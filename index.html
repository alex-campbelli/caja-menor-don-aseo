/* ==========================================================================
   §14  PRUEBAS DEL SISTEMA  (§67, §68)
   --------------------------------------------------------------------------
   Se ejecutan contra una base de datos TEMPORAL e independiente: nunca tocan
   la información real. Al terminar, la base de pruebas se elimina.
   ========================================================================== */
const Pruebas = {
  resultados: [],
  ejecutando: false,

  async correr(alProgreso) {
    this.resultados = [];
    this.ejecutando = true;
    const dbReal = db;
    // se preserva TODA la caché en memoria: si falta alguna colección, al
    // terminar las pruebas la interfaz mostraría datos de la base temporal
    const cacheReal = { config: Cache.config, contratos: Cache.contratos, personas: Cache.personas,
                        municipios: Cache.municipios, categorias: Cache.categorias };
    const nombreTmp = 'dacm_pruebas_' + Date.now();
    const auditoriaAntes = Auditoria.activa;
    let ctx = {};
    try {
      const dbTmp = new IndexedDBAdapter(nombreTmp, 1);
      await dbTmp.init();
      db = dbTmp;
      Auditoria.activa = false;
      Cache.contratos = new Map(); Cache.personas = new Map();
      Cache.municipios = new Map(); Cache.categorias = new Map();
      await Semillas.aplicar(true);
      await Cache.cargar();
      Analitica.invalidar();

      for (const grupo of this.SUITE) {
        for (const t of grupo.casos) {
          const t0 = performance.now();
          try {
            await t.fn(ctx);
            this.resultados.push({ grupo: grupo.nombre, nombre: t.nombre, ok: true, ms: performance.now() - t0 });
          } catch (e) {
            this.resultados.push({ grupo: grupo.nombre, nombre: t.nombre, ok: false, ms: performance.now() - t0,
              error: (e && e.message) || String(e) });
          }
          if (alProgreso) alProgreso(this.resultados.length, this.total());
        }
      }
    } finally {
      db = dbReal;
      Auditoria.activa = auditoriaAntes;
      Cache.config = cacheReal.config; Cache.contratos = cacheReal.contratos;
      Cache.personas = cacheReal.personas;
      Cache.municipios = cacheReal.municipios; Cache.categorias = cacheReal.categorias;
      Analitica.invalidar();
      this.ejecutando = false;
      try { indexedDB.deleteDatabase(nombreTmp); } catch {}
    }
    return this.resultados;
  },

  total() { return this.SUITE.reduce((a, g) => a + g.casos.length, 0); },

  /* --- utilidades de aserción --- */
  ok(cond, msg) { if (!cond) throw new Error(msg || 'Aserción fallida'); },
  igual(a, b, msg) {
    if (a !== b) throw new Error((msg || 'Valores distintos') + ' — esperado ' + JSON.stringify(b) + ', obtenido ' + JSON.stringify(a));
  },
  async lanza(fn, msg) {
    try { await fn(); } catch { return true; }
    throw new Error(msg || 'Se esperaba un error y no ocurrió');
  },

  SUITE: [
    {
      nombre: 'Núcleo: dinero, fechas e identificadores',
      casos: [
        { nombre: 'Money.parse interpreta formato colombiano', fn: () => {
            Pruebas.igual(Money.parse('300.000'), 30000000, 'Miles con punto');
            Pruebas.igual(Money.parse('$ 1.234.567'), 123456700, 'Con símbolo');
            Pruebas.igual(Money.parse('1.234.567,89'), 123456789, 'Con decimales');
            Pruebas.igual(Money.parse(''), 0, 'Vacío');
            Pruebas.igual(Money.parse(300000), 30000000, 'Número');
          } },
        { nombre: 'La aritmética de dinero no pierde centavos', fn: () => {
            const partes = Money.split(10000, [1, 1, 1]);
            Pruebas.igual(partes.reduce((a, b) => a + b, 0), 10000, 'La suma del reparto debe ser exacta');
            Pruebas.igual(Money.parse('0,1') + Money.parse('0,2'), Money.parse('0,3'), '0,1 + 0,2 = 0,3 en enteros');
          } },
        { nombre: 'Fechas: serial de Excel y formatos', fn: () => {
            Pruebas.igual(Fecha.deSerialExcel(45959), '2025-10-29', 'Serial 45959 = inicio del contrato');
            Pruebas.igual(Fecha.aSerialExcel('2025-10-29'), 45959, 'Ida y vuelta del serial');
            Pruebas.igual(Fecha.deSerialExcel(46227), '2026-07-24', 'Ultimo serial del historico');
            Pruebas.igual(Fecha.parse('29/10/2025'), '2025-10-29', 'dd/mm/aaaa');
            Pruebas.ok(Fecha.valida('2025-10-29'), 'Fecha válida');
            Pruebas.ok(!Fecha.valida('2025-02-30'), '30 de febrero no existe');
          } },
        { nombre: 'ULID: únicos, ordenables y con prefijo', fn: () => {
            const ids = new Set();
            for (let i = 0; i < 3000; i++) ids.add(ID.caja());
            Pruebas.igual(ids.size, 3000, 'Sin colisiones en 3.000 generaciones');
            const a = ID.caja(), b = ID.caja();
            Pruebas.ok(a < b, 'Deben ser ordenables lexicográficamente');
            Pruebas.ok(Ulid.isValid(a, 'cm'), 'Formato válido con prefijo');
          } }
      ]
    },
    {
      nombre: 'Modelo de datos y esquema PostgreSQL',
      casos: [
        { nombre: 'camelCase ↔ snake_case es reversible', fn: () => {
            const campos = ['contratoId', 'creadoEn', 'actualizadoEn', 'nombreNorm', 'numeroCuenta',
              'tipoCuenta', 'esFinanciador', 'esSolicitante', 'requiereRevision', 'motivoRevision',
              'reposicionManual', 'totalDetalles', 'valorUnitario', 'estadoCaja', 'snapshotHtml',
              'storageKey', 'nombreArchivo', 'financiadorPorDefectoId', 'prefijoConsignacion',
              'logoDataUrl', 'marcaDataUrl', 'contratoActivoId', 'esNoAplica', 'municipioNombre',
              'solicitanteTexto', 'consignacionId', 'entidadId', 'id', 'total', 'mes'];
            for (const c of campos) {
              const ida = Nombres.snake(c);
              const vuelta = Nombres.camel(ida);
              Pruebas.igual(vuelta, c, 'Ida y vuelta de "' + c + '" (pasó por "' + ida + '")');
            }
            Pruebas.igual(Nombres.snake('contratoId'), 'contrato_id');
            Pruebas.igual(Nombres.camel('valor_unitario'), 'valorUnitario');
          } },
        { nombre: 'Una caja completa sobrevive al viaje de ida y vuelta', fn: async ctx => {
            const caja = Modelo.caja({
              contratoId: 'ctr_X', numero: 'CM-2026-00001', fecha: '2026-03-10',
              solicitante: { personaId: 'per_Y', nombre: 'Prueba', numeroCuenta: '123', capturadoEn: '2026-01-01' },
              municipioNombre: 'Apartadó', total: 30000000, gasolina: 10000000,
              requiereRevision: 1, legacy: { fila: 42, totalConIva: '300000' }
            });
            const fila = Nombres.filaSalida(caja);
            Pruebas.ok('contrato_id' in fila, 'La columna se llama contrato_id');
            Pruebas.ok('requiere_revision' in fila, 'requiere_revision');
            Pruebas.ok(!('contratoId' in fila), 'Ya no queda el nombre en camelCase');
            // el contenido JSONB NO se toca: sigue en camelCase por dentro
            Pruebas.igual(fila.solicitante.personaId, 'per_Y', 'El JSONB conserva sus claves internas');
            Pruebas.igual(fila.legacy.totalConIva, '300000', 'El bloque legacy queda intacto');
            const vuelta = Nombres.filaEntrada(fila);
            Pruebas.igual(vuelta.contratoId, 'ctr_X');
            Pruebas.igual(vuelta.total, 30000000, 'El dinero no se altera');
            Pruebas.igual(vuelta.municipioNombre, 'Apartadó', 'Las tildes se conservan');
            Pruebas.igual(JSON.stringify(vuelta.solicitante), JSON.stringify(caja.solicitante));
          } },
        { nombre: 'El esquema SQL cubre todas las colecciones y protege con RLS', fn: () => {
            const ddl = Migracion.generarDDL();
            for (const col of COLECCIONES_DATOS) {
              Pruebas.ok(ddl.includes('create table if not exists ' + col + ' ('),
                'Falta la tabla ' + col);
            }
            Pruebas.ok(ddl.includes('total bigint not null'), 'El dinero debe ser BIGINT (centavos)');
            // se examina sólo el SQL ejecutable: los comentarios pueden nombrar esos tipos
            const sql = ddl.split('\n').filter(l => !l.trim().startsWith('--')).join('\n');
            Pruebas.ok(!/\b(money|float|real|double precision)\b/i.test(sql),
              'Ninguna columna en coma flotante ni tipo money');
            ['subtotal', 'retencion', 'total', 'gasolina', 'aceite'].forEach(c =>
              Pruebas.ok(new RegExp(c + ' bigint').test(sql), 'La columna ' + c + ' debe ser bigint'));
            Pruebas.igual((ddl.match(/enable row level security/g) || []).length, COLECCIONES_DATOS.length,
              'RLS en todas las tablas');
            Pruebas.ok(ddl.includes('to authenticated'), 'Las políticas exigen sesión iniciada');
            Pruebas.ok(!ddl.includes('to anon'), 'Nada abierto al rol anónimo');
            Pruebas.ok(ddl.includes("'soportes'"), 'Bucket privado de soportes');
            Pruebas.ok(ddl.includes('contrato_id text references contratos(id)'), 'Las cajas apuntan al contrato');
          } },
        { nombre: 'CRÍTICO · los booleanos viajan como boolean, no como 1/0', fn: () => {
            /* La base local guarda 1/0 (IndexedDB no indexa booleanos) pero las
               columnas son `boolean` en PostgreSQL. Si no se traduce, la
               escritura se rechaza y falla la subida entera. */
            const ddl = Migracion.generarDDL();
            const declaradasBool = new Set();
            for (const l of ddl.split('\n')) {
              for (const m of l.matchAll(/(\w+)\s+boolean/g)) declaradasBool.add(Nombres.camel(m[1]));
            }
            Pruebas.ok(declaradasBool.size > 0, 'El esquema declara columnas boolean');
            for (const campo of declaradasBool) {
              Pruebas.ok(Nombres.BOOLEANOS.has(campo),
                'La columna boolean "' + campo + '" no está en la lista de conversión');
            }
            // conversión efectiva en ambos sentidos
            const persona = Modelo.persona({ nombre: 'X', esFinanciador: 1, esSolicitante: 0 });
            const fila = Nombres.filaSalida(persona);
            Pruebas.igual(fila.es_financiador, true, 'esFinanciador 1 → true');
            Pruebas.igual(fila.es_solicitante, false, 'esSolicitante 0 → false');
            Pruebas.igual(typeof fila.es_financiador, 'boolean', 'El tipo enviado es boolean');
            const vuelta = Nombres.filaEntrada(fila);
            Pruebas.igual(vuelta.esFinanciador, 1, 'true → 1 al volver a la base local');
            Pruebas.igual(vuelta.esSolicitante, 0, 'false → 0');
            // una caja completa
            const caja = Nombres.filaSalida(Modelo.caja({ requiereRevision: 1, reposicionManual: 0 }));
            Pruebas.igual(caja.requiere_revision, true);
            Pruebas.igual(caja.reposicion_manual, false);
            // los números que NO son booleanos no se tocan
            Pruebas.igual(Nombres.filaSalida({ total: 1 }).total, 1, 'Un importe de 1 centavo sigue siendo 1');
            Pruebas.igual(Nombres.filaSalida({ orden: 0 }).orden, 0, 'Un orden 0 sigue siendo 0');
          } },
        { nombre: 'CRÍTICO · cada campo encaja con el tipo declarado en PostgreSQL', fn: () => {
            /* Lee los tipos del propio SQL y valida contra ellos lo que
               produciría cada modelo. Aquí se cazan los desajustes que de otro
               modo sólo aparecen al escribir de verdad en la nube, por ejemplo
               una fecha vacía "" contra una columna `date`. */
            const ddl = Migracion.generarDDL();
            const tipos = {};   // tabla -> { columna: tipo }
            let tabla = null;
            const RESERVADAS = new Set(['constraint', 'primary', 'unique', 'create', 'references',
                                        'not', 'default', 'check', 'key', 'on', 'delete', 'set']);
            for (const linea of ddl.split('\n')) {
              const abre = linea.match(/^create table if not exists (\w+) \(/);
              if (abre) { tabla = abre[1]; tipos[tabla] = {}; continue; }
              if (!tabla) continue;
              if (linea.startsWith(');')) { tabla = null; continue; }
              if (linea.trim().startsWith('--')) continue;
              // el esquema declara VARIAS columnas por línea: hay que recorrerlas todas
              for (const m of linea.matchAll(/(\w+)\s+(bigint|int|numeric|boolean|date|timestamptz|jsonb|text)\b/g)) {
                if (!RESERVADAS.has(m[1])) tipos[tabla][m[1]] = m[2];
              }
            }
            Pruebas.ok(Object.keys(tipos).length >= 12, 'Se leyeron los tipos del esquema');
            Pruebas.ok(Object.keys(tipos.cajas || {}).length >= 25,
              'Se leyeron las columnas de cajas (' + Object.keys(tipos.cajas || {}).length + ')');

            const muestras = {
              configuracion: Modelo.configuracion(),
              contratos: Modelo.contrato({ nombre: 'C' }),
              municipios: Modelo.municipio({ nombre: 'M' }),
              personas: Modelo.persona({ nombre: 'P' }),
              categorias: Modelo.categoria({ nombre: 'K' }),
              cajas: Modelo.caja({}),
              detalles: Modelo.detalle({ cajaId: 'cm_x' }),
              consignaciones: Modelo.consignacion({}),
              aplicaciones: Modelo.aplicacion({ consignacionId: 'con_x', cajaId: 'cm_x' }),
              documentos: Modelo.documento({}),
              auditoria: Modelo.auditoria('caja', 'cm_x', 'CREAR', null),
              secuencias: { id: 'caja:x:2026', valor: 1, actualizadoEn: Modelo.ahora() }
            };
            const fallos = [];
            for (const [tbl, obj] of Object.entries(muestras)) {
              const cols = tipos[tbl];
              if (!cols) { fallos.push(tbl + ': la tabla no está en el esquema'); continue; }
              const fila = Nombres.filaSalida(obj);
              for (const [col, val] of Object.entries(fila)) {
                const tipo = cols[col];
                if (!tipo) { fallos.push(tbl + '.' + col + ': la columna no existe en el esquema'); continue; }
                if (val === null) continue;                       // NULL vale en cualquier columna
                const t = typeof val;
                if (tipo === 'boolean' && t !== 'boolean') fallos.push(tbl + '.' + col + ': boolean recibe ' + t);
                else if ((tipo === 'bigint' || tipo === 'int' || tipo === 'numeric') && t !== 'number')
                  fallos.push(tbl + '.' + col + ': ' + tipo + ' recibe ' + t + ' (' + JSON.stringify(val) + ')');
                else if ((tipo === 'date' || tipo === 'timestamptz') && (t !== 'string' || val === ''))
                  fallos.push(tbl + '.' + col + ': ' + tipo + ' recibe ' + JSON.stringify(val));
                else if (tipo === 'text' && t !== 'string')
                  fallos.push(tbl + '.' + col + ': text recibe ' + t);
              }
            }
            Pruebas.igual(fallos.length, 0, 'Desajustes de tipo: ' + fallos.join(' | '));
          } },
        { nombre: 'Los identificadores ULID sirven como clave primaria de texto', fn: () => {
            const ids = [ID.contrato(), ID.caja(), ID.detalle(), ID.consignacion(), ID.documento()];
            for (const id of ids) {
              Pruebas.ok(/^[a-z]{2,3}_[0-9A-HJKMNP-TV-Z]{26}$/.test(id), 'Formato apto para TEXT PK: ' + id);
              Pruebas.ok(!/['"\\\s]/.test(id), 'Sin caracteres que requieran escape en SQL');
            }
          } },
        { nombre: 'Los parámetros de conexión se normalizan al guardarse', fn: () => {
            const previa = localStorage.getItem(Nube.CLAVE_PREFS);
            Nube.guardarConfig({ url: 'https://ejemplo.supabase.co/', anonKey: 'x'.repeat(60) });
            const c = Nube.config();
            Pruebas.igual(c.url, 'https://ejemplo.supabase.co', 'Se normaliza la barra final');
            Pruebas.igual(c.anonKey.length, 60, 'La clave se guarda tal cual');
            Pruebas.ok(Nube.configurada(), 'Queda configurada');
            if (previa === null) localStorage.removeItem(Nube.CLAVE_PREFS);
            else localStorage.setItem(Nube.CLAVE_PREFS, previa);
          } },
        { nombre: 'CRÍTICO · el arranque no tiene ninguna salida a una base local', fn: () => {
            /* Una base local paralela produciría dos verdades: una caja escrita
               en el equipo equivocado no existiría para el resto. Esta prueba
               existe para que esa puerta no se reabra por descuido. */
            const src = arrancar.toString();
            Pruebas.ok(!/IndexedDBAdapter/.test(src), 'El arranque nunca abre la base local');
            Pruebas.ok(/SupabaseAdapter/.test(src), 'El arranque abre la base del servidor');
            Pruebas.ok(/pedirCredenciales/.test(src), 'Exige sesión antes de tocar los datos');
            const acceso = Sesion.pedirCredenciales.toString();
            Pruebas.ok(!/sesLocal/.test(acceso), 'La pantalla de acceso no tiene el enlace de trabajo local');
            Pruebas.ok(!/sin conexión/i.test(acceso), 'Ni ofrece trabajar sin conexión');
            Pruebas.ok(!/modo:/.test(acceso), 'Ya no devuelve un modo de trabajo: sólo hay uno');
          } },
        { nombre: 'La barra lateral identifica la sesión y permite cerrarla', fn: () => {
            const previa = localStorage.getItem(Nube.CLAVE_SESION);
            Nube.guardarSesion({ access_token: 'x', refresh_token: 'y',
                                 expira: Date.now() + 3600000, correo: 'prueba@donaseo.co' });

                { categoriaId: cat.id, elemento: 'Gasolina', rol: RolEstadistico.GASOLINA,

            Pruebas.igual(caja.aceite, 10000000, 'Y su aceite');

                const esSub = d.rol === RolEstadistico.GASOLINA || d.rol === RolEstadistico.ACEITE;

                if (donde.indexOf(n) < 0) donde.push(n);

            const caja = { id: 'cm_x', total: 30000000, retencion: 0, observaciones: '' };

        { nombre: 'CRÍTICO · el resaltado no rompe el escapado de HTML', fn: () => {

        { nombre: 'El resaltado ignora tildes y mayúsculas, pero pinta el texto tal cual', fn: () => {

        { nombre: 'CRÍTICO · el rango de fechas espera a la fecha «hasta»', fn: () => {

            const src = VistaCajas.render.toString();

          } },
        { nombre: 'CRÍTICO · dos cajas del mismo día salen por consecutivo', fn: () => {
            /* Ordenando sólo por fecha, las doce cajas de un mismo día salían en

            const filas = [
              { fecha: '2025-11-07', numero: 'CM-2025-00010' },
              { fecha: '2025-11-07', numero: 'CM-2025-00008' },

            const clave = c => c.fecha + '|' + (c.numero || '');
            filas.sort(U.by(clave, 'asc'));
            Pruebas.igual(filas.map(c => c.numero.slice(-5)).join(' '), '00007 00008 00009 00010',

            filas.sort(U.by(clave, 'desc'));
            Pruebas.igual(filas.map(c => c.numero.slice(-5)).join(' '), '00010 00009 00008 00007',

            const src = VistaCajas.render.toString();

        { nombre: 'CRÍTICO · la consulta al servidor lleva desempate', fn: async () => {
            /* Sin desempate, además del desorden, al pedir por páginas con

            const ad = Object.create(SupabaseAdapter.prototype);

            Pruebas.ok(/order=fecha\.asc,id\.asc/.test(decodeURIComponent(ruta)),

        { nombre: 'Las columnas del listado se llaman como en el Excel', fn: () => {

        { nombre: 'CRÍTICO · la categoría de una caja sale de sus detalles', fn: async ctx => {

    },
    {
      nombre: 'Intercambio: Excel, respaldo e integridad',
      casos: [
        { nombre: 'Escribir y volver a leer un archivo .xlsx', fn: async () => {
            const blob = await Xlsx.escribir([{
              nombre: 'Prueba', columnas: [{ titulo: 'texto' }, { titulo: 'valor', tipo: 'dinero' }, { titulo: 'fecha', tipo: 'fecha' }],

            const file = new File([blob], 'prueba.xlsx', { type: blob.type });
            const libro = await Xlsx.leer(file);
            Pruebas.igual(libro.hojas.length, 1, 'Una hoja');
            const datos = await libro.filas('Prueba');

        { nombre: 'CRÍTICO · la plantilla lleva exactamente las columnas del archivo real', fn: async () => {
            /* Encabezados de «Cuentas de caja menor 1.xlsx», copiados literalmente.
               Esta lista es el contrato: si el archivo del usuario cambia, esta

            const DEL_ARCHIVO = ['FECHA', 'CATEGORÍA', 'CONSIGNÓ', 'UBICACIÓN', 'CONCEPTO',
                                 'GASOLINA', 'ACEITE', 'DESCRIPCIÓN', 'TOTAL'];
            Pruebas.igual(Importador.CAMPOS.map(c => c.t).join(' | '), DEL_ARCHIVO.join(' | '),

            const blob = await Xlsx.escribir(Exportar.hojasPlantilla(), { titulo: 'Plantilla' });

            const datos = await libro.filas(libro.hojas[0].nombre);
            const enc = datos.filas[0].celdas.map(c => (c && c.valor != null) ? String(c.valor).trim() : '')

            Pruebas.igual(enc.join(' | '), DEL_ARCHIVO.join(' | '),
              'Y la plantilla que se descarga lleva las mismas');
            Pruebas.igual(datos.filas.length - 1, Importador.EJEMPLOS.length, 'Con sus filas de ejemplo');
            for (const ej of Importador.EJEMPLOS)
              Pruebas.igual(ej.length, DEL_ARCHIVO.length, 'Cada ejemplo trae una celda por columna');
          } },
        { nombre: 'CRÍTICO · los encabezados del archivo se reconocen solos', fn: () => {
            /* Se simula la detección del asistente sobre los encabezados reales,
               incluidos los nombres anteriores al cambio: un archivo viejo con
               CLASE debe seguir entrando sin retoques. */
            const detectar = encabezados => {
              const m = {};
              Importador.CAMPOS.forEach(campo => {
                m[campo.k] = encabezados.findIndex(h => {
                  const n = Txt.norm(h);
                  return n && campo.alias.some(a => n === Txt.norm(a) ||
                    n.replace(/[^a-z0-9]/g, '') === Txt.norm(a).replace(/[^a-z0-9]/g, ''));
                });
              });
              return m;
            };
            const actual = detectar(['FECHA', 'CATEGORÍA', 'CONSIGNÓ', 'UBICACIÓN', 'CONCEPTO',
                                     'GASOLINA', 'ACEITE', 'DESCRIPCIÓN', 'TOTAL']);
            for (const c of Importador.CAMPOS)
              Pruebas.ok(actual[c.k] >= 0, 'Reconoce ' + c.t + ' del archivo actual');

            const viejo = detectar(['fecha', 'CLASE', 'TIPO', 'CONSIGNÓ', 'UBICACIÓN', 'CONCEPTO',
                                    'GASOLINA', 'ACEITE', 'DESCRIPCIÓN', 'Total con iva']);

            Pruebas.ok(!('tipo' in viejo), 'La columna TIPO ya no se pide: sobra sin estorbar');

        { nombre: 'Detección de duplicados del importador', fn: () => {

            const b = Importador.claveDuplicado({ fecha: '2026-03-10', ubicacion: 'APARTADO', concepto: 'alirio  pardo',
              descripcion: 'gasolina', total: 10000000 });
            Pruebas.igual(a, b, 'Debe reconocer el mismo registro pese a mayúsculas y tildes');
            const c = Importador.claveDuplicado({ fecha: '2026-03-10', ubicacion: 'Apartadó', concepto: 'Alirio Pardo',
              descripcion: 'Gasolina', total: 10000001 });
            Pruebas.ok(a !== c, 'Un valor distinto no es duplicado');
          } },
        { nombre: 'Crear respaldo completo', fn: async ctx => {

            const res = await Respaldo.restaurar(ctx.respaldo, 'reemplazar');
            Pruebas.igual(await db.count('cajas'), ctx.contadoresAntes.cajas, 'Cajas restauradas');
            Pruebas.igual(await db.count('detalles'), ctx.contadoresAntes.detalles, 'Detalles restaurados');
            const caja = await CajaRepo.get(ctx.caja300.id);
            Pruebas.ok(caja, 'La caja recuperó su mismo identificador');
            Pruebas.igual(caja.total, 30000000, 'Los importes se conservan exactos');
          } },
        { nombre: 'Los documentos sobreviven a la restauración', fn: async ctx => {
            const docs = await CajaRepo.documentos(ctx.caja300.id);

            const criticos = problemas.filter(p => p.tipo !== 'Caja sin detalles' && p.tipo !== 'Caja sin contrato');
            Pruebas.igual(criticos.length, 0, 'Problemas: ' + criticos.map(p => p.tipo + ' (' + p.detalle + ')').join(' | '));
          } },
        { nombre: 'El esquema PostgreSQL se genera completo', fn: () => {
            const ddl = Migracion.generarDDL();
            ['cajas', 'detalles', 'consignaciones', 'aplicaciones', 'documentos', 'personas', 'municipios', 'categorias']
              .forEach(t => Pruebas.ok(ddl.includes('create table if not exists ' + t), 'Falta la tabla ' + t));
            Pruebas.ok(ddl.includes('bigint'), 'El dinero debe ser BIGINT (centavos)');

          } }
      ]
    }
  ]
};

/* ==========================================================================
   VISTA · PRUEBAS
   ========================================================================== */
const VistaPruebas = {
  async render(cont) {
    Shell.titulo('Pruebas del sistema', 'Verificación funcional automatizada');
    const res = Pruebas.resultados;
    const total = Pruebas.total();
    const ok = res.filter(r => r.ok).length;
    const fail = res.filter(r => !r.ok).length;

    cont.innerHTML =
      '<div class="page-head"><div><h1>Pruebas del sistema</h1>' +
      '<div class="ph-sub">' + total + ' pruebas sobre una base temporal aislada · sus datos reales no se tocan</div></div>' +
      '<div class="ph-actions"><button class="btn btn-primary btn-lg" data-act="correr">' +
      Icon('flask', '', 15) + 'Ejecutar todas las pruebas</button></div></div>' +

      '<div class="alert a-info mb16">' + Icon('info') +
      '<div>Las pruebas se ejecutan contra una base de datos <b>temporal e independiente</b> que se crea y se elimina ' +
      'automáticamente. Verifican los criterios de aceptación: cálculo del total, subcomponentes de gasolina y aceite, ' +
      'consecutivos irrepetibles, snapshots históricos, reposiciones parciales, la separación entre gasto y reposición, ' +
      'lectura/escritura de Excel, respaldo y restauración.</div></div>' +

      (res.length ? '<div class="grid g4 mb16">' +
        Comp.kpi({ label: 'Ejecutadas', valor: res.length + ' / ' + total, color: 'var(--info-500)', icono: 'flask' }) +
        Comp.kpi({ label: 'Correctas', valor: String(ok), color: 'var(--ok-500)', icono: 'check' }) +
        Comp.kpi({ label: 'Fallidas', valor: String(fail), color: 'var(--dang-500)', icono: 'x' }) +
        Comp.kpi({ label: 'Tiempo total', valor: Math.round(U.sumBy(res, r => r.ms)) + ' ms', color: '#8a6d3b', icono: 'clock' }) +
        '</div>' : '') +

      '<div id="pruebasCuerpo">' +
      (res.length ? this.tabla(res) : Pruebas.SUITE.map(g =>
        '<div class="card mb12"><div class="card-h"><h3>' + esc(g.nombre) + '</h3>' +
        '<span class="ch-sub">' + g.casos.length + ' pruebas</span></div>' +
        '<div class="card-b flush"><table class="tbl"><tbody>' +
        g.casos.map(c => '<tr><td style="width:34px" class="txt-3">' + Icon('clock', '', 13) + '</td>' +
          '<td>' + esc(c.nombre) + '</td></tr>').join('') +
        '</tbody></table></div></div>').join('')) +
      '</div>';

    setAcciones({
      correr: async () => {
        const cuerpo = $('#pruebasCuerpo');
        cuerpo.innerHTML = '<div class="card"><div class="card-b" style="text-align:center;padding:40px">' +
          '<span class="spin" style="width:24px;height:24px;border-width:3px"></span>' +
          '<h3 class="mt16">Ejecutando pruebas…</h3><div id="pbProg" style="max-width:400px;margin:16px auto 0"></div></div></div>';
        await Pruebas.correr((hechas, tot) => {
          const p = $('#pbProg');
          if (p) p.innerHTML = '<div class="progress"><i style="width:' + (hechas / tot * 100).toFixed(1) + '%"></i></div>' +
            '<div class="fs12 txt-2 mt8">' + hechas + ' de ' + tot + '</div>';
        });
        VistaPruebas.render(cont);
        const f = Pruebas.resultados.filter(r => !r.ok).length;
        if (f === 0) Toast.ok('Las ' + Pruebas.resultados.length + ' pruebas pasaron correctamente.');
        else Toast.err(f + ' prueba(s) fallaron. Revise el detalle.');
      }
    });
  },

  tabla(res) {
    const grupos = U.groupBy(res, 'grupo');
    return [...grupos.entries()].map(([nombre, casos]) => {
      const fallos = casos.filter(c => !c.ok).length;
      return '<div class="card mb12"><div class="card-h">' +
        '<h3>' + esc(nombre) + '</h3>' +
        '<span class="ch-sub">' + casos.filter(c => c.ok).length + ' / ' + casos.length + ' correctas</span>' +
        '<div class="ch-act">' + (fallos ? '<span class="pill p-red">' + fallos + ' fallidas</span>'
          : '<span class="pill p-green">Todas correctas</span>') + '</div></div>' +
        '<div class="card-b flush"><table class="tbl"><tbody>' +
        casos.map(c => '<tr><td style="width:34px">' +
          (c.ok ? '<span style="color:var(--ok-500)">' + Icon('check', '', 15) + '</span>'
                : '<span style="color:var(--dang-500)">' + Icon('x', '', 15) + '</span>') + '</td>' +
          '<td>' + esc(c.nombre) +
          (c.error ? '<div class="fs11" style="color:var(--dang-500);margin-top:3px">' + esc(c.error) + '</div>' : '') + '</td>' +
          '<td class="num txt-3 fs11" style="width:70px">' + Math.round(c.ms) + ' ms</td></tr>').join('') +
        '</tbody></table></div></div>';
    }).join('');
  }
};


/* ==========================================================================
   §14b  PANTALLA DE INICIO DE SESIÓN (modo nube)
   --------------------------------------------------------------------------
   El sistema trabaja únicamente contra el servidor, así que esta pantalla es
   la puerta de entrada: sin sesión válida no se lee ni se escribe nada.
   ========================================================================== */
const Sesion = {
  /** pide credenciales y no devuelve hasta que haya una sesión válida */
  pedirCredenciales() {
    return new Promise(resolve => {
      const cfg = Nube.config();
      const app = $('#app');
      app.innerHTML =
        '<div style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:20px;overflow:auto">' +
        '<div style="width:100%;max-width:380px">' +
          '<div style="text-align:center;margin-bottom:22px">' +
            '<img src="' + MARCA_DON_ASEO + '" alt="" style="width:60px;height:60px;border-radius:14px;' +
              'display:block;margin:0 auto 14px;object-fit:cover">' +
            '<div style="font-size:17px;font-weight:650">' + esc(APP.nombre) + '</div>' +
            '<div style="color:var(--text-3);font-size:12.5px;margin-top:3px">' + esc(APP.empresa) + '</div>' +
          '</div>' +
          '<div class="card"><div class="card-b">' +
            '<div class="field"><label>Correo</label>' +
            '<input class="inp" id="sesCorreo" type="email" autocomplete="username" ' +
            'value="' + attr(localStorage.getItem('dacm.ultimoCorreo') || '') + '" autofocus></div>' +
            '<div class="field"><label>Contraseña</label>' +
            '<input class="inp" id="sesClave" type="password" autocomplete="current-password"></div>' +
            '<div id="sesError"></div>' +
            '<button class="btn btn-primary btn-lg" id="sesEntrar" style="width:100%;margin-top:6px">' +
            Icon('shield', '', 15) + 'Entrar</button>' +
            '<div class="fs11 txt-3 mt12" style="text-align:center;line-height:1.5" id="sesEstado" ' +
            'title="' + attr((cfg.url || '').replace('https://', '')) + '">' +
            '<span class="conx-p conx-p-esp" style="display:inline-block;margin-right:6px;vertical-align:middle">' +
            '</span>Comprobando el servidor…</div>' +
          '</div></div>' +
          '<div class="fs11 txt-3" style="text-align:center;margin-top:14px;line-height:1.6">' +
            'La información vive en el servidor y es la misma desde cualquier equipo. ' +
            'Se necesita conexión a internet y una cuenta autorizada.' +
          '</div>' +
        '</div></div>';

      const err = m => {
        $('#sesError').innerHTML = '<div class="alert a-err mb12" style="padding:9px 11px">' +
          Icon('warn', '', 14) + '<div>' + esc(m) + '</div></div>';
      };
      const entrar = async () => {
        const correo = $('#sesCorreo').value.trim();
        const clave = $('#sesClave').value;
        if (!correo || !clave) { err('Escriba su correo y contraseña.'); return; }
        const btn = $('#sesEntrar');
        btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Verificando…';
        try {
          await Nube.entrar(correo, clave);
          localStorage.setItem('dacm.ultimoCorreo', correo);
          resolve();
        } catch (e) {
          err(e.message || 'No se pudo iniciar sesión.');
          btn.disabled = false; btn.innerHTML = Icon('shield', '', 15) + 'Entrar';
          $('#sesClave').focus();
        }
      };
      /* El estado no se declara: se comprueba. Si el servidor está caído se
         sabe ANTES de escribir la contraseña, no después de que falle. */
      (async () => {
        await Conexion.comprobar(true);
        const e = $('#sesEstado'); if (!e) return;
        const vivo = Conexion.calcular() === 'envivo';
        e.innerHTML = '<span class="conx-p conx-p-' + (vivo ? 'ok' : 'mal') +
          '" style="display:inline-block;margin-right:6px;vertical-align:middle"></span>' +
          (vivo ? 'Servidor disponible' + (Conexion.latencia !== null ? ' · ' + Conexion.latencia + ' ms' : '')
                : 'El servidor no responde');
      })();

      $('#sesEntrar').onclick = entrar;
      $('#sesClave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
      $('#sesCorreo').addEventListener('keydown', e => { if (e.key === 'Enter') $('#sesClave').focus(); });
    });
  }
};


/* ==========================================================================
   §15  SEMILLAS Y ARRANQUE
   ========================================================================== */
const Semillas = {
  MUNICIPIOS: [
    'Medellín', 'Apartadó', 'San Jerónimo', 'Andes', 'La Pintada', 'El Retiro',
    'El Carmen de Viboral', 'Caucasia', 'Guarne', 'Itagüí', 'Envigado'
  ],
  CATEGORIAS: [
    { nombre: 'Gasolina', rol: RolEstadistico.GASOLINA, estadistica: 1, sistema: 1, orden: 1,
      descripcion: 'Subcomponente del total. Se descuenta del total, nunca se suma por encima.' },
    { nombre: 'Aceite', rol: RolEstadistico.ACEITE, estadistica: 1, sistema: 1, orden: 2,
      descripcion: 'Subcomponente del total. Se descuenta del total, nunca se suma por encima.' },
    { nombre: 'Reparación', orden: 10 },
    { nombre: 'Recolección', orden: 11 },
    { nombre: 'Luis Miguel', orden: 12 },
    { nombre: 'Exámenes médicos', orden: 13 },
    { nombre: 'Abogado', orden: 14 },
    { nombre: 'Viáticos', orden: 15 },
    { nombre: 'Trabajos especiales', orden: 16 }
  ],

  async aplicar(forzar) {
    /* configuración */
    let cfg = await db.get('configuracion', 'cfg_default');
    if (!cfg || forzar) {
      cfg = Modelo.configuracion({
        empresa: 'DON ASEO LTDA.',
        contratoNombre: 'COMFENALCO',
        fechaInicio: '2025-10-29'
      });
      await db.put('configuracion', cfg);
    }
    Cache.config = cfg;

    /* Logotipo de la empresa e identificación tributaria.
       Se instalan una sola vez (marcado con `logoSemilla`) y NUNCA se pisa lo
       que el usuario haya decidido: si cargó su propia imagen o la quitó,
       `logoPropio` queda en 1 y esto no vuelve a tocarse. El NIT sólo se
       rellena si está vacío. */
    let cambioIdentidad = false;
    if (!cfg.logoPropio && cfg.logoSemilla !== LOGO_VERSION) {
      cfg.logoDataUrl = LOGO_DON_ASEO;
      cfg.marcaDataUrl = MARCA_DON_ASEO;
      cfg.logoSemilla = LOGO_VERSION;
      cambioIdentidad = true;
    }
    if (Txt.vacio(cfg.nit)) { cfg.nit = NIT_DON_ASEO; cambioIdentidad = true; }
    if (cambioIdentidad) { await db.put('configuracion', cfg); Cache.config = cfg; }

    /* municipios */
    if ((await db.count('municipios')) === 0) {
      const lista = this.MUNICIPIOS.map(n => Modelo.municipio({ nombre: n, origen: Origen.SISTEMA }));
      lista.push(Modelo.municipio({ nombre: VALOR_NO_APLICA, origen: Origen.SISTEMA, esNoAplica: 1, departamento: '' }));
      await db.putMany('municipios', lista);
    }
    /* categorías */
    if ((await db.count('categorias')) === 0) {
      await db.putMany('categorias', this.CATEGORIAS.map(c => Modelo.categoria(Object.assign({ origen: Origen.SISTEMA }, c))));
    }
    /* personas que adelantan dinero */
    if ((await db.count('personas')) === 0) {
      const fabian = Modelo.persona({
        nombre: 'Fabián Castro', esFinanciador: 1, esSolicitante: 1, origen: Origen.SISTEMA,
        cargo: 'Adelanta el dinero de las cajas menores',
        observaciones: 'Persona que habitualmente adelanta el dinero. Puede cambiarse en cada caja menor.'
      });
      await db.putMany('personas', [
        fabian,
        Modelo.persona({
          nombre: 'DON ASEO LTDA.', esFinanciador: 1, esSolicitante: 0, origen: Origen.SISTEMA,
          cargo: 'Empresa',
          observaciones: 'Representa a la empresa cuando el dinero sale directamente de ella y no de una persona.'
        })
      ]);
      cfg.financiadorPorDefectoId = fabian.id;
      await db.put('configuracion', cfg);
      Cache.config = cfg;
    }

    /* ----------------------------------------------------------------------
       MIGRACIÓN v1 → v2: de un contrato implícito a contratos independientes.
       Se crea un contrato con los datos que hasta ahora vivían en la
       configuración y se le asignan TODAS las operaciones existentes.
       Es idempotente: si ya hay contratos, no hace nada.
       ---------------------------------------------------------------------- */
    if ((await db.count('contratos')) === 0) {
      const inicial = Modelo.contrato({
        nombre: cfg.contratoNombre || 'COMFENALCO',
        numero: cfg.contratoNumero || '',
        fechaInicio: cfg.fechaInicio || '2025-10-29',
        fechaFin: cfg.fechaFin || '',
        estado: cfg.estado || 'VIGENTE',
        prefijoCaja: cfg.prefijoCaja || 'CM',
        prefijoConsignacion: cfg.prefijoConsignacion || 'CON',
        financiadorPorDefectoId: cfg.financiadorPorDefectoId || null,
        infoAdicional: cfg.infoAdicional || '',
        origen: Origen.SISTEMA
      });
      await db.put('contratos', inicial);
      Cache.contratos.set(inicial.id, inicial);
      cfg.contratoActivoId = inicial.id;
      await db.put('configuracion', cfg);
      Cache.config = cfg;

      // adoptar las operaciones huérfanas y renombrar sus consecutivos
      const adoptar = async (col, campo) => {
        const lista = (await db.getAll(col)).filter(x => !x.contratoId);
        if (!lista.length) return 0;
        lista.forEach(x => { x.contratoId = inicial.id; });
        await db.putMany(col, lista);
        return lista.length;
      };
      const nC = await adoptar('cajas');
      const nD = await adoptar('detalles');
      const nK = await adoptar('consignaciones');
      // los contadores pasan a llevar el id del contrato en su clave
      const viejas = await db.getAll('secuencias');
      for (const sq of viejas) {
        const m = String(sq.id).match(/^(caja|con):([^:]+):(\d{4})$/);
        if (!m) continue;
        const nueva = (m[1] === 'caja' ? Secuencia.claveCaja : Secuencia.claveConsignacion)(inicial.id, m[2], m[3]);
        await db.put('secuencias', { id: nueva, valor: sq.valor, actualizadoEn: Modelo.ahora() });
        await db.remove('secuencias', sq.id);
      }
      if (nC || nK) console.info('[migración v2] contrato «' + inicial.nombre + '»: ' +
        nC + ' cajas, ' + nD + ' detalles, ' + nK + ' consignaciones adoptadas.');
    }

    /* --- migración v3: estados resumidos ---------------------------------
       Los seis estados anteriores se reducen a los tres pasos que ocurren de
       verdad. Se reescriben los que quedaron con el nombre viejo; los que ya
       están al día no se tocan, así que arrancar dos veces no cambia nada. */
    {
      const cajas = await db.getAll('cajas');
      const aCambiar = cajas.filter(c => ESTADOS_ANTIGUOS[c.estado]);
      if (aCambiar.length) {
        await db.putMany('cajas', aCambiar.map(c =>
          Object.assign({}, c, { estado: ESTADOS_ANTIGUOS[c.estado] })));
        const cuenta = {};
        for (const c of aCambiar) {
          const k = c.estado + ' → ' + ESTADOS_ANTIGUOS[c.estado];
          cuenta[k] = (cuenta[k] || 0) + 1;
        }
        console.info('[migración v3] estados actualizados:', cuenta);
      }
    }

    /* auto-reparación: si no hay financiador por defecto, proponer el primero
       que no sea la propia empresa (el usuario puede cambiarlo en Configuración) */
    if (!cfg.financiadorPorDefectoId) {
      const personas = await db.getAll('personas');
      const cand = personas.filter(p => p.esFinanciador && p.estado === Estado.ACTIVO)
        .sort((a, b) => (Txt.norm(a.cargo) === 'empresa' ? 1 : 0) - (Txt.norm(b.cargo) === 'empresa' ? 1 : 0)
                        || a.nombre.localeCompare(b.nombre, 'es'))[0];
      if (cand) {
        cfg.financiadorPorDefectoId = cand.id;
        await db.put('configuracion', cfg);
        Cache.config = cfg;
        const ctr = ContratoRepo.activo();
        if (ctr && !ctr.financiadorPorDefectoId) {
          ctr.financiadorPorDefectoId = cand.id;
          await db.put('contratos', ctr);
          Cache.contratos.set(ctr.id, ctr);
        }
      }
    }
  }
};

    setAcciones({ inicio: () => Router.ir('dashboard') });
  });

/* --------------------------------------------------------------------------
   Arranque
   -------------------------------------------------------------------------- */
async function arrancar() {
  const app = $('#app');
  app.innerHTML = '<div style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)">' +
    '<div style="text-align:center">' +
    '<img src="' + MARCA_DON_ASEO + '" alt="Don Aseo Ltda." ' +
    'style="width:58px;height:58px;border-radius:13px;margin:0 auto 16px;display:block;object-fit:cover">' +
    '<div style="font-weight:600;font-size:15px">Control de Caja Menor</div>' +
    '<div style="color:var(--text-3);font-size:12.5px;margin-top:4px">Don Aseo Ltda.</div>' +
    '<div style="margin-top:18px"><span class="spin"></span></div>' +
    '<div id="bootMsg" style="color:var(--text-3);font-size:11.5px;margin-top:10px">Abriendo la base de datos…</div>' +
    '</div></div>';
  const msg = t => { const e = $('#bootMsg'); if (e) e.textContent = t; };

  try {
    Prefs.cargar();
    document.documentElement.setAttribute('data-theme', Prefs.get('tema') === 'dark' ? 'dark' : 'light');

    /* El sistema trabaja SIEMPRE contra el servidor: una sola base para todos.
       Deliberadamente no hay copia local de trabajo ni respaldo a IndexedDB si
       la nube falla: dos bases separadas son dos verdades distintas, y una caja
       registrada en el equipo equivocado no existe para nadie más. Si no se
       puede conectar se avisa y se detiene; es preferible no entrar a entrar y
       perder lo escrito. (IndexedDB sigue en el código sólo como banco de
       pruebas aislado del corredor de tests.) */
    if (!Nube.configurada()) throw new ErrorDominio(
      'Este archivo no tiene servidor configurado. Use la dirección publicada del sistema.', 'SIN_NUBE');

    msg('Conectando con el servidor…');
    if (!await Nube.token()) await Sesion.pedirCredenciales();

    msg('Abriendo la base de datos…');
    db = new SupabaseAdapter();
    await db.init();
    msg('Preparando catálogos…');
    await Semillas.aplicar(false);
    await Cache.cargar();

    msg('Cargando la interfaz…');
    Shell.render();
    Tip.iniciar();
    Conexion.iniciar();
    Shell.aplicarFavicon();
    registrarRutas();
    Router.iniciar();
    await Shell.refrescarConteos();

    /* la barra lateral y los conteos se refrescan ante cualquier cambio de datos */
    ['cajas:cambio', 'consignaciones:cambio', 'personas:cambio', 'documentos:cambio', 'import:finalizado', 'datos:reemplazados']
      .forEach(e => Bus.on(e, U.debounce(() => Shell.refrescarConteos(), 400)));
    Bus.on('ruta:cambio', () => Shell.pintarNav());
    Bus.on('config:cambio', () => Shell.pintarNav());
    Bus.on('contrato:cambio', () => { Shell.render(); Shell.refrescarConteos(); Router.resolver(); });
    Bus.on('contratos:cambio', () => Shell.pintarSelectorContrato());

    /* aviso de primera vez */
    const nCajas = await db.count('cajas');
    if (nCajas === 0 && !localStorage.getItem('dacm.bienvenida')) {
      localStorage.setItem('dacm.bienvenida', '1');
      setTimeout(() => bienvenida(), 500);
    }
    console.info('%c' + APP.nombre + ' v' + APP.version + ' · esquema v' + APP.esquema,
      'color:#0f7f58;font-weight:700');
  } catch (e) {
    console.error(e);
    pantallaDeFallo(app, e);
  }
}

/**
 * Pantalla de diagnóstico cuando no se puede abrir la base de datos.
 * Nunca cae a una base local: da a elegir entre reintentar o cambiar de
 * cuenta, para que jamás se escriba en un sitio distinto del servidor.
 */
function pantallaDeFallo(app, e) {
  const mensaje = e && e.message ? e.message : String(e);
  const sinRed = !navigator.onLine || (e && e.codigo === 'SIN_RED') ||
                 /failed to fetch|networkerror|load failed/i.test(mensaje);
  app.innerHTML =
    '<div style="max-width:640px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif">' +
    '<div class="alert a-err" style="margin-bottom:18px">' + Icon('warn') +
    '<div><b>No se pudo conectar con el servidor.</b><br>' + esc(mensaje) + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>Qué hacer</h3></div><div class="card-b">' +
    (sinRed
      ? '<p class="mb12">Parece un problema de conexión. Revise que el equipo tenga internet y vuelva a ' +
        'intentarlo. La información está a salvo en el servidor: no se pierde nada por no poder entrar ahora.</p>'
      : '<p class="mb12">El servidor respondió con un error. Si vuelve a ocurrir, cierre la sesión y entre de ' +
        'nuevo: puede que las credenciales hayan caducado.</p>') +
    '<div class="flex g8 wrap">' +
    '<button class="btn btn-primary" id="fallReintentar">' + Icon('refresh', '', 14) + 'Reintentar</button>' +
    '<button class="btn" id="fallSalir">' + Icon('salir', '', 14) + 'Cerrar sesión</button>' +
    '</div></div></div></div>';
  const r = document.getElementById('fallReintentar');
  if (r) r.onclick = () => location.reload();
  const b = document.getElementById('fallSalir');
  if (b) b.onclick = async () => { try { await Nube.salir(); } catch (x) {} location.reload(); };
}

function bienvenida() {
  Modal.abrir({
    titulo: 'Bienvenido al Control de Caja Menor',
    subtitulo: esc(APP.empresa) + (ContratoRepo.activo() ? ' · Contrato ' + esc(ContratoRepo.activo().nombre) : ''),
    ancho: 'wide',
    cuerpo:
      '<p class="fs13 txt-2 mb16">El sistema está listo con la configuración inicial: municipios, categorías ' +
      '(incluidas gasolina y aceite como conceptos medibles) y las personas que adelantan el dinero. ' +
      'Trabaja en línea: cada cambio se guarda en el servidor en el momento.</p>' +
      '<div class="grid g2">' +
      '<div class="card"><div class="card-b">' +
      '<div class="flex aic g8 mb8">' + Icon('cog', 'txt-3', 16) + '<b>1. Complete la configuración</b></div>' +
      '<p class="fs12 txt-2">NIT, dirección, teléfono, responsable y logo. Todo eso aparece en el formato impreso.</p>' +
      '<button class="btn btn-sm mt8" data-ir="configuracion" data-cerrar>Ir a Configuración</button></div></div>' +
      '<div class="card"><div class="card-b">' +
      '<div class="flex aic g8 mb8">' + Icon('upload', 'txt-3', 16) + '<b>2. Importe el histórico</b></div>' +
      '<p class="fs12 txt-2">Cargue «Cuentas de caja menor 1.xlsx». El asistente le mostrará cada fila y le pedirá ' +
      'confirmar qué valores son personas antes de crear nada.</p>' +
      '<button class="btn btn-sm mt8" data-ir="importar" data-cerrar>Ir a Importar</button></div></div>' +
      '<div class="card"><div class="card-b">' +
      '<div class="flex aic g8 mb8">' + Icon('personas', 'txt-3', 16) + '<b>3. Registre las personas</b></div>' +
      '<p class="fs12 txt-2">Con cédula, banco y cuenta. Al crear una caja menor esos datos se cargan solos y quedan ' +
      'congelados en el documento.</p>' +
      '<button class="btn btn-sm mt8" data-ir="personas" data-cerrar>Ir a Personas</button></div></div>' +
      '<div class="card"><div class="card-b">' +
      '<div class="flex aic g8 mb8">' + Icon('nube', 'txt-3', 16) + '<b>4. Todo queda en el servidor</b></div>' +
      '<p class="fs12 txt-2">Se guarda al instante y se ve igual desde cualquier equipo entrando con su cuenta. ' +
      'Aun así descargue un respaldo .dacm cada tanto: es su copia propia.</p>' +
      '<button class="btn btn-sm mt8" data-ir="respaldos" data-cerrar>Ir a Copias de seguridad</button></div></div>' +
      '</div>' +
      '<div class="alert a-info mt16">' + Icon('info') +
      '<div>Atajos: <b>Ctrl + K</b> para la búsqueda global · <b>Ctrl + G</b> para una caja menor nueva.</div></div>',
    pie: '<button class="btn btn-primary" data-cerrar>Comenzar</button>'
  });
}

/* Arranque */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
else arrancar();
