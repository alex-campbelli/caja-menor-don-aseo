   * una lima; lo que lo distingue es que además cuenta en la serie de
   * gasolina, y eso se marca en la casilla de Estadística. Ofrecerlos en los
   * dos sitios hacía dudar de cuál era el bueno.
   *
   * Siguen existiendo en el catálogo —el histórico y las estadísticas las
   * usan—; lo único que cambia es que ya no se proponen al escribir.
   */
  opcionesCategorias() {
    return CategoriaRepo.activas()
      .filter(c => c.rol !== RolEstadistico.GASOLINA && c.rol !== RolEstadistico.ACEITE)
      .map(c => ({
        id: c.id, texto: c.nombre,
        sub: c.descripcion || '',
        tag: c.estadistica ? 'ESTADÍSTICA' : ''
      }));
  },
  opcionesMunicipios() {
    return MunicipioRepo.activos().map(m => ({ id: m.id, texto: m.nombre, sub: m.departamento || '' }));
  }
};

/* --- Entrada de dinero: formatea al escribir, guarda centavos ------------- */
const MoneyInput = {
  montar(input, alCambiar) {
    input.classList.add('inp-money');
    input.setAttribute('inputmode', 'numeric');
    const sync = () => {
      const cents = Money.parse(input.value);
      input.dataset.cents = String(cents);
      if (alCambiar) alCambiar(cents);
    };
    input.addEventListener('input', () => {
      const posFin = input.value.length - input.selectionStart;
      const cents = Money.parse(input.value);
      input.value = Money.formatInput(cents);
      const np = Math.max(0, input.value.length - posFin);
      try { input.setSelectionRange(np, np); } catch {}
      sync();
    });
    input.addEventListener('blur', () => { input.value = Money.formatInput(Money.parse(input.value)); sync(); });
    input.addEventListener('focus', () => input.select());
    sync();
    return { valor: () => Money.parse(input.value), fijar: c => { input.value = Money.formatInput(c); sync(); } };
  },
  leer(input) { return Money.parse(input.value); }
};

/* --- Zona de carga múltiple de archivos (§26) ----------------------------- */
const DropZone = {
  montar(el, alRecibir) {
    const input = document.createElement('input');
    input.type = 'file'; input.multiple = true; input.className = 'hidden';
    el.appendChild(input);
    el.addEventListener('click', e => { if (e.target !== input) input.click(); });
    input.addEventListener('change', () => { if (input.files.length) alRecibir([...input.files]); input.value = ''; });
    ['dragenter', 'dragover'].forEach(ev => el.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); el.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => el.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      if (ev === 'dragleave' && el.contains(e.relatedTarget)) return;
      el.classList.remove('over');
    }));
    el.addEventListener('drop', e => {
      const fs = [...(e.dataTransfer.files || [])];
      if (fs.length) alRecibir(fs);
    });
    return { abrir: () => input.click() };
  }
};

/* --- Gráficos SVG (sin librerías) ---------------------------------------- */
const Chart = (() => {
  const PALETA = ['#0f7f58', '#2563c9', '#c8860d', '#6d4aca', '#c8372d', '#0e8a8a', '#8a6d3b', '#5eb894',
                  '#e0693a', '#4e5d6b'];
  function ejeY(max) {
    const pasos = 4;
    const mag = Math.pow(10, Math.floor(Math.log10(max || 1)));
    let paso = Math.ceil((max || 1) / pasos / mag) * mag;
    if (paso <= 0) paso = 1;
    const top = Math.ceil((max || 1) / paso) * paso;
    const ticks = [];
    for (let v = 0; v <= top + 1e-9; v += paso) ticks.push(v);
    return { top: top || 1, ticks };
  }
  /* etiqueta de eje: sin símbolo y sin decimal cuando es redondo (100 M, 1,5 MM) */
  function fmtEje(v) {
    return Money.compact(v)
      .replace(/^\$[\s ]*/, '')
      .replace(/,0(?=\s|$)/, '');
  }

  /** barras verticales — series temporales */
  function barras(datos, opts) {
    const o = opts || {};
    const W = 100, H = o.alto || 190;
    if (!datos.length) return '<div class="empty" style="padding:26px"><p>Sin datos.</p></div>';
    const pl = 46, pr = 8, pt = 10, pb = 30;
    const max = Math.max(...datos.map(d => d.valor), 1);
    const { top, ticks } = ejeY(max);
    const iw = 1000 - pl - pr, ih = H - pt - pb;
    const bw = iw / datos.length;
    const ancho = Math.min(bw * 0.62, 46);
    let s = '<svg class="chart" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">';
    ticks.forEach(t => {
      const y = pt + ih - (t / top) * ih;
      s += '<line class="gl" x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (1000 - pr) + '" y2="' + y.toFixed(1) + '"/>';
      s += '<text x="' + (pl - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + fmtEje(t) + '</text>';
    });
    datos.forEach((d, i) => {
      const h = (d.valor / top) * ih;
      const x = pl + i * bw + (bw - ancho) / 2;
      const y = pt + ih - h;
      s += '<rect class="bar-r" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + ancho.toFixed(1) +
        '" height="' + Math.max(0, h).toFixed(1) + '" rx="2" data-tip="' +
        attr(d.etiqueta + ': ' + (o.formato ? o.formato(d.valor) : Money.format(d.valor)) +
             (d.sub ? ' · ' + d.sub : '')) + '"' + (d.color ? ' style="fill:' + d.color + '"' : '') + '/>';
      if (datos.length <= 24)
        s += '<text x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' +
          esc(d.corta || d.etiqueta) + '</text>';
    });
    s += '<line class="ax" x1="' + pl + '" y1="' + (pt + ih) + '" x2="' + (1000 - pr) + '" y2="' + (pt + ih) + '"/>';
    s += '</svg>';
    return s;
  }

  /** línea + área — evolución */
  function linea(series, opts) {
    const o = opts || {};
    const H = o.alto || 200;
    const base = series[0] ? series[0].datos : [];
    if (!base.length) return '<div class="empty" style="padding:26px"><p>Sin datos.</p></div>';
    const pl = 46, pr = 10, pt = 12, pb = 28;
    const max = Math.max(...series.flatMap(s => s.datos.map(d => d.valor)), 1);
    const { top, ticks } = ejeY(max);
    const iw = 1000 - pl - pr, ih = H - pt - pb;
    const px = i => pl + (base.length === 1 ? iw / 2 : (i / (base.length - 1)) * iw);
    const py = v => pt + ih - (v / top) * ih;
    let s = '<svg class="chart" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">';
    ticks.forEach(t => {
      const y = py(t);
      s += '<line class="gl" x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (1000 - pr) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text x="' + (pl - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + fmtEje(t) + '</text>';
    });
    series.forEach((serie, si) => {
      const color = serie.color || PALETA[si % PALETA.length];
      const pts = serie.datos.map((d, i) => px(i).toFixed(1) + ',' + py(d.valor).toFixed(1));
      if (si === 0 && o.area !== false) {
        s += '<path class="ar" style="fill:' + color + '" d="M' + px(0).toFixed(1) + ',' + (pt + ih) + ' L' +
          pts.join(' L') + ' L' + px(base.length - 1).toFixed(1) + ',' + (pt + ih) + ' Z"/>';
      }
      s += '<polyline class="ln" style="stroke:' + color + '" points="' + pts.join(' ') + '"/>';
      serie.datos.forEach((d, i) => {
        s += '<circle class="dot" style="stroke:' + color + '" cx="' + px(i).toFixed(1) + '" cy="' + py(d.valor).toFixed(1) +
          '" r="3.2" data-tip="' + attr(d.etiqueta + ' · ' + serie.nombre + ': ' +
          (o.formato ? o.formato(d.valor) : Money.format(d.valor))) + '"/>';
      });
    });
    base.forEach((d, i) => {
      if (base.length > 18 && i % 2) return;
      s += '<text x="' + px(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(d.corta || d.etiqueta) + '</text>';
    });
    s += '<line class="ax" x1="' + pl + '" y1="' + (pt + ih) + '" x2="' + (1000 - pr) + '" y2="' + (pt + ih) + '"/></svg>';
    if (series.length > 1) {
      s += '<div class="legend">' + series.map((se, i) =>
        '<span><i style="background:' + (se.color || PALETA[i % PALETA.length]) + '"></i>' + esc(se.nombre) + '</span>').join('') + '</div>';
    }
    return s;
  }

  /** dona — composición */
  function dona(datos, opts) {
    const o = opts || {};
    const total = U.sumBy(datos, d => d.valor);
    if (!total) return '<div class="empty" style="padding:26px"><p>Sin datos.</p></div>';
    const R = 78, r = 48, cx = 100, cy = 100;
    let ang = -Math.PI / 2, s = '<svg class="chart" viewBox="0 0 200 200" style="height:' + (o.alto || 190) + 'px">';
    datos.forEach((d, i) => {
      const frac = d.valor / total;
      const a2 = ang + frac * Math.PI * 2;
      const largo = frac > 0.5 ? 1 : 0;
      const x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
      const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      const x3 = cx + r * Math.cos(a2), y3 = cy + r * Math.sin(a2);
      const x4 = cx + r * Math.cos(ang), y4 = cy + r * Math.sin(ang);
      const color = d.color || PALETA[i % PALETA.length];
      s += '<path d="M' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' A' + R + ',' + R + ' 0 ' + largo + ',1 ' +
        x2.toFixed(2) + ',' + y2.toFixed(2) + ' L' + x3.toFixed(2) + ',' + y3.toFixed(2) + ' A' + r + ',' + r +
        ' 0 ' + largo + ',0 ' + x4.toFixed(2) + ',' + y4.toFixed(2) + ' Z" fill="' + color + '" ' +
        'data-tip="' + attr(d.etiqueta + ': ' + Money.format(d.valor) + ' (' + (frac * 100).toFixed(1) + '%)') + '"/>';
      ang = a2;
    });
    if (o.centro) {
      s += '<text x="100" y="96" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--text)">' +
        esc(o.centro) + '</text>';
      if (o.centroSub) s += '<text x="100" y="112" text-anchor="middle" style="font-size:9px">' + esc(o.centroSub) + '</text>';
    }
    s += '</svg>';
    s += '<div class="legend">' + datos.map((d, i) =>
      '<span><i style="background:' + (d.color || PALETA[i % PALETA.length]) + '"></i>' + esc(d.etiqueta) +
      ' <b class="tnum">' + (d.valor / total * 100).toFixed(0) + '%</b></span>').join('') + '</div>';
    return s;
  }

  /** barras apiladas horizontales — gasolina/aceite/otros */
  function apilada(segmentos, opts) {
    const o = opts || {};
    const total = U.sumBy(segmentos, s => s.valor);
    if (!total) return '<div class="txt-3 fs12">Sin datos.</div>';
    let acc = 0;
    let s = '<div style="display:flex;height:' + (o.alto || 22) + 'px;border-radius:5px;overflow:hidden;border:1px solid var(--border)">';
    segmentos.forEach((seg, i) => {
      const w = seg.valor / total * 100;
      acc += w;
      s += '<div data-tip="' + attr(seg.etiqueta + ': ' + Money.format(seg.valor) + ' (' + w.toFixed(1) + '%)') +
        '" style="width:' + w.toFixed(2) + '%;background:' + (seg.color || PALETA[i % PALETA.length]) + '"></div>';
    });
    s += '</div><div class="legend">' + segmentos.map((seg, i) =>
      '<span><i style="background:' + (seg.color || PALETA[i % PALETA.length]) + '"></i>' + esc(seg.etiqueta) +
      ' <b class="tnum">' + Money.format(seg.valor) + '</b></span>').join('') + '</div>';
    return s;
  }

  return { barras, linea, dona, apilada, PALETA };
})();

/* Tooltips globales para los gráficos */
(function tooltips() {
  let tip = null;
  document.addEventListener('mouseover', e => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) return;
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip); }
    tip.textContent = t.getAttribute('data-tip');
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e => {
    if (!tip || tip.style.display === 'none') return;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 12, y = e.clientY - h - 8;
    if (x + w > innerWidth - 8) x = e.clientX - w - 12;
    if (y < 6) y = e.clientY + 16;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('mouseout', e => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t && tip) tip.style.display = 'none';
  });
})();

  },

  montarBuscador() {
    const inp = $('#gq'), caja = $('#gsr');
    if (!inp) return;
    let items = [], hl = -1;
    const cerrar = () => { caja.classList.add('hidden'); hl = -1; };
    const pintar = res => {
      items = [];
      if (!res.total) {
        caja.innerHTML = '<div class="gsr-i txt-3">Sin resultados</div>';
      } else {
        caja.innerHTML = res.grupos.map(g =>
          '<div class="gsr-g">' + esc(g.titulo) + '</div>' +
          g.items.map(it => { items.push(it);
            return '<div class="gsr-i" data-i="' + (items.length - 1) + '">' + Icon(g.icono, '', 14) +
              '<span class="gi-t">' + it.titulo + '</span>' +
              (it.meta ? '<span class="gi-m">' + esc(it.meta) + '</span>' : '') + '</div>';
          }).join('')).join('');
      }
      caja.classList.remove('hidden');
    };
    const buscar = U.debounce(async () => {
      const q = inp.value.trim();
      if (q.length < 2) { cerrar(); return; }
      try { pintar(await Buscador.buscar(q)); } catch (e) { console.error(e); }
    }, 160);
    inp.addEventListener('input', buscar);
    inp.addEventListener('focus', () => { if (inp.value.trim().length >= 2) buscar(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Escape') { cerrar(); inp.blur(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(hl + 1, items.length - 1); marcar(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(hl - 1, 0); marcar(); }
      else if (e.key === 'Enter' && items[hl >= 0 ? hl : 0]) {
        Router.ir(items[hl >= 0 ? hl : 0].ruta); cerrar(); inp.blur(); inp.value = '';
      }
    });
    function marcar() {
      $$('.gsr-i', caja).forEach((el, i) => el.classList.toggle('hl', i === hl));
      const el = caja.querySelector('.hl'); if (el) el.scrollIntoView({ block: 'nearest' });
    }
    caja.addEventListener('mousedown', e => {
      const it = e.target.closest('.gsr-i'); if (!it || it.dataset.i === undefined) return;
      e.preventDefault();
      Router.ir(items[Number(it.dataset.i)].ruta); cerrar(); inp.value = ''; inp.blur();
    });
    document.addEventListener('mousedown', e => { if (!e.target.closest('.gsearch')) cerrar(); });
  }
};

/**
 * Ejecuta una acción y, si tarda, enseña el aviso de espera.
 *
 * Muchas acciones van al servidor —adjuntar un comprobante, cambiar el estado
 * de una caja— y mientras tanto la pantalla se quedaba igual, como si el clic
 * no hubiera entrado: parecía que el programa se había colgado y de pronto
 * refrescaba solo. Sólo se avisa cuando la acción devuelve una promesa; las
 * instantáneas no encienden nada, y el aviso tampoco aparece antes de los
 * 180 ms, así que lo rápido sigue viéndose rápido.
 */
async function correrAccion(fn, el, ev) {
  let r;
  try { r = fn(el, ev); }
  catch (err) { manejarError(err); return; }
  if (!r || typeof r.then !== 'function') return r;
  Cargando.iniciar();
  try { return await r; }
  catch (err) { manejarError(err); }
  finally { Cargando.terminar(); }
}

/* --- Delegación global de eventos ---------------------------------------- */
const AccionesGlobales = {
  async cambiarContrato(el) {
    try { await ContratoRepo.cambiarActivo(el.value); Toast.ok('Contrato activo: ' + ContratoRepo.activo().nombre); }
    catch (e) { manejarError(e); }
  },
  menu() { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); },
  conexion() { Conexion.verDetalle(); },
  async salir() {
    const s = Nube.sesion() || {};
    const ok = await Modal.confirmar({
      titulo: 'Cerrar sesión',
      html: 'Se cerrará la sesión de <b>' + esc(s.correo || '') + '</b> en este navegador.' +
            '<br><br>La información queda guardada en el servidor: no se pierde nada al salir. ' +
            'Para volver a entrar necesitará el correo y la contraseña.',
      textoOk: 'Cerrar sesión'
    });
    if (!ok) return;
    try { await Nube.salir(); } catch (e) { console.warn(e); }
    location.reload();
  },
  tema() {
    const nuevo = Prefs.get('tema') === 'dark' ? 'light' : 'dark';
    Prefs.set('tema', nuevo);
    document.documentElement.setAttribute('data-theme', nuevo);
    const b = $('[data-gact="tema"]');
    if (b) b.innerHTML = Icon(nuevo === 'dark' ? 'sun' : 'moon', '', 15);
  }
};

/**
 * Delegación de clics. Gana SIEMPRE el elemento más interno: un botón o un
 * desplegable dentro de una fila navegable no debe disparar la navegación de
 * la fila (antes sí lo hacía, porque `data-ir` se evaluaba primero).
 */
document.addEventListener('click', async e => {
  const ir = e.target.closest('[data-ir]');
  const g  = e.target.closest('[data-gact]');
  const a  = e.target.closest('[data-act]');
  const masInterno = el => el && (!ir || ir === el || ir.contains(el));

  if (masInterno(g)) {
    if (g.tagName === 'SELECT' || g.tagName === 'INPUT') { e.stopPropagation(); return; }
    e.preventDefault();
    const fn = AccionesGlobales[g.getAttribute('data-gact')];
    if (fn) correrAccion(fn, g, e);
    return;
  }
  if (masInterno(a)) {
    // los controles de formulario los atiende el evento 'change'; aquí sólo
    // se impide que el clic escale hasta la fila navegable
    if (a.tagName === 'SELECT' || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') { e.stopPropagation(); return; }
    const fn = Acciones[a.getAttribute('data-act')];
    if (fn) { e.preventDefault(); await correrAccion(fn, a, e); }
    return;
  }
  if (ir) {
    e.preventDefault();
    Router.ir(ir.getAttribute('data-ir'));
    if (innerWidth <= 860) { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }
  }
});
document.addEventListener('change', async e => {
  const g = e.target.closest('[data-gact]');
  if (g) { const fn = AccionesGlobales[g.getAttribute('data-gact')];
    if (fn) { await correrAccion(fn, g, e); return; } }
  const a = e.target.closest('[data-act]');
  if (a && (a.tagName === 'SELECT' || a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) {
    const fn = Acciones[a.getAttribute('data-act')];
    if (fn) await correrAccion(fn, a, e);
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-act]');
  if (f) { e.preventDefault(); const fn = Acciones[f.getAttribute('data-act')];
    if (fn) await correrAccion(fn, f, e); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const q = $('#gq'); if (q) { q.focus(); q.select(); } }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g') { e.preventDefault(); Router.ir('caja-nueva'); }
});
document.addEventListener('click', e => {
  if (e.target.id === 'scrim') { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }
});

function manejarError(err) {
  console.error(err);
  /* Sin sesión no se puede leer ni escribir nada: seguir mostrando la pantalla
     sólo produce errores en cascada. Se vuelve al acceso una única vez. */
  if (err instanceof ErrorDominio && (err.codigo === 'SESION_EXPIRADA' || err.codigo === 'SIN_SESION')) {
    if (!manejarError._saliendo) {
      manejarError._saliendo = true;
      Modal.alerta('La sesión expiró',
        'Por seguridad la sesión se cerró. Se le pedirá el correo y la contraseña de nuevo.<br><br>' +
        'Nada de lo que ya guardó se pierde.', 'warn');
      setTimeout(() => location.reload(), 2600);
    }
    return;
  }
  if (err instanceof ErrorValidacion) {
    Modal.alerta('No se pudo guardar',
      '<ul style="margin:0;padding-left:18px">' + err.errores.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>', 'err');
  } else if (err instanceof ErrorDominio) {
    Toast.err(err.message);
  } else {
    Toast.err('Error inesperado: ' + (err && err.message ? err.message : String(err)));
  }
}

      (ultimasCons.length ? '<div class="card mt16"><div class="card-h"><h3>Últimas consignaciones</h3>' +
        '<div class="ch-act"><span class="link fs12" data-ir="consignaciones">Ver todas</span></div></div>' +
        '<div class="card-b flush"><div class="tbl-wrap"><table class="tbl">' +
        '<thead><tr><th>Número</th><th>Fecha</th><th>Beneficiario</th><th>Banco / Referencia</th>' +
        '<th class="num">Valor</th><th class="num">Cajas</th></tr></thead><tbody>' +
        ultimasCons.map(c => '<tr class="row-click" data-ir="consignacion/' + attr(c.id) + '">' +
          '<td class="mono">' + esc(c.numero) + '</td>' +
          '<td class="nowrap">' + Fecha.corta(c.fecha) + '</td>' +
          '<td>' + esc((c.beneficiario && c.beneficiario.nombre) || '—') + '</td>' +
          '<td class="trunc" style="max-width:190px">' + esc([c.banco, c.referencia].filter(Boolean).join(' · ') || '—') + '</td>' +
          '<td class="num">' + Money.format(c.valor) + '</td>' +
          '<td class="num"><span data-cons-cajas="' + attr(c.id) + '">—</span></td></tr>').join('') +
        '</tbody></table></div></div></div>' : '');

    setAcciones({
      'dash:periodo': el => { f.periodo = el.dataset.p;
        if (f.periodo === 'anio' && !f.anio) f.anio = Fecha.anio(Fecha.hoy());
        if (f.periodo === 'mes' && !f.mes) f.mes = Fecha.mesClave(Fecha.hoy());
        VistaDashboard.render(cont); },
      'dash:anio': el => { f.anio = el.value; VistaDashboard.render(cont); },
      'dash:mes': el => { f.mes = el.value; VistaDashboard.render(cont); },
      'dash:desde': Comp.filtroFecha(v => { f.desde = v; VistaDashboard.render(cont); }),
      'dash:hasta': Comp.filtroFecha(v => { f.hasta = v; VistaDashboard.render(cont); }),
      verRevisiones: () => VistaDashboard.modalRevisiones(revisiones)
    });

    // conteo de cajas por consignación (consulta ligera, después del pintado)
    const apls = await db.getAll('aplicaciones');
    const porCon = new Map();
    apls.forEach(a => porCon.set(a.consignacionId, (porCon.get(a.consignacionId) || 0) + 1));
    $$('[data-cons-cajas]').forEach(el => { el.textContent = porCon.get(el.getAttribute('data-cons-cajas')) || 0; });
  },

  modalRevisiones(lista) {
    Modal.abrir({
      titulo: 'Cajas que requieren revisión',
      subtitulo: 'Inconsistencias detectadas en los datos de origen. No se modificaron automáticamente.',
      ancho: 'wide',
      cuerpo: '<div class="alert a-info mb12">' + Icon('info') +
        '<div>Estos registros se importaron <b>tal como estaban</b> en el archivo original. ' +
        'El sistema no alteró ningún valor. Ábralos y corrija manualmente cuando tenga la información correcta.</div></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Número</th><th>Fecha</th><th>Concepto</th>' +
        '<th class="num">Total</th><th>Motivo</th></tr></thead><tbody>' +
        lista.map(c => '<tr class="row-click" data-ir="caja/' + attr(c.id) + '">' +
          '<td class="mono">' + esc(c.numero) + '</td><td class="nowrap">' + Fecha.corta(c.fecha) + '</td>' +
          '<td>' + esc(Comp.nombreSolicitante(c)) + '</td><td class="num">' + Money.format(c.total) + '</td>' +
          '<td class="fs11">' + esc(c.motivoRevision || '—') + '</td></tr>').join('') +
        '</tbody></table></div>'
    });
  }
};


/* ==========================================================================
   VISTA · CAJAS MENORES (listado)
   ========================================================================== */
const VistaCajas = {
  /* Qué cajas están marcadas. Vive fuera de los filtros porque sobrevive a
     repintados y a cambios de página: se puede marcar en la página 1, pasar a
     la 2, seguir marcando y ver el total de todas juntas. */
  seleccion: new Set(),

  /**
   * Fila desplegable con el desglose de una caja.
   *
   * En el archivo, un movimiento es UNA fila con su descripción y las cifras de
   * gasolina y aceite aparte. Al traerlo, el gasto se parte en tres conceptos y
   * la descripción queda en el suyo. Eso se leía como si la gasolina se cobrara
   * dos veces: arriba $170.000 y otra vez nombrada en «Gasolina, aceite,
   * cuchillas y botas».
   *
   * La descripción NO se mueve de su fila: es la anotación de ese gasto y ahí
   * hace falta. Lo que se añade es lo que faltaba para entenderlo — cada
   * subcomponente dice que es «Parte de la caja menor», el total va a la vista
   * para comprobar que la suma cuadra, y debajo se dice con todas las letras
   * que gasolina y aceite no se suman aparte (§13).
   */
  filaDetalle(c, dets) {
    const haySub = dets.some(d => d.rol === RolEstadistico.GASOLINA || d.rol === RolEstadistico.ACEITE);
    const suma = U.sumBy(dets, d => d.valor);
    return '<tr class="det-fila hidden" data-det="' + attr(c.id) + '"><td colspan="15">' +
      '<div class="det-caja">' +
      (dets.length
        /* Las mismas columnas que dentro de la caja: al separar categoría y
           elemento, este desglose se quedó enseñando sólo la categoría y las
           doce filas de una caja menor decían todas «Caja menor». */
        ? '<table class="tbl-mini"><thead><tr><th>Categoría</th><th>Elemento</th>' +
          '<th>Descripción</th><th class="num">Valor</th></tr></thead><tbody>' +
          dets.map(d => {
            const sub = d.rol === RolEstadistico.GASOLINA || d.rol === RolEstadistico.ACEITE;
            return '<tr><td class="nowrap">' + esc(d.categoriaNombre || '—') +
              (sub ? ' <span class="txt-3 fs11">Parte de la caja menor</span>' : '') + '</td>' +
              '<td class="nowrap">' + (String(d.elemento || '').trim()
                ? esc(d.elemento) : '<span class="txt-3">—</span>') + '</td>' +
              '<td>' + (String(d.descripcion || '').trim()
                ? esc(d.descripcion) : '<span class="txt-3">—</span>') + '</td>' +
              '<td class="num">' + Money.format(d.valor) + '</td></tr>';
          }).join('') +
          '</tbody><tfoot>' +
          (c.retencion
            ? '<tr><td colspan="3">Suma de los conceptos</td>' +
              '<td class="num">' + Money.format(suma) + '</td></tr>' +
              '<tr><td colspan="3">Retención</td>' +
              '<td class="num">− ' + Money.format(c.retencion) + '</td></tr>'
            : '') +
          '<tr><td colspan="3">Total de la caja</td>' +
          '<td class="num">' + Money.format(c.total) + '</td></tr>' +
          '</tfoot></table>'
        : '') +
      (haySub ? '<div class="fs11 txt-3 mt8">La gasolina y el aceite son parte del total de caja menor, ' +
                'no se suman aparte.</div>' : '') +
      (String(c.observaciones || '').trim()
        ? '<div class="fs12 mt8"><b>Observaciones:</b> ' + esc(c.observaciones) + '</div>' : '') +
      '</div></td></tr>';
  },

  /**
   * Barra flotante con lo que está marcado. Aparece sola al marcar la primera
   * caja y suma sobre la marcha: sirve para escoger a ojo las que faltan por
   * reembolsar y ver de una vez cuánto suman, sin sacar la calculadora.
   */
  barraSeleccion() {
    const ctx = VistaCajas._ctx;
    if (!ctx) return '';
    const sel = ctx.todas.filter(c => VistaCajas.seleccion.has(c.id));
    if (!sel.length) return '';
    const total = U.sumBy(sel, c => c.total);
    const pend = U.sumBy(sel, c => Finanzas.pendienteDe(c, ctx.repuesto.get(c.id) || 0));
    return '<div class="selbar">' +
      '<div class="selbar-in">' +
        '<b>' + sel.length + '</b> caja(s) marcada(s)' +
        '<span class="selbar-sep"></span>' +
        'Total <b>' + Money.format(total) + '</b>' +
        (pend ? '<span class="selbar-sep"></span>Pendiente <b>' + Money.format(pend) + '</b>' : '') +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-sm" data-act="resumenSeleccion">' + Icon('doc', '', 13) +
          'Resumen para quien consignó</button>' +
        '<button class="btn btn-sm btn-primary" data-act="pdfSeleccion">' + Icon('print', '', 13) +
          'PDF con comprobantes</button>' +
        '<button class="btn btn-sm btn-ghost btn-icon" data-act="selLimpiar" title="Quitar la selección">' +
          Icon('x', '', 13) + '</button>' +
      '</div></div>';
  },

  /**
   * Refresca SÓLO lo que cambia al marcar: la fila, la casilla del encabezado
   * y la barra del total.
   *
   * Antes esto repintaba la vista completa, y repintar significa volver a
   * pedir cajas, detalles y aplicaciones al servidor: marcar cinco casillas
   * seguidas eran cinco consultas y varios segundos. Ahora no se consulta
   * nada: la suma sale de lo que ya está en pantalla.
   */
  refrescarSeleccion() {
    const ctx = VistaCajas._ctx;
    if (!ctx || !document.contains(ctx.cont)) return;
    ctx.cont.querySelectorAll('tr.row-click[data-ir]').forEach(tr => {
      const cb = tr.querySelector('[data-act="selUna"]');
      if (!cb) return;
      const marcada = VistaCajas.seleccion.has(cb.dataset.id);
      cb.checked = marcada;
      tr.classList.toggle('marcada', marcada);
    });
    const cabecera = ctx.cont.querySelector('[data-act="selPagina"]');
    if (cabecera) cabecera.checked = ctx.pagina.length > 0 &&
      ctx.pagina.every(c => VistaCajas.seleccion.has(c.id));
    const barra = ctx.cont.querySelector('#selBarra');
    if (barra) barra.innerHTML = VistaCajas.barraSeleccion();
  },

  async render(cont) {
    Shell.titulo('Cajas menores', 'Las columnas se llaman igual que en su archivo de Excel');
    const f = Estado_App.filtrosCajas;
    cont.innerHTML = Comp.cargando();

    const q = Txt.norm(f.texto);
    const ctrId = ContratoRepo.activoId();

    /* La categoría y la descripción viven en los detalles, no en la caja. Se
       traen de una vez —una lectura, no una por fila— y en paralelo con las
       aplicaciones, que tampoco dependen de nada. */
    const [detsTodos, aplsTodas, docsTodos] = await Promise.all([
      db.getAll('detalles'), db.getAll('aplicaciones'), db.getAll('documentos')]);

    /* Qué cajas tienen ya su comprobante de consignación. Puede estar colgado
       de la caja o de la consignación que la repone: las dos cuentan, igual
       que en el detalle de la caja. */
    const conComprobante = new Set();
    {
      const esComp = d => d.tipo === TipoDocumento.COMPROBANTE_CONSIGNACION && d.estado !== Estado.INACTIVO;
      const consConComp = new Set();
      for (const d of docsTodos) {
        if (!esComp(d)) continue;
        if (d.cajaId) conComprobante.add(d.cajaId);
        if (d.consignacionId) consConComp.add(d.consignacionId);
      }
      for (const a of aplsTodas) if (consConComp.has(a.consignacionId)) conComprobante.add(a.cajaId);
    }
    const detsPorCaja = new Map();
    for (const d of detsTodos) {
      if (!detsPorCaja.has(d.cajaId)) detsPorCaja.set(d.cajaId, []);
      detsPorCaja.get(d.cajaId).push(d);
    }
    /* Gasolina y aceite ya tienen columna propia: como «categoría» de la caja
       interesa el concepto del gasto, no sus subcomponentes.
     *
     * Pero si la caja NO tiene ninguna otra cosa —dos conceptos, gasolina y
     * aceite, y nada más— saltárselos dejaba la columna en «—» aunque ambos
     * dijeran «Caja menor». Venía de cuando gasolina y aceite ERAN la
     * categoría; hoy son un papel aparte y la categoría de esas filas es tan
     * buena como cualquiera. Es el mismo resguardo que ya usa la relación de
     * reembolso. */
    const catsDe = c => {
      const propias = [], subs = [];
      for (const d of (detsPorCaja.get(c.id) || [])) {
        const n = String(d.categoriaNombre || '').trim();
        if (!n) continue;
        const esSub = d.rol === RolEstadistico.GASOLINA || d.rol === RolEstadistico.ACEITE;
        const donde = esSub ? subs : propias;
        if (donde.indexOf(n) < 0) donde.push(n);
      }
      return propias.length ? propias : subs;
    };

    /* Las sugerencias tienen que salir de lo que de verdad hay, y sin que el
       texto ya escrito las recorte: si no, tras elegir «Alirio» sólo se podría
       sugerir dentro de sus cajas. Se recogen en la MISMA pasada del filtro,
       justo antes de comprobar el texto. */
    const candidatos = [];
    const todas = await db.query('cajas', {
      indice: f.orden === 'numero' ? 'numero' : f.orden === 'total' ? 'fecha' : 'fecha',
      direccion: f.dir,
      filtro: c => {
        if (ctrId && c.contratoId && c.contratoId !== ctrId) return false;
        if (f.estado && c.estado !== f.estado) return false;
        if (f.estado === '' && f.ocultarAnuladas && c.estado === EstadoCaja.ANULADA) return false;
        if (f.solicitanteId && c.solicitanteId !== f.solicitanteId) return false;
        if (f.municipioId && c.municipioId !== f.municipioId) return false;
        if (f.consignoId && c.consignoId !== f.consignoId) return false;
        /* El rango se aplica cuando hay fecha «hasta». Con sólo la de inicio
           el listado se recalculaba a media escritura y mostraba un resultado
           que todavía no se había terminado de pedir. */
        if (f.hasta) {
          if (f.desde && c.fecha < f.desde) return false;
          if (c.fecha > f.hasta) return false;
        }
        if (f.origen && c.origen !== f.origen) return false;
        if (f.categoriaId && !(detsPorCaja.get(c.id) || []).some(d => d.categoriaId === f.categoriaId)) return false;
        candidatos.push(c);
        if (q) {
          const ds = detsPorCaja.get(c.id) || [];
          const blob = [c.numero, Comp.nombreSolicitante(c), c.municipioNombre, c.observaciones,
                        c.solicitante && c.solicitante.cedula, Comp.nombreConsigno(c),
                        ds.map(d => d.categoriaNombre).join(' '), ds.map(d => d.descripcion).join(' ')].join(' ');
          if (!Txt.norm(blob).includes(q)) return false;
        }
        return true;
      }
    });
    /* Dentro de un mismo día manda el consecutivo: es el orden en que se
       registraron y el que se espera al leer la columna NÚMERO de arriba abajo.
       Ambos campos ordenan bien como texto (la fecha es ISO y el consecutivo va
       con ceros delante), así que se comparan juntos. */
    if (f.orden === 'fecha') todas.sort(U.by(c => c.fecha + '|' + (c.numero || ''), f.dir));
    else if (f.orden === 'total') todas.sort(U.by('total', f.dir));
    else if (f.orden === 'numero') todas.sort(U.by('numero', f.dir));
    else if (f.orden === 'solicitante') todas.sort(U.by(c => Comp.nombreSolicitante(c), f.dir));
    else if (f.orden === 'categoria') todas.sort(U.by(c => Txt.norm(catsDe(c)[0] || ''), f.dir));

    const apls = aplsTodas;
    const repuesto = new Map();
    apls.forEach(a => repuesto.set(a.cajaId, (repuesto.get(a.cajaId) || 0) + a.monto));

    const tam = Prefs.get('paginaTam') || 25;
    const totalPags = Math.max(1, Math.ceil(todas.length / tam));
    if (f.pagina > totalPags) f.pagina = totalPags;
    const pagina = todas.slice((f.pagina - 1) * tam, f.pagina * tam);

    /* la casilla del encabezado marca o desmarca la página que se está viendo */
    const todasMarcadas = pagina.length > 0 && pagina.every(c => VistaCajas.seleccion.has(c.id));
    const vivas = todas.filter(c => c.estado !== EstadoCaja.ANULADA);
    const sumTotal = U.sumBy(vivas, c => c.total);
    const sumPend = U.sumBy(vivas, c => Finanzas.pendienteDe(c, repuesto.get(c.id) || 0));

    /* Los encabezados llevan los MISMOS nombres que el archivo de Excel, para
       poder comparar las dos pantallas sin traducir. Donde el nombre del
       archivo no dice por sí solo qué hay dentro —CONCEPTO son personas— la
       explicación va en el globo de ayuda, que no ocupa ancho. */
    const th = (campo, txt, cls, ayuda) => {
      const act = f.orden === campo;
      return '<th class="sortable' + (act ? ' sorted' : '') + (cls ? ' ' + cls : '') +
        '" data-act="ordenar" data-campo="' + campo + '"' +
        (ayuda ? ' title="' + attr(ayuda) + '"' : '') + '>' +
        esc(txt) + '<span class="sarrow">' + (act ? (f.dir === 'asc' ? '▲' : '▼') : '↕') + '</span></th>';
    };

    cont.innerHTML =
      '<div class="page-head"><div><h1>Cajas menores</h1>' +
      '<div class="ph-sub">' + todas.length.toLocaleString('es-CO') + ' registro(s) · Total ' + Money.format(sumTotal) +
      ' · Pendiente ' + Money.format(sumPend) + '</div></div>' +
      '<div class="ph-actions">' +
      '<button class="btn" data-act="selPorReembolsar" title="Marca las cajas ya consignadas que todavía no se han reembolsado">' +
        Icon('check', '', 14) + 'Marcar por reembolsar</button>' +
      '<button class="btn" data-act="exportarExcel">' + Icon('download', '', 14) + 'Excel</button>' +
      '<button class="btn" data-act="exportarCsv">' + Icon('download', '', 14) + 'CSV</button>' +
      '<button class="btn btn-primary" data-ir="caja-nueva">' + Icon('plus', '', 14) + 'Nueva caja</button>' +
      '</div></div>' +

      '<div class="card mb16"><div class="card-b" style="padding:12px 14px">' +
      '<div class="filters" style="margin:0">' +
        '<div class="field" style="flex:1 1 220px"><label>Búsqueda</label>' +
          '<input class="inp" placeholder="Número, concepto, cédula, ubicación, descripción…" value="' +
          attr(f.texto) + '" id="buscaCaja" data-act="fTexto"></div>' +
        '<div class="field"><label>Estado</label><select class="inp" data-act="fEstado">' +
          '<option value="">Todos</option>' +
          Object.keys(ESTADO_CAJA_META).map(k => '<option value="' + k + '"' + (f.estado === k ? ' selected' : '') + '>' +
            ESTADO_CAJA_META[k].label + '</option>').join('') + '</select></div>' +
        '<div class="field"><label title="Como en el Excel: la persona que solicita">Concepto</label>' +
          '<select class="inp" data-act="fSolicitante">' +
          '<option value="">Todos</option>' +
          PersonaRepo.todas().sort(U.by('nombre')).map(p => '<option value="' + p.id + '"' +
            (f.solicitanteId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label title="Como en el Excel: el municipio">Ubicación</label>' +
          '<select class="inp" data-act="fMunicipio">' +
          '<option value="">Todos</option>' +
          MunicipioRepo.todos().map(m => '<option value="' + m.id + '"' + (f.municipioId === m.id ? ' selected' : '') + '>' +
            esc(m.nombre) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Consignó</label><select class="inp" data-act="fConsigno">' +
          '<option value="">Todos</option>' +
          PersonaRepo.todas().filter(p => p.esFinanciador).map(p => '<option value="' + p.id + '"' +
            (f.consignoId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Categoría</label><select class="inp" data-act="fCategoria">' +
          '<option value="">Todas</option>' +
          CategoriaRepo.todas().map(k => '<option value="' + attr(k.id) + '"' +
            (f.categoriaId === k.id ? ' selected' : '') + '>' + esc(k.nombre) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Desde</label><input type="date" class="inp" value="' + attr(f.desde) + '" data-act="fDesde"></div>' +
        '<div class="field"><label>Hasta</label><input type="date" class="inp" value="' + attr(f.hasta) + '" data-act="fHasta"></div>' +
        '<button class="btn" data-act="limpiar">' + Icon('refresh', '', 13) + 'Limpiar</button>' +
      '</div>' +
      (f.desde && !f.hasta
        ? '<div class="fs11 txt-3" style="margin-top:8px">' + Icon('info', '', 12) +
          ' Escriba también la fecha <b>hasta</b> para aplicar el rango.</div>'
        : '') +
      '</div></div>' +

      '<div class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl compacta">' +
      '<thead><tr>' +
      '<th style="width:30px" title="Marcar todas las de esta página">' +
        '<input type="checkbox" data-act="selPagina"' + (todasMarcadas ? ' checked' : '') + '></th>' +
      '<th style="width:30px"></th>' +
      '<th style="width:36px" title="Marcas: comentario y comprobante"></th>' +
      th('numero', 'Número') + th('fecha', 'Fecha') + th('categoria', 'Categoría') +
      th('solicitante', 'Concepto', '', 'Como en el Excel. Es la persona que solicita el dinero.') +
      '<th title="Como en el Excel. Es el municipio de la operación.">Ubicación</th>' +
      '<th title="Quién adelantó el dinero. No es quien lo solicita.">Consignó</th>' + th('total', 'Total', 'num') +
      '<th class="num">Gasolina</th><th class="num">Aceite</th>' +
      '<th class="num" title="Del programa: cuánto falta por reponer de esta caja.">Pendiente</th>' +
      '<th title="Del programa: en qué punto va la caja.">Estado</th><th></th>' +
      '</tr></thead><tbody>' +
      (pagina.length ? pagina.map(c => {
        const rep = repuesto.get(c.id) || 0;
        const pend = Finanzas.pendienteDe(c, rep);
        const cats = catsDe(c);
        const dets = (detsPorCaja.get(c.id) || []).slice().sort(U.by('orden'));
        /* La flechita salía sólo si algún detalle tenía descripción escrita:
           venía de cuando la fila desplegable era nada más eso. Hoy enseña el
           desglose entero —categoría, elemento, valor y el cuadre del total—,
           así que sobra con que haya algo que desglosar. Los detalles ya están
           cargados para toda la página, de modo que esto no pide nada más a la
           base. */
        const hayDesglose = dets.length > 0 || String(c.observaciones || '').trim();
        const marcada = VistaCajas.seleccion.has(c.id);
        return '<tr class="row-click est-' + attr(c.estado) + (marcada ? ' marcada' : '') +
          '" data-ir="caja/' + attr(c.id) + '">' +
          '<td class="col-sel" onclick="event.stopPropagation()">' +
            '<input type="checkbox" data-act="selUna" data-id="' + attr(c.id) + '"' +
            (marcada ? ' checked' : '') + '></td>' +
          '<td class="col-exp">' + (hayDesglose
            ? '<button class="btn btn-sm btn-ghost btn-icon" data-act="verTexto" data-id="' + attr(c.id) +
              '" title="Ver el desglose de la caja">' + Icon('chevR', '', 13) + '</button>'
            : '') + '</td>' +
          '<td class="col-marcas">' +
            (String(c.comentario || '').trim()
              ? '<span class="marca m-nota" tabindex="0" data-tip="' + attr(c.comentario) + '">' +
                Icon('doc', '', 11) + '</span>'
              : '') +
            (conComprobante.has(c.id)
              ? '<span class="marca m-comp" tabindex="0" ' +
                'data-tip="Tiene adjunto el comprobante de la consignación">' + Icon('check', '', 11) + '</span>'
              : (ESTADOS_POR_REEMBOLSAR.includes(c.estado)
                  ? '<span class="marca m-falta" tabindex="0" ' +
                    'data-tip="Consignada, pero todavía sin comprobante adjunto">' +
                    Icon('warn', '', 11) + '</span>'
                  : '')) +
            '</td>' +
          '<td class="mono nowrap">' + esc(c.numero) +
            (c.requiereRevision ? ' <span tabindex="0" data-tip="Requiere revisión: los valores del origen ' +
              'no cuadraban y se dejaron tal cual" style="color:var(--warn-500);cursor:help">⚠</span>' : '') +
            '</td>' +
          '<td class="nowrap">' + Fecha.corta(c.fecha) + '</td>' +
          '<td class="trunc" style="max-width:126px" title="' + attr(cats.join(' · ')) + '">' +
            (cats.length ? esc(cats[0]) + (cats.length > 1
              ? ' <span class="txt-3 fs11">+' + (cats.length - 1) + '</span>' : '')
              : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="trunc" style="max-width:148px" title="' + attr(Comp.nombreSolicitante(c)) + '">' +
            esc(Comp.nombreSolicitante(c)) + '</td>' +
          '<td class="trunc" style="max-width:104px" title="' + attr(c.municipioNombre || '') + '">' +
            esc(c.municipioNombre || '—') + '</td>' +
          '<td class="trunc" style="max-width:92px" title="' + attr(Comp.nombreConsigno(c)) + '">' +
            esc(Comp.nombreConsigno(c)) + '</td>' +
          '<td class="num"><b>' + Money.format(c.total) + '</b></td>' +
          '<td class="num">' + (c.gasolina ? Money.format(c.gasolina) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="num">' + (c.aceite ? Money.format(c.aceite) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="num">' + (pend > 0 ? '<span style="color:var(--dang-500);font-weight:650">' + Money.format(pend) + '</span>'
            : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="td-estado">' + Comp.selectorEstadoCaja(c, 'estadoRapido') + '</td>' +
          '<td class="nowrap">' +
            '<button class="btn btn-sm btn-ghost btn-icon" data-act="verFormato" data-id="' + attr(c.id) +
              '" title="Vista previa del formato">' + Icon('eye', '', 13) + '</button>' +
            '<button class="btn btn-sm btn-ghost btn-icon" data-act="copiarImagen" data-id="' + attr(c.id) +
              '" title="Copiar el formato como imagen para WhatsApp">' + Icon('copy', '', 13) + '</button>' +
          '</td>' +
          '</tr>' +
          /* La descripción es texto largo: en una columna quedaría cortada y
             sin poder copiarse. Va en su propia fila, desplegable, con TODOS
             los detalles de la caja y su texto completo. */
          (hayDesglose ? VistaCajas.filaDetalle(c, dets) : '');
      }).join('')
        : '<tr><td colspan="15">' + Comp.vacio({ icono: 'caja', titulo: 'Sin resultados',
            texto: todas.length === 0 ? 'Aún no hay cajas menores registradas o los filtros no coinciden.' : 'Ajuste los filtros.',
            accion: 'nueva', textoAccion: 'Crear la primera caja', iconoAccion: 'plus' }) + '</td></tr>') +
      '</tbody>' +
      (pagina.length ? '<tfoot><tr><td colspan="9">Subtotal de la página</td>' +
        '<td class="num">' + Money.format(U.sumBy(pagina.filter(c => c.estado !== EstadoCaja.ANULADA), c => c.total)) + '</td>' +
        '<td class="num">' + Money.format(U.sumBy(pagina, c => c.gasolina)) + '</td>' +
        '<td class="num">' + Money.format(U.sumBy(pagina, c => c.aceite)) + '</td>' +
        '<td colspan="3"></td></tr></tfoot>' : '') +
      '</table></div>' +
      Comp.pager({ total: todas.length, tam, pagina: f.pagina, actPag: 'irPagina', actTam: 'cambiarTam' }) +
      '</div></div>' +
      '<div id="selBarra">' + VistaCajas.barraSeleccion() + '</div>';

    /* Lo que hace falta para recalcular la barra sin volver a pedir nada a la
       base: marcar una casilla no puede costar una consulta. */
    VistaCajas._ctx = { cont: cont, todas: todas, repuesto: repuesto, pagina: pagina };

    const recargar = () => { f.pagina = 1; VistaCajas.render(cont); };
    const sugerencias = [];
    for (const c of candidatos) {
      sugerencias.push({ texto: Comp.nombreSolicitante(c), tag: 'Concepto' });
      for (const d of (detsPorCaja.get(c.id) || []))
        sugerencias.push({ texto: d.categoriaNombre, tag: 'Categoría' });
      sugerencias.push({ texto: c.municipioNombre, tag: 'Ubicación' });
      sugerencias.push({ texto: Comp.nombreConsigno(c), tag: 'Consignó' });
    }
    Combo.buscador('buscaCaja', sugerencias, texto => {
      if (texto === f.texto) return;
      f.texto = texto; recargar();
    });
    setAcciones({
      /* Sólo al confirmar (Intro o salir del campo). Mientras se escribe lo
         que se mueve es la lista de sugerencias, no las 447 filas. */
      fTexto: el => { if (el.value === f.texto) return; f.texto = el.value; recargar(); },
      fEstado: el => { f.estado = el.value; recargar(); },
      fSolicitante: el => { f.solicitanteId = el.value; recargar(); },
      fMunicipio: el => { f.municipioId = el.value; recargar(); },
      fConsigno: el => { f.consignoId = el.value; recargar(); },
      fCategoria: el => { f.categoriaId = el.value; recargar(); },
      fDesde: Comp.filtroFecha(v => { f.desde = v; recargar(); }),
      fHasta: Comp.filtroFecha(v => { f.hasta = v; recargar(); }),
      limpiar: () => { Object.assign(f, { texto: '', estado: '', solicitanteId: '', municipioId: '', consignoId: '',
        categoriaId: '', desde: '', hasta: '', origen: '', pagina: 1 }); VistaCajas.render(cont); },
      ordenar: el => {
        const campo = el.dataset.campo;
        if (f.orden === campo) f.dir = f.dir === 'asc' ? 'desc' : 'asc';
        else { f.orden = campo; f.dir = campo === 'fecha' ? 'desc' : 'asc'; }
        VistaCajas.render(cont);
      },
      irPagina: el => { f.pagina = U.clamp(Number(el.dataset.pagina), 1, totalPags); VistaCajas.render(cont); },
      cambiarTam: el => { Prefs.set('paginaTam', Number(el.value)); f.pagina = 1; VistaCajas.render(cont); },
      nueva: () => Router.ir('caja-nueva'),
      selUna: el => {
        if (el.checked) VistaCajas.seleccion.add(el.dataset.id);
        else VistaCajas.seleccion.delete(el.dataset.id);
        VistaCajas.refrescarSeleccion();
      },
      selPagina: el => {
        pagina.forEach(c => el.checked ? VistaCajas.seleccion.add(c.id) : VistaCajas.seleccion.delete(c.id));
        VistaCajas.refrescarSeleccion();
      },
      selLimpiar: () => { VistaCajas.seleccion.clear(); VistaCajas.refrescarSeleccion(); },
      /* Atajo para lo que se pide cada semana: las que ya se consignaron y
         todavía no se han reembolsado. */
      selPorReembolsar: () => {
        VistaCajas.seleccion.clear();
        todas.filter(c => ESTADOS_POR_REEMBOLSAR.includes(c.estado) &&
          Finanzas.pendienteDe(c, repuesto.get(c.id) || 0) > 0)
          .forEach(c => VistaCajas.seleccion.add(c.id));
        if (!VistaCajas.seleccion.size) Toast.warn('No hay cajas consignadas pendientes de reembolso.');
        VistaCajas.refrescarSeleccion();
      },
      resumenSeleccion: () => {
        const sel = todas.filter(c => VistaCajas.seleccion.has(c.id));
        Documento.resumenReembolso(sel, repuesto, detsPorCaja);
      },
      pdfSeleccion: async () => {
        const sel = todas.filter(c => VistaCajas.seleccion.has(c.id));
        await Documento.pdfConComprobantes(sel);
      },
      verTexto: el => {
        const fila = cont.querySelector('tr.det-fila[data-det="' + el.dataset.id + '"]');
        if (!fila) return;
        const abierta = !fila.classList.toggle('hidden');
        el.innerHTML = Icon(abierta ? 'chevD' : 'chevR', '', 13);
        el.title = abierta ? 'Ocultar la descripción' : 'Ver la descripción';
      },
      verFormato: async el => { const c = await CajaRepo.get(el.dataset.id); await Documento.previsualizar(c); },
      copiarImagen: async el => {
        const c = await CajaRepo.get(el.dataset.id);
        if (!c) return;
        el.disabled = true;
        try { await Documento.copiarImagen(c); } finally { el.disabled = false; }
      },
      /* Cambio de estado sin abrir la caja (§16: se permiten ajustes manuales) */
      estadoRapido: async el => {
        const id = el.dataset.id, nuevo = el.value;
        const caja = await CajaRepo.get(id);
        if (!caja || caja.estado === nuevo) return;
        const anterior = caja.estado;
        try {
          const apls = await CajaRepo.aplicaciones(id);
          const repuestoCaja = Finanzas.repuesto(apls);
          const actualizada = await CajaService.cambiarEstado(id, nuevo);
          let aviso = 'Caja ' + caja.numero + ': ' + (ESTADO_CAJA_META[anterior] || {}).label +
                      ' → ' + (ESTADO_CAJA_META[nuevo] || {}).label + '.';
          if (nuevo === EstadoCaja.REEMBOLSADA && repuestoCaja < caja.total) {
            aviso += ' Se marcó como saldada sin consignación registrada: deja de contar como pendiente.';
            Toast.warn(aviso, 7000);
          } else Toast.ok(aviso);
          Analitica.invalidar();
          const y = window.scrollY;
          await VistaCajas.render(cont);
          window.scrollTo(0, y);
        } catch (err) {
          el.value = anterior;      // revertir el desplegable si el dominio lo rechaza
          manejarError(err);
        }
      },
      exportarExcel: () => Exportar.cajasExcel(todas, repuesto),
      exportarCsv: () => Exportar.cajasCsv(todas, repuesto)
    });
  }
};

/* ==========================================================================
   VISTA · DETALLE DE CAJA
   ========================================================================== */
const VistaCaja = {
  async render(cont, params) {
    const id = params[0];
    cont.innerHTML = Comp.cargando();
    const caja = await CajaRepo.get(id);
    if (!caja) { cont.innerHTML = Comp.vacio({ icono: 'warn', titulo: 'Caja no encontrada',
      texto: 'El registro no existe o fue eliminado.' }); return; }
    Shell.titulo(caja.numero, Comp.nombreSolicitante(caja));

    const [detalles, apls, docs] = await Promise.all([
      CajaRepo.detalles(id), CajaRepo.aplicaciones(id), CajaRepo.documentos(id)
    ]);
    const consIds = U.uniq(apls.map(a => a.consignacionId));
    const cons = await db.getMany('consignaciones', consIds);
    const conPorId = new Map(cons.map(c => [c.id, c]));
    /* El comprobante de la transferencia puede estar colgado de la caja o de la
       consignación que la repone. Da igual dónde se guardara: desde la caja se
       ven los dos sitios, para no tener que ir a buscarlo. */
    const docsCons = consIds.length
      ? (await Promise.all(consIds.map(i => ConsignacionRepo.documentos(i)))).reduce((a, b) => a.concat(b), [])
      : [];
    const esComprobante = d => d.tipo === TipoDocumento.COMPROBANTE_CONSIGNACION;
    const comprobantes = docs.filter(esComprobante).concat(docsCons.filter(esComprobante));
    const repuesto = Finanzas.repuesto(apls);
    const pendiente = Finanzas.pendiente(caja, apls);
    const calc = Finanzas.calcular(detalles, caja.retencion);
    const auditoria = await Auditoria.porEntidad(id);
    const sol = caja.solicitante || {};

    const inconsistente = calc.total !== caja.total || calc.subtotal !== caja.subtotal;

    cont.innerHTML =
      '<div class="page-head">' +
      '<div><div class="flex aic g8"><button class="btn btn-sm btn-ghost btn-icon" data-ir="cajas" title="Volver">' +
        Icon('back', '', 15) + '</button>' +
        '<h1 style="font-family:var(--mono);letter-spacing:0">' + esc(caja.numero) + '</h1>' +
        Comp.pillEstadoCaja(caja.estado) + Comp.pillOrigen(caja.origen) +
        (caja.requiereRevision ? '<span class="pill p-amber">Requiere revisión</span>' : '') + '</div>' +
      '<div class="ph-sub">' + Fecha.larga(caja.fecha) + ' · creada ' + Fecha.stamp(caja.creadoEn) + '</div>' +
      /* La nota corta se escribe aquí, en la caja, no metida en el formulario
         de edición: es un apunte del día a día, no parte del documento. */
      '<div class="caja-coment">' + Icon('doc', 'txt-3', 13) +
        (String(caja.comentario || '').trim()
          ? '<span class="cc-txt">' + esc(caja.comentario) + '</span>' +
            '<button class="link fs11" data-act="editarComentario">cambiar</button>' +
            '<button class="link fs11" data-act="quitarComentario">quitar</button>'
          : '<button class="link fs12" data-act="editarComentario">Agregar un comentario corto</button>') +
      '</div></div>' +
      '<div class="ph-actions">' +
        '<button class="btn btn-primary" data-act="copiarImagen" title="Copiar el formato como imagen para enviarlo por WhatsApp">' +
          Icon('copy', '', 14) + 'Copiar imagen</button>' +
        '<button class="btn" data-act="previsualizar">' + Icon('eye', '', 14) + 'Vista previa</button>' +
        '<button class="btn" data-act="imprimir">' + Icon('print', '', 14) + 'Imprimir / PDF</button>' +
        (caja.estado !== EstadoCaja.ANULADA ?
          '<button class="btn" data-ir="caja-editar/' + attr(caja.id) + '">' + Icon('edit', '', 14) + 'Editar</button>' : '') +
        '<button class="btn btn-icon" data-act="masAcciones" title="Más acciones">' + Icon('chevD', '', 15) + '</button>' +
      '</div></div>' +

      (caja.estado === EstadoCaja.ANULADA ? '<div class="alert a-err mb16">' + Icon('ban') +
        '<div><b>Caja anulada</b> el ' + Fecha.stamp(caja.anuladaEn) +
        (caja.motivoAnulacion ? '. Motivo: ' + esc(caja.motivoAnulacion) : '') +
        '. Se conserva en el histórico y su número no se reutiliza.</div></div>' : '') +
      (caja.requiereRevision ? '<div class="alert a-warn mb16">' + Icon('warn') +
        '<div><b>Requiere revisión.</b> ' + esc(caja.motivoRevision || '') +
        ' Los valores se conservan tal como estaban en el origen; corríjalos manualmente si dispone del dato correcto.</div></div>' : '') +
      (inconsistente ? '<div class="alert a-err mb16">' + Icon('warn') +
        '<div><b>Inconsistencia de totales detectada.</b> El total almacenado (' + Money.format(caja.total) +
        ') no coincide con la suma de los detalles (' + Money.format(calc.total) + '). ' +
        '<span class="link" data-act="recalcular">Recalcular ahora</span></div></div>' : '') +

      '<div class="grid g4 mb16">' +
        Comp.kpi({ label: 'Total', valor: Money.format(caja.total), color: 'var(--brand-500)', icono: 'money',
          meta: '<span>' + detalles.length + ' detalle(s)</span>' }) +
        Comp.kpi({ label: 'Gasolina', valor: Money.format(caja.gasolina), color: '#c8860d', icono: 'fuel',
          meta: '<span>' + U.pct(caja.gasolina, caja.total).toFixed(1).replace('.', ',') + '% del total</span>' }) +
        Comp.kpi({ label: 'Aceite', valor: Money.format(caja.aceite), color: '#6d4aca', icono: 'drop',
          meta: '<span>' + U.pct(caja.aceite, caja.total).toFixed(1).replace('.', ',') + '% del total</span>' }) +
        Comp.kpi({ label: pendiente > 0 ? 'Pendiente por reponer' : 'Repuesto', color: pendiente > 0 ? 'var(--dang-500)' : 'var(--ok-500)',
          valor: Money.format(pendiente > 0 ? pendiente : repuesto), icono: pendiente > 0 ? 'clock' : 'check',
          meta: '<span>' + (repuesto ? 'Repuesto ' + Money.format(repuesto) + ' de ' + Money.format(caja.total) : 'Sin reposición registrada') + '</span>' }) +
      '</div>' +

      '<div class="grid g32 mb16">' +
      '<div class="card"><div class="card-h"><h3>Detalles del gasto</h3>' +
        '<span class="ch-sub">Gasolina y aceite son subcomponentes del total, no se suman por encima</span></div>' +
        '<div class="card-b flush"><div class="tbl-wrap"><table class="tbl">' +
        '<thead><tr><th style="width:34px">#</th><th>Categoría</th><th>Elemento</th><th>Descripción</th>' +
        '<th class="num">Cant.</th><th class="num">Vr. unitario</th><th class="num">Vr. total</th></tr></thead><tbody>' +
        detalles.map((d, i) => '<tr>' +
          '<td class="txt-3">' + (i + 1) + '</td>' +
          '<td>' + esc(d.categoriaNombre || '—') +
            (d.rol === RolEstadistico.GASOLINA ? ' <span class="pill np p-amber">GASOLINA</span>' : '') +
            (d.rol === RolEstadistico.ACEITE ? ' <span class="pill np p-violet">ACEITE</span>' : '') +
            (d.rol && d.rol !== RolEstadistico.GASOLINA && d.rol !== RolEstadistico.ACEITE ?
              ' <span class="pill np p-blue">' + esc(d.rol) + '</span>' : '') +
            (!d.categoriaId && d.categoriaNombre ? ' <span class="co-tag" title="Concepto escrito libremente">libre</span>' : '') + '</td>' +
          '<td>' + esc(d.elemento || '—') + '</td>' +
          '<td>' + esc(d.descripcion || '—') + '</td>' +
          '<td class="num txt-3">' + (d.cantidad != null ? d.cantidad : '') + '</td>' +
          '<td class="num txt-3">' + (d.valorUnitario ? Money.format(d.valorUnitario) : '') + '</td>' +
          '<td class="num"><b>' + Money.format(d.valor) + '</b></td></tr>').join('') +
        '</tbody><tfoot>' +
        '<tr><td colspan="6">Subtotal</td><td class="num">' + Money.format(caja.subtotal) + '</td></tr>' +
        '<tr><td colspan="6">Retención</td><td class="num">' + Money.format(caja.retencion) + '</td></tr>' +
        '<tr><td colspan="6" style="font-size:13px">TOTAL</td><td class="num" style="font-size:14px">' +
          Money.format(caja.total) + '</td></tr>' +
        '</tfoot></table></div></div>' +
        (caja.observaciones ? '<div class="card-f"><b>Observaciones:</b> ' + esc(caja.observaciones) + '</div>' : '') +
      '</div>' +

      '<div>' +
      '<div class="card mb16"><div class="card-h"><h3>Solicitante</h3>' +
        '<div class="ch-act">' +
        '<button class="btn btn-sm btn-primary" data-act="copiarDatosConsignacion" ' +
        'title="Copiar nombre, cédula, municipio, banco, cuenta y valor para enviarlos por WhatsApp">' +
        Icon('copy', '', 12) + 'Copiar datos</button>' +
        (sol.personaId ? '<span class="link fs12" data-ir="persona/' + attr(sol.personaId) + '">Ver perfil</span>' : '') +
        '</div></div>' +
        '<div class="card-b">' +
        '<div class="alert a-info fs11 mb12" style="padding:7px 10px">' + Icon('info', '', 13) +
        '<div>Datos <b>congelados</b> al momento de crear la caja. Si la ficha de la persona cambia, este documento no se altera.</div></div>' +
        '<dl class="dl">' +
        '<dt>Nombre</dt><dd>' + esc(sol.nombre || caja.solicitanteTexto || VALOR_NO_DISPONIBLE) + '</dd>' +
        '<dt>Cédula</dt><dd class="mono">' + esc(sol.cedula ? Txt.cedulaFmt(sol.cedula) : VALOR_NO_DISPONIBLE) + '</dd>' +
        '<dt>Municipio</dt><dd>' + esc(caja.municipioNombre || VALOR_NO_APLICA) + '</dd>' +
        '<dt>Dirección</dt><dd>' + esc(caja.direccion || VALOR_NO_DISPONIBLE) + '</dd>' +
        '<dt>Banco</dt><dd>' + esc(sol.banco || VALOR_NO_DISPONIBLE) + '</dd>' +
        '<dt>Tipo cuenta</dt><dd>' + esc(sol.tipoCuenta || VALOR_NO_DISPONIBLE) + '</dd>' +
        '<dt>N.° cuenta</dt><dd class="mono"><span id="ctaMask">' + esc(Txt.mascaraCuenta(sol.numeroCuenta) || VALOR_NO_DISPONIBLE) + '</span>' +
          (sol.numeroCuenta ? ' <span class="link fs11" data-act="revelarCuenta">mostrar</span>' : '') + '</dd>' +
        '<dt>Consignó</dt><dd>' + esc(Comp.nombreConsigno(caja)) + '</dd>' +
        '</dl></div></div>' +

      '<div class="card mb16"><div class="card-h"><h3>Reposición</h3>' +
        '<div class="ch-act">' + (pendiente > 0 && caja.estado !== EstadoCaja.ANULADA ?

        '<div class="card-b">' +
        (apls.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Consignación</th><th>Fecha</th>' +
