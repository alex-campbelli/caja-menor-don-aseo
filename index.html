          apls.map(a => { const c = conPorId.get(a.consignacionId);
            return '<tr class="row-click" data-ir="consignacion/' + attr(a.consignacionId) + '">' +
              '<td class="mono">' + esc(c ? c.numero : a.consignacionId) + '</td>' +
              '<td class="nowrap">' + (c ? Fecha.corta(c.fecha) : '—') + '</td>' +
              '<td class="num">' + Money.format(a.monto) + '</td></tr>'; }).join('') +
          '</tbody><tfoot><tr><td colspan="2">Total repuesto</td><td class="num">' + Money.format(repuesto) +
          '</td></tr></tfoot></table></div>' +
          (pendiente > 0 ? '<div class="alert a-warn mt12" style="padding:8px 11px">' + Icon('warn', '', 13) +
            '<div>Reposición parcial. Saldo pendiente: <b>' + Money.format(pendiente) + '</b></div></div>' : '')
          : '<div class="empty" style="padding:20px">' + Icon('clock') +
            '<h4>Sin reposición</h4><p>Pendiente por reponer: <b>' + Money.format(pendiente) + '</b></p></div>') +

        /* Comprobante de la transferencia. Va aquí, junto a la reposición, y no
           perdido entre los soportes de compra: es la prueba de que el dinero
           de ESTA caja se giró. */
        '<div class="divider"></div>' +
        '<div class="flex aic g8 mb8">' +
          '<b class="fs12">Comprobante de la transferencia</b>' +
          (comprobantes.length ? '<span class="pill np p-green">' + comprobantes.length + '</span>' : '') +
          '<span style="flex:1"></span>' +
          '<button class="btn btn-sm" data-act="adjuntarComprobante">' + Icon('upload', '', 12) + 'Adjuntar</button>' +
          '<input type="file" id="inComprobante" multiple hidden>' +
        '</div>' +
        (comprobantes.length
          ? '<div class="comp-lista">' + comprobantes.map(d =>
              '<div class="comp-item">' +
                '<span class="comp-ic">' + Icon(U.esImagen(d.mime) ? 'eye' : 'file', '', 13) + '</span>' +
                '<button class="link fs12 trunc" style="text-align:left" data-act="expVer" data-id="' + attr(d.id) +
                  '" title="' + attr(d.nombre) + '">' + esc(d.nombre) + '</button>' +
                '<span class="txt-3 fs11 nowrap">' + Txt.bytes(d.tamano) + '</span>' +
                '<span class="txt-3 fs11 nowrap">' + (d.consignacionId
                  ? esc((conPorId.get(d.consignacionId) || {}).numero || 'consignación')
                  : 'en esta caja') + '</span>' +
                '<button class="btn btn-sm btn-ghost btn-icon" data-act="expDescargar" data-id="' + attr(d.id) +
                  '" title="Descargar">' + Icon('download', '', 12) + '</button>' +
              '</div>').join('') + '</div>'
          : '<div class="fs12 txt-3">Todavía no hay comprobante de la transferencia de esta caja. ' +
            'Adjunte aquí la captura o el PDF que le envíe quien consignó.</div>') +
        '</div></div>' +

      '<div class="card"><div class="card-h"><h3>Trazabilidad</h3></div><div class="card-b">' +
        '<dl class="dl">' +
        '<dt>ID interno</dt><dd class="mono fs11">' + esc(caja.id) + '</dd>' +
        '<dt>Origen</dt><dd>' + Comp.pillOrigen(caja.origen) + '</dd>' +
        '<dt>Creada</dt><dd>' + Fecha.stamp(caja.creadoEn) + '</dd>' +
        '<dt>Actualizada</dt><dd>' + Fecha.stamp(caja.actualizadoEn) + '</dd>' +
        '</dl>' +
        (caja.legacy ? '<div class="mt12"><div class="fs11 txt-3 mb8" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">' +
          'Datos originales del archivo importado</div>' +
          '<dl class="dl fs11">' + Object.entries(caja.legacy).filter(([, v]) => v !== null && v !== '' && v !== undefined)
            .map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</dd>').join('') +
          '</dl></div>' : '') +
        (auditoria.length ? '<div class="mt12"><div class="fs11 txt-3 mb8" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Auditoría</div>' +
          auditoria.slice(0, 8).map(a => '<div class="fs11 flex aic g6" style="padding:3px 0">' +
            '<span class="pill np p-gray">' + esc(a.accion) + '</span>' +
            '<span class="txt-3">' + Fecha.stamp(a.ts) + '</span></div>').join('') + '</div>' : '') +
        '</div></div>' +
      '</div></div>' +

      '<div class="card" id="expedienteCaja"></div>';

    await Expediente.montar($('#expedienteCaja'), { cajaId: caja.id, docs, titulo: 'Expediente documental de ' + caja.numero });

    setAcciones({
      previsualizar: () => Documento.previsualizar(caja),
      imprimir: () => Documento.imprimir(caja),
      copiarImagen: async el => {
        const original = el.innerHTML;
        el.disabled = true; el.innerHTML = '<span class="spin"></span>Generando…';
        try { await Documento.copiarImagen(caja); }
        finally { el.disabled = false; el.innerHTML = original; }
      },
      descargarImagen: () => Documento.descargarImagen(caja),
      copiarDatosConsignacion: () => Documento.copiarMensajeConsignacion(caja),
      archivarFormato: async () => {
        const doc = await Documento.archivar(caja);
        Toast.ok('Formato archivado en el expediente: ' + doc.nombre);
        VistaCaja.render(cont, params);
      },
      recalcular: async () => {
        await CajaService.actualizar(caja.id, { detalles, retencion: caja.retencion, omitirValidacion: true });
        Toast.ok('Totales recalculados.');
        VistaCaja.render(cont, params);
      },
      revelarCuenta: () => { $('#ctaMask').textContent = sol.numeroCuenta || VALOR_NO_DISPONIBLE; },
      editarComentario: () => VistaCaja.pedirComentario(caja, cont, params),
      quitarComentario: async () => {
        await CajaRepo.comentar(caja.id, '');
        Toast.ok('Comentario quitado.');
        VistaCaja.render(cont, params);
      },
      adjuntarComprobante: () => { const i = $('#inComprobante'); if (i) i.click(); },
      masAcciones: () => VistaCaja.menuAcciones(caja, cont, params),
      ...Expediente.acciones({ cajaId: caja.id, recargar: () => VistaCaja.render(cont, params) })
    });

    /* Se adjunta a ESTA caja y ya marcado como comprobante de consignación:
       sin tener que elegir el tipo en un desplegable cada vez. */
    const inC = $('#inComprobante');
    if (inC) inC.onchange = async () => {
      const files = [...inC.files];
      if (!files.length) return;
      await Expediente.subir(files, { cajaId: caja.id, tipo: TipoDocumento.COMPROBANTE_CONSIGNACION });
      VistaCaja.render(cont, params);
    };
  },

  /** Ventanita para escribir la nota corta que se ve en el listado */
  pedirComentario(caja, cont, params) {
    const m = Modal.abrir({
      titulo: 'Comentario de ' + caja.numero,
      ancho: 'narrow',
      cuerpo: '<div class="field"><label>Una línea, para recordar algo de esta caja</label>' +
        '<input class="inp" id="ccTexto" maxlength="140" autofocus value="' +
        attr(caja.comentario || '') + '" placeholder="Ej.: falta el soporte de la compra"></div>' +
        '<div class="fs11 txt-3">Se verá en el listado al pasar el cursor por el número. ' +
        'No sale en el formato impreso.</div>',
      pie: '<button class="btn" data-cerrar>Cancelar</button>' +
           '<button class="btn btn-primary" id="ccOk">Guardar</button>',
      alMontar(el) {
        const inp = el.querySelector('#ccTexto');
        const guardar = async () => {
          const txt = inp.value.trim();
          Modal.cerrar(el);
          try {
            await CajaRepo.comentar(caja.id, txt);
            Toast.ok(txt ? 'Comentario guardado.' : 'Comentario quitado.');
            VistaCaja.render(cont, params);
          } catch (e) { manejarError(e); }
        };
        el.querySelector('#ccOk').onclick = guardar;
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); guardar(); } });
      }
    });
    return m;
  },

  menuAcciones(caja, cont, params) {
    const estados = Object.keys(ESTADO_CAJA_META).filter(k => k !== EstadoCaja.ANULADA);
    Modal.abrir({
      titulo: 'Acciones sobre ' + caja.numero,
      ancho: 'narrow',
      cuerpo:
        '<div class="field"><label>Cambiar estado manualmente</label>' +
        '<select class="inp" id="acEstado">' + estados.map(k => '<option value="' + k + '"' +
          (caja.estado === k ? ' selected' : '') + '>' + ESTADO_CAJA_META[k].label + '</option>').join('') + '</select>' +
        '<div class="hint">El flujo habitual es Borrador → Pagada → Pendiente de reposición → Repuesta. ' +
        'El estado de reposición se recalcula automáticamente al registrar consignaciones.</div></div>' +
        '<div class="divider"></div>' +
        '<div class="flex g8 wrap mb12">' +
        '<button class="btn" data-act="archivarFormato" data-cerrar>' + Icon('save', '', 14) + 'Archivar formato en el expediente</button>' +
        '<button class="btn" data-act="descargarImagen" data-cerrar>' + Icon('download', '', 14) + 'Descargar imagen (PNG)</button>' +
        '</div>' +
        '<div class="flex g8 wrap">' +
        (caja.estado === EstadoCaja.ANULADA
          ? '<button class="btn" id="acReactivar">' + Icon('refresh', '', 14) + 'Reactivar caja</button>'
          : '<button class="btn btn-danger" id="acAnular">' + Icon('ban', '', 14) + 'Anular caja</button>') +
        (caja.estado === EstadoCaja.BORRADOR ?
          '<button class="btn btn-danger" id="acEliminar">' + Icon('trash', '', 14) + 'Eliminar borrador</button>' : '') +
        '<button class="btn" id="acDuplicar">' + Icon('copy', '', 14) + 'Duplicar</button>' +
        '</div>',
      pie: '<button class="btn" data-cerrar>Cerrar</button><button class="btn btn-primary" id="acGuardarEstado">Guardar estado</button>',
      alMontar(m) {
        m.querySelector('#acGuardarEstado').onclick = async () => {
          try {
            await CajaService.cambiarEstado(caja.id, m.querySelector('#acEstado').value);
            Modal.cerrar(m); Toast.ok('Estado actualizado.'); VistaCaja.render(cont, params);
          } catch (e) { manejarError(e); }
        };
        const anular = m.querySelector('#acAnular');
        if (anular) anular.onclick = async () => {
          Modal.cerrar(m);
          const motivo = await VistaCaja.pedirMotivo();
          if (motivo === null) return;
          try { await CajaService.anular(caja.id, motivo); Toast.ok('Caja anulada. El número ' + caja.numero + ' se conserva.');
            VistaCaja.render(cont, params); } catch (e) { manejarError(e); }
        };
        const react = m.querySelector('#acReactivar');
        if (react) react.onclick = async () => {
          try { await CajaService.reactivar(caja.id, EstadoCaja.BORRADOR); Modal.cerrar(m);
            Toast.ok('Caja reactivada como borrador.'); VistaCaja.render(cont, params); } catch (e) { manejarError(e); }
        };
        const elim = m.querySelector('#acEliminar');
        if (elim) elim.onclick = async () => {
          Modal.cerrar(m);
          if (!await Modal.confirmar({ titulo: 'Eliminar borrador', peligro: true, textoOk: 'Eliminar',
            html: 'Se eliminará definitivamente el borrador <b>' + esc(caja.numero) + '</b> con sus detalles y documentos. ' +
                  'Esta acción no se puede deshacer.' })) return;
          try { await CajaService.eliminar(caja.id); Toast.ok('Borrador eliminado.'); Router.ir('cajas'); }
          catch (e) { manejarError(e); }
        };
        m.querySelector('#acDuplicar').onclick = async () => {
          Modal.cerrar(m);
          const dets = await CajaRepo.detalles(caja.id);
          Estado_App.borradorCaja = {
            fecha: Fecha.hoy(),
            solicitanteId: caja.solicitanteId, consignoId: caja.consignoId,
            municipioId: caja.municipioId, direccion: caja.direccion,
            observaciones: caja.observaciones,
            detalles: dets.map(d => ({ categoriaId: d.categoriaId, categoriaNombre: d.categoriaNombre,
              descripcion: d.descripcion, valor: d.valor, rol: d.rol, cantidad: d.cantidad, valorUnitario: d.valorUnitario }))
          };
          Router.ir('caja-nueva');
        };
      }
    });
  },

  pedirMotivo() {
    return new Promise(res => {
      Modal.abrir({
        titulo: 'Anular caja menor', ancho: 'narrow',
        cuerpo: '<div class="alert a-warn mb12">' + Icon('warn') +
          '<div>La caja quedará <b>anulada</b> pero se conserva íntegra en el histórico y su número no se reutiliza.</div></div>' +
          '<div class="field"><label>Motivo de la anulación</label>' +
          '<textarea class="inp" id="mtv" placeholder="Ej.: registro duplicado, error en el valor…"></textarea></div>',
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-danger" id="okAnular">Anular</button>',
        alMontar(m) {
          m.querySelector('#okAnular').onclick = () => { const v = m.querySelector('#mtv').value.trim(); Modal.cerrar(m); res(v); };
          m.addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) res(null); });
        }
      });
    });
  }
};


/* ==========================================================================
   COMPONENTE · EXPEDIENTE DOCUMENTAL (§25, §26, §27)
   Reutilizado por caja menor y por consignación.
   ========================================================================== */
/* Casi todo lo que se compra con caja menor pertenece a esa misma categoría.
   Antes se escribía el artículo en la casilla de categoría, y cada lima o cada
   machete acababa creando una categoría propia. Ahora la categoría viene
   puesta y el artículo va en su columna. */
const CATEGORIA_POR_DEFECTO = 'Caja menor';
function detalleNuevo() {
  const cat = CategoriaRepo.porNombre(CATEGORIA_POR_DEFECTO);
  return { categoriaId: cat ? cat.id : null,
           categoriaNombre: cat ? cat.nombre : CATEGORIA_POR_DEFECTO,
           elemento: '', descripcion: '', valor: 0, rol: null };
}

const Expediente = {
  async montar(el, cfg) {
    if (!el) return;
    const docs = cfg.docs || (cfg.cajaId ? await CajaRepo.documentos(cfg.cajaId) : await ConsignacionRepo.documentos(cfg.consignacionId));
    const porTipo = U.groupBy(docs, 'tipo');
    const tipos = Object.keys(TIPO_DOC_META);
    el.className = 'card';
    el.innerHTML =
      '<div class="card-h"><h3>' + esc(cfg.titulo || 'Expediente documental') + '</h3>' +
      '<span class="ch-sub">' + docs.length + ' documento(s) · ' + Txt.bytes(U.sumBy(docs, d => d.tamano)) + '</span>' +
      '<div class="ch-act">' +
      '<select class="inp" id="expTipo" style="height:28px;width:auto;font-size:12px">' +
      tipos.map(t => '<option value="' + t + '"' + (t === (cfg.tipoPorDefecto || TipoDocumento.SOPORTE_COMPRA) ? ' selected' : '') + '>' +
        TIPO_DOC_META[t].label + '</option>').join('') + '</select>' +
      '<button class="btn btn-sm btn-primary" data-act="expSubir">' + Icon('upload', '', 13) + 'Adjuntar</button>' +
      '</div></div>' +
      '<div class="card-b">' +
      '<div class="dz mb16" id="expDz">' + Icon('upload') +
      '<h4>Arrastre aquí los archivos o haga clic para seleccionarlos</h4>' +
      '<p>Fotos de WhatsApp, facturas, recibos, comprobantes y formatos diligenciados. Selección múltiple permitida · máx. 40 MB por archivo.</p></div>' +
      (docs.length ? '<div class="flex g6 wrap mb12">' +
        [...porTipo.entries()].map(([t, l]) => Comp.chipDoc(l.length, t)).join('') + '</div>' +
        '<div class="docgrid" id="expGrid">' + docs.map(d => Expediente.tarjeta(d)).join('') + '</div>'
        : '<div class="empty" style="padding:20px"><p>Sin documentos adjuntos todavía.</p></div>') +
      '</div>';

    DropZone.montar($('#expDz', el), async files => {
      await Expediente.subir(files, {
        cajaId: cfg.cajaId, consignacionId: cfg.consignacionId,
        tipo: $('#expTipo', el).value
      });
      if (cfg.recargar) cfg.recargar(); else Expediente.montar(el, Object.assign({}, cfg, { docs: null }));
    });
    // miniaturas de imágenes (lazy, tras el pintado)
    for (const d of docs) {
      if (!U.esImagen(d.mime)) continue;
      const cont = el.querySelector('[data-th="' + d.id + '"]');
      if (!cont) continue;
      DocumentoService.url(d.id).then(u => { if (u) cont.innerHTML = '<img src="' + u + '" alt="' + attr(d.nombre) + '">'; });
    }
  },

  tarjeta(d) {
    const ext = (d.extension || U.extension(d.nombreArchivo) || '?').toUpperCase();
    const meta = TIPO_DOC_META[d.tipo] || TIPO_DOC_META.OTRO;
    return '<div class="doc" data-doc="' + attr(d.id) + '">' +
      '<div class="doc-th" data-th="' + attr(d.id) + '" data-act="expVer" data-id="' + attr(d.id) + '">' +
      (U.esImagen(d.mime) ? '<span class="spin"></span>' :
        U.esPdf(d.mime) ? Icon('doc') + '<span class="dt-ext" style="position:absolute;bottom:6px">PDF</span>' :
        Icon('file') + '<span class="dt-ext" style="position:absolute;bottom:6px">' + esc(ext) + '</span>') +
      '</div>' +
      '<div class="doc-a">' +
      '<button data-act="expDescargar" data-id="' + attr(d.id) + '" title="Descargar">' + Icon('download', '', 12) + '</button>' +
      '<button data-act="expEditar" data-id="' + attr(d.id) + '" title="Renombrar">' + Icon('edit', '', 12) + '</button>' +
      '<button data-act="expEliminar" data-id="' + attr(d.id) + '" title="Eliminar">' + Icon('trash', '', 12) + '</button>' +
      '</div>' +
      '<div class="doc-i"><div class="dn" title="' + attr(d.nombre) + '">' + esc(d.nombre) + '</div>' +
      '<div class="dm"><span class="pill np ' + meta.color + '">' + esc(meta.label) + '</span></div>' +
      '<div class="dm txt-3">' + Txt.bytes(d.tamano) + ' · ' + Fecha.corta(d.creadoEn.slice(0, 10)) + '</div>' +
      (d.descripcion ? '<div class="dm txt-3 trunc" title="' + attr(d.descripcion) + '">' + esc(d.descripcion) + '</div>' : '') +
      '</div></div>';
  },

  async subir(files, meta) {
    let ok = 0, dup = 0, err = 0;
    for (const f of files) {
      try {
        const buf = f.size <= 12 * 1024 * 1024 ? await f.arrayBuffer() : null;
        const hash = buf ? await U.hashHex(buf) : null;
        if (hash) {
          const d = await DocumentoService.duplicado(hash, meta.cajaId, meta.consignacionId);
          if (d) { dup++; continue; }
        }
        await DocumentoService.adjuntar(f, meta);
        ok++;
      } catch (e) { console.error(e); err++; Toast.err('No se pudo adjuntar "' + f.name + '": ' + e.message); }
    }
    if (ok) Toast.ok(ok + ' documento(s) adjuntado(s).');
    if (dup) Toast.warn(dup + ' archivo(s) omitido(s) por estar ya adjuntos (contenido idéntico).');
    Shell.refrescarConteos();
  },

  acciones(cfg) {
    const recargar = cfg.recargar || (() => Router.resolver());
    return {
      expSubir: () => { const dz = $('#expDz'); if (dz) dz.click(); },
      expVer: async el => {
        const d = await db.get('documentos', el.dataset.id);
        if (!d) return;
        const url = await DocumentoService.url(d.id);
        if (!url) { Toast.err('Archivo no disponible.'); return; }
        Modal.abrir({
          titulo: d.nombre, subtitulo: (TIPO_DOC_META[d.tipo] || {}).label + ' · ' + Txt.bytes(d.tamano),
          ancho: 'xwide',
          cuerpo: U.esImagen(d.mime)
            ? '<div style="text-align:center;background:var(--surface-3);border-radius:8px;padding:10px">' +
              '<img src="' + url + '" style="max-width:100%;max-height:70vh;border-radius:5px"></div>'
            : U.esPdf(d.mime) || /html/.test(d.mime)
              ? '<iframe src="' + url + '" style="width:100%;height:72vh;border:1px solid var(--border);border-radius:8px;background:#fff"></iframe>'
              : '<div class="empty">' + Icon('file') + '<h4>Vista previa no disponible</h4>' +
                '<p>Este tipo de archivo (' + esc(d.mime) + ') no se puede previsualizar. Descárguelo para abrirlo.</p></div>',
          pie: '<button class="btn mf-left" data-cerrar>Cerrar</button>' +
               '<button class="btn btn-primary" id="dlDoc">' + Icon('download', '', 14) + 'Descargar</button>',
          alMontar(m) { m.querySelector('#dlDoc').onclick = () => DocumentoService.descargar(d); }
        });
      },
      expDescargar: async el => {
        const d = await db.get('documentos', el.dataset.id);
        if (d) await DocumentoService.descargar(d);
      },
      expEditar: async el => {
        const d = await db.get('documentos', el.dataset.id);
        if (!d) return;
        Modal.abrir({
          titulo: 'Editar documento', ancho: 'narrow',
          cuerpo: '<div class="field"><label>Nombre</label><input class="inp" id="dNom" value="' + attr(d.nombre) + '"></div>' +
            '<div class="field"><label>Tipo</label><select class="inp" id="dTipo">' +
            Object.keys(TIPO_DOC_META).map(t => '<option value="' + t + '"' + (t === d.tipo ? ' selected' : '') + '>' +
              TIPO_DOC_META[t].label + '</option>').join('') + '</select></div>' +
            '<div class="field"><label>Descripción</label><textarea class="inp" id="dDesc">' + esc(d.descripcion) + '</textarea></div>',
          pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="dOk">Guardar</button>',
          alMontar(m) {
            m.querySelector('#dOk').onclick = async () => {
              await DocumentoService.actualizar(d.id, {
                nombre: m.querySelector('#dNom').value.trim() || d.nombre,
                tipo: m.querySelector('#dTipo').value,
                descripcion: m.querySelector('#dDesc').value.trim()
              });
              Modal.cerrar(m); Toast.ok('Documento actualizado.'); recargar();
            };
          }
        });
      },
      expEliminar: async el => {
        const d = await db.get('documentos', el.dataset.id);
        if (!d) return;
        if (!await Modal.confirmar({ titulo: 'Eliminar documento', peligro: true, textoOk: 'Eliminar',
          html: 'Se eliminará <b>' + esc(d.nombre) + '</b> del expediente. Esta acción no se puede deshacer.' })) return;
        await DocumentoService.eliminar(d.id);
        Toast.ok('Documento eliminado.');
        Shell.refrescarConteos();
        recargar();
      }
    };
  }
};

/* ==========================================================================
   VISTA · NUEVA CAJA / EDITAR CAJA  (§52)
   ========================================================================== */
const VistaCajaForm = {
  estado: null,

  async render(cont, params) {
    const editandoId = params && params[0] ? params[0] : null;
    cont.innerHTML = Comp.cargando();

    let base;
    if (editandoId) {
      const caja = await CajaRepo.get(editandoId);
      if (!caja) { cont.innerHTML = Comp.vacio({ icono: 'warn', titulo: 'Caja no encontrada' }); return; }
      if (caja.estado === EstadoCaja.ANULADA) {
        cont.innerHTML = Comp.vacio({ icono: 'ban', titulo: 'Caja anulada',
          texto: 'Una caja anulada no se puede editar. Reactívela primero desde su detalle.' });
        return;
      }
      const dets = await CajaRepo.detalles(editandoId);
      base = {
        id: caja.id, numero: caja.numero, fecha: caja.fecha,
        solicitanteId: caja.solicitanteId, solicitanteTexto: caja.solicitanteTexto,
        consignoId: caja.consignoId, municipioId: caja.municipioId,
        direccion: caja.direccion, estado: caja.estado, observaciones: caja.observaciones,
        retencion: caja.retencion,
        detalles: dets.map(d => ({ id: d.id, categoriaId: d.categoriaId, categoriaNombre: d.categoriaNombre,
          elemento: d.elemento,
          descripcion: d.descripcion, cantidad: d.cantidad, valorUnitario: d.valorUnitario, valor: d.valor, rol: d.rol }))
      };
      Shell.titulo('Editar ' + caja.numero, 'Modificación de caja menor');
    } else {
      const borrador = Estado_App.borradorCaja;
      Estado_App.borradorCaja = null;
      const fabian = PersonaRepo.financiadorPorDefecto();
      base = borrador || {
        fecha: Fecha.hoy(), solicitanteId: '', consignoId: fabian ? fabian.id : '',
        municipioId: '', direccion: '', estado: EstadoCaja.BORRADOR, observaciones: '', retencion: 0,
        detalles: [detalleNuevo()]   // la primera fila también trae la categoría puesta
      };
      if (!base.consignoId && fabian) base.consignoId = fabian.id;
      if (!base.detalles || !base.detalles.length) base.detalles = [{ categoriaId: null, categoriaNombre: '', descripcion: '', valor: 0, rol: null }];
      Shell.titulo('Nueva caja menor', 'El número se asigna automáticamente al guardar');
    }
    this.estado = base;

    const roles = this.rolesDisponibles();
    cont.innerHTML =
      '<div class="page-head"><div><div class="flex aic g8">' +
      '<button class="btn btn-sm btn-ghost btn-icon" data-ir="' + (editandoId ? 'caja/' + editandoId : 'cajas') + '">' +
      Icon('back', '', 15) + '</button><h1>' + (editandoId ? 'Editar caja menor' : 'Nueva caja menor') + '</h1>' +
      (editandoId ? '<span class="pill np p-blue" style="font-family:var(--mono)">' + esc(base.numero) + '</span>' : '') + '</div>' +
      '<div class="ph-sub">' + (editandoId ? 'Los datos del solicitante sólo se re-capturan si cambia la persona seleccionada.'
        : 'Al seleccionar el solicitante se cargan automáticamente cédula, banco, cuenta y municipio.') + '</div></div>' +
      '<div class="ph-actions">' +
      '<button class="btn" data-act="cancelar">Cancelar</button>' +
      '<button class="btn btn-primary btn-lg" data-act="guardar">' + Icon('save', '', 15) +
        (editandoId ? 'Guardar cambios' : 'Guardar caja menor') + '</button>' +
      '</div></div>' +

      '<div class="grid g32">' +
      '<div>' +
        '<div class="card mb16"><div class="card-h"><h3>Datos de la operación</h3></div><div class="card-b">' +
        '<div class="row">' +
          '<div class="field" style="flex:0 0 150px"><label>Fecha <span class="req">*</span></label>' +
            '<input type="date" class="inp" id="fFecha" value="' + attr(base.fecha) + '"></div>' +
          '<div class="field" style="flex:2 1 260px"><label>Solicitante <span class="req">*</span></label>' +
            '<div class="combo"><input class="inp" id="fSolicitante" placeholder="Escriba para buscar…" autocomplete="off"></div>' +
            '<div class="hint" id="hSolicitante">Persona que solicita o a quien corresponde la caja menor. ' +
            'Sólo aparecen las marcadas como «puede ser solicitante» en su ficha.</div></div>' +
          '<div class="field" style="flex:1 1 200px"><label>Consignó (quien adelantó el dinero)</label>' +
            '<div class="combo"><input class="inp" id="fConsigno" placeholder="Ej.: Fabián Castro" autocomplete="off"></div>' +
            '<div class="hint">Quien pone el dinero por adelantado. Sólo aparecen las marcadas como ' +
            '«puede adelantar dinero» en su ficha.</div></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field" style="flex:1 1 200px"><label>Municipio / ubicación</label>' +
            '<div class="combo"><input class="inp" id="fMunicipio" placeholder="Seleccione o escriba…" autocomplete="off"></div></div>' +
          '<div class="field" style="flex:2 1 260px"><label>Dirección</label>' +
            '<input class="inp" id="fDireccion" value="' + attr(base.direccion || '') + '" placeholder="Dirección de la operación"></div>' +
          '<div class="field" style="flex:0 0 190px"><label>Estado</label>' +
            '<select class="inp" id="fEstado">' + Object.keys(ESTADO_CAJA_META).filter(k => k !== EstadoCaja.ANULADA)
              .map(k => '<option value="' + k + '"' + (base.estado === k ? ' selected' : '') + '>' +
                ESTADO_CAJA_META[k].label + '</option>').join('') + '</select></div>' +
        '</div>' +
        '</div></div>' +

        '<div class="card mb16"><div class="card-h"><h3>Detalles del gasto</h3>' +
          '<span class="ch-sub">Puede agregar tantos conceptos como necesite</span>' +
          '<div class="ch-act"><button class="btn btn-sm" data-act="addDetalle">' + Icon('plus', '', 12) + 'Agregar detalle</button></div>' +
        '</div><div class="card-b flush">' +
          /* Al separar categoría y elemento la tabla pedía 717 px en un hueco
             de 653: los campos se estrujaban y el valor quedaba en 37 px. Se
             aprieta igual que el listado de cajas y se reparten los anchos. */
          '<div class="tbl-wrap"><table class="tbl compacta" id="tblDetalles">' +
          '<thead><tr><th style="width:22px"></th><th style="min-width:118px">Categoría</th>' +
          '<th style="min-width:112px">Elemento</th>' +
          '<th style="min-width:110px">Descripción</th><th style="width:86px">Estadística</th>' +
          '<th class="num" style="width:92px">Valor</th><th style="width:26px"></th></tr></thead>' +
          '<tbody id="tbDetalles"></tbody></table></div>' +
          '<div style="padding:10px 14px;border-top:1px solid var(--border)">' +
          '<button class="btn btn-sm" data-act="addDetalle">' + Icon('plus', '', 12) + 'Agregar detalle</button>' +
          '<span class="fs11 txt-3" style="margin-left:10px">La <b>categoría</b> agrupa (Caja menor, Viáticos…) ' +
          'y el <b>elemento</b> es lo que se compró (una lima, un machete). ' +
          'Si escribe gasolina o aceite, la casilla de <b>Estadística</b> se marca sola.</span>' +
          '</div>' +
        '</div></div>' +

        '<div class="card"><div class="card-h"><h3>Observaciones</h3></div><div class="card-b">' +
        '<textarea class="inp" id="fObs" placeholder="Notas internas sobre esta caja menor…">' + esc(base.observaciones || '') + '</textarea>' +
        '</div></div>' +
      '</div>' +

      '<div>' +
        '<div class="card mb16" id="cardTotales"></div>' +
        '<div class="card mb16" id="cardSolicitante"></div>' +
        '<div class="card"><div class="card-h"><h3>Ayuda</h3></div><div class="card-b fs12 txt-2" style="line-height:1.6">' +
        '<p style="margin-bottom:8px"><b>Gasolina y aceite</b> son subcomponentes del total: marque el detalle correspondiente ' +
        'en la columna «Estadística». El sistema los extrae del total, nunca los suma por encima.</p>' +
        '<p style="margin-bottom:8px"><b>El total se calcula solo</b> a partir de los detalles. No existe un campo de total manual.</p>' +
        '<p><b>Los datos bancarios</b> se copian de la ficha de la persona y quedan congelados en esta caja. ' +
        'Si mañana cambia de cuenta, este documento no se modifica.</p>' +
        '</div></div>' +
      '</div></div>';

    // --- combos
    const inSol = $('#fSolicitante'), inCon = $('#fConsigno'), inMun = $('#fMunicipio');
    const solP = base.solicitanteId ? PersonaRepo.get(base.solicitanteId) : null;
    if (solP) { inSol.value = solP.nombre; inSol.dataset.id = solP.id; }
    else if (base.solicitanteTexto) inSol.value = base.solicitanteTexto;
    const conP = base.consignoId ? PersonaRepo.get(base.consignoId) : null;
    if (conP) { inCon.value = conP.nombre; inCon.dataset.id = conP.id; }
    const munM = base.municipioId ? MunicipioRepo.get(base.municipioId) : null;
    if (munM) { inMun.value = munM.nombre; inMun.dataset.id = munM.id; }

    Combo.montar(inSol, {
      opciones: () => Combo.opcionesPersonasPorRol('solicitante', base.solicitanteId),
      permitirLibre: false,
      alElegir: op => {
        this.estado.solicitanteId = op ? op.id : '';
        if (op) {
          const p = PersonaRepo.get(op.id);
          if (p && p.municipioId && !this.estado.municipioId) {
            const m = MunicipioRepo.get(p.municipioId);
            if (m) { inMun.value = m.nombre; inMun.dataset.id = m.id; this.estado.municipioId = m.id; }
          }
        }
        this.pintarSolicitante();
        this.pintarDetalles();
      }
    });
    Combo.montar(inCon, {
      opciones: () => Combo.opcionesPersonasPorRol('financiador', base.consignoId),
      permitirLibre: false,
      alElegir: op => { this.estado.consignoId = op ? op.id : ''; }
    });
    Combo.montar(inMun, {
      opciones: () => Combo.opcionesMunicipios(),
      permitirLibre: true, etiquetaLibre: 'nuevo',
      alElegir: async (op, libre) => {
        if (op) { this.estado.municipioId = op.id; return; }
        if (libre) {
          const m = await MunicipioRepo.obtenerOCrear(libre, Origen.MANUAL);
          if (m) { this.estado.municipioId = m.id; inMun.value = m.nombre; inMun.dataset.id = m.id; Toast.ok('Municipio "' + m.nombre + '" creado.'); }
        }
      }
    });

    this.pintarDetalles();
    this.pintarSolicitante();

    setAcciones({
      addDetalle: () => { this.estado.detalles.push(detalleNuevo());
        this.pintarDetalles(); setTimeout(() => { const f = $$('#tbDetalles tr'); const u = f[f.length - 1];
          if (u) { const i = u.querySelector('input'); if (i) i.focus(); } }, 20); },
      delDetalle: el => { this.estado.detalles.splice(Number(el.dataset.i), 1);
        if (!this.estado.detalles.length) this.estado.detalles.push(detalleNuevo());
        this.pintarDetalles(); },
      cambiarRol: el => { this.estado.detalles[Number(el.dataset.i)].rol = el.value || null; this.pintarTotales(); },
      cancelar: () => Router.ir(editandoId ? 'caja/' + editandoId : 'cajas'),
      guardar: () => this.guardar(editandoId, cont)
    });

    // sincronizar campos simples
    $('#fFecha').addEventListener('change', e => { this.estado.fecha = e.target.value; });
    $('#fDireccion').addEventListener('input', e => { this.estado.direccion = e.target.value; });
    $('#fEstado').addEventListener('change', e => { this.estado.estado = e.target.value; });
    $('#fObs').addEventListener('input', e => { this.estado.observaciones = e.target.value; });
    setTimeout(() => { if (!editandoId && !base.solicitanteId) inSol.focus(); }, 80);
  },

  rolesDisponibles() {
    const roles = [{ v: RolEstadistico.GASOLINA, t: 'Gasolina' }, { v: RolEstadistico.ACEITE, t: 'Aceite' }];
    CategoriaRepo.estadisticas().forEach(c => {
      if (c.rol && !roles.some(r => r.v === c.rol)) roles.push({ v: c.rol, t: c.nombre });
    });
    return roles;
  },

  pintarDetalles() {
    const tb = $('#tbDetalles'); if (!tb) return;
    const roles = this.rolesDisponibles();
    tb.innerHTML = this.estado.detalles.map((d, i) =>
      '<tr data-fila="' + i + '">' +
      '<td class="txt-3 tc">' + (i + 1) + '</td>' +
      '<td><div class="combo"><input class="inp" data-cat="' + i + '" placeholder="Caja menor, Viáticos…" autocomplete="off" value="' +
        attr(d.categoriaNombre || '') + '"' + (d.categoriaId ? ' data-id="' + attr(d.categoriaId) + '"' : '') + '></div></td>' +
      '<td><input class="inp" data-elem="' + i + '" placeholder="Ej.: lima, machete, nailón" value="' +
        attr(d.elemento || '') + '"></td>' +
      '<td><input class="inp" data-desc="' + i + '" placeholder="Opcional" value="' + attr(d.descripcion || '') + '"></td>' +
      '<td><select class="inp" data-act="cambiarRol" data-i="' + i + '" style="font-size:11.5px">' +
        '<option value="">Ninguna</option>' +
        roles.map(r => '<option value="' + attr(r.v) + '"' + (d.rol === r.v ? ' selected' : '') + '>' + esc(r.t) + '</option>').join('') +
        '</select></td>' +
      '<td><input class="inp inp-money" data-val="' + i + '" value="' + attr(Money.formatInput(d.valor || 0)) + '" placeholder="0"></td>' +
      '<td><button class="btn btn-sm btn-ghost btn-icon" data-act="delDetalle" data-i="' + i + '" title="Quitar">' +
        Icon('trash', '', 13) + '</button></td>' +
      '</tr>').join('');

    // montar combos y money inputs de cada fila
    this.estado.detalles.forEach((d, i) => {
      const inCat = tb.querySelector('[data-cat="' + i + '"]');
      Combo.montar(inCat, {
        opciones: () => Combo.opcionesCategorias(),
        permitirLibre: true, etiquetaLibre: 'texto libre',
        alElegir: (op, libre) => {
          if (op) {
            const c = CategoriaRepo.get(op.id);
            d.categoriaId = c.id; d.categoriaNombre = c.nombre;
            if (c.rol) d.rol = c.rol;
          } else { d.categoriaId = null; d.categoriaNombre = libre || ''; }
          this.pintarDetalles(); this.pintarTotales();
        },
        alEscribir: v => { d.categoriaNombre = v; d.categoriaId = null; }
      });
      const inElem = tb.querySelector('[data-elem="' + i + '"]');
      inElem.addEventListener('input', e => { d.elemento = e.target.value; });
      /* Si el artículo es gasolina o aceite se marca solo en Estadística, que
         es lo que uno espera al escribirlo. Sólo cuando la casilla está en
         blanco: una elección hecha a mano nunca se pisa. Y se cambia el valor
         del desplegable en vez de repintar la tabla, para no arrancarle el
         foco a quien viene tabulando. */
      inElem.addEventListener('change', () => {
        if (d.rol) return;
        const n = Txt.norm(d.elemento);
        const rol = /gasolina/.test(n) ? RolEstadistico.GASOLINA
                  : /aceite/.test(n) ? RolEstadistico.ACEITE : null;
        if (!rol) return;
        d.rol = rol;
        const sel = tb.querySelector('[data-act="cambiarRol"][data-i="' + i + '"]');
        if (sel) sel.value = rol;
        this.pintarTotales();
      });
      inElem.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); tb.querySelector('[data-desc="' + i + '"]').focus(); }
      });
      const inDesc = tb.querySelector('[data-desc="' + i + '"]');
      inDesc.addEventListener('input', e => { d.descripcion = e.target.value; });
      inDesc.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); tb.querySelector('[data-val="' + i + '"]').focus(); }
      });
      const inVal = tb.querySelector('[data-val="' + i + '"]');
      MoneyInput.montar(inVal, c => { d.valor = c; this.pintarTotales(); });
      inVal.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (i === this.estado.detalles.length - 1) { Acciones.addDetalle && Acciones.addDetalle(); }
          else tb.querySelector('[data-cat="' + (i + 1) + '"]').focus();
        }
      });
    });
    this.pintarTotales();
  },

  pintarTotales() {
    const el = $('#cardTotales'); if (!el) return;
    const calc = Finanzas.calcular(this.estado.detalles, this.estado.retencion || 0);
    const excede = calc.gasolina + calc.aceite > calc.total && calc.total > 0;
    el.innerHTML =
      '<div class="card-h"><h3>Resumen financiero</h3>' +
      '<span class="ch-sub">Calculado automáticamente</span></div><div class="card-b">' +
      '<table class="tbl" style="font-size:13px">' +
      '<tr><td>Subtotal</td><td class="num">' + Money.format(calc.subtotal) + '</td></tr>' +
      '<tr><td>Retención</td><td class="num">' + Money.format(calc.retencion) + '</td></tr>' +
      '<tr style="background:var(--surface-2)"><td><b style="font-size:14px">TOTAL</b></td>' +
      '<td class="num"><b style="font-size:16px">' + Money.format(calc.total) + '</b></td></tr>' +
      '</table>' +
      '<div class="divider"></div>' +
      '<div class="fs11 txt-3 mb8" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Subcomponentes</div>' +
      Chart.apilada([
        { etiqueta: 'Gasolina', valor: calc.gasolina, color: '#c8860d' },
        { etiqueta: 'Aceite', valor: calc.aceite, color: '#6d4aca' },
        { etiqueta: 'Otros', valor: Math.max(0, calc.otros), color: '#0f7f58' }
      ]) +
      (excede ? '<div class="alert a-err mt12" style="padding:8px 10px">' + Icon('warn', '', 13) +
        '<div>Gasolina + aceite (' + Money.format(calc.gasolina + calc.aceite) + ') <b>supera el total</b> (' +
        Money.format(calc.total) + '). Corrija antes de guardar.</div></div>' : '') +
      '<div class="fs11 txt-3 mt12">' + calc.totalDetalles + ' detalle(s) · la retención se conserva para uso futuro y hoy es siempre $ 0.</div>' +
      '</div>';
  },

  pintarSolicitante() {
    const el = $('#cardSolicitante'); if (!el) return;
    const p = this.estado.solicitanteId ? PersonaRepo.get(this.estado.solicitanteId) : null;
    if (!p) {
      el.innerHTML = '<div class="card-h"><h3>Datos del solicitante</h3></div><div class="card-b">' +
        '<div class="empty" style="padding:22px">' + Icon('user') +
        '<h4>Seleccione un solicitante</h4><p>Sus datos bancarios se cargarán automáticamente y quedarán congelados en esta caja.</p>' +
        '<button class="btn btn-sm" data-act="nuevaPersonaRapida">' + Icon('plus', '', 12) + 'Crear persona</button></div></div>';
      Acciones.nuevaPersonaRapida = () => VistaPersonas.modalPersona(null, async p2 => {
        const inSol = $('#fSolicitante');
        inSol.value = p2.nombre; inSol.dataset.id = p2.id;
        this.estado.solicitanteId = p2.id;
        if (p2.municipioId && !this.estado.municipioId) {
          const m = MunicipioRepo.get(p2.municipioId);
          if (m) { $('#fMunicipio').value = m.nombre; this.estado.municipioId = m.id; }
        }
        this.pintarSolicitante();
      });
      return;
    }
    const m = p.municipioId ? MunicipioRepo.get(p.municipioId) : null;
    el.innerHTML = '<div class="card-h"><h3>Datos del solicitante</h3>' +
      '<div class="ch-act"><span class="link fs12" data-ir="persona/' + attr(p.id) + '">Ver perfil</span></div></div>' +
      '<div class="card-b"><dl class="dl">' +
      '<dt>Nombre</dt><dd>' + esc(p.nombre) + '</dd>' +
      '<dt>Cédula</dt><dd class="mono">' + esc(p.cedula ? Txt.cedulaFmt(p.cedula) : VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Banco</dt><dd>' + esc(p.banco || VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Tipo cuenta</dt><dd>' + esc(p.tipoCuenta || VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>N.° cuenta</dt><dd class="mono">' + esc(p.numeroCuenta || VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Municipio</dt><dd>' + esc(m ? m.nombre : VALOR_NO_DISPONIBLE) + '</dd>' +
      (p.cargo ? '<dt>Cargo</dt><dd>' + esc(p.cargo) + '</dd>' : '') +
      '</dl>' +
      (p.estado === Estado.INACTIVO ? '<div class="alert a-warn mt12" style="padding:7px 10px">' + Icon('warn', '', 13) +
        '<div>Esta persona está <b>inactiva</b>.</div></div>' : '') +
      '</div>';
  },

  async guardar(editandoId, cont) {
    const e = this.estado;
    const inSol = $('#fSolicitante');
    const entrada = {
      fecha: $('#fFecha').value,
      solicitanteId: e.solicitanteId || (inSol.dataset.id || ''),
      solicitanteTexto: e.solicitanteId ? '' : inSol.value.trim(),
      consignoId: e.consignoId || ($('#fConsigno').dataset.id || ''),
      municipioId: e.municipioId || '',
      direccion: $('#fDireccion').value.trim(),
      estado: $('#fEstado').value,
      observaciones: $('#fObs').value.trim(),
      retencion: e.retencion || 0,
      detalles: e.detalles.filter(d => (d.valor || 0) > 0 || !Txt.vacio(d.categoriaNombre) || !Txt.vacio(d.descripcion))
    };
    try {
      let caja;
      if (editandoId) {
        caja = await CajaService.actualizar(editandoId, entrada);
        Toast.ok('Caja ' + caja.numero + ' actualizada.');
      } else {
        caja = await CajaService.crear(entrada);
        Toast.ok('Caja ' + caja.numero + ' creada por ' + Money.format(caja.total) + '.');
      }
      Shell.refrescarConteos();
      Router.ir('caja/' + caja.id);
    } catch (err) { manejarError(err); }
  }
};


/* ==========================================================================
   VISTA · CONSIGNACIONES (listado)
   ========================================================================== */
const VistaConsignaciones = {
  async render(cont) {
    Shell.titulo('Consignaciones / Reposiciones', 'Reposición del dinero adelantado — no es gasto');
    const f = Estado_App.filtrosConsignaciones;
    cont.innerHTML = Comp.cargando();

    const q = Txt.norm(f.texto);
    const ctrId = ContratoRepo.activoId();
    const candidatos = [];   // para las sugerencias: sin el filtro de texto
    const todas = await db.query('consignaciones', {
      indice: 'fecha', direccion: 'desc',
      filtro: c => {
        if (ctrId && c.contratoId && c.contratoId !== ctrId) return false;
        if (f.beneficiarioId && c.beneficiarioId !== f.beneficiarioId) return false;
        if (f.desde && c.fecha < f.desde) return false;
        if (f.hasta && c.fecha > f.hasta) return false;
        candidatos.push(c);
        if (q) {
          const blob = [c.numero, c.referencia, c.banco, c.beneficiario && c.beneficiario.nombre, c.observaciones].join(' ');
          if (!Txt.norm(blob).includes(q)) return false;
        }
        return true;
      }
    });
    const apls = await db.getAll('aplicaciones');
    const porCon = new Map();
    apls.forEach(a => {
      if (!porCon.has(a.consignacionId)) porCon.set(a.consignacionId, { n: 0, monto: 0 });
      const o = porCon.get(a.consignacionId); o.n++; o.monto += a.monto;
    });

    const tam = Prefs.get('paginaTam') || 25;
    const totalPags = Math.max(1, Math.ceil(todas.length / tam));
    if (f.pagina > totalPags) f.pagina = totalPags;
    const pagina = todas.slice((f.pagina - 1) * tam, f.pagina * tam);
    const suma = U.sumBy(todas, c => c.valor);
    const pendFin = await Analitica.pendientePorFinanciador();

    cont.innerHTML =
      '<div class="page-head"><div><h1>Consignaciones / Reposiciones</h1>' +
      '<div class="ph-sub">' + todas.length + ' consignación(es) · ' + Money.format(suma) + ' consignados</div></div>' +
      '<div class="ph-actions">' +
      '<button class="btn" data-act="exportar">' + Icon('download', '', 14) + 'Exportar</button>' +
      '<button class="btn btn-primary" data-ir="consignacion-nueva">' + Icon('plus', '', 14) + 'Nueva consignación</button>' +
      '</div></div>' +

      '<div class="alert a-info mb16">' + Icon('info') +
      '<div><b>Una consignación NO es un gasto.</b> Es la reposición del dinero que alguien adelantó. ' +
      'El dashboard suma el gasto desde las cajas menores y el dinero repuesto desde las consignaciones: nunca los suma entre sí.</div></div>' +

      (pendFin.length ? '<div class="grid g3 mb16">' + pendFin.map(p =>
        '<div class="kpi" style="--k:var(--dang-500)"><div class="kpi-l">' + Icon('clock', '', 12) +
        'Pendiente · ' + esc(p.etiqueta) + '</div><div class="kpi-v" style="color:var(--dang-500)">' +
        Money.format(p.pendiente) + '</div><div class="kpi-m">' + p.n + ' caja(s)</div></div>').join('') + '</div>' : '') +

      '<div class="card mb16"><div class="card-b" style="padding:12px 14px"><div class="filters" style="margin:0">' +
      '<div class="field" style="flex:1 1 220px"><label>Búsqueda</label>' +
      '<input class="inp" placeholder="Número, referencia, banco, beneficiario…" value="' + attr(f.texto) +
        '" id="buscaCons" data-act="cTexto"></div>' +
      '<div class="field"><label>Beneficiario</label><select class="inp" data-act="cBenef"><option value="">Todos</option>' +
      PersonaRepo.todas().filter(p => p.esFinanciador).map(p => '<option value="' + p.id + '"' +
        (f.beneficiarioId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Desde</label><input type="date" class="inp" value="' + attr(f.desde) + '" data-act="cDesde"></div>' +
      '<div class="field"><label>Hasta</label><input type="date" class="inp" value="' + attr(f.hasta) + '" data-act="cHasta"></div>' +
      '<button class="btn" data-act="cLimpiar">' + Icon('refresh', '', 13) + 'Limpiar</button>' +
      '</div></div></div>' +

      '<div class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th>Número</th><th>Fecha</th><th>Beneficiario</th><th>Banco</th><th>Referencia</th>' +
      '<th class="num">Valor</th><th class="num">Aplicado</th><th class="num">Cajas</th><th>Cuadre</th></tr></thead><tbody>' +
      (pagina.length ? pagina.map(c => {
        const info = porCon.get(c.id) || { n: 0, monto: 0 };
        const dif = c.valor - info.monto;
        return '<tr class="row-click" data-ir="consignacion/' + attr(c.id) + '">' +
          '<td class="mono">' + esc(c.numero) + '</td>' +
          '<td class="nowrap">' + Fecha.corta(c.fecha) + '</td>' +
          '<td>' + esc((c.beneficiario && c.beneficiario.nombre) || '—') + '</td>' +
          '<td class="trunc" style="max-width:130px">' + esc(c.banco || '—') + '</td>' +
          '<td class="mono trunc" style="max-width:150px">' + esc(c.referencia || '—') + '</td>' +
          '<td class="num"><b>' + Money.format(c.valor) + '</b></td>' +
          '<td class="num">' + Money.format(info.monto) + '</td>' +
          '<td class="num">' + info.n + '</td>' +
          '<td>' + (dif === 0 ? '<span class="pill p-green">Cuadra</span>' :
            dif > 0 ? '<span class="pill p-amber">Sobra ' + Money.compact(dif) + '</span>' :
                      '<span class="pill p-red">Falta ' + Money.compact(-dif) + '</span>') + '</td></tr>';
      }).join('')
        : '<tr><td colspan="9">' + Comp.vacio({ icono: 'banco', titulo: 'Sin consignaciones',
            texto: 'Registre la consignación con la que se repone el dinero adelantado.',
            accion: 'nuevaCons', textoAccion: 'Nueva consignación', iconoAccion: 'plus' }) + '</td></tr>') +
      '</tbody></table></div>' +
      Comp.pager({ total: todas.length, tam, pagina: f.pagina, actPag: 'cPagina', actTam: 'cTam' }) +
      '</div></div>';

    const recargar = () => { f.pagina = 1; VistaConsignaciones.render(cont); };
    Combo.buscador('buscaCons', candidatos.flatMap(c => [
      { texto: c.beneficiario && c.beneficiario.nombre, tag: 'Beneficiario' },
      { texto: c.numero, tag: 'Número' },
      { texto: c.banco, tag: 'Banco' },
      { texto: c.referencia, tag: 'Referencia' }
    ]), texto => { if (texto === f.texto) return; f.texto = texto; recargar(); });

    setAcciones({
      cTexto: el => { if (el.value === f.texto) return; f.texto = el.value; recargar(); },
      cBenef: el => { f.beneficiarioId = el.value; recargar(); },
      cDesde: Comp.filtroFecha(v => { f.desde = v; recargar(); }),
      cHasta: Comp.filtroFecha(v => { f.hasta = v; recargar(); }),
      cLimpiar: () => { Object.assign(f, { texto: '', beneficiarioId: '', desde: '', hasta: '', pagina: 1 }); VistaConsignaciones.render(cont); },
      cPagina: el => { f.pagina = U.clamp(Number(el.dataset.pagina), 1, totalPags); VistaConsignaciones.render(cont); },
      cTam: el => { Prefs.set('paginaTam', Number(el.value)); f.pagina = 1; VistaConsignaciones.render(cont); },
      nuevaCons: () => Router.ir('consignacion-nueva'),
      exportar: () => Exportar.consignacionesExcel(todas, porCon)
    });
  }
};

const VistaConsignacionForm = {
  estado: null,

  async render(cont, params) {

    cont.innerHTML = Comp.cargando();

    let base, previasApl = [];
    if (editandoId) {
      const c = await ConsignacionRepo.get(editandoId);
      if (!c) { cont.innerHTML = Comp.vacio({ icono: 'warn', titulo: 'Consignación no encontrada' }); return; }
      previasApl = await ConsignacionRepo.aplicaciones(editandoId);
      base = { id: c.id, numero: c.numero, fecha: c.fecha, beneficiarioId: c.beneficiarioId, valor: c.valor,

        seleccion: new Map(previasApl.map(a => [a.cajaId, a.monto])) };
      Shell.titulo('Editar ' + c.numero, 'Consignación / reposición');
    } else {
      const fabian = PersonaRepo.financiadorPorDefecto();
      base = { fecha: Fecha.hoy(), beneficiarioId: fabian ? fabian.id : '', valor: 0,
        banco: fabian ? fabian.banco : '', referencia: '', observaciones: '', seleccion: new Map() };
      Shell.titulo('Nueva consignación', 'Reposición de cajas menores');
    }
    this.estado = base;

    const pend = await CajaService.pendientesDeReposicion({
      contratoId: ContratoRepo.activoId(),
      consignoId: base.beneficiarioId || '',
      incluirId: [...base.seleccion.keys()]
    });
    this.pendientes = pend;

    cont.innerHTML =
      '<div class="page-head"><div><div class="flex aic g8">' +
      '<button class="btn btn-sm btn-ghost btn-icon" data-ir="consignaciones">' + Icon('back', '', 15) + '</button>' +
      '<h1>' + (editandoId ? 'Editar consignación' : 'Nueva consignación') + '</h1>' +
      (editandoId ? '<span class="pill np p-blue" style="font-family:var(--mono)">' + esc(base.numero) + '</span>' : '') + '</div>' +
      '<div class="ph-sub">Seleccione las cajas menores que esta consignación repone. Una consignación puede cubrir muchas cajas.</div></div>' +
      '<div class="ph-actions"><button class="btn" data-ir="consignaciones">Cancelar</button>' +
      '<button class="btn btn-primary btn-lg" data-act="guardar">' + Icon('save', '', 15) + 'Guardar consignación</button></div></div>' +

      '<div class="grid g32">' +
      '<div><div class="card mb16"><div class="card-h"><h3>Cajas pendientes de reposición</h3>' +
      '<span class="ch-sub" id="selCount"></span>' +
      '<div class="ch-act">' +
      '<button class="btn btn-sm" data-act="selTodo">Seleccionar todas</button>' +
      '<button class="btn btn-sm" data-act="selNada">Ninguna</button>' +
      '</div></div>' +
      '<div class="card-b flush"><div class="tbl-wrap tbl-scroll"><table class="tbl">' +
      '<thead><tr><th style="width:34px"></th><th>Número</th><th>Fecha</th><th>Concepto</th>' +
      '<th>Ubicación</th><th class="num">Total</th><th class="num">Repuesto</th><th class="num">Pendiente</th>' +
      '<th class="num" style="width:130px">Aplicar</th></tr></thead>' +
      '<tbody id="tbPend"></tbody></table></div></div></div></div>' +

      '<div>' +
      '<div class="card mb16"><div class="card-h"><h3>Datos de la consignación</h3></div><div class="card-b">' +
      '<div class="field"><label>Fecha <span class="req">*</span></label>' +
      '<input type="date" class="inp" id="kFecha" value="' + attr(base.fecha) + '"></div>' +
      '<div class="field"><label>Beneficiario <span class="req">*</span></label>' +
      '<div class="combo"><input class="inp" id="kBenef" placeholder="Quien recibe la consignación" autocomplete="off"></div>' +
      '<div class="hint">Persona a la que se le repone el dinero que adelantó. Sólo aparecen las ' +
      'marcadas como «puede adelantar dinero» en su ficha.</div></div>' +
      '<div class="field"><label>Valor consignado <span class="req">*</span></label>' +
      '<input class="inp inp-money" id="kValor" value="' + attr(Money.formatInput(base.valor)) + '"></div>' +
      '<div class="row"><div class="field"><label>Banco</label>' +
      '<input class="inp" id="kBanco" value="' + attr(base.banco || '') + '" placeholder="Banco destino"></div>' +
      '<div class="field"><label>Referencia bancaria</label>' +
      '<input class="inp" id="kRef" value="' + attr(base.referencia || '') + '" placeholder="N.° de transacción"></div></div>' +
      '<div class="field"><label>Observaciones</label>' +
      '<textarea class="inp" id="kObs">' + esc(base.observaciones || '') + '</textarea></div>' +
      '</div></div>' +
      '<div class="card" id="cardCuadre"></div>' +
      '</div></div>';

    const inB = $('#kBenef');
    const b = base.beneficiarioId ? PersonaRepo.get(base.beneficiarioId) : null;
    if (b) { inB.value = b.nombre; inB.dataset.id = b.id; }
    Combo.montar(inB, {
      opciones: () => Combo.opcionesPersonasPorRol('financiador', base.beneficiarioId),
      permitirLibre: false,
      alElegir: async op => {
        this.estado.beneficiarioId = op ? op.id : '';
        const p = op ? PersonaRepo.get(op.id) : null;
        if (p && p.banco && !$('#kBanco').value) $('#kBanco').value = p.banco;
        this.pendientes = await CajaService.pendientesDeReposicion({
          contratoId: ContratoRepo.activoId(),
          consignoId: this.estado.beneficiarioId, incluirId: [...this.estado.seleccion.keys()] });
        this.pintarPendientes();
      }
    });
    MoneyInput.montar($('#kValor'), c => { this.estado.valor = c; this.pintarCuadre(); });
    $('#kFecha').addEventListener('change', e => { this.estado.fecha = e.target.value; });
    $('#kBanco').addEventListener('input', e => { this.estado.banco = e.target.value; });
    $('#kRef').addEventListener('input', e => { this.estado.referencia = e.target.value; });
    $('#kObs').addEventListener('input', e => { this.estado.observaciones = e.target.value; });

    this.pintarPendientes();

    setAcciones({
      togCaja: el => {
        const id = el.dataset.id;
        const caja = this.pendientes.find(c => c.id === id);
        if (el.checked) this.estado.seleccion.set(id, caja ? caja._pendiente : 0);
        else this.estado.seleccion.delete(id);
        this.pintarPendientes();
      },
      selTodo: () => { this.pendientes.forEach(c => this.estado.seleccion.set(c.id, c._pendiente)); this.pintarPendientes(); },
      selNada: () => { this.estado.seleccion.clear(); this.pintarPendientes(); },
      igualarValor: () => {
        const total = U.sumBy([...this.estado.seleccion.values()], v => v);
        $('#kValor').value = Money.formatInput(total);
        this.estado.valor = total;
        this.pintarCuadre();
      },
      guardar: () => this.guardar(editandoId)
    });
  },

  pintarPendientes() {
    const tb = $('#tbPend'); if (!tb) return;
    const lista = this.pendientes;
    if (!lista.length) {
      tb.innerHTML = '<tr><td colspan="9">' + Comp.vacio({ icono: 'check', titulo: 'No hay cajas pendientes',
        texto: 'Todas las cajas del beneficiario seleccionado están repuestas, o aún no hay cajas en estado pagada/pendiente.' }) + '</td></tr>';
    } else {
      tb.innerHTML = lista.map(c => {
        const sel = this.estado.seleccion.has(c.id);
        const monto = this.estado.seleccion.get(c.id) || 0;
        return '<tr' + (sel ? ' style="background:var(--accent-soft)"' : '') + '>' +
          '<td><input type="checkbox" data-act="togCaja" data-id="' + attr(c.id) + '"' + (sel ? ' checked' : '') + '></td>' +
          '<td class="mono"><span class="link" data-ir="caja/' + attr(c.id) + '">' + esc(c.numero) + '</span></td>' +
          '<td class="nowrap">' + Fecha.corta(c.fecha) + '</td>' +
          '<td class="trunc" style="max-width:150px">' + esc(Comp.nombreSolicitante(c)) + '</td>' +
          '<td class="trunc" style="max-width:110px">' + esc(c.municipioNombre || '—') + '</td>' +
          '<td class="num">' + Money.format(c.total) + '</td>' +
          '<td class="num txt-3">' + (c._repuesto ? Money.format(c._repuesto) : '—') + '</td>' +
          '<td class="num" style="color:var(--dang-500);font-weight:650">' + Money.format(c._pendiente) + '</td>' +
          '<td>' + (sel ? '<input class="inp inp-money" style="height:27px;font-size:12px" data-monto="' + attr(c.id) +
            '" value="' + attr(Money.formatInput(monto)) + '">' : '<span class="txt-3 fs11">—</span>') + '</td></tr>';
      }).join('');
      lista.forEach(c => {
        const inp = tb.querySelector('[data-monto="' + c.id + '"]');
        if (!inp) return;
        MoneyInput.montar(inp, cents => {
          if (cents > c._pendiente) { inp.classList.add('is-err'); inp.title = 'Excede el pendiente de la caja'; }
          else { inp.classList.remove('is-err'); inp.title = ''; }
          this.estado.seleccion.set(c.id, cents);
          this.pintarCuadre();
        });
      });
    }
    const n = this.estado.seleccion.size;
    const sc = $('#selCount');
    if (sc) sc.textContent = n ? n + ' caja(s) seleccionada(s)' : lista.length + ' caja(s) con saldo';
    this.pintarCuadre();
  },

  pintarCuadre() {
    const el = $('#cardCuadre'); if (!el) return;
    const asign = [...this.estado.seleccion.entries()].map(([cajaId, monto]) => ({ cajaId, monto }));
    const v = Finanzas.verificarConsignacion(this.estado.valor, asign);
    const exceso = asign.some(a => {
      const c = this.pendientes.find(x => x.id === a.cajaId);
      return c && a.monto > c._pendiente;
    });
    el.innerHTML =
      '<div class="card-h"><h3>Verificación de cuadre</h3></div><div class="card-b">' +
      '<table class="tbl" style="font-size:13px">' +
      '<tr><td>Total de cajas seleccionadas</td><td class="num">' + Money.format(v.totalCajas) + '</td></tr>' +
      '<tr><td>Valor de la consignación</td><td class="num">' + Money.format(v.valorConsignacion) + '</td></tr>' +
      '<tr style="background:var(--surface-2)"><td><b>DIFERENCIA</b></td><td class="num"><b style="color:' +
      (v.cuadra ? 'var(--ok-500)' : 'var(--dang-500)') + '">' + Money.format(v.diferencia) + '</b></td></tr>' +
      '</table>' +
      (v.cuadra && v.totalCajas > 0 ? '<div class="alert a-ok mt12" style="padding:8px 11px">' + Icon('check', '', 13) +
        '<div>Los valores cuadran exactamente.</div></div>' : '') +
      (!v.cuadra ? '<div class="alert a-warn mt12" style="padding:8px 11px">' + Icon('warn', '', 13) +
        '<div>' + (v.sobrante
          ? 'La consignación es <b>mayor</b> que lo asignado a las cajas en ' + Money.format(v.diferencia) + '. Las cajas no seleccionadas seguirán pendientes.'
          : 'Lo asignado a las cajas <b>supera</b> el valor consignado en ' + Money.format(-v.diferencia) + '.') +
        ' <span class="link" data-act="igualarValor">Igualar el valor al total de cajas</span></div></div>' : '') +
      (exceso ? '<div class="alert a-err mt12" style="padding:8px 11px">' + Icon('warn', '', 13) +
        '<div>Uno o más montos superan el saldo pendiente de su caja. Corrija antes de guardar.</div></div>' : '') +
      '<div class="fs11 txt-3 mt12">Las cajas quedarán en estado <b>Repuesta</b> si se cubre el total, o ' +
      '<b>Pendiente de reposición</b> si la reposición es parcial.</div></div>';
  },

  async guardar(editandoId) {
    const asignaciones = [...this.estado.seleccion.entries()]
      .map(([cajaId, monto]) => ({ cajaId, monto })).filter(a => a.monto > 0);
    const entrada = {
      fecha: $('#kFecha').value,
      beneficiarioId: this.estado.beneficiarioId,
      valor: Money.parse($('#kValor').value),
      banco: $('#kBanco').value.trim(),
      referencia: $('#kRef').value.trim(),
      observaciones: $('#kObs').value.trim(),
      asignaciones
    };
    const v = Finanzas.verificarConsignacion(entrada.valor, asignaciones);
    if (!v.cuadra) {
      const ok = await Modal.confirmar({
        titulo: 'Los valores no cuadran',
        textoOk: 'Guardar de todas formas', peligro: true,
        html: '<p>Valor de la consignación: <b>' + Money.format(v.valorConsignacion) + '</b></p>' +
              '<p>Total asignado a cajas: <b>' + Money.format(v.totalCajas) + '</b></p>' +
              '<p style="margin-top:8px">Diferencia: <b style="color:var(--dang-500)">' + Money.format(v.diferencia) + '</b></p>' +
              '<p class="mt12 fs12 txt-2">El sistema registrará exactamente lo que usted indique. Las cajas se marcarán ' +
              'como repuestas sólo por el monto efectivamente aplicado.</p>'
      });
      if (!ok) return;
    }
    try {
      const con = editandoId
        ? await ConsignacionService.actualizar(editandoId, entrada)
        : await ConsignacionService.crear(entrada);
      Toast.ok('Consignación ' + con.numero + ' guardada · ' + asignaciones.length + ' caja(s) repuesta(s).');
      Shell.refrescarConteos();
      Router.ir('consignacion/' + con.id);
    } catch (e) { manejarError(e); }
  }
};

          '<td>' + (cj ? Comp.pillEstadoCaja(cj.estado) : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="7"><div class="empty" style="padding:26px"><p>No hay cajas asociadas a esta consignación.</p></div></td></tr>') +
      '</tbody><tfoot><tr><td colspan="5">Total aplicado</td><td class="num">' + Money.format(v.totalCajas) +

      '<div class="card"><div class="card-h"><h3>Datos de la consignación</h3></div><div class="card-b">' +
