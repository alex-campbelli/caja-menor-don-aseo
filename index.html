   texto real y seleccionable, sin cargar ninguna librería.
   Al archivar, se congela el HTML resultante como documento del expediente:
   el histórico no se re-evalúa nunca contra las fichas actuales.
   ========================================================================== */
const Documento = {
  /** construye el HTML del formato a partir de la caja y sus detalles */
  async construir(caja, opts) {
    const o = opts || {};
    const cfg = ConfigRepo.get() || Modelo.configuracion();
    /* el contrato se toma de LA CAJA: un documento antiguo no debe cambiar
       porque hoy se esté trabajando en otro contrato */
    const ctr = ContratoRepo.get(caja.contratoId) || ContratoRepo.activo() || {};
    const detalles = o.detalles || await CajaRepo.detalles(caja.id);
    const sol = caja.solicitante || {};
    const FILAS_MIN = 12;
    const vacias = Math.max(0, FILAS_MIN - detalles.length);

    const logo = cfg.logoDataUrl
      ? '<img src="' + attr(cfg.logoDataUrl) + '" alt="">'
      : '<div class="lg-txt">DON ASEO<small>LTDA.</small></div>';

    const campo = (l, v) => '<div class="dp-f"><label>' + esc(l) + '</label><span>' + esc(v || '') + '</span></div>';

    return '' +
    '<div class="doc-page' + (caja.estado === EstadoCaja.ANULADA ? ' dp-watermark' : '') + '">' +
      (caja.estado === EstadoCaja.ANULADA ? '<div class="dp-anulada"><span>ANULADA</span></div>' : '') +
      '<div class="dp-head">' +
        '<div class="dp-logo">' + logo + '</div>' +
        '<div class="dp-hc">' +
          '<h1>' + esc(cfg.tituloDocumento) + '</h1>' +
          '<div class="dp-co">' + esc(cfg.empresa) + (cfg.nit ? ' · NIT ' + esc(cfg.nit) : '') + '</div>' +
          '<div class="dp-meta">' +
            [cfg.direccion, cfg.ciudad, cfg.telefono ? 'Tel. ' + cfg.telefono : '', cfg.correo]
              .filter(Boolean).map(esc).join(' · ') +
          '</div>' +
          '<div class="dp-meta"><b>Contrato:</b> ' + esc(ctr.nombre || '') +
            (ctr.numero ? ' N.° ' + esc(ctr.numero) : '') + '</div>' +
        '</div>' +
        '<div class="dp-num">' +
          '<div>N.° DE CAJA MENOR<b>' + esc(caja.numero) + '</b></div>' +
          '<div>FECHA<b>' + esc(Fecha.corta(caja.fecha)) + '</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="dp-norm">' + esc(cfg.referenciaNormativa) + '</div>' +

      '<div class="dp-sec"><div class="dp-sec-t">Datos del beneficiario / solicitante</div>' +
        '<div class="dp-fields">' +
          campo('Solicitante', sol.nombre || caja.solicitanteTexto || VALOR_NO_DISPONIBLE) +
          campo('C.C. / NIT', sol.cedula ? Txt.cedulaFmt(sol.cedula) : VALOR_NO_DISPONIBLE) +
          campo('Municipio', caja.municipioNombre || VALOR_NO_APLICA) +
          campo('Dirección', caja.direccion || VALOR_NO_DISPONIBLE) +
          campo('Banco', sol.banco || VALOR_NO_DISPONIBLE) +
          campo('Tipo de cuenta', sol.tipoCuenta || VALOR_NO_DISPONIBLE) +
          campo('N.° de cuenta', sol.numeroCuenta || VALOR_NO_DISPONIBLE) +
          campo('Consignó', Comp.nombreConsigno(caja)) +
        '</div>' +
      '</div>' +

      '<table class="dp-tbl">' +
        '<thead><tr>' +
          '<th style="width:8mm">#</th>' +
          '<th style="width:34mm">CATEGORÍA</th>' +
          '<th style="width:34mm">ELEMENTO</th>' +
          '<th>DETALLE</th>' +
          '<th style="width:26mm">VR. UNITARIO</th>' +
          '<th style="width:28mm">VR. TOTAL</th>' +
        '</tr></thead><tbody>' +
        detalles.map((d, i) => '<tr>' +
          '<td class="c">' + (i + 1) + '</td>' +
          '<td>' + esc(d.categoriaNombre || '') + '</td>' +
          '<td>' + esc(d.elemento || '') + '</td>' +
          '<td>' + esc(d.descripcion || '') + '</td>' +
          '<td class="n">' + (d.valorUnitario ? Money.format(d.valorUnitario) : '') + '</td>' +
          '<td class="n">' + Money.format(d.valor) + '</td>' +
        '</tr>').join('') +
        Array.from({ length: vacias }, () => '<tr class="empty-r">' +
          '<td></td><td></td><td></td><td></td><td></td><td></td></tr>').join('') +
        '</tbody>' +
      '</table>' +

      '<div class="dp-tot"><table>' +
        '<tr><td>Subtotal</td><td>' + Money.format(caja.subtotal) + '</td></tr>' +
        '<tr><td>Retención</td><td>' + Money.format(caja.retencion) + '</td></tr>' +
        '<tr class="grand"><td>Total</td><td>' + Money.format(caja.total) + '</td></tr>' +
      '</table></div>' +

      /* La discriminación de gasolina y aceite y la leyenda de aceptación se
         quitaron del impreso: ocupaban dos bloques y apretaban la hoja. Las
         cifras siguen estando —cada una en su fila del detalle— y la firma de
         quien recibe ya deja constancia de la aceptación. */
      (caja.observaciones ? '<div class="dp-obs"><b>Observaciones</b>' + esc(caja.observaciones) + '</div>' : '') +

      '<div class="dp-sign">' +
        '<div><div class="ln"></div><b>' + esc(sol.nombre || caja.solicitanteTexto || '') + '</b>' +
          '<small>' + esc(sol.tipoDocumento || 'C.C.') + ' ' +
            esc(sol.cedula ? Txt.cedulaFmt(sol.cedula) : '____________') + '</small>' +
          '<small>Recibí a satisfacción</small></div>' +
        '<div><div class="ln"></div><b>' + esc(cfg.responsable || '') + '</b>' +
          '<small>' + esc(cfg.cargoResponsable || 'Responsable de caja menor') + '</small>' +
          '<small>' + esc(cfg.empresa) + '</small></div>' +
        '<div><div class="ln"></div><b>' + esc(Comp.nombreConsigno(caja)) + '</b>' +
          '<small>Consignó / adelantó el dinero</small></div>' +
      '</div>' +

      '<div class="dp-foot">' +
        '<span>' + esc(cfg.empresa) + (cfg.nit ? ' · NIT ' + esc(cfg.nit) : '') +
          ' · Contrato ' + esc(ctr.nombre || '') + '</span>' +
        '<span>' + esc(caja.numero) + ' · ID ' + esc(caja.id) + '</span>' +
        '<span>Generado ' + esc(Fecha.stamp(Fecha.ahora())) + '</span>' +
      '</div>' +
    '</div>';
  },

  /** documento autocontenido para archivar (incluye su propio CSS) */
  async construirAutonomo(caja, opts) {
    const cuerpo = await this.construir(caja, opts);
    const css = [...document.styleSheets].map(s => {
      try { return [...s.cssRules].map(r => r.cssText).join('\n'); } catch { return ''; }
    }).join('\n');
    return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
      '<title>' + esc(caja.numero) + ' · ' + esc(Comp.nombreSolicitante(caja)) + '</title>' +
      '<style>' + css + '\nbody{background:#e8edf1;padding:16px;margin:0}' +
      '.doc-page{box-shadow:0 4px 20px rgba(0,0,0,.2);margin:0 auto}' +
      '@media print{body{background:#fff;padding:0}}</style></head><body>' +
      cuerpo +
      '<!-- Documento congelado el ' + Fecha.ahora() + ' por ' + APP.nombre + ' v' + APP.version +
      '. Refleja los datos vigentes en el momento de su generación. -->' +
      '</body></html>';
  },

  /* ------------------------------------------------------------------------
     EXPORTACIÓN COMO IMAGEN (para enviar por WhatsApp)
     --------------------------------------------------------------------------
     Se rasteriza sin librerías: el documento se serializa a XHTML válido, se
     envuelve en un <svg><foreignObject> con su CSS incrustado y se dibuja en
     un <canvas>. El logo va como data: URL, así que no hay recursos externos
     y el lienzo no queda "contaminado" (se puede exportar a PNG).
     ------------------------------------------------------------------------ */
  _cssFormato: null,
  /** extrae del sistema sólo las reglas del documento imprimible */
  cssDelFormato() {
    if (this._cssFormato) return this._cssFormato;
    const reglas = ['*{box-sizing:border-box;margin:0;padding:0}',
                    'body,div,table,td,th,span,b,small,h1{font-family:"Segoe UI",Arial,Helvetica,sans-serif}'];
    for (const hoja of document.styleSheets) {
      let lista;
      try { lista = hoja.cssRules; } catch { continue; }
      for (const r of lista) {
        if (r.type !== 1) continue;                       // sólo reglas de estilo (ignora @media print)
        const sel = r.selectorText || '';
        if (/\.doc-page|\.dp-/.test(sel)) reglas.push(r.cssText);
      }
    }
    this._cssFormato = reglas.join('\n');
    return this._cssFormato;
  },

  /** genera el PNG del formato. escala 2 = ~1630 px de ancho, nítido en móvil */
  async aPngBlob(caja, opts) {
    return this.htmlAPngBlob(await this.construir(caja), opts);
  },

  /**
   * Convierte a PNG cualquier documento ya compuesto.
   *
   * Antes esto sólo sabía dibujar una caja menor. Se separó para que la
   * relación de reembolso pueda copiarse como imagen con exactamente el mismo
   * camino —y las mismas trampas ya resueltas— en vez de tener una copia.
   */
  async htmlAPngBlob(html, opts) {
    const o = opts || {};
    const escala = o.escala || 2;

    const caja_ = document.createElement('div');
    caja_.style.cssText = 'position:fixed;left:-20000px;top:0;width:230mm;background:#fff;';
    caja_.innerHTML = html;
    document.body.appendChild(caja_);
    try {
      const pagina = caja_.querySelector('.doc-page');
      if (!pagina) throw new ErrorDominio('No se pudo componer el documento.', 'SIN_DOC');
      const w = Math.ceil(pagina.offsetWidth);
      const h = Math.ceil(pagina.offsetHeight);
      if (!w || !h) throw new ErrorDominio('El documento no tiene medidas visibles.', 'SIN_MEDIDAS');

      // XMLSerializer garantiza XHTML bien formado (dentro de foreignObject es obligatorio)
      const cuerpo = new XMLSerializer().serializeToString(pagina);
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + (w * escala) + '" height="' + (h * escala) + '" ' +
        'viewBox="0 0 ' + w + ' ' + h + '">' +
        '<foreignObject x="0" y="0" width="' + w + '" height="' + h + '">' +
        '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px;background:#fff">' +
        '<style>' + this.cssDelFormato() + '</style>' +
        cuerpo +
        '</div></foreignObject></svg>';

      /* IMPORTANTE: el SVG debe cargarse como data: URL, no como blob:.
         Chromium marca el lienzo como "contaminado" (y prohíbe exportarlo) al
         dibujar un SVG con <foreignObject> servido desde una URL blob:, pero
         no cuando llega en una data: URL. Verificado en Edge/Chrome. */
      const bytes = new TextEncoder().encode(svg);
      let bin = '';
      const TROZO = 8192;
      for (let i = 0; i < bytes.length; i += TROZO) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + TROZO));
      const url = 'data:image/svg+xml;base64,' + btoa(bin);

      const img = new Image();
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = () => rej(new ErrorDominio('El navegador no pudo rasterizar el documento.', 'RASTER'));
        img.src = url;
      });
      const lienzo = document.createElement('canvas');
      lienzo.width = w * escala;
      lienzo.height = h * escala;
      const ctx = lienzo.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, lienzo.width, lienzo.height);
      ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
      const png = await new Promise(res => lienzo.toBlob(res, 'image/png'));
      if (!png) throw new ErrorDominio('No se pudo generar la imagen.', 'PNG');
      return png;
    } finally { caja_.remove(); }
  },

  /** copia el formato al portapapeles como imagen; si no se puede, lo descarga */
  /** Copia al portapapeles un documento ya compuesto (o lo descarga si el
      navegador no deja escribir en el portapapeles). */
  async copiarHtmlComoImagen(html, nombre, escala) {
    const promesa = this.htmlAPngBlob(html, { escala });
    promesa.catch(() => {});
    const puedeCopiar = !!(navigator.clipboard && navigator.clipboard.write &&
                           window.ClipboardItem && window.isSecureContext);
    if (puedeCopiar) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': promesa })]);
        Toast.ok('Imagen copiada. Péguela en WhatsApp con Ctrl + V.');
        return { copiada: true };
      } catch (e) { console.warn('[copiar imagen] portapapeles no disponible:', e && e.name); }
    }
    const png = await promesa;
    U.descargar(png, nombre);
    Toast.warn('El navegador no permitió copiar al portapapeles. Se descargó la imagen «' +
      nombre + '»: adjúntela en WhatsApp.', 9000);
    return { copiada: false, descargada: true };
  },

  async copiarImagen(caja, escala) {
    const nombre = U.nombreSeguro(caja.numero || 'caja-menor') + '.png';
    // Se genera UNA sola vez y se reutiliza la misma promesa: pasarla sin
    // resolver a ClipboardItem conserva el gesto del usuario (si se hiciera
    // `await` antes, Chrome rechazaría la escritura por perder la activación).
    const promesa = this.aPngBlob(caja, { escala });
    promesa.catch(() => {});   // evita "unhandled rejection" si falla el primer intento
    const puedeCopiar = !!(navigator.clipboard && navigator.clipboard.write &&
                           window.ClipboardItem && window.isSecureContext);
    if (puedeCopiar) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': promesa })]);
        Toast.ok('Imagen copiada. Péguela en WhatsApp con Ctrl + V.');
        return { copiada: true };
      } catch (e) {
        console.warn('[copiar imagen] portapapeles no disponible:', e && e.name);
      }
    }
    const png = await promesa;          // ya está generada: no se rehace el trabajo
    U.descargar(png, nombre);
    Toast.warn('El navegador no permitió copiar al portapapeles. Se descargó la imagen «' +
      nombre + '»: adjúntela en WhatsApp.', 9000);
    return { copiada: false, descargada: true };
  },

  async descargarImagen(caja, escala) {
    const png = await this.aPngBlob(caja, { escala });
    U.descargar(png, U.nombreSeguro(caja.numero || 'caja-menor') + '.png');
    Toast.ok('Imagen descargada (' + Txt.bytes(png.size) + ').');
    return png;
  },

  /* ------------------------------------------------------------------------
     MENSAJE DE SOLICITUD DE CONSIGNACIÓN (texto plano para WhatsApp)
     --------------------------------------------------------------------------
     Se arma con los datos CONGELADOS en la caja (§63), no con la ficha actual
     de la persona: es lo que corresponde a esta operación concreta.
     El número de cuenta va COMPLETO —es el dato que quien consigna debe
     copiar—, a diferencia de los listados, donde se enmascara (§46).
     ------------------------------------------------------------------------ */
  mensajeConsignacion(caja) {
    const s = caja.solicitante || {};
    const lineas = [
      'Caja menor ' + (caja.numero || ''),
      'Nombre: ' + (s.nombre || caja.solicitanteTexto || VALOR_NO_DISPONIBLE),
      'Cédula: ' + (s.cedula ? Txt.cedulaFmt(s.cedula) : VALOR_NO_DISPONIBLE),
      'Municipio: ' + (caja.municipioNombre || VALOR_NO_APLICA),
      'Banco: ' + (s.banco || VALOR_NO_DISPONIBLE),
      'Tipo de cuenta: ' + (s.tipoCuenta || VALOR_NO_DISPONIBLE),
      'N.° de cuenta: ' + (s.numeroCuenta || VALOR_NO_DISPONIBLE),
      'Valor a consignar: ' + Money.format(caja.total)
    ];
    // se sustituyen los espacios duros del formato monetario por espacios normales
    return lineas.join('\n').replace(/ /g, ' ');
  },

  /** copia el mensaje; si el navegador no lo permite, lo muestra para copiarlo a mano */
  async copiarMensajeConsignacion(caja) {
    const texto = this.mensajeConsignacion(caja);
    try {
      if (!(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext))
        throw new Error('sin portapapeles');
      await navigator.clipboard.writeText(texto);
      Toast.ok('Datos copiados. Péguelos en el chat con Ctrl + V.');
      return { copiado: true, texto };
    } catch (e) {
      console.warn('[copiar datos]', e && e.name);
      Documento.modalMensaje(caja, texto);
      return { copiado: false, texto };
    }
  },

  /** respaldo: el texto a la vista y ya seleccionado para copiar con Ctrl + C */
  modalMensaje(caja, texto) {
    Modal.abrir({
      titulo: 'Datos para la consignación',
      subtitulo: caja.numero + ' · copie el texto y péguelo en WhatsApp',
      ancho: 'narrow',
      cuerpo: '<div class="alert a-warn mb12" style="padding:9px 11px">' + Icon('warn', '', 14) +
        '<div>El navegador no permitió copiar automáticamente. El texto ya está seleccionado: ' +
        'pulse <b>Ctrl + C</b>.</div></div>' +
        '<textarea class="inp" id="msgTxt" readonly style="min-height:190px;font-family:var(--mono);font-size:12px">' +
        esc(texto) + '</textarea>',
      pie: '<button class="btn" data-cerrar>Cerrar</button>' +
           '<button class="btn btn-primary" id="msgCopiar">' + Icon('copy', '', 14) + 'Intentar copiar</button>',
      alMontar(m) {
        const ta = m.querySelector('#msgTxt');
        setTimeout(() => { ta.focus(); ta.select(); }, 60);
        m.querySelector('#msgCopiar').onclick = async () => {
          ta.focus(); ta.select();
          try {
            await navigator.clipboard.writeText(texto);
            Toast.ok('Datos copiados.');
            Modal.cerrar(m);
          } catch {
            const ok = document.execCommand && document.execCommand('copy');
            if (ok) { Toast.ok('Datos copiados.'); Modal.cerrar(m); }
            else Toast.warn('Use Ctrl + C: el texto ya está seleccionado.');
          }
        };
      }
    });
  },

  async previsualizar(caja) {
    if (!caja) return;
    const html = await this.construir(caja);
    Modal.abrir({
      titulo: 'Vista previa · ' + caja.numero,
      subtitulo: 'Formato oficial · tamaño carta',
      ancho: 'xwide',
      cuerpo: '<div class="preview-shell">' + html + '</div>',
      pie: '<div class="mf-left flex g8 aic">' +
             '<button class="btn" data-cerrar>Cerrar</button>' +
             '<button class="btn" id="pvArchivar" title="Guardar este documento en el expediente de la caja">' +
               Icon('save', '', 14) + 'Archivar</button>' +
             '<button class="btn" id="pvHtml" title="Descargar el documento como página HTML">' +
               Icon('download', '', 14) + 'HTML</button>' +
           '</div>' +
        '<button class="btn btn-primary" id="pvCopiarImg" title="Copiar como imagen para pegarla en WhatsApp">' +
          Icon('copy', '', 14) + 'Copiar imagen</button>' +
        '<button class="btn" id="pvPng" title="Descargar como imagen PNG">' +
          Icon('download', '', 14) + 'PNG</button>' +
        '<button class="btn" id="pvPrint">' + Icon('print', '', 14) + 'Imprimir / PDF</button>',
      alMontar: m => {
        const conEspera = (btn, texto, fn) => {
          btn.onclick = async () => {
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spin"></span>' + texto;
            try { await fn(); }
            catch (e) { manejarError(e); }
            finally { btn.disabled = false; btn.innerHTML = original; }
          };
        };
        m.querySelector('#pvPrint').onclick = () => Documento.imprimir(caja);
        m.querySelector('#pvHtml').onclick = async () => {
          const doc = await Documento.construirAutonomo(caja);
          U.descargar(new Blob([doc], { type: 'text/html;charset=utf-8' }), caja.numero + '.html');
        };
        m.querySelector('#pvArchivar').onclick = async () => {
          const d = await Documento.archivar(caja);
          Toast.ok('Formato archivado: ' + d.nombre);
        };
        // el portapapeles exige conservar el gesto del usuario: no se envuelve en espera
        m.querySelector('#pvCopiarImg').onclick = async () => {
          const btn = m.querySelector('#pvCopiarImg');
          const original = btn.innerHTML;
          btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Generando…';
          try { await Documento.copiarImagen(caja); }
          catch (e) { manejarError(e); }
          finally { btn.disabled = false; btn.innerHTML = original; }
        };
        conEspera(m.querySelector('#pvPng'), 'Generando…', () => Documento.descargarImagen(caja));
      }
    });
  },


  /* =======================================================================
     RESUMEN DE REEMBOLSO
     Lo que cada semana pide quien consignó: la lista de cajas que puso de su
     bolsillo y todavía no le han devuelto, para poder cotejar que lo que le
     reembolsan es exactamente lo que giró.
     ======================================================================= */
  resumenReembolso(cajas, repuesto, detsPorCaja) {
    if (!cajas || !cajas.length) { Toast.warn('No hay cajas marcadas.'); return; }
    const cfg = ConfigRepo.get() || {};
    const ctr = ContratoRepo.activo() || {};
    const orden = cajas.slice().sort((a, b) => (a.fecha + a.numero).localeCompare(b.fecha + b.numero));
    const pendDe = c => Finanzas.pendienteDe(c, (repuesto && repuesto.get(c.id)) || 0);

    /* Para qué es el dinero: la categoría del gasto. Gasolina y aceite no
       cuentan aquí —son partes del total de una caja menor, no el motivo—,
       salvo que la caja no tenga ninguna otra cosa. */
    const categoriaDe = c => {
      const ds = (detsPorCaja && detsPorCaja.get(c.id)) || [];
      const propias = [], subs = [];
      for (const d of ds) {
        const n = String(d.categoriaNombre || '').trim();
        if (!n) continue;
        const esSub = d.rol === RolEstadistico.GASOLINA || d.rol === RolEstadistico.ACEITE;
        const donde = esSub ? subs : propias;
        if (donde.indexOf(n) < 0) donde.push(n);
      }
      const lista = propias.length ? propias : subs;
      return lista.join(' · ');
    };

    /* Se agrupa por quien puso el dinero: si en la semana consignaron dos
       personas distintas, cada una recibe su propio corte. */
    const grupos = new Map();
    for (const c of orden) {
      const k = Comp.nombreConsigno(c) || 'Sin registrar';
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(c);
    }
    const totalGeneral = U.sumBy(orden, c => c.total);
    const pendGeneral = U.sumBy(orden, c => pendDe(c));
    const variosGrupos = grupos.size > 1;

    const bloque = (quien, lista) =>
      (variosGrupos ? '<div class="dp-sec"><div class="dp-sec-t">Consignó: ' + esc(quien) +
        '</div></div>' : '') +
      '<table class="dp-tbl rr-tbl"><thead><tr>' +

  /* =======================================================================
     CAJA + COMPROBANTE, TODO EN UN SOLO TRABAJO DE IMPRESIÓN
     De la consignación más antigua a la más reciente: cada caja con su
     formato y, detrás, la imagen del comprobante con que se giró el dinero.
     ======================================================================= */
  async pdfConComprobantes(cajas) {
    if (!cajas || !cajas.length) { Toast.warn('No hay cajas marcadas.'); return; }
    Cargando.iniciar();
    try {
      const orden = cajas.slice().sort((a, b) => (a.fecha + a.numero).localeCompare(b.fecha + b.numero));
      const partes = [];
      let conComprobante = 0;
      for (const c of orden) {
        partes.push(await this.construir(c));
        /* El comprobante puede estar colgado de la caja o de la consignación
           que la repone: se buscan los dos sitios, igual que en su detalle. */
        const apls = await CajaRepo.aplicaciones(c.id);
        const ids = U.uniq(apls.map(a => a.consignacionId));
        let docs = await CajaRepo.documentos(c.id);
        for (const i of ids) docs = docs.concat(await ConsignacionRepo.documentos(i));
        const comp = docs.filter(d => d.tipo === TipoDocumento.COMPROBANTE_CONSIGNACION);
        if (!comp.length) continue;
        conComprobante++;
        const imgs = [];
        for (const d of comp) {
          const url = await DocumentoService.url(d.id);
          if (!url) continue;
          imgs.push(U.esImagen(d.mime)
            ? '<figure class="doc-comp"><img src="' + attr(url) + '" alt="">' +
              '<figcaption>' + esc(d.nombre) + '</figcaption></figure>'
            : '<div class="doc-comp-otro">' + esc(d.nombre) +
              ' — no es una imagen, se conserva en el expediente.</div>');
        }
        if (!imgs.length) continue;
        partes.push('<div class="doc-page"><div class="doc-cab-min">Comprobante de ' + esc(c.numero) +
          ' · ' + Fecha.corta(c.fecha) + ' · ' + esc(Comp.nombreSolicitante(c)) +
          ' · ' + Money.format(c.total) + '</div>' + imgs.join('') + '</div>');
      }
      const root = $('#printRoot');
      root.innerHTML = partes.join('');
      const limpiar = () => { root.innerHTML = ''; window.removeEventListener('afterprint', limpiar); };
      window.addEventListener('afterprint', limpiar);
      if (conComprobante < orden.length)
        Toast.warn((orden.length - conComprobante) + ' caja(s) van sin comprobante: todavía no se les ha adjuntado.', 7000);
      setTimeout(() => { window.print(); setTimeout(limpiar, 3000); }, 400);
    } catch (e) { manejarError(e); }
    finally { Cargando.terminar(); }
  },

  async imprimir(caja) {
    const html = await this.construir(caja);
    const root = $('#printRoot');
    root.innerHTML = html;
    const limpiar = () => { root.innerHTML = ''; window.removeEventListener('afterprint', limpiar); };
    window.addEventListener('afterprint', limpiar);
    setTimeout(() => { window.print(); setTimeout(limpiar, 1500); }, 60);
  },

  /** imprime varias cajas en un solo trabajo (una por página) */
  async imprimirLote(cajas) {
    const partes = [];
    for (const c of cajas) partes.push(await this.construir(c));
    const root = $('#printRoot');
    root.innerHTML = partes.join('');
    const limpiar = () => { root.innerHTML = ''; window.removeEventListener('afterprint', limpiar); };
    window.addEventListener('afterprint', limpiar);
    setTimeout(() => { window.print(); setTimeout(limpiar, 2500); }, 80);
  },

  /** congela el documento y lo adjunta al expediente de la caja (§18) */
  async archivar(caja) {
    const html = await this.construirAutonomo(caja);
    const doc = await DocumentoService.guardarGenerado(html, {
      cajaId: caja.id,
      tipo: TipoDocumento.FORMATO_CAJA,
      nombre: 'Formato ' + caja.numero,
      descripcion: 'Documento generado el ' + Fecha.stamp(Fecha.ahora()) +
        '. Congelado: no cambia aunque se modifiquen las fichas maestras.'
    });
    await Auditoria.registrar('caja', caja.id, 'GENERAR_FORMATO', { documentoId: doc.id, numero: caja.numero });
    Bus.emit('documentos:cambio', doc);
    Shell.refrescarConteos();
    return doc;
  }
};


/* ==========================================================================

   --------------------------------------------------------------------------

     · NO se inventa información. Lo que no está en el archivo queda vacío o
       marcado como "No disponible".
     · NO se corrige el dato de origen. Las inconsistencias se marcan y se
       importan tal cual, para que una persona decida.
     · Cada fila conserva archivo, hoja, número de fila y sus 10 columnas
       originales en el bloque `legacy`, de modo que siempre pueda responderse

  /* ---------------- PASO 1 · archivo ---------------- */

  async cargarArchivo(file) {
    const s = this.st;
    if (!file) return;
    if (!/\.xlsx$/i.test(file.name)) {
      Toast.err('Sólo se admite formato .xlsx. Abra el archivo en Excel y use "Guardar como → Libro de Excel (.xlsx)".');
      return;
    }
    try {
      Toast.ok('Leyendo ' + file.name + '…');
      const libro = await Xlsx.leer(file);
      s.archivo = file; s.libro = libro;
      s.hojaSel = (libro.hojas.find(h => Txt.norm(h.nombre).includes('comfenalco')) || libro.hojas[0]).nombre;
      this.render($('#vista'));
    } catch (e) { manejarError(e); }
  },

  async leerHoja() {
    const s = this.st;
    try {
      const datos = await s.libro.filas(s.hojaSel);
      s.datos = datos;
      // detectar fila de encabezado: la primera con ≥3 celdas de texto
      let idx = 0;
      for (let i = 0; i < Math.min(8, datos.filas.length); i++) {
        const c = datos.filas[i].celdas.filter(x => x && typeof x.valor === 'string' && x.valor.trim());
        if (c.length >= 3) { idx = i; break; }
      }
      s.filaEncabezado = idx;
      s.encabezados = [];
      for (let c = 0; c < datos.columnas; c++) {
        const cel = datos.filas[idx] && datos.filas[idx].celdas[c];
        s.encabezados.push(cel && cel.valor != null ? String(cel.valor).trim() : '');
      }
      // auto-mapeo por nombre
      s.mapeo = {};
      this.CAMPOS.forEach(campo => {
        const i = s.encabezados.findIndex(h => {
          const n = Txt.norm(h);
          return n && campo.alias.some(a => n === Txt.norm(a) || n.replace(/[^a-z0-9]/g, '') === Txt.norm(a).replace(/[^a-z0-9]/g, ''));
        });
        s.mapeo[campo.k] = i >= 0 ? i : null;
      });
      s.paso = 2;
      this.render($('#vista'));
    } catch (e) { manejarError(e); }
  },

        '<option value="">— no mapear —</option>' +
        s.encabezados.map((h, i) => '<option value="' + i + '"' + (s.mapeo[c.k] === i ? ' selected' : '') + '>' +
          esc(Xlsx.refDeCol(i)) + ' · ' + esc(h || '(sin título)') + '</option>').join('') +
        '</select></div>').join('') +
      '</div>' +
      (faltantes.length ? '<div class="alert a-err mt12">' + Icon('warn') +

      '</div></div>' +

      '</tr></thead><tbody>' +
      muestras.map(f => '<tr><td class="txt-3">' + f.fila + '</td>' +
        s.encabezados.map((h, i) => {
          const c = f.celdas[i];
          const v = c ? c.valor : '';
          return '<td class="trunc" style="max-width:200px">' +
            (c && c.tipo === 'numero' ? '<span class="num">' + esc(Number(v).toLocaleString('es-CO')) + '</span>' : esc(v)) + '</td>';

  filasDatos() {
    const s = this.st;
    const filaHdr = s.datos.filas[s.filaEncabezado].fila;
    return s.datos.filas.filter(f => f.fila > filaHdr);
  },
  celda(fila, campo) {
    const i = this.st.mapeo[campo];
    if (i === null || i === undefined) return null;
    const c = fila.celdas[i];
    return c ? c.valor : null;
  },

  /* ---------------- PASO 3 · personas y catálogos ---------------- */
  prepararMapeos() {
    const s = this.st;
    const filas = this.filasDatos();
    // valores distintos de CONCEPTO con frecuencia
    const conceptos = new Map();
    const consignos = new Map();
    const ubicaciones = new Map();
    for (const f of filas) {
      const co = this.celda(f, 'concepto');
      if (co != null && String(co).trim()) {
        const k = String(co).trim();
        conceptos.set(k, (conceptos.get(k) || 0) + 1);
      }
      const cs = this.celda(f, 'consigno');
      if (cs != null && String(cs).trim()) { const k = String(cs).trim(); consignos.set(k, (consignos.get(k) || 0) + 1); }
      const ub = this.celda(f, 'ubicacion');
      if (ub != null && String(ub).trim()) { const k = String(ub).trim(); ubicaciones.set(k, (ubicaciones.get(k) || 0) + 1); }
    }
    s.conceptos = [...conceptos.entries()].map(([texto, n]) => ({ texto, n })).sort(U.by('n', 'desc'));
    s.consignos = [...consignos.entries()].map(([texto, n]) => ({ texto, n })).sort(U.by('n', 'desc'));
    s.ubicaciones = [...ubicaciones.entries()].map(([texto, n]) => ({ texto, n })).sort(U.by('n', 'desc'));

    // sugerencias (NUNCA decisiones automáticas)
    s.conceptos.forEach(c => {
      if (s.mapPersonas.has(c.texto)) return;
      const existente = PersonaRepo.porNombre(c.texto);
      if (existente) { s.mapPersonas.set(c.texto, { accion: 'persona', personaId: existente.id, nombre: existente.nombre }); return; }
      const pareceNombre = Txt.pareceNombrePersona(c.texto);
      s.mapPersonas.set(c.texto, pareceNombre
        ? { accion: 'crear', personaId: null, nombre: Txt.casoNombre(c.texto) }
        : { accion: 'texto', personaId: null, nombre: '' });
    });
    s.consignos.forEach(c => {
      if (s.mapConsigno.has(c.texto)) return;
      const n = Txt.norm(c.texto);
      const existente = PersonaRepo.todas().find(p =>
        Txt.norm(p.nombre) === n ||
        Txt.norm(p.cargo || '') === n ||                       // p. ej. "EMPRESA" → ficha con cargo "Empresa"
        Txt.norm(p.nombre).includes(n) ||
        n.includes(Txt.norm(p.nombre.split(' ')[0])));
      s.mapConsigno.set(c.texto, existente ? existente.id : '');
    });
    s.ubicaciones.forEach(u => {
      if (s.mapMunicipios.has(u.texto)) return;
      const ex = MunicipioRepo.porNombre(u.texto);
      s.mapMunicipios.set(u.texto, ex ? ex.id : 'crear');
    });
  },

  /* ---------------- PASO 4 · validación ---------------- */
  async analizar() {
    const s = this.st;
    const filas = this.filasDatos();
    const cajasExistentes = await db.getAll('cajas');
    const clavesExistentes = new Map();
    for (const c of cajasExistentes) {
      const k = this.claveDuplicado({
        fecha: c.fecha, ubicacion: c.municipioNombre, concepto: (c.legacy && c.legacy.concepto) || Comp.nombreSolicitante(c),
        descripcion: (c.legacy && c.legacy.descripcion) || '', total: c.total
      });
      if (!clavesExistentes.has(k)) clavesExistentes.set(k, c);
    }
    const vistasEnArchivo = new Map();
    const registros = [];

    /* Umbral de valor atípico: el mayor entre un piso absoluto configurable y
       30 veces la mediana del propio archivo. Así se marcan sólo los valores
       realmente fuera de escala y no doscientas filas normales. */
    const totalesArchivo = filas.map(f => Money.parse(this.celda(f, 'total'))).filter(v => v > 0).sort((x, y) => x - y);
    const mediana = totalesArchivo.length ? totalesArchivo[Math.floor(totalesArchivo.length / 2)] : 0;
    const umbral = Math.max(s.opciones.umbralAtipico, mediana * 30);
    s.umbralCalculado = umbral;
    s.medianaArchivo = mediana;

    for (const f of filas) {
      const crudo = {
        fecha: this.celda(f, 'fecha'), categoria: this.celda(f, 'categoria'),
        consigno: this.celda(f, 'consigno'), ubicacion: this.celda(f, 'ubicacion'), concepto: this.celda(f, 'concepto'),
        gasolina: this.celda(f, 'gasolina'), aceite: this.celda(f, 'aceite'),
        descripcion: this.celda(f, 'descripcion'), total: this.celda(f, 'total')
      };
      const errores = [], advertencias = [];
      const fecha = Fecha.parse(crudo.fecha);
      if (!fecha || !Fecha.valida(fecha)) errores.push('Fecha inválida o vacía');
      const total = Money.parse(crudo.total);
      if (!total || total <= 0) errores.push('El total debe ser un número mayor que cero');
      const gasolina = Money.parse(crudo.gasolina);
      const aceite = Money.parse(crudo.aceite);
      if (gasolina < 0 || aceite < 0) errores.push('Gasolina/aceite no pueden ser negativos');
      let inconsistente = false;
      if (total > 0 && gasolina + aceite > total) {
        inconsistente = true;
        advertencias.push('Gasolina (' + Money.format(gasolina) + ') + aceite (' + Money.format(aceite) +
          ') supera el total (' + Money.format(total) + '). Se importa sin modificar y se marca para revisión.');
      }
      if (total > umbral)
        advertencias.push('Valor atípico: ' + Money.format(total) + ' (más de 30 veces la mediana del archivo, ' +
          Money.format(mediana) + '). Verifique que no sea un error de digitación en el origen. No se modificará.');
      if (Txt.vacio(crudo.descripcion) && Txt.vacio(crudo.concepto))
        advertencias.push('Sin descripción ni concepto.');

      const textoConcepto = crudo.concepto != null ? String(crudo.concepto).trim() : '';
      const mapP = s.mapPersonas.get(textoConcepto) || { accion: 'texto' };
      const textoConsigno = crudo.consigno != null ? String(crudo.consigno).trim() : '';
      const textoUbic = crudo.ubicacion != null ? String(crudo.ubicacion).trim() : '';

      const clave = this.claveDuplicado({ fecha, ubicacion: textoUbic, concepto: textoConcepto,
        descripcion: crudo.descripcion || '', total });
      let duplicado = null;
      if (clavesExistentes.has(clave)) duplicado = { tipo: 'base', caja: clavesExistentes.get(clave) };
      else if (vistasEnArchivo.has(clave)) duplicado = { tipo: 'archivo', fila: vistasEnArchivo.get(clave) };
      else vistasEnArchivo.set(clave, f.fila);

      const estadoReg = errores.length ? 'error' : duplicado ? 'duplicado' : advertencias.length ? 'advertencia' : 'ok';
      if (!s.decisiones.has(f.fila))
        s.decisiones.set(f.fila, errores.length ? 'omitir' : (duplicado && s.opciones.omitirDuplicados ? 'omitir' : 'importar'));

      registros.push({
        fila: f.fila, crudo, fecha, total, gasolina, aceite, inconsistente,
        textoConcepto, textoConsigno, textoUbic, mapPersona: mapP,
        errores, advertencias, duplicado, estado: estadoReg
      });
    }
    s.analisis = {
      registros,
      totales: {
        analizados: registros.length,
        validos: registros.filter(r => r.estado === 'ok').length,
        advertencias: registros.filter(r => r.estado === 'advertencia').length,
        errores: registros.filter(r => r.estado === 'error').length,
        duplicados: registros.filter(r => r.estado === 'duplicado').length,
        importar: registros.filter(r => s.decisiones.get(r.fila) === 'importar').length,
        monto: U.sumBy(registros.filter(r => s.decisiones.get(r.fila) === 'importar'), r => r.total)
      }
    };
    return s.analisis;
  },

  claveDuplicado(o) {
    return [Txt.slug(o.fecha), Txt.slug(o.ubicacion), Txt.slug(o.concepto),
            Txt.slug(String(o.descripcion || '').slice(0, 60)), String(o.total)].join('|');
  },

  async paso4(el) {
    const s = this.st;
    el.innerHTML = Comp.cargando('Validando ' + this.filasDatos().length + ' filas…');
    const a = await this.analizar();
    const t = a.totales;
    const filtro = s.filtroValidacion || 'todos';
    const lista = a.registros.filter(r => filtro === 'todos' ? true :
      filtro === 'problemas' ? r.estado !== 'ok' : r.estado === filtro);

    el.innerHTML =
      '<div class="grid g4 mb16">' +
      Comp.kpi({ label: 'Registros analizados', valor: t.analizados.toLocaleString('es-CO'), color: 'var(--info-500)', icono: 'list' }) +

      '</div>' +
      '<div class="grid g3 mb16">' +

      Comp.kpi({ label: 'Se importarán', valor: t.importar.toLocaleString('es-CO'), color: 'var(--brand-500)', icono: 'upload' }) +
      Comp.kpi({ label: 'Monto total a importar', valor: Money.format(t.monto), color: 'var(--brand-600)', icono: 'money' }) +
      '</div>' +

      '<div class="alert a-info mb16">' + Icon('info') +
      '<div>Mediana de valores del archivo: <b>' + Money.format(s.medianaArchivo || 0) + '</b>. ' +
      'Se marcan como atípicos los valores superiores a <b>' + Money.format(s.umbralCalculado || 0) + '</b>. ' +
      'Las advertencias <b>no impiden</b> la importación: los valores se conservan exactamente como están en el origen.</div></div>' +

      (t.errores ? '<div class="alert a-err mb16">' + Icon('warn') +
        '<div><b>' + t.errores + ' fila(s) con errores</b> quedarán excluidas: no tienen fecha válida o total mayor que cero. ' +
        'Corrija el archivo de origen y vuelva a importarlas si corresponde.</div></div>' : '') +

      '<div class="card"><div class="card-h"><h3>4. Revisión fila por fila</h3>' +
      '<div class="ch-act"><div class="seg">' +
      [['todos', 'Todos'], ['problemas', 'Con observación'], ['duplicado', 'Duplicados'],
       ['advertencia', 'Advertencias'], ['error', 'Errores']].map(([k, tx]) =>
        '<button data-act="impFiltro" data-f="' + k + '"' + (filtro === k ? ' class="on"' : '') + '>' + esc(tx) + '</button>').join('') +
      '</div>' +
      '<button class="btn btn-sm" data-act="impTodosImportar">Importar todos</button>' +
      '<button class="btn btn-sm" data-act="impTodosOmitirDup">Omitir duplicados</button>' +
      '</div></div>' +
      '<div class="card-b flush"><div class="tbl-wrap tbl-scroll" style="max-height:520px"><table class="tbl">' +
      '<thead><tr><th style="width:52px">Fila</th><th>Fecha</th><th>Clase</th><th>Ubicación</th><th>Concepto</th>' +
      '<th>Descripción</th><th class="num">Gasolina</th><th class="num">Aceite</th><th class="num">Total</th>' +
      '<th>Estado</th><th style="width:120px">Acción</th></tr></thead><tbody>' +
      (lista.length ? lista.slice(0, 600).map(r => {
        const dec = s.decisiones.get(r.fila);
        const pill = r.estado === 'ok' ? '<span class="pill p-green">Válido</span>' :
          r.estado === 'advertencia' ? '<span class="pill p-amber">Advertencia</span>' :
          r.estado === 'duplicado' ? '<span class="pill p-violet">Posible duplicado</span>' :
          '<span class="pill p-red">Error</span>';
        const tip = [...r.errores, ...r.advertencias,
          r.duplicado ? (r.duplicado.tipo === 'base' ? 'Ya existe en el sistema: ' + r.duplicado.caja.numero
                                                     : 'Repetido en la fila ' + r.duplicado.fila) : ''].filter(Boolean).join(' · ');
        return '<tr' + (dec === 'omitir' ? ' style="opacity:.5"' : '') + '>' +
          '<td class="txt-3 mono">' + r.fila + '</td>' +
          '<td class="nowrap">' + (r.fecha ? Fecha.corta(r.fecha) : '<span style="color:var(--dang-500)">—</span>') + '</td>' +
          '<td class="trunc" style="max-width:120px">' + esc(r.crudo.categoria || '') + '</td>' +
          '<td class="trunc" style="max-width:110px">' + esc(r.textoUbic) + '</td>' +
          '<td class="trunc" style="max-width:180px">' + esc(r.textoConcepto) +
            (r.mapPersona.accion === 'crear' ? ' <span class="pill np p-blue">nueva persona</span>' :
             r.mapPersona.accion === 'persona' ? ' <span class="pill np p-green">persona</span>' :
             ' <span class="co-tag">texto</span>') + '</td>' +
          '<td class="trunc" style="max-width:210px" title="' + attr(r.crudo.descripcion || '') + '">' +
            esc(r.crudo.descripcion || '') + '</td>' +
          '<td class="num">' + (r.gasolina ? Money.format(r.gasolina) : '') + '</td>' +
          '<td class="num">' + (r.aceite ? Money.format(r.aceite) : '') + '</td>' +
          '<td class="num"><b>' + Money.format(r.total) + '</b></td>' +
          '<td title="' + attr(tip) + '">' + pill + '</td>' +
          '<td>' + (r.errores.length ? '<span class="txt-3 fs11">Excluida</span>' :
            '<select class="inp" style="height:26px;font-size:11.5px" data-act="impDecidir" data-fila="' + r.fila + '">' +
            '<option value="importar"' + (dec === 'importar' ? ' selected' : '') + '>Importar</option>' +
            '<option value="omitir"' + (dec === 'omitir' ? ' selected' : '') + '>Omitir</option></select>') + '</td>' +
          '</tr>' +
          (tip && r.estado !== 'ok' ? '<tr><td></td><td colspan="10" class="fs11" style="padding-top:0;color:var(--warn-700)">' +
            Icon('info', '', 11) + ' ' + esc(tip) + '</td></tr>' : '');
      }).join('') : '<tr><td colspan="11"><div class="empty" style="padding:26px"><p>Sin filas en este filtro.</p></div></td></tr>') +
      '</tbody></table></div>' +
      (lista.length > 600 ? '<div class="card-f">Mostrando 600 de ' + lista.length + ' filas.</div>' : '') +
      '</div></div>' +

      '<div class="flex g8 mt16"><button class="btn" data-act="impVolver3">' + Icon('back', '', 14) + 'Atrás</button>' +
      '<button class="btn btn-primary btn-lg" data-act="impEjecutar"' + (t.importar ? '' : ' disabled') + '>' +
      Icon('upload', '', 15) + 'Importar ' + t.importar + ' registro(s)</button></div>';

    Object.assign(Acciones, {
      impFiltro: elx => { s.filtroValidacion = elx.dataset.f; this.render($('#vista')); },
      impDecidir: elx => { s.decisiones.set(Number(elx.dataset.fila), elx.value); this.render($('#vista')); },
      impTodosImportar: () => { a.registros.forEach(r => { if (!r.errores.length) s.decisiones.set(r.fila, 'importar'); });
        this.render($('#vista')); },
      impTodosOmitirDup: () => { a.registros.forEach(r => { if (r.duplicado) s.decisiones.set(r.fila, 'omitir'); });
        this.render($('#vista')); },
      impVolver3: () => { s.paso = 3; this.render($('#vista')); },
      impEjecutar: () => this.ejecutar()
    });
  },

  /* ---------------- PASO 5 · ejecución ---------------- */
  async ejecutar() {
    const s = this.st;
    const aImportar = s.analisis.registros.filter(r => s.decisiones.get(r.fila) === 'importar' && !r.errores.length);
    if (!aImportar.length) { Toast.warn('No hay registros seleccionados para importar.'); return; }

    const ok = await Modal.confirmar({
      titulo: 'Confirmar importación',
      textoOk: 'Importar ahora',
      html: '<p>Se crearán <b>' + aImportar.length + '</b> caja(s) menor(es) por un total de <b>' +
        Money.format(U.sumBy(aImportar, r => r.total)) + '</b>.</p>' +
        '<p class="mt8">Estado asignado: <b>' + (ESTADO_CAJA_META[s.opciones.estadoDestino] || {}).label + '</b>.</p>' +
        '<p class="mt12 fs12 txt-2">Cada registro conservará su fila y columnas originales para auditoría. ' +
        'Esta operación no modifica ni elimina información existente.</p>'
    });
    if (!ok) return;

    s.paso = 5;
    s.progreso = { total: aImportar.length, hechos: 0, creadas: 0, personas: 0, municipios: 0,
                   categorias: 0, errores: [], enCurso: true };
    this.render($('#vista'));

    const importId = ID.importacion();
    const cfg = ConfigRepo.get() || {};
    const ahora = Fecha.ahora();

    try {
      /* 1) municipios */
      const munPorTexto = new Map();
      for (const [texto, valor] of s.mapMunicipios.entries()) {
        if (valor === 'ignorar') { munPorTexto.set(texto, null); continue; }
        if (valor === 'crear') {
          const m = await MunicipioRepo.obtenerOCrear(texto, Origen.IMPORT);
          if (m) { munPorTexto.set(texto, m.id); s.progreso.municipios++; }
        } else munPorTexto.set(texto, valor);
      }
      /* 2) personas confirmadas */
      const perPorTexto = new Map();
      for (const [texto, m] of s.mapPersonas.entries()) {
        if (m.accion === 'persona' && m.personaId) { perPorTexto.set(texto, m.personaId); continue; }
        if (m.accion !== 'crear') continue;
        const nombre = (m.nombre || texto).trim();
        const ex = PersonaRepo.porNombre(nombre);
        if (ex) { perPorTexto.set(texto, ex.id); continue; }
        const p = await PersonaRepo.guardar(Modelo.persona({
          nombre, origen: Origen.IMPORT, esSolicitante: 1,
          legacy: { archivo: s.archivo.name, hoja: s.hojaSel, valorOriginal: texto, importId, importadoEn: ahora }
        }));
        perPorTexto.set(texto, p.id);
        s.progreso.personas++;
      }
      /* 3) categorías del archivo
         Se registran igual que los municipios. Esto no es inventar datos (§64):
         el nombre está escrito literalmente en la columna CATEGORÍA. Sin este
         paso, cada gasto guardaba el nombre pero sin referencia al catálogo, y
         las estadísticas contaban textos sueltos en vez de categorías. */
      const catPorTexto = new Map();
      for (const r of aImportar) {
        const t = r.crudo.categoria != null ? String(r.crudo.categoria).trim() : '';
        if (!t || catPorTexto.has(t)) continue;
        const yaEstaba = Boolean(CategoriaRepo.porNombre(t));
        const c = await CategoriaRepo.obtenerOCrear(t, Origen.IMPORT);
        if (c) { catPorTexto.set(t, c.id); if (!yaEstaba) s.progreso.categorias++; }
      }

      /* 4) cajas */
      const categoriaGas = CategoriaRepo.porRol(RolEstadistico.GASOLINA);
      const categoriaAce = CategoriaRepo.porRol(RolEstadistico.ACEITE);

      for (const r of aImportar) {
        try {
          const municipioId = munPorTexto.get(r.textoUbic) || null;
          const solicitanteId = perPorTexto.get(r.textoConcepto) || null;
          const consignoId = s.mapConsigno.get(r.textoConsigno) || null;
          const detalles = [];
          const claseTxt = r.crudo.categoria != null ? String(r.crudo.categoria).trim() : '';
          const claseId = catPorTexto.get(claseTxt) || null;
          const descTxt = r.crudo.descripcion != null ? String(r.crudo.descripcion).trim() : '';

          if (r.inconsistente) {
            /* Gasolina + aceite superan el total → NO se altera ningún valor:
               se registra un único detalle por el total real y se conservan las
               cifras declaradas en `legacy` para auditoría. */
            detalles.push({ categoriaId: claseId, categoriaNombre: claseTxt || 'Sin clasificar',
              descripcion: descTxt, valor: r.total, rol: null, origen: Origen.IMPORT });
          } else {
            if (r.gasolina > 0) detalles.push({ categoriaId: categoriaGas ? categoriaGas.id : null,
              categoriaNombre: categoriaGas ? categoriaGas.nombre : 'Gasolina',
              descripcion: descTxt && (r.aceite > 0 || r.total - r.gasolina - r.aceite > 0) ? '' : descTxt,
              valor: r.gasolina, rol: RolEstadistico.GASOLINA, origen: Origen.IMPORT });
            if (r.aceite > 0) detalles.push({ categoriaId: categoriaAce ? categoriaAce.id : null,
              categoriaNombre: categoriaAce ? categoriaAce.nombre : 'Aceite',
              descripcion: '', valor: r.aceite, rol: RolEstadistico.ACEITE, origen: Origen.IMPORT });
            const resto = r.total - r.gasolina - r.aceite;
            if (resto > 0) detalles.push({ categoriaId: claseId, categoriaNombre: claseTxt || 'Sin clasificar',
              descripcion: descTxt, valor: resto, rol: null, origen: Origen.IMPORT });
            if (!detalles.length) detalles.push({ categoriaId: claseId, categoriaNombre: claseTxt || 'Sin clasificar',
              descripcion: descTxt, valor: r.total, rol: null, origen: Origen.IMPORT });
          }

          await CajaService.crear({
            fecha: r.fecha,
            solicitanteId,
            solicitanteTexto: solicitanteId ? '' : (r.textoConcepto || ''),
            consignoId,
            consignoTexto: r.textoConsigno || '',
            municipioId,
            municipioNombre: municipioId ? MunicipioRepo.nombre(municipioId) : (r.textoUbic || ''),
            direccion: '',
            estado: s.opciones.estadoDestino,
            observaciones: '',
            retencion: 0,
            detalles,
            origen: Origen.IMPORT,
            requiereRevision: r.inconsistente ? 1 : 0,
            motivoRevision: r.inconsistente
              ? 'El archivo de origen declara gasolina ' + Money.format(r.gasolina) + ' y aceite ' +
                Money.format(r.aceite) + ', que juntos superan el total ' + Money.format(r.total) +
                '. Los valores se conservaron sin modificar; gasolina y aceite quedaron excluidos de las estadísticas de esta caja.'
              : '',
            legacy: {
              archivo: s.archivo.name, hoja: s.hojaSel, fila: r.fila, importId, importadoEn: ahora,
              fecha: r.crudo.fecha, categoria: r.crudo.categoria, consigno: r.crudo.consigno,
              ubicacion: r.crudo.ubicacion, concepto: r.crudo.concepto,
              gasolina: r.crudo.gasolina, aceite: r.crudo.aceite,
              descripcion: r.crudo.descripcion, totalConIva: r.crudo.total,
              gasolinaDeclarada: r.inconsistente ? Money.toPesos(r.gasolina) : undefined,
              aceiteDeclarado: r.inconsistente ? Money.toPesos(r.aceite) : undefined
            },
            omitirValidacion: true
          });
          s.progreso.creadas++;
        } catch (e) {
          console.error('[import fila ' + r.fila + ']', e);
          s.progreso.errores.push({ fila: r.fila, mensaje: e.message || String(e) });
        }
        s.progreso.hechos++;
        if (s.progreso.hechos % 10 === 0) { this.pintarProgreso(); await new Promise(res => setTimeout(res, 0)); }
      }

      await db.put('importaciones', {
        id: importId, archivo: s.archivo.name, hoja: s.hojaSel,
        filasAnalizadas: s.analisis.totales.analizados,
        cajasCreadas: s.progreso.creadas, personasCreadas: s.progreso.personas,
        municipiosCreados: s.progreso.municipios, categoriasCreadas: s.progreso.categorias,
        omitidas: s.analisis.totales.analizados - s.progreso.creadas,
        errores: s.progreso.errores.length,
        mapeo: s.mapeo, opciones: s.opciones,
        montoImportado: U.sumBy(aImportar, r => r.total),
        creadoEn: ahora
      });
      await Auditoria.registrar('importacion', importId, 'IMPORTAR',
        { archivo: s.archivo.name, cajas: s.progreso.creadas });

      s.progreso.enCurso = false;
      Analitica.invalidar();
      Bus.emit('import:finalizado', { importId });
      Shell.refrescarConteos();
      this.render($('#vista'));
      Toast.ok('Importación completada: ' + s.progreso.creadas + ' cajas creadas.');
    } catch (e) {
      s.progreso.enCurso = false;
      manejarError(e);
      this.render($('#vista'));
    }
  },

  pintarProgreso() {
    const s = this.st, p = s.progreso;
    const el = $('#impProgreso');
    if (!el || !p) return;
    const pct = p.total ? (p.hechos / p.total * 100) : 0;
    el.innerHTML = '<div class="progress"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="fs12 txt-2 mt8">' + p.hechos + ' de ' + p.total + ' · ' + p.creadas + ' cajas creadas</div>';
  },

  paso5(el) {
    const s = this.st, p = s.progreso ||
      { total: 0, hechos: 0, creadas: 0, personas: 0, municipios: 0, categorias: 0, errores: [] };
    if (p.enCurso) {
      el.innerHTML = '<div class="card"><div class="card-b" style="text-align:center;padding:40px">' +
        '<span class="spin" style="width:26px;height:26px;border-width:3px"></span>' +
        '<h3 class="mt16">Importando…</h3>' +
        '<p class="txt-3 fs12 mt8">No cierre esta ventana.</p>' +
        '<div id="impProgreso" style="max-width:420px;margin:20px auto 0"></div></div></div>';
      this.pintarProgreso();
      return;
    }
    el.innerHTML =
      '<div class="alert a-ok mb16">' + Icon('check') +
      '<div><b>Importación finalizada.</b> Los datos originales se conservaron íntegros en cada registro.</div></div>' +
      '<div class="grid g5 mb16">' +
      Comp.kpi({ label: 'Cajas creadas', valor: String(p.creadas), color: 'var(--ok-500)', icono: 'caja' }) +
      Comp.kpi({ label: 'Personas creadas', valor: String(p.personas), color: 'var(--brand-500)', icono: 'personas' }) +
      Comp.kpi({ label: 'Municipios creados', valor: String(p.municipios), color: '#6d4aca', icono: 'pin' }) +
      Comp.kpi({ label: 'Categorías creadas', valor: String(p.categorias || 0), color: '#8a6d3b', icono: 'tag' }) +
      Comp.kpi({ label: 'Errores', valor: String(p.errores.length), color: 'var(--dang-500)', icono: 'warn' }) +
      '</div>' +
      (p.errores.length ? '<div class="card mb16"><div class="card-h"><h3>Filas no importadas</h3></div>' +
        '<div class="card-b flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fila</th><th>Motivo</th></tr></thead>' +
        '<tbody>' + p.errores.map(e => '<tr><td class="mono">' + e.fila + '</td><td>' + esc(e.mensaje) + '</td></tr>').join('') +
        '</tbody></table></div></div></div>' : '') +
      '<div class="flex g8">' +
      '<button class="btn btn-primary" data-ir="dashboard">' + Icon('dashboard', '', 14) + 'Ver dashboard</button>' +
      '<button class="btn" data-ir="cajas">' + Icon('caja', '', 14) + 'Ver cajas importadas</button>' +
      '<button class="btn" data-act="reiniciar">' + Icon('refresh', '', 14) + 'Importar otro archivo</button>' +
      '</div>';
  },

  async modalHistorial() {
    const lista = (await db.getAll('importaciones')).sort(U.by('creadoEn', 'desc'));
    Modal.abrir({
      titulo: 'Importaciones realizadas', ancho: 'wide',
      cuerpo: lista.length
        ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Archivo</th><th>Hoja</th>' +
          '<th class="num">Analizadas</th><th class="num">Creadas</th><th class="num">Personas</th>' +
          '<th class="num">Monto</th><th class="num">Errores</th></tr></thead><tbody>' +
          lista.map(i => '<tr><td class="nowrap">' + Fecha.stamp(i.creadoEn) + '</td>' +
            '<td>' + esc(i.archivo) + '</td><td>' + esc(i.hoja) + '</td>' +
            '<td class="num">' + i.filasAnalizadas + '</td><td class="num"><b>' + i.cajasCreadas + '</b></td>' +
            '<td class="num">' + i.personasCreadas + '</td>' +
            '<td class="num">' + Money.format(i.montoImportado || 0) + '</td>' +
            '<td class="num">' + (i.errores || 0) + '</td></tr>').join('') +
          '</tbody></table></div>'
        : '<div class="empty">' + Icon('upload') + '<h4>Sin importaciones</h4><p>Todavía no se ha importado ningún archivo.</p></div>'
    });
  }
};


/* ==========================================================================
   §13  RESPALDO, RESTAURACIÓN Y MIGRACIÓN  (§42, §47)
   --------------------------------------------------------------------------
   Formato .dacm = un ZIP con:
     manifiesto.json   metadatos, contadores y versión de esquema
     datos.json        todas las colecciones (sin binarios)
     documentos/…      los archivos reales, con su nombre = id del documento
   Es autodescriptivo: cualquier persona puede abrirlo con un descompresor y
   leer el JSON. No depende de esta aplicación para ser interpretado.
   ========================================================================== */
const Respaldo = {
  EXT: 'dacm',

  async crear(opts) {
    const o = opts || {};
    const cfg = ConfigRepo.get() || {};
    /* Trece lecturas completas, una detrás de otra, son trece esperas de red
       encadenadas. No dependen entre sí: se piden a la vez. */
    const datos = {};
    for (const [col, filas] of await Promise.all(
          COLECCIONES_DATOS.map(async col => [col, await db.getAll(col)]))) datos[col] = filas;

    const archivos = [];
    let bytesDocs = 0;
    if (o.incluirDocumentos !== false) {
      for (const doc of datos.documentos) {
        const blob = await DocumentoService.blob(doc.id);
        if (!blob) continue;
        const ext = doc.extension || U.extension(doc.nombreArchivo) || 'bin';
        archivos.push({ nombre: 'documentos/' + doc.id + '.' + ext, datos: blob, comprimir: !/^(jpg|jpeg|png|pdf|zip|webp)$/i.test(ext) });
        bytesDocs += blob.size;
      }
    }
    const manifiesto = {
      aplicacion: APP.nombre, version: APP.version, esquema: APP.esquema,
      generadoEn: Fecha.ahora(),
      empresa: cfg.empresa, contratos: ContratoRepo.todos().map(c => c.nombre),
      incluyeDocumentos: o.incluirDocumentos !== false,
      bytesDocumentos: bytesDocs,
      contadores: Object.fromEntries(COLECCIONES_DATOS.map(c => [c, datos[c].length])),
      totales: {
        gastoOperativo: U.sumBy(datos.cajas.filter(c => c.estado !== EstadoCaja.ANULADA), c => c.total),
        repuesto: U.sumBy(datos.aplicaciones, a => a.monto)
      },
      nota: 'Respaldo de ' + APP.nombre + '. Los importes están en CENTAVOS (enteros). ' +
            'Los identificadores son ULID con prefijo y son estables entre sistemas.'
    };
    archivos.unshift({ nombre: 'manifiesto.json', datos: JSON.stringify(manifiesto, null, 2) });
    archivos.splice(1, 0, { nombre: 'datos.json', datos: JSON.stringify(datos) });
    archivos.push({ nombre: 'LEEME.txt', datos:
      'RESPALDO · ' + APP.nombre + '\r\n' +
      '================================================\r\n' +
      'Generado: ' + Fecha.stamp(manifiesto.generadoEn) + '\r\n' +
      'Empresa: ' + (cfg.empresa || '') + '\r\n' +
      'Contratos: ' + ContratoRepo.todos().map(c => c.nombre).join(', ') + '\r\n\r\n' +
      'Este archivo es un ZIP estándar. Contiene:\r\n' +
      '  manifiesto.json  metadatos y contadores\r\n' +
      '  datos.json       todas las tablas del sistema\r\n' +
      '  documentos/      los soportes originales (PDF, imágenes, etc.)\r\n\r\n' +
      'Para restaurar: abra el sistema y use Copias de seguridad → Restaurar.\r\n' +
      'IMPORTANTE: los valores monetarios están expresados en CENTAVOS enteros\r\n' +
      '(300000000 = $ 3.000.000) para garantizar exactitud financiera.\r\n' });

    const blob = await Zip.escribir(archivos);
    return { blob, manifiesto };
  },

  async descargar(opts) {
    Toast.ok('Generando respaldo…');
    const { blob, manifiesto } = await this.crear(opts);
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
      '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    U.descargar(blob, 'respaldo-caja-menor-' + stamp + '.' + this.EXT);
    await Auditoria.registrar('sistema', 'respaldo', 'CREAR_RESPALDO', manifiesto.contadores);
    Toast.ok('Respaldo generado (' + Txt.bytes(blob.size) + ').');
    return manifiesto;
  },

  async leer(file) {
    const zip = await Zip.leer(await file.arrayBuffer());
    if (!zip.tiene('datos.json'))
      throw new ErrorDominio('El archivo no es un respaldo válido (falta datos.json).', 'RESPALDO_INVALIDO');
    const manifiesto = zip.tiene('manifiesto.json') ? JSON.parse(await zip.texto('manifiesto.json')) : {};
    const datos = JSON.parse(await zip.texto('datos.json'));
    return { zip, manifiesto, datos };
  },

  /** modo: 'reemplazar' | 'combinar' */
  async restaurar(file, modo, alProgreso) {
    const { zip, manifiesto, datos } = await this.leer(file);
    const prog = alProgreso || (() => {});

    if (modo === 'reemplazar') {
      prog('Vaciando la base de datos…', 5);
      for (const col of COLECCIONES) await db.clear(col);
    }
    let n = 0;
    const totalCols = COLECCIONES_DATOS.length;
    for (const col of COLECCIONES_DATOS) {
      const lista = datos[col] || [];
      prog('Restaurando ' + col + ' (' + lista.length + ')…', 5 + (n / totalCols) * 60);
      if (lista.length) await db.putMany(col, lista);
      n++;
    }
    // documentos binarios
    const docs = datos.documentos || [];
    let restaurados = 0;
    for (let i = 0; i < docs.length; i++) {
      const doc = docs[i];
      const ext = doc.extension || U.extension(doc.nombreArchivo) || 'bin';
      const ruta = 'documentos/' + doc.id + '.' + ext;
      if (!zip.tiene(ruta)) continue;
      const blob = await zip.blob(ruta, doc.mime);
      if (blob) {
        await db.put('archivos', { docId: doc.id, blob, mime: doc.mime, nombre: doc.nombreArchivo, tamano: blob.size });
        restaurados++;
      }
      if (i % 10 === 0) prog('Restaurando documentos (' + i + '/' + docs.length + ')…', 65 + (i / Math.max(1, docs.length)) * 30);
    }
    prog('Reconstruyendo consecutivos…', 96);
    await this.reconstruirSecuencias();
    await Cache.cargar();
    Analitica.invalidar();
    Bus.emit('datos:reemplazados', null);
    await Auditoria.registrar('sistema', 'respaldo', 'RESTAURAR', { modo, archivo: file.name, documentos: restaurados });
    prog('Listo', 100);
    return { manifiesto, contadores: Object.fromEntries(COLECCIONES_DATOS.map(c => [c, (datos[c] || []).length])), documentos: restaurados };
  },

  /** tras restaurar o importar, el contador debe quedar por encima del máximo existente */
  async reconstruirSecuencias() {
    const cajas = await db.getAll('cajas');
    const cons = await db.getAll('consignaciones');
    const max = {};
    /* la clave lleva el contrato: cada contrato reanuda su propia numeración */
    const anota = (contratoId, tipo, numero) => {
      const m = String(numero || '').match(/^(.+)-(\d{4})-(\d+)$/);
      if (!m) return;
      const k = tipo === 'caja' ? Secuencia.claveCaja(contratoId || 'sin', m[1], m[2])
                                : Secuencia.claveConsignacion(contratoId || 'sin', m[1], m[2]);
      max[k] = Math.max(max[k] || 0, Number(m[3]));
    };
    for (const c of cajas) anota(c.contratoId, 'caja', c.numero);
    for (const c of cons) anota(c.contratoId, 'con', c.numero);
    for (const [k, v] of Object.entries(max)) await Secuencia.asegurarMinimo(k, v);
  },

  /** verificación de integridad referencial (§43) */
  async verificarIntegridad() {
    const problemas = [];
    const [cajas, detalles, apls, cons, docs, personas] = await Promise.all([
      db.getAll('cajas'), db.getAll('detalles'), db.getAll('aplicaciones'),
      db.getAll('consignaciones'), db.getAll('documentos'), db.getAll('personas')
    ]);
    const idsCajas = new Set(cajas.map(c => c.id));
    const idsCons = new Set(cons.map(c => c.id));
    const idsPers = new Set(personas.map(p => p.id));

    for (const d of detalles) if (!idsCajas.has(d.cajaId))
      problemas.push({ tipo: 'Detalle huérfano', detalle: 'El detalle ' + d.id + ' apunta a una caja inexistente.' });
    for (const a of apls) {
      if (!idsCajas.has(a.cajaId)) problemas.push({ tipo: 'Aplicación huérfana', detalle: 'Aplicación ' + a.id + ' → caja inexistente.' });
      if (!idsCons.has(a.consignacionId)) problemas.push({ tipo: 'Aplicación huérfana', detalle: 'Aplicación ' + a.id + ' → consignación inexistente.' });
    }
    for (const c of cajas) {
      if (!c.numero) problemas.push({ tipo: 'Caja sin número', detalle: c.id });
      if (c.solicitanteId && !idsPers.has(c.solicitanteId))
        problemas.push({ tipo: 'Referencia rota', detalle: 'La caja ' + c.numero + ' apunta a una persona inexistente.' });
      const ds = detalles.filter(x => x.cajaId === c.id);
      const calc = Finanzas.calcular(ds, c.retencion);
      if (calc.total !== c.total)
        problemas.push({ tipo: 'Total inconsistente', detalle: 'Caja ' + c.numero + ': almacenado ' + Money.format(c.total) +
          ' vs. suma de detalles ' + Money.format(calc.total) + '.', cajaId: c.id });
      if (!ds.length && c.estado !== EstadoCaja.ANULADA)
        problemas.push({ tipo: 'Caja sin detalles', detalle: 'Caja ' + c.numero, cajaId: c.id });
      const rep = U.sumBy(apls.filter(a => a.cajaId === c.id), a => a.monto);
      if (rep > c.total)
        problemas.push({ tipo: 'Sobre-reposición', detalle: 'Caja ' + c.numero + ': repuesto ' + Money.format(rep) +
          ' supera el total ' + Money.format(c.total) + '.', cajaId: c.id });
    }
    const idsCtr = new Set((await db.getAll('contratos')).map(x => x.id));
    for (const c of cajas) {
      if (!c.contratoId) problemas.push({ tipo: 'Caja sin contrato', detalle: c.numero, cajaId: c.id });
      else if (!idsCtr.has(c.contratoId))
        problemas.push({ tipo: 'Contrato inexistente', detalle: 'La caja ' + c.numero + ' apunta a un contrato que no existe.', cajaId: c.id });
    }
    for (const ap of apls) {
      const cj = cajas.find(x => x.id === ap.cajaId);
      const cn = cons.find(x => x.id === ap.consignacionId);
      if (cj && cn && cj.contratoId && cn.contratoId && cj.contratoId !== cn.contratoId)
        problemas.push({ tipo: 'Dinero cruzado entre contratos',
          detalle: 'La consignación ' + cn.numero + ' repone la caja ' + cj.numero + ', que es de otro contrato.', cajaId: cj.id });
    }
    const nums = new Map();
    for (const c of cajas) {
      if (nums.has(c.numero)) problemas.push({ tipo: 'Número duplicado', detalle: c.numero });
      nums.set(c.numero, c.id);
    }
    for (const d of docs) {
      if (d.cajaId && !idsCajas.has(d.cajaId)) problemas.push({ tipo: 'Documento huérfano', detalle: d.nombre });
      if (d.consignacionId && !idsCons.has(d.consignacionId)) problemas.push({ tipo: 'Documento huérfano', detalle: d.nombre });
    }
    return problemas;
  },

  async repararTotales() {
    const cajas = await db.getAll('cajas');
    const detalles = await db.getAll('detalles');
    const porCaja = U.groupBy(detalles, 'cajaId');
    let n = 0;
    const cambios = [];
    for (const c of cajas) {
      const ds = porCaja.get(c.id) || [];
      const calc = Finanzas.calcular(ds, c.retencion);
      if (calc.total !== c.total || calc.subtotal !== c.subtotal || calc.gasolina !== c.gasolina || calc.aceite !== c.aceite) {
        cambios.push(Object.assign({}, c, {
          subtotal: calc.subtotal, total: calc.total, gasolina: calc.gasolina, aceite: calc.aceite,
          totalDetalles: ds.length, actualizadoEn: Modelo.ahora()
        }));
        n++;
      }
    }
    if (cambios.length) await db.putMany('cajas', cambios);
    Analitica.invalidar();
    Bus.emit('cajas:cambio', null);
    return n;
  }
};

        })) return;

        Toast.ok('Información eliminada. El sistema quedó con la configuración inicial.');
        Router.ir('dashboard');
      }
    });
  }
};


/* ==========================================================================
   §13b  MIGRACIÓN A LA NUBE (Supabase)
   --------------------------------------------------------------------------
   Genera el esquema PostgreSQL a partir del MISMO modelo que usa la base
   local, y copia los datos en ambos sentidos. Los identificadores son ULID:
   al migrar no hay que reconstruir ninguna relación.
   ========================================================================== */
const Migracion = {
  generarDDL() {
    const L = [];
    const T = x => L.push(x);
    const TABLAS = ['configuracion', 'contratos', 'municipios', 'personas', 'categorias', 'cajas',
                    'detalles', 'consignaciones', 'aplicaciones', 'documentos', 'auditoria',
                    'importaciones', 'secuencias'];

    T('-- ============================================================================');
    T('-- ' + APP.nombre + ' v' + APP.version + ' — esquema PostgreSQL / Supabase (datos v' + APP.esquema + ')');
    T('-- Generado el ' + Fecha.stamp(Fecha.ahora()));
    T('--');
    T('-- CÓMO USARLO');
    T('--   1. Supabase → SQL Editor → New query → pegue TODO esto → Run.');
    T('--   2. Authentication → Users → Add user (correo y contraseña).');
    T('--   3. Guarde la Project URL y la clave anon public (Project Settings → API).');
    T('--');
    T('-- DISEÑO');
    T('--   · Identificadores ULID con prefijo (TEXT). Las claves ya coinciden:');
    T('--     migrar NO obliga a reconstruir relaciones.');
    T('--   · El dinero es BIGINT en CENTAVOS. Nunca float.');
    T('--   · contrato_id acota cajas, detalles y consignaciones: cada contrato');
    T('--     es una unidad económica cerrada. Los catálogos se comparten.');
    T('--   · RLS activo en todo. La clave anon es pública por diseño; lo que');
    T('--     protege los datos es la sesión iniciada, no la clave.');
    T('-- ============================================================================');
    T('');
    T('create table if not exists configuracion (');
    T("  id text primary key default 'cfg_default',");
    T('  empresa text, nit text, contrato_activo_id text,');

    T('create or replace view v_caja_saldo as');
    T('select c.id, c.contrato_id, c.numero, c.fecha, c.total, c.estado,');
    T('       coalesce(sum(a.monto), 0) as repuesto,');
    T("       case when c.estado in ('ANULADA','BORRADOR','REEMBOLSADA') then 0");

    T('-- Gasto operativo y dinero repuesto son magnitudes DISTINTAS: no se suman.');

    T("       sum(c.aceite)   filter (where c.estado <> 'ANULADA') as aceite,");

    T('from cajas c group by c.contrato_id, c.mes order by c.contrato_id, c.mes;');
    T('');
    T('-- ---------------------------------------------------------------------------');
    T('-- SEGURIDAD — esto es lo que protege los datos, no la clave anon.');
    T('-- Sin sesión iniciada la API no devuelve ni acepta absolutamente nada.');
    T('-- ---------------------------------------------------------------------------');
    TABLAS.forEach(t => T('alter table ' + t + ' enable row level security;'));
    T('');
    TABLAS.forEach(t => {
      T('drop policy if exists "' + t + '_auth" on ' + t + ';');
      T('create policy "' + t + '_auth" on ' + t + ' for all to authenticated using (true) with check (true);');
    });
    T('');
    T('-- ---------------------------------------------------------------------------');
    T('-- SOPORTES: bucket PRIVADO (facturas, fotos, comprobantes)');
    T('-- ---------------------------------------------------------------------------');
    T("insert into storage.buckets (id, name, public) values ('soportes', 'soportes', false)");
    T('  on conflict (id) do nothing;');
    T('');
    T('drop policy if exists "soportes_auth" on storage.objects;');
    T('create policy "soportes_auth" on storage.objects for all to authenticated');
    T("  using (bucket_id = 'soportes') with check (bucket_id = 'soportes');");
    T('');
    T('-- Listo. Ahora cree el usuario en Authentication → Users → Add user.');
    return L.join('\n');
  },

  async exportarJson() {
    /* Trece lecturas completas, una detrás de otra, son trece esperas de red
       encadenadas. No dependen entre sí: se piden a la vez. */
    const datos = {};
    for (const [col, filas] of await Promise.all(
          COLECCIONES_DATOS.map(async col => [col, await db.getAll(col)]))) datos[col] = filas;
    const paquete = {
      _meta: {
        aplicacion: APP.nombre, version: APP.version, esquema: APP.esquema,
        generadoEn: Fecha.ahora(),
        nota: 'Importes en CENTAVOS (BIGINT). Identificadores ULID con prefijo, listos para TEXT PRIMARY KEY.',
        ordenDeCarga: Migracion.ORDEN_SUBIDA
      },
      datos
    };
    U.descargar(new Blob([JSON.stringify(paquete, null, 1)], { type: 'application/json' }),
      Exportar.nombreArchivo('datos-migracion', 'json'));
    Toast.ok('Datos exportados en JSON para migración.');
  },

  /** orden que respeta las claves foráneas */
  ORDEN_SUBIDA: ['configuracion', 'contratos', 'municipios', 'personas', 'categorias', 'cajas',
                 'detalles', 'consignaciones', 'aplicaciones', 'documentos', 'importaciones',
                 'auditoria', 'secuencias'],

  /**
   * Copia la base local a Supabase. Es idempotente: todo va como upsert por
   * id, así que repetirla no duplica nada y sirve para reintentar si se corta.
   */
  async subirANube(alProgreso) {
    const prog = alProgreso || (() => {});
    const destino = new SupabaseAdapter();
    await destino.init();
    const resumen = { tablas: {}, documentos: 0, errores: [] };
    const total = this.ORDEN_SUBIDA.length;
    let i = 0;
    for (const col of this.ORDEN_SUBIDA) {
      const filas = await db.getAll(col);
      prog('Subiendo ' + col + ' (' + filas.length + ')…', (i / total) * 85);
      if (filas.length) {
        try { await destino.putMany(col, filas); resumen.tablas[col] = filas.length; }
        catch (e) { resumen.errores.push(col + ': ' + e.message); }
      } else resumen.tablas[col] = 0;
      i++;
    }
    const docs = await db.getAll('documentos');
    for (let k = 0; k < docs.length; k++) {
      prog('Subiendo soportes (' + (k + 1) + '/' + docs.length + ')…', 85 + (k / Math.max(1, docs.length)) * 14);
      const arch = await db.get('archivos', docs[k].id);
      if (!arch || !arch.blob) continue;
      try { await destino.put('archivos', { docId: docs[k].id, blob: arch.blob, mime: docs[k].mime }); resumen.documentos++; }
      catch (e) { resumen.errores.push('documento ' + docs[k].nombre + ': ' + e.message); }
    }
    prog('Listo', 100);
    return resumen;
  },

  /** Trae la base de la nube al equipo (copia local de seguridad) */
  async bajarDeNube(alProgreso) {
    const prog = alProgreso || (() => {});
    const origen = new SupabaseAdapter();
    await origen.init();
    const resumen = { tablas: {} };
    const total = this.ORDEN_SUBIDA.length;
    let i = 0;
    for (const col of this.ORDEN_SUBIDA) {
      prog('Descargando ' + col + '…', (i / total) * 90);
      const filas = await origen.getAll(col);
      if (filas.length) await db.putMany(col, filas);
      resumen.tablas[col] = filas.length;
      i++;
    }
    await Cache.cargar();
    Analitica.invalidar();
    Bus.emit('datos:reemplazados', null);
    prog('Listo', 100);
    return resumen;
  }
};
