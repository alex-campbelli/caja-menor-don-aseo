/* ==========================================================================
   §3  ADAPTADOR: IndexedDB
   --------------------------------------------------------------------------
   Elegido porque:
     · guarda Blobs nativos (sin inflar 33% como base64)  → documentos
     · soporta índices y cursores                          → 5.000+ cajas
     · transacciones ACID por store                        → integridad
     · cuota de cientos de MB (vs 5 MB de localStorage)
   Los binarios viven en la colección `archivos`, SEPARADA de `documentos`,
   para que listar un expediente nunca cargue los bytes.
   ========================================================================== */
const ESQUEMA_IDB = {
  configuracion:  { keyPath: 'id', indices: [] },
  secuencias:     { keyPath: 'id', indices: [] },
  /* Cada contrato es una unidad económica independiente: sus cajas,
     consignaciones, saldos, consecutivos y estadísticas no se mezclan.
     Los catálogos (personas, municipios, categorías) sí se comparten,
     porque un mismo líder o municipio puede intervenir en varios contratos. */
  contratos:      { keyPath: 'id', indices: [ ['nombreNorm', 'nombreNorm'], ['estado', 'estado'] ] },
  personas:       { keyPath: 'id', indices: [
                      ['estado', 'estado'], ['nombreNorm', 'nombreNorm'], ['cedula', 'cedula'],
                      ['municipioId', 'municipioId'], ['esFinanciador', 'esFinanciador'] ] },
  municipios:     { keyPath: 'id', indices: [ ['nombreNorm', 'nombreNorm'], ['estado', 'estado'] ] },
  categorias:     { keyPath: 'id', indices: [ ['nombreNorm', 'nombreNorm'], ['estado', 'estado'], ['rol', 'rol'] ] },
  cajas:          { keyPath: 'id', indices: [
                      ['numero', 'numero', { unique: true }], ['fecha', 'fecha'], ['estado', 'estado'],
                      ['contratoId', 'contratoId'],
                      ['solicitanteId', 'solicitanteId'], ['consignoId', 'consignoId'],
                      ['municipioId', 'municipioId'], ['mes', 'mes'], ['anio', 'anio'],
                      ['origen', 'origen'], ['creadoEn', 'creadoEn'] ] },
  detalles:       { keyPath: 'id', indices: [
                      ['cajaId', 'cajaId'], ['contratoId', 'contratoId'], ['categoriaId', 'categoriaId'], ['rol', 'rol'],
                      ['fecha', 'fecha'], ['personaId', 'personaId'], ['municipioId', 'municipioId'],
                      ['mes', 'mes'] ] },
  consignaciones: { keyPath: 'id', indices: [
                      ['numero', 'numero', { unique: true }], ['fecha', 'fecha'], ['contratoId', 'contratoId'],
                      ['beneficiarioId', 'beneficiarioId'], ['estado', 'estado'], ['mes', 'mes'] ] },
  aplicaciones:   { keyPath: 'id', indices: [ ['consignacionId', 'consignacionId'], ['cajaId', 'cajaId'] ] },
  documentos:     { keyPath: 'id', indices: [
                      ['cajaId', 'cajaId'], ['consignacionId', 'consignacionId'],
                      ['tipo', 'tipo'], ['creadoEn', 'creadoEn'] ] },
  archivos:       { keyPath: 'docId', indices: [] },
  auditoria:      { keyPath: 'id', indices: [ ['entidadId', 'entidadId'], ['entidad', 'entidad'], ['ts', 'ts'] ] },
  importaciones:  { keyPath: 'id', indices: [ ['creadoEn', 'creadoEn'] ] }
};
const COLECCIONES = Object.keys(ESQUEMA_IDB);
/** colecciones que forman parte del respaldo de datos (los binarios van aparte) */
const COLECCIONES_DATOS = COLECCIONES.filter(c => c !== 'archivos');

class IndexedDBAdapter extends StorageAdapter {
  constructor(nombre, version) {
    super();
    this.nombre = nombre || APP.dbName;
    this.version = version || APP.dbVersion;
    this.db = null;
  }

  init() {
    if (this.db) return Promise.resolve(this);
    return new Promise((resolve, reject) => {
      if (!globalThis.indexedDB) {
        reject(new ErrorDominio('Este navegador no soporta IndexedDB. Use Chrome, Edge o Firefox actualizado.', 'SIN_IDB'));
        return;
      }
      const req = indexedDB.open(this.nombre, this.version);
      req.onupgradeneeded = ev => {
        const db = req.result;
        for (const [nombre, def] of Object.entries(ESQUEMA_IDB)) {
          let store;
          if (!db.objectStoreNames.contains(nombre)) store = db.createObjectStore(nombre, { keyPath: def.keyPath });
          else store = req.transaction.objectStore(nombre);
          for (const [idxNombre, campo, opts] of def.indices) {
            if (!store.indexNames.contains(idxNombre)) store.createIndex(idxNombre, campo, opts || {});
          }
        }
        Bus.emit('db:upgrade', { de: ev.oldVersion, a: ev.newVersion });
      };
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => { this.db.close(); this.db = null;
          Toast.warn('La base de datos fue actualizada en otra pestaña. Recargue la página.'); };
        resolve(this);
      };
      req.onerror = () => reject(new ErrorDominio('No se pudo abrir la base de datos: ' + (req.error && req.error.message), 'IDB_OPEN'));
      req.onblocked = () => Toast.warn('Cierre las otras pestañas de la aplicación para completar la actualización.');
    });
  }

  _tx(cols, modo) {
    if (!this.db) throw new ErrorDominio('Base de datos no inicializada', 'IDB_INIT');
    return this.db.transaction(cols, modo || 'readonly');
  }
  _wrap(req) {
    return new Promise((res, rej) => {
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error || new Error('Error IndexedDB'));
    });
  }

  async get(col, id) {
    if (!id) return null;
    return (await this._wrap(this._tx([col]).objectStore(col).get(id))) || null;
  }
  async getMany(col, ids) {
    if (!ids || !ids.length) return [];
    const st = this._tx([col]).objectStore(col);
    const out = await Promise.all(ids.map(id => this._wrap(st.get(id))));
    return out.filter(Boolean);
  }
  async getAll(col) { return (await this._wrap(this._tx([col]).objectStore(col).getAll())) || []; }

  async put(col, doc) {
    const tx = this._tx([col], 'readwrite');
    await this._wrap(tx.objectStore(col).put(doc));
    await new Promise((r, j) => { tx.oncomplete = r; tx.onerror = () => j(tx.error); tx.onabort = () => j(tx.error); });
    return doc;
  }
  async putMany(col, docs) {
    if (!docs || !docs.length) return 0;
    const tx = this._tx([col], 'readwrite');
    const st = tx.objectStore(col);
    for (const d of docs) st.put(d);
    await new Promise((r, j) => { tx.oncomplete = r; tx.onerror = () => j(tx.error); tx.onabort = () => j(tx.error); });
    return docs.length;
  }
  async remove(col, id) {
    const tx = this._tx([col], 'readwrite');
    await this._wrap(tx.objectStore(col).delete(id));
    await new Promise((r, j) => { tx.oncomplete = r; tx.onerror = () => j(tx.error); });
    return true;
  }
  async removeWhere(col, indice, valor) {
    const tx = this._tx([col], 'readwrite');
    const src = indice ? tx.objectStore(col).index(indice) : tx.objectStore(col);
    let n = 0;
    await new Promise((res, rej) => {
      const req = src.openCursor(indice ? IDBKeyRange.only(valor) : undefined);
      req.onsuccess = () => { const c = req.result; if (!c) return res();
        c.delete(); n++; c.continue(); };
      req.onerror = () => rej(req.error);
    });
    await new Promise(r => { tx.oncomplete = r; });
    return n;
  }
  async clear(col) {
    const tx = this._tx([col], 'readwrite');
    await this._wrap(tx.objectStore(col).clear());
    await new Promise(r => { tx.oncomplete = r; });
  }
  async count(col, indice, valor) {
    const st = this._tx([col]).objectStore(col);
    const src = indice ? st.index(indice) : st;
    return await this._wrap(valor === undefined ? src.count() : src.count(IDBKeyRange.only(valor)));
  }

  /**
   * query(col, {indice, valor, desde, hasta, direccion, limite, offset, filtro})
   * Usa cursores: nunca materializa la colección completa si hay límite.
   */
  async query(col, opts) {
    const o = opts || {};
    const st = this._tx([col]).objectStore(col);
    const src = o.indice ? st.index(o.indice) : st;
    let rango = null;
    if (o.valor !== undefined && o.valor !== null) rango = IDBKeyRange.only(o.valor);
    else if (o.desde !== undefined || o.hasta !== undefined) {
      if (o.desde !== undefined && o.hasta !== undefined) rango = IDBKeyRange.bound(o.desde, o.hasta);
      else if (o.desde !== undefined) rango = IDBKeyRange.lowerBound(o.desde);
      else rango = IDBKeyRange.upperBound(o.hasta);
    }
    const dir = o.direccion === 'desc' ? 'prev' : 'next';
    const limite = o.limite || Infinity;
    const offset = o.offset || 0;
    const out = []; let saltados = 0;
    await new Promise((res, rej) => {
      const req = src.openCursor(rango, dir);
      req.onsuccess = () => {
        const c = req.result;
        if (!c || out.length >= limite) return res();
        const v = c.value;
        if (!o.filtro || o.filtro(v)) {
          if (saltados < offset) saltados++;
          else out.push(v);
        }
        c.continue();
      };
      req.onerror = () => rej(req.error);
    });
    return out;
  }

  /** transacción atómica sobre varias colecciones */
  async transaccion(cols, fn) {
    const tx = this._tx(cols, 'readwrite');
    const api = {
      get:  (c, id) => this._wrap(tx.objectStore(c).get(id)),
      getAll: c => this._wrap(tx.objectStore(c).getAll()),
      put:  (c, d) => { tx.objectStore(c).put(d); return d; },
      remove: (c, id) => { tx.objectStore(c).delete(id); },
      porIndice: (c, idx, val) => this._wrap(tx.objectStore(c).index(idx).getAll(IDBKeyRange.only(val))),
      abortar: () => tx.abort()
    };
    let resultado;
    try { resultado = await fn(api); }
    catch (e) { try { tx.abort(); } catch (_) {} throw e; }
    await new Promise((res, rej) => {
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new ErrorDominio('Transacción fallida', 'TX'));
      tx.onabort = () => rej(tx.error || new ErrorDominio('Transacción abortada', 'TX_ABORT'));
    });
    return resultado;
  }

  async estadisticasAlmacen() {
    const colecciones = {};
    for (const c of COLECCIONES) { try { colecciones[c] = await this.count(c); } catch { colecciones[c] = 0; } }
    let cuota = null;
    if (navigator.storage && navigator.storage.estimate) {
      try { cuota = await navigator.storage.estimate(); } catch {}
    }
    return { colecciones, cuota };
  }

  async exportarTodo() {
    const datos = {};
    for (const c of COLECCIONES_DATOS) datos[c] = await this.getAll(c);
    return datos;
  }
}

/* ==========================================================================
   §4  ESQUEMA DE DOMINIO — enums, fábricas y validadores
   ========================================================================== */
/* Tres pasos, que son los que ocurren de verdad:
     PENDIENTE   → la caja está lista, pero todavía nadie ha consignado.
     CONSIGNADA  → ya giraron el dinero; falta devolvérselo a quien lo puso.
     REEMBOLSADA → a quien consignó ya le devolvieron su dinero.
   Se conservan BORRADOR (aún se está armando) y ANULADA (se dejó sin efecto y
   conserva su número, §): no son pasos del recorrido sino situaciones aparte. */
const EstadoCaja = Object.freeze({
  BORRADOR: 'BORRADOR',
  PENDIENTE: 'PENDIENTE',
  CONSIGNADA: 'CONSIGNADA',
  REEMBOLSADA: 'REEMBOLSADA',
  ANULADA: 'ANULADA'
});
const ESTADO_CAJA_META = {
  BORRADOR:    { label: 'Borrador',    pill: 'p-gray',  orden: 1,
                 ayuda: 'Todavía se está armando.' },
  PENDIENTE:   { label: 'Pendiente',   pill: 'p-amber', orden: 2,
                 ayuda: 'La caja está lista, pero todavía no le han consignado.' },
  CONSIGNADA:  { label: 'Consignada',  pill: 'p-blue',  orden: 3,
                 ayuda: 'Ya giraron el dinero. Falta reembolsárselo a quien consignó.' },
  REEMBOLSADA: { label: 'Reembolsada', pill: 'p-green', orden: 4,
                 ayuda: 'A quien consignó ya le devolvieron su dinero.' },
  ANULADA:     { label: 'Anulada',     pill: 'p-red',   orden: 5,
                 ayuda: 'Se dejó sin efecto. Conserva su número y su histórico.' }
};
/** Estados que representan dinero realmente comprometido (entran en el gasto) */
const ESTADOS_VIVOS = [EstadoCaja.BORRADOR, EstadoCaja.PENDIENTE,
                       EstadoCaja.CONSIGNADA, EstadoCaja.REEMBOLSADA];
/** Estados que pueden recibir reposición */
const ESTADOS_REPONIBLES = [EstadoCaja.PENDIENTE, EstadoCaja.CONSIGNADA, EstadoCaja.REEMBOLSADA];
/** Alguien puso el dinero y todavía no se le ha devuelto: es lo que se le debe */
const ESTADOS_POR_REEMBOLSAR = [EstadoCaja.CONSIGNADA];
/** Cajas que aún no están cerradas: se resaltan en el listado */
const ESTADOS_ABIERTOS = [EstadoCaja.PENDIENTE, EstadoCaja.CONSIGNADA];

/** Estados de antes del cambio → estado equivalente de ahora */
const ESTADOS_ANTIGUOS = {
  PENDIENTE_PAGO: EstadoCaja.PENDIENTE,
  PAGADA: EstadoCaja.CONSIGNADA,
  PENDIENTE_REPOSICION: EstadoCaja.CONSIGNADA,
  REPUESTA: EstadoCaja.REEMBOLSADA
};

const Estado = Object.freeze({ ACTIVO: 'ACTIVO', INACTIVO: 'INACTIVO' });
const Origen = Object.freeze({ MANUAL: 'MANUAL', IMPORT: 'IMPORT', SISTEMA: 'SISTEMA' });
const ORIGEN_META = { MANUAL: { label: 'Manual', pill: 'p-gray' }, IMPORT: { label: 'Importado', pill: 'p-amber' },
                      SISTEMA: { label: 'Sistema', pill: 'p-blue' } };

const TipoDocumento = Object.freeze({
  FORMATO_CAJA: 'FORMATO_CAJA',
  COMPROBANTE_CONSIGNACION: 'COMPROBANTE_CONSIGNACION',
  SOPORTE_COMPRA: 'SOPORTE_COMPRA',
  FACTURA: 'FACTURA',
  RECIBO: 'RECIBO',
  FORMATO_COMPRAS: 'FORMATO_COMPRAS',
  OTRO: 'OTRO'
});
const TIPO_DOC_META = {
  FORMATO_CAJA:             { label: 'Formato de caja menor', icono: 'doc',    color: 'p-blue' },
  COMPROBANTE_CONSIGNACION: { label: 'Comprobante de consignación', icono: 'banco', color: 'p-green' },
  SOPORTE_COMPRA:           { label: 'Soporte de compra',     icono: 'file',   color: 'p-amber' },
  FACTURA:                  { label: 'Factura',               icono: 'file',   color: 'p-violet' },
  RECIBO:                   { label: 'Recibo',                icono: 'file',   color: 'p-gray' },
  FORMATO_COMPRAS:          { label: 'Formato de compras',    icono: 'doc',    color: 'p-blue' },
  OTRO:                     { label: 'Otro',                  icono: 'folder', color: 'p-gray' }
};

/** Roles estadísticos: gasolina y aceite vienen de fábrica, el resto los crea el usuario */
const RolEstadistico = Object.freeze({ GASOLINA: 'GASOLINA', ACEITE: 'ACEITE' });

const TIPOS_CUENTA = ['Ahorros', 'Corriente', 'Nequi', 'Daviplata', 'Otro', 'No disponible'];
/** No todos los trabajadores tienen cédula: algunos presentan pasaporte */
const TIPOS_DOCUMENTO = ['Cédula', 'Cédula de extranjería', 'Pasaporte', 'PEP', 'NIT'];
const VALOR_NO_DISPONIBLE = 'No disponible';
const VALOR_NO_APLICA = 'No aplica';

/* --- Fábricas: garantizan que ninguna entidad nazca sin id ni marcas ------ */
const Modelo = {
  ahora: () => Fecha.ahora(),

  /**
   * Configuración de EMPRESA. Es única y se comparte por todos los contratos:
   * razón social, NIT, logotipo, textos legales del documento.
   * Lo que cambia de un contrato a otro vive en `Modelo.contrato`.
   */
  configuracion(p) {
    p = p || {};
    return {
      id: 'cfg_default',
      empresa: p.empresa || 'DON ASEO LTDA.',
      nit: p.nit || '',
      /** contrato sobre el que se está trabajando ahora mismo */
      contratoActivoId: p.contratoActivoId || null,
      /* --- campos heredados de la v1: se migran a `contratos` y se conservan
             sólo para poder reconstruir instalaciones antiguas --- */
      contratoNombre: p.contratoNombre || '',
      contratoNumero: p.contratoNumero || '',
      fechaInicio: p.fechaInicio || '',
      fechaFin: p.fechaFin || '',
      direccion: p.direccion || '',
      telefono: p.telefono || '',
      correo: p.correo || '',
      ciudad: p.ciudad || '',
      /* logoDataUrl: logotipo completo para el documento impreso.
         marcaDataUrl: versión cuadrada para la interfaz (barra lateral, icono).
         logoPropio=1 cuando el usuario cargó o quitó una imagen a propósito:
         a partir de ahí el sistema deja de instalar el logotipo de fábrica. */
      logoDataUrl: p.logoDataUrl || '',
      marcaDataUrl: p.marcaDataUrl || '',
      logoPropio: p.logoPropio ? 1 : 0,
      logoSemilla: p.logoSemilla || 0,
      responsable: p.responsable || '',
      cargoResponsable: p.cargoResponsable || '',
      estado: p.estado || 'VIGENTE',
      tituloDocumento: p.tituloDocumento ||
        'DOCUMENTO SOPORTE DE COSTOS Y GASTOS EN OPERACIONES CON NO OBLIGADOS A EXPEDIR FACTURA O DOCUMENTO EQUIVALENTE',
      referenciaNormativa: p.referenciaNormativa ||
        'Artículo 1.6.1.4.12 del Decreto 1625 de 2016 · Resolución DIAN 000167 de 2021 · Documento soporte en adquisiciones con no obligados a facturar',
      /* Persona propuesta por defecto en «Consignó». Editable; nunca fija en el código. */
      financiadorPorDefectoId: p.financiadorPorDefectoId || null,
      prefijoCaja: p.prefijoCaja || 'CM',
      prefijoConsignacion: p.prefijoConsignacion || 'CON',
      infoAdicional: p.infoAdicional || '',
      esquemaVersion: APP.esquema,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  /**
   * CONTRATO — unidad económica independiente.
   * Cada uno lleva su propia numeración, sus propias cajas, consignaciones,
   * saldos y estadísticas. Nada se mezcla entre contratos.
   */
  contrato(p) {
    p = p || {};
    const nombre = String(p.nombre || '').trim();
    return {
      id: p.id || ID.contrato(),
      nombre,
      nombreNorm: Txt.norm(nombre),
      numero: String(p.numero || '').trim(),
      cliente: String(p.cliente || '').trim(),
      fechaInicio: p.fechaInicio || '',
      fechaFin: p.fechaFin || '',
      estado: p.estado || 'VIGENTE',
      /** consecutivos propios: dos contratos nunca comparten numeración */
      prefijoCaja: p.prefijoCaja || 'CM',
      prefijoConsignacion: p.prefijoConsignacion || 'CON',
      financiadorPorDefectoId: p.financiadorPorDefectoId || null,
      color: p.color || '',
      observaciones: p.observaciones || '',
      infoAdicional: p.infoAdicional || '',
      origen: p.origen || Origen.MANUAL,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  persona(p) {
    p = p || {};
    const nombre = String(p.nombre || '').trim();
    return {
      id: p.id || ID.persona(),
      nombre,
      nombreNorm: Txt.norm(nombre),
      /* El número va en `cedula` desde el primer día; renombrarlo rompería el
         histórico. Lo que se añade es de QUÉ documento es ese número. */
      tipoDocumento: p.tipoDocumento || TIPOS_DOCUMENTO[0],
      cedula: String(p.cedula || '').trim(),
      banco: String(p.banco || '').trim(),
      tipoCuenta: p.tipoCuenta || '',
      numeroCuenta: String(p.numeroCuenta || '').trim(),
      municipioId: p.municipioId || null,
      cargo: String(p.cargo || '').trim(),
      telefono: String(p.telefono || '').trim(),
      correo: String(p.correo || '').trim(),
      observaciones: p.observaciones || '',
      esFinanciador: p.esFinanciador ? 1 : 0,   // 1/0: IndexedDB no indexa booleanos
      esSolicitante: p.esSolicitante === undefined ? 1 : (p.esSolicitante ? 1 : 0),
      estado: p.estado || Estado.ACTIVO,
      origen: p.origen || Origen.MANUAL,
      legacy: p.legacy || null,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  municipio(p) {
    p = p || {};
    const nombre = String(p.nombre || '').trim();
    return {
      id: p.id || ID.municipio(),
      nombre,
      nombreNorm: Txt.norm(nombre),
      departamento: p.departamento || 'Antioquia',
      estado: p.estado || Estado.ACTIVO,
      esNoAplica: p.esNoAplica ? 1 : 0,
      origen: p.origen || Origen.MANUAL,
      legacy: p.legacy || null,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  categoria(p) {
    p = p || {};
    const nombre = String(p.nombre || '').trim();
    return {
      id: p.id || ID.categoria(),
      nombre,
      nombreNorm: Txt.norm(nombre),
      /** rol estadístico especial: GASOLINA | ACEITE | <clave libre> | null */
      rol: p.rol || null,
      /** si true, aparece como serie propia en las estadísticas (§12) */
      estadistica: p.estadistica ? 1 : 0,
      color: p.color || '',
      descripcion: p.descripcion || '',
      orden: p.orden === undefined ? 100 : p.orden,
      estado: p.estado || Estado.ACTIVO,
      sistema: p.sistema ? 1 : 0,       // no se puede eliminar (gasolina/aceite)
      origen: p.origen || Origen.MANUAL,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  /** Snapshot inmutable de una persona dentro de una operación (§63) */
  snapshotPersona(persona, municipio) {
    if (!persona) return null;
    return {
      personaId: persona.id,
      nombre: persona.nombre,
      tipoDocumento: persona.tipoDocumento || TIPOS_DOCUMENTO[0],
      cedula: persona.cedula || '',
      banco: persona.banco || '',
      tipoCuenta: persona.tipoCuenta || '',
      numeroCuenta: persona.numeroCuenta || '',
      cargo: persona.cargo || '',
      municipioId: persona.municipioId || null,
      municipioNombre: municipio ? municipio.nombre : '',
      capturadoEn: Modelo.ahora()
    };
  },

  caja(p) {
    p = p || {};
    return {
      id: p.id || ID.caja(),
      contratoId: p.contratoId || null,
      numero: p.numero || '',
      fecha: p.fecha || Fecha.hoy(),
      mes: Fecha.mesClave(p.fecha || Fecha.hoy()),
      anio: Fecha.anio(p.fecha || Fecha.hoy()),
      /** SNAPSHOT — no es una referencia viva a la ficha de la persona */
      solicitante: p.solicitante || null,
      solicitanteId: (p.solicitante && p.solicitante.personaId) || null,
      solicitanteTexto: p.solicitanteTexto || '',   // histórico sin persona identificable
      consigno: p.consigno || null,
      consignoId: (p.consigno && p.consigno.personaId) || null,
      consignoTexto: p.consignoTexto || '',
      municipioId: p.municipioId || null,
      municipioNombre: p.municipioNombre || '',
      direccion: p.direccion || '',
      estado: p.estado || EstadoCaja.BORRADOR,
      subtotal: p.subtotal || 0,       // centavos — derivado de los detalles
      retencion: p.retencion || 0,     // centavos — reservado (hoy siempre 0)
      total: p.total || 0,             // centavos — subtotal - retencion
      gasolina: p.gasolina || 0,       // centavos — SUBCOMPONENTE, no se suma al total
      aceite: p.aceite || 0,           // centavos — SUBCOMPONENTE
      totalDetalles: p.totalDetalles || 0,
      /** nota corta; se ve en el listado al pasar el cursor por encima */
      comentario: String(p.comentario || '').trim(),
      observaciones: p.observaciones || '',
      requiereRevision: p.requiereRevision ? 1 : 0,
      motivoRevision: p.motivoRevision || '',
      /* REPUESTA declarada sin consignación registrada (histórico ya conciliado
         fuera del sistema). Evita inventar consignaciones y evita, a la vez,
         que el histórico aparezca como saldo pendiente. */
      reposicionManual: p.reposicionManual ? 1 : 0,
      origen: p.origen || Origen.MANUAL,
      legacy: p.legacy || null,
      anuladaEn: p.anuladaEn || null,
      motivoAnulacion: p.motivoAnulacion || '',
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  detalle(p) {
    p = p || {};
    return {
      id: p.id || ID.detalle(),
      cajaId: p.cajaId,
      contratoId: p.contratoId || null,
      orden: p.orden === undefined ? 0 : p.orden,
      categoriaId: p.categoriaId || null,
      /** texto libre preservado tal cual lo escribió el usuario o venía del Excel */
      categoriaNombre: String(p.categoriaNombre || '').trim(),
      /* Qué se compró: la lima, el machete, el rastrillo. Antes esto se escribía
         en la categoría y cada compra acababa creando una categoría propia,
         cuando todas pertenecen a la misma (normalmente «Caja menor»). */
      elemento: String(p.elemento || '').trim(),
      descripcion: String(p.descripcion || '').trim(),
      cantidad: p.cantidad === undefined || p.cantidad === null || p.cantidad === '' ? null : Number(p.cantidad),
      valorUnitario: p.valorUnitario || 0,
      valor: p.valor || 0,
      rol: p.rol || null,               // GASOLINA | ACEITE | clave estadística | null
      esGasolina: p.rol === RolEstadistico.GASOLINA ? 1 : 0,
      esAceite: p.rol === RolEstadistico.ACEITE ? 1 : 0,
      /* --- campos desnormalizados: caché de consulta para estadísticas.
             Los reescribe SIEMPRE CajaService; nunca son fuente de verdad. --- */
      fecha: p.fecha || null,
      mes: p.mes || null,
      personaId: p.personaId || null,
      municipioId: p.municipioId || null,
      estadoCaja: p.estadoCaja || null,
      origen: p.origen || Origen.MANUAL,
      legacy: p.legacy || null,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  consignacion(p) {
    p = p || {};
    return {
      id: p.id || ID.consignacion(),
      contratoId: p.contratoId || null,
      numero: p.numero || '',
      fecha: p.fecha || Fecha.hoy(),
      mes: Fecha.mesClave(p.fecha || Fecha.hoy()),
      anio: Fecha.anio(p.fecha || Fecha.hoy()),
      beneficiario: p.beneficiario || null,           // SNAPSHOT
      beneficiarioId: (p.beneficiario && p.beneficiario.personaId) || null,
      valor: p.valor || 0,                            // centavos
      banco: p.banco || '',
      referencia: String(p.referencia || '').trim(),
      observaciones: p.observaciones || '',
      estado: p.estado || 'REGISTRADA',
      origen: p.origen || Origen.MANUAL,
      legacy: p.legacy || null,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  /** Puente consignación ↔ caja CON MONTO: habilita N:M y reposiciones parciales */
  aplicacion(p) {
    p = p || {};
    return {
      id: p.id || ID.aplicacion(),
      consignacionId: p.consignacionId,
      cajaId: p.cajaId,
      monto: p.monto || 0,
      creadoEn: p.creadoEn || Modelo.ahora()
    };
  },

  documento(p) {
    p = p || {};
    return {
      id: p.id || ID.documento(),
      cajaId: p.cajaId || null,
      consignacionId: p.consignacionId || null,
      tipo: p.tipo || TipoDocumento.OTRO,
      nombre: p.nombre || p.nombreArchivo || 'documento',
      nombreArchivo: p.nombreArchivo || '',
      mime: p.mime || 'application/octet-stream',
      extension: p.extension || U.extension(p.nombreArchivo),
      tamano: p.tamano || 0,
      descripcion: p.descripcion || '',
      hash: p.hash || null,
      /** identificador de almacenamiento: hoy `archivos.docId`; mañana la ruta del bucket */
      storageKey: p.storageKey || null,
      estado: p.estado || Estado.ACTIVO,
      /** snapshot congelado del documento generado (formato de caja) */
      snapshotHtml: p.snapshotHtml || null,
      origen: p.origen || Origen.MANUAL,
      creadoEn: p.creadoEn || Modelo.ahora(),
      actualizadoEn: Modelo.ahora()
    };
  },

  auditoria(entidad, entidadId, accion, datos) {
    return {
      id: ID.auditoria(),
      entidad, entidadId, accion,
      datos: datos || null,
      usuario: 'local',
      ts: Modelo.ahora()
    };
  }
};

/* --- Validadores: la única puerta de entrada de datos al dominio ---------- */
const Validar = {
  persona(p) {
    const e = [];
    if (Txt.vacio(p.nombre)) e.push('El nombre es obligatorio.');
    if (p.nombre && p.nombre.trim().length < 3) e.push('El nombre debe tener al menos 3 caracteres.');
    if (p.cedula && !/^[\dA-Za-z.\-\s]{4,20}$/.test(p.cedula))
      e.push('El número de documento tiene un formato no válido.');
    if (p.tipoDocumento && !TIPOS_DOCUMENTO.includes(p.tipoDocumento))
      e.push('Tipo de documento no válido.');
    if (p.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(p.correo)) e.push('El correo no es válido.');
    if (p.numeroCuenta && !/^[\d\-\s]{4,30}$/.test(p.numeroCuenta)) e.push('El número de cuenta sólo admite dígitos.');
    if (![Estado.ACTIVO, Estado.INACTIVO].includes(p.estado)) e.push('Estado no válido.');
    return e;
  },
  contrato(c) {
    const e = [];
    if (Txt.vacio(c.nombre)) e.push('El nombre del contrato es obligatorio.');
    if (c.fechaInicio && !Fecha.valida(c.fechaInicio)) e.push('La fecha de inicio no es válida.');
    if (c.fechaFin && !Fecha.valida(c.fechaFin)) e.push('La fecha final no es válida.');
    if (c.fechaInicio && c.fechaFin && c.fechaFin < c.fechaInicio)
      e.push('La fecha final no puede ser anterior a la de inicio.');
    if (Txt.vacio(c.prefijoCaja)) e.push('El prefijo de caja menor es obligatorio.');
    return e;
  },
  municipio(m) {
    const e = [];
    if (Txt.vacio(m.nombre)) e.push('El nombre del municipio es obligatorio.');
    return e;
  },
  categoria(c) {
    const e = [];
    if (Txt.vacio(c.nombre)) e.push('El nombre de la categoría es obligatorio.');
    return e;
  },
  detalle(d, indice) {
    const e = [];
    const n = indice !== undefined ? 'Detalle ' + (indice + 1) + ': ' : '';
    if (Txt.vacio(d.categoriaNombre) && Txt.vacio(d.descripcion))
      e.push(n + 'debe indicar al menos una categoría/concepto o una descripción.');
    if (!Money.isValid(d.valor)) e.push(n + 'el valor no es un número válido.');
    if (d.valor < 0) e.push(n + 'el valor no puede ser negativo.');
    if (d.valor === 0) e.push(n + 'el valor no puede ser cero.');
    return e;
  },
  caja(caja, detalles) {
    const e = [];
    if (!Fecha.valida(caja.fecha)) e.push('La fecha no es válida.');
    if (!caja.solicitanteId && Txt.vacio(caja.solicitanteTexto))
      e.push('Debe seleccionar un solicitante.');
    if (!detalles || !detalles.length) e.push('La caja menor debe tener al menos un detalle.');
    (detalles || []).forEach((d, i) => e.push(...Validar.detalle(d, i)));
    if (caja.retencion < 0) e.push('La retención no puede ser negativa.');
    const calc = Finanzas.calcular(detalles || [], caja.retencion || 0);
    if (calc.total < 0) e.push('El total no puede ser negativo (la retención supera el subtotal).');
    if (calc.gasolina + calc.aceite > calc.total)
      e.push('Gasolina (' + Money.format(calc.gasolina) + ') + aceite (' + Money.format(calc.aceite) +
             ') supera el total de la caja (' + Money.format(calc.total) + ').');
    return e;
  },
  consignacion(c) {
    const e = [];
    if (!Fecha.valida(c.fecha)) e.push('La fecha no es válida.');
    if (!c.beneficiarioId) e.push('Debe seleccionar el beneficiario de la consignación.');
    if (!Money.isValid(c.valor) || c.valor <= 0) e.push('El valor de la consignación debe ser mayor a cero.');
    return e;
  }
};


/* ==========================================================================
   §3b  ADAPTADOR: Supabase (PostgREST + Auth + Storage)
   --------------------------------------------------------------------------
   Implementa el MISMO puerto StorageAdapter que IndexedDB. Ni el dominio ni
   las vistas cambian una línea: sólo se sustituye la instancia en el arranque.

   Se habla directamente con la API REST usando `fetch`; no se carga el SDK de
   Supabase, para que el sistema siga siendo un único archivo sin dependencias.

   SEGURIDAD — importante si el repositorio es público:
     · La clave `anon` es pública por diseño; no protege nada por sí sola.
     · Quien protege los datos es Row Level Security + el inicio de sesión.
       Las políticas exigen `authenticated`, así que sin una sesión válida
       la API devuelve cero filas y rechaza toda escritura.
     · Por eso el sistema pide correo y contraseña antes de abrir nada.

/* --- conversión de nombres camelCase ↔ snake_case (mecánica y reversible) -- */
const Nombres = {
  /**
   * Columnas declaradas `boolean` en PostgreSQL. En la base local se guardan
   * como 1/0 a propósito, porque IndexedDB no admite booleanos en un índice.
   * Aquí se traducen en ambos sentidos; sin esto, PostgreSQL rechazaría la
   * escritura y la subida fallaría entera.
   */
  BOOLEANOS: new Set(['logoPropio', 'esNoAplica', 'esFinanciador', 'esSolicitante',
                      'estadistica', 'sistema', 'requiereRevision', 'reposicionManual',
                      'esGasolina', 'esAceite', 'snapshotHtml']),
  /**
   * Columnas `date` o `timestamptz`. En el modelo local una fecha ausente se
   * guarda como cadena vacía; PostgreSQL exige NULL y rechaza "" con
   * «invalid input syntax for type date». Se traduce al salir.
   */
  FECHAS: new Set(['fecha', 'fechaInicio', 'fechaFin', 'anuladaEn', 'creadoEn', 'actualizadoEn', 'ts']),
  _aSnake: new Map(),
  _aCamel: new Map(),
  snake(k) {
    if (this._aSnake.has(k)) return this._aSnake.get(k);
    const v = k.replace(/([A-Z])/g, m => '_' + m.toLowerCase());
    this._aSnake.set(k, v);
    return v;
  },
  camel(k) {
    if (this._aCamel.has(k)) return this._aCamel.get(k);
    const v = k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
    this._aCamel.set(k, v);
    return v;
  },
  /** sólo las claves de primer nivel; el contenido JSONB se deja intacto */
  filaSalida(obj) {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      let val = v === undefined ? null : v;
      if (this.BOOLEANOS.has(k) && val !== null) val = Boolean(val);   // 1/0 → true/false
      if (this.FECHAS.has(k) && val === '') val = null;                // "" → NULL
      out[this.snake(k)] = val;
    }
    return out;
  },
  filaEntrada(obj) {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      const ck = this.camel(k);
      out[ck] = (this.BOOLEANOS.has(ck) && typeof v === 'boolean') ? (v ? 1 : 0) : v;
    }
    return out;
  }
};

class SupabaseAdapter extends StorageAdapter {
  constructor(cfg) {
    super();
    const c = cfg || Nube.config();
    this.url = c.url;
    this.anonKey = c.anonKey;
    this.bucket = 'soportes';
    this.listo = false;
  }

  async init() {
    if (!this.url || !this.anonKey)
      throw new ErrorDominio('Falta configurar la conexión con Supabase.', 'SIN_CONFIG');
    const token = await Nube.token();
    if (!token) throw new ErrorDominio('Sesión no iniciada.', 'SIN_SESION');
    const est = await Nube.esquemaListo();
    if (!est.listo) {
      if (est.red) throw new ErrorDominio(
        'El servidor no respondió. Revise la conexión a internet y vuelva a intentarlo.', 'SIN_RED');
      throw new ErrorDominio('La base de datos del servidor todavía no tiene las tablas del sistema. ' +
        (est.motivo || ''), 'SIN_ESQUEMA');
    }
    this.listo = true;
    return this;
  }

  async _cab(extra) {
    const token = await Nube.token();
    if (!token) {
      Conexion.rechazoSesion('La sesión caducó y no se pudo renovar.');
      throw new ErrorDominio('La sesión expiró. Vuelva a iniciar sesión.', 'SESION_EXPIRADA');
    }
    return Object.assign({
      'apikey': this.anonKey,
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    }, extra || {});
  }

  async _pedir(ruta, opts) {
    const o = opts || {};
    const cab = await this._cab(o.headers);
    const t0 = performance.now();
    let r;
    try {
      r = await fetch(this.url + '/rest/v1/' + ruta, {
        method: o.method || 'GET', headers: cab, body: o.body
      });
    } catch (e) {
      /* fetch sólo lanza cuando NO llegó respuesta: red caída, DNS, CORS */
      Conexion.noRespondio((e && e.message) || 'sin respuesta');
      throw new ErrorDominio('El servidor no respondió. Revise la conexión a internet.', 'SIN_RED');
    }
    /* llegó respuesta: la conexión funciona, sea cual sea el código. Un 400 o
       un 500 son problemas de la consulta, no de la línea. */
    Conexion.respondio(performance.now() - t0);
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const msg = j.message || j.hint || ('Error ' + r.status);
      const dup = Nube.traducirDuplicado(msg);
      if (dup) throw dup;
      // sólo el 401 invalida la credencial; un 403 es una regla RLS haciendo su trabajo
      if (r.status === 401) Conexion.rechazoSesion(msg);
      if (r.status === 401 || r.status === 403)
        throw new ErrorDominio('Sin permiso para esta operación. Revise su sesión y las políticas RLS. (' + msg + ')', 'RLS');
      throw new ErrorDominio('Supabase: ' + msg, 'API');
    }
    if (r.status === 204) return null;
    const texto = await r.text();
    return texto ? JSON.parse(texto) : null;
  }

  /* -------- lectura -------- */
  async get(col, id) {
    if (!id) return null;
    if (col === 'archivos') return this._descargarArchivo(id);
    const f = await this._pedir(col + '?id=eq.' + encodeURIComponent(id) + '&select=*&limit=1');
    return f && f.length ? Nombres.filaEntrada(f[0]) : null;
  }
  async getMany(col, ids) {
    if (!ids || !ids.length) return [];
    const out = [];
    for (let i = 0; i < ids.length; i += 100) {
      const lote = ids.slice(i, i + 100).map(x => '"' + x + '"').join(',');
      const f = await this._pedir(col + '?id=in.(' + encodeURIComponent(lote) + ')&select=*');
      out.push(...(f || []).map(x => Nombres.filaEntrada(x)));
    }
    return out;
  }
  /** PostgREST pagina a 1.000 filas: se recorre hasta agotar */
  async getAll(col) {
    if (col === 'archivos') return [];
    const out = [];
    const TAM = 1000;
    for (let desde = 0; ; desde += TAM) {
      const f = await this._pedir(col + '?select=*&order=id.asc&limit=' + TAM + '&offset=' + desde);
      if (!f || !f.length) break;
      out.push(...f.map(x => Nombres.filaEntrada(x)));
      if (f.length < TAM) break;
    }
    return out;
  }

  /* -------- escritura -------- */
  async put(col, doc) {
    if (col === 'archivos') return this._subirArchivo(doc);
    await this._pedir(col, {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(Nombres.filaSalida(doc))
    });
    return doc;
  }
  async putMany(col, docs) {
    if (!docs || !docs.length) return 0;
    if (col === 'archivos') { for (const d of docs) await this._subirArchivo(d); return docs.length; }
    const TAM = 400;
    for (let i = 0; i < docs.length; i += TAM) {
      await this._pedir(col, {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(docs.slice(i, i + TAM).map(d => Nombres.filaSalida(d)))
      });
    }
    return docs.length;
  }
  async remove(col, id) {
    if (col === 'archivos') return this._borrarArchivo(id);
    await this._pedir(col + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE' });
    return true;
  }
  async removeWhere(col, indice, valor) {
    await this._pedir(col + '?' + Nombres.snake(indice) + '=eq.' + encodeURIComponent(valor), { method: 'DELETE' });
    return 0;
  }
  async clear(col) {
    if (col === 'archivos') return;
    // `not.is.null` sobre la clave primaria borra todas las filas
    await this._pedir(col + '?id=not.is.null', { method: 'DELETE' });
  }
  async count(col, indice, valor) {
    if (col === 'archivos') return 0;
    const filtro = indice !== undefined && valor !== undefined
      ? '&' + Nombres.snake(indice) + '=eq.' + encodeURIComponent(valor) : '';
    const r = await fetch(this.url + '/rest/v1/' + col + '?select=id' + filtro + '&limit=1', {
      headers: await this._cab({ 'Prefer': 'count=exact', 'Range-Unit': 'items', 'Range': '0-0' })
    });
    const rango = r.headers.get('content-range') || '*/0';
    return Number(String(rango).split('/')[1]) || 0;
  }

  async query(col, opts) {
    const o = opts || {};
    const p = ['select=*'];
    if (o.indice) {
      const campo = Nombres.snake(o.indice);
      if (o.valor !== undefined && o.valor !== null) p.push(campo + '=eq.' + encodeURIComponent(o.valor));
      if (o.desde !== undefined) p.push(campo + '=gte.' + encodeURIComponent(o.desde));
      if (o.hasta !== undefined) p.push(campo + '=lte.' + encodeURIComponent(o.hasta));
      /* PostgreSQL no garantiza NINGÚN orden entre filas con la misma clave.
         Ordenando sólo por fecha, doce cajas del mismo día salían cada vez en
         una posición distinta —de ahí el 8, 10, 9 en pantalla— y, peor, al
         pedirlas por páginas con OFFSET una fila podía repetirse en dos páginas
         o no salir en ninguna. El id es único y creciente: sirve de desempate. */
      const dir = o.direccion === 'desc' ? 'desc' : 'asc';
      p.push('order=' + campo + '.' + dir + (campo === 'id' ? '' : ',id.' + dir));
    }
    // con filtro en memoria hay que traerlo todo; sin él se puede limitar en el servidor
    if (o.limite && !o.filtro) p.push('limit=' + o.limite);
    if (o.offset && !o.filtro) p.push('offset=' + o.offset);
    let filas = [];
    const TAM = 1000;
    for (let desde = 0; ; desde += TAM) {
      const q = p.concat(o.limite && !o.filtro ? [] : ['limit=' + TAM, 'offset=' + desde]).join('&');
      const f = await this._pedir(col + '?' + q);
      if (!f || !f.length) break;
      filas.push(...f.map(x => Nombres.filaEntrada(x)));
      if (f.length < TAM || (o.limite && !o.filtro)) break;
    }
    if (o.filtro) filas = filas.filter(o.filtro);
    if (o.offset && o.filtro) filas = filas.slice(o.offset);
    if (o.limite && o.filtro) filas = filas.slice(0, o.limite);
    return filas;
  }

  /**
   * PostgREST no expone transacciones multi-tabla por HTTP. Se ejecutan las
   * escrituras en orden y, si algo falla, se informa: por eso las operaciones
   * del dominio están diseñadas para ser idempotentes (upsert por id) y se
   * puede reintentar sin duplicar nada.
   */
  async transaccion(cols, fn) {
    const pendientes = [];
    const api = {
      get: (c, id) => this.get(c, id),
      getAll: c => this.getAll(c),
      put: (c, d) => { pendientes.push(['put', c, d]); return d; },
      remove: (c, id) => { pendientes.push(['del', c, id]); },
      porIndice: (c, idx, val) => this.query(c, { indice: idx, valor: val }),
      abortar: () => { throw new ErrorDominio('Operación cancelada.', 'TX_ABORT'); }
    };
    const resultado = await fn(api);
    // primero los borrados, luego las altas: evita chocar con índices únicos
    for (const [op, c, x] of pendientes) if (op === 'del') await this.remove(c, x);
    const porColeccion = new Map();
    for (const [op, c, x] of pendientes) {
      if (op !== 'put') continue;
      if (!porColeccion.has(c)) porColeccion.set(c, []);
      porColeccion.get(c).push(x);
    }
    for (const [c, docs] of porColeccion) await this.putMany(c, docs);
    return resultado;
  }

  /* -------- documentos en Supabase Storage -------- */
  async _subirArchivo(doc) {
    const blob = doc.blob;
    if (!blob) return doc;
    const token = await Nube.token();
    const r = await fetch(this.url + '/storage/v1/object/' + this.bucket + '/' + encodeURIComponent(doc.docId), {
      method: 'POST',
      headers: {
        'apikey': this.anonKey, 'Authorization': 'Bearer ' + token,
        'Content-Type': doc.mime || 'application/octet-stream',
        'x-upsert': 'true'
      },
      body: blob
    });
    if (!r.ok && r.status !== 409) {
      const t = await r.text().catch(() => '');
      throw new ErrorDominio('No se pudo subir el archivo: ' + t.slice(0, 160), 'STORAGE');
    }
    return doc;
  }
  async _descargarArchivo(docId) {
    const token = await Nube.token();
    const r = await fetch(this.url + '/storage/v1/object/' + this.bucket + '/' + encodeURIComponent(docId), {
      headers: { 'apikey': this.anonKey, 'Authorization': 'Bearer ' + token }
    });
    if (!r.ok) return null;
    const blob = await r.blob();
    return { docId, blob, mime: blob.type, tamano: blob.size };
  }
  async _borrarArchivo(docId) {
    const token = await Nube.token();
    await fetch(this.url + '/storage/v1/object/' + this.bucket + '/' + encodeURIComponent(docId), {
      method: 'DELETE',
      headers: { 'apikey': this.anonKey, 'Authorization': 'Bearer ' + token }
    }).catch(() => {});
    return true;
  }

  async estadisticasAlmacen() {
    /* Trece conteos en serie son trece viajes de ida y vuelta a la nube: medido
       contra el servidor real, 3.493 ms. Lanzados a la vez cuestan lo que el
       más lento, 655 ms. No hay dependencia entre ellos, así que la cola era
       gratuita en el sentido malo de la palabra. */
    const pares = await Promise.all(COLECCIONES_DATOS.map(async c => {
      try { return [c, await this.count(c)]; } catch { return [c, 0]; }
    }));
    const colecciones = {};
    for (const [c, n] of pares) colecciones[c] = n;
    return { colecciones, cuota: null, nube: true, url: this.url };
  }
}


/* ==========================================================================
   §2c  ESTADO DE LA CONEXIÓN  —  verificado, nunca decorativo
   --------------------------------------------------------------------------
   Un indicador fijo que dijera «en vivo» sería peor que no tener ninguno:
   daría confianza con el cable desenchufado. Aquí el estado se deduce de
   evidencia y de nada más. Hay dos fuentes:

     1. El resultado real de CADA petición que hace el programa. Es la mejor
        prueba posible, porque es el tráfico de trabajo de verdad.
     2. Una comprobación propia cuando lleva rato sin haber tráfico, para que
        el indicador no se quede colgado de un éxito viejo.

   «En vivo» significa literalmente: la última señal del servidor fue un
   intercambio correcto y ocurrió hace menos de VIGENCIA milisegundos. Pasado
   ese plazo el estado caduca solo y vuelve a «comprobando» hasta que haya
   evidencia nueva. Nunca se afirma nada que no se acabe de verificar.

   Distinciones que importan para no mentir en ninguna de las dos direcciones:
     · fetch sólo lanza excepción cuando NO hubo respuesta (red caída, DNS,
       CORS). Eso sí es pérdida de conexión.
     · Un HTTP 400 o 500 es una respuesta: prueba que el servidor está vivo.
       Contarlo como «sin conexión» mandaría a revisar el router cuando lo que
       falla es una consulta.
     · Un 403 de RLS es una regla de permisos, no una sesión caída. Sólo el
       401 significa que la credencial dejó de valer.
   ========================================================================== */
const Conexion = {
  VIGENCIA: 40000,   // un éxito deja de ser prueba pasados 40 s
  INTERVALO: 25000,  // si no hubo tráfico en 25 s, se comprueba sola
  LATIDO: 5000,      // repintado: la caducidad debe verse aunque no pase nada

  estado: 'comprobando',
  ultimoExito: 0,
  ultimoFallo: 0,     // sólo informativo, para el detalle
  ultimoIntento: 0,
  latencia: null,
  motivo: '',
  _timer: null,
  _enVuelo: null,
  _iniciado: false,

  /* ---------------- evidencia (la informa el adaptador) ---------------- */

  /** llegó respuesta del servidor, con el código que sea: la conexión sirve */
  respondio(ms) {
    this.ultimoIntento = this.ultimoExito = Date.now();
    if (typeof ms === 'number' && isFinite(ms)) this.latencia = Math.round(ms);
    this.motivo = '';
    this.estado = 'envivo';
    this.pintar();
  },

  /** no hubo respuesta: red caída, DNS o servidor inalcanzable */
  noRespondio(msg) {
    this.ultimoIntento = this.ultimoFallo = Date.now();
    this.motivo = msg || 'El servidor no respondió.';
    this.estado = 'sin_red';
    this.pintar();
  },

  /** el servidor contestó 401: la credencial dejó de valer */
  rechazoSesion(msg) {
    this.ultimoIntento = Date.now();
    this.motivo = msg || 'La sesión caducó.';
    this.estado = 'sesion';
    this.pintar();
  },

  /* ---------------- lectura del estado ---------------- */

  vigente() { return Date.now() - this.ultimoExito < this.VIGENCIA; },

  /**
   * Estado que se muestra. `estado` guarda la ÚLTIMA señal recibida, así que
   * manda ella; la caducidad sólo puede degradar un «en vivo», nunca ascender
   * un fallo. Aquí no se comparan marcas de tiempo a propósito: dos señales
   * seguidas caen en el mismo milisegundo y la comparación decidía al azar,
   * llegando a mostrar «en vivo» justo después de una caída.
   */
  calcular() {
    if (this.estado === 'sesion') return 'sesion';
    if (this.estado === 'sin_red') return 'sin_red';
    if (this.vigente()) return 'envivo';
    return 'comprobando';
  },

  META: {
    envivo:      { clase: 'ok',  texto: 'En vivo',      ayuda: 'Conectado con el servidor' },
    comprobando: { clase: 'esp', texto: 'Comprobando…', ayuda: 'Verificando la conexión' },
    sin_red:     { clase: 'mal', texto: 'Sin conexión', ayuda: 'El servidor no responde' },
    sesion:      { clase: 'mal', texto: 'Sesión caducada', ayuda: 'Vuelva a iniciar sesión' }
  },

  /* ---------------- comprobación propia ---------------- */

  /**
   * Pide una fila mínima a la API. No es un ping cualquiera: al pasar por
   * PostgREST con el token de la sesión, comprueba de una vez la red, el
   * servidor, la autenticación y las políticas RLS — justo la cadena que hace
   * falta para trabajar. `no-store` es obligatorio: una respuesta servida por
   * la caché del navegador sería una prueba falsa.
   */
  async comprobar(forzar) {
    if (this._enVuelo) return this._enVuelo;
    /* Sólo se ahorra la petición cuando AHORA MISMO se está mostrando «en vivo»
       con evidencia fresca. Mirar sólo la vigencia dejaba el aviso atascado en
       rojo: tras una caída el último éxito seguía dentro de plazo, la
       comprobación se saltaba a sí misma y nunca se enteraba de que la línea
       había vuelto. Si el aviso no está en verde, siempre se comprueba. */
    if (!forzar && this.calcular() === 'envivo') return;
    if (!navigator.onLine) { this.noRespondio('El equipo no tiene conexión a internet.'); return; }
    if (!Nube.configurada()) return;
    this.pintar();
    const t0 = performance.now();
    this._enVuelo = (async () => {
      try {
        const c = Nube.config();
        let tk = null;
        try { tk = await Nube.token(); } catch (e) { /* la red se juzga abajo */ }
        const r = await fetch(c.url + '/rest/v1/configuracion?select=id&limit=1', {
          headers: { apikey: c.anonKey, Authorization: 'Bearer ' + (tk || c.anonKey) },
          cache: 'no-store'
        });
        if (r.status === 401) this.rechazoSesion('El servidor no aceptó la sesión.');
        else this.respondio(performance.now() - t0);
      } catch (e) {
        this.noRespondio((e && e.message) || 'sin respuesta');
      } finally {
        this._enVuelo = null;
        this.pintar();
      }
    })();
    return this._enVuelo;
  },

  iniciar() {
    if (this._iniciado) return;
    this._iniciado = true;
    this._timer = setInterval(() => this.latir(), this.LATIDO);
    addEventListener('online', () => this.comprobar(true));
    addEventListener('offline', () => this.noRespondio('El equipo se quedó sin conexión a internet.'));
    // al volver a la pestaña no se da por bueno lo de antes: se vuelve a mirar
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.comprobar(true); });
    this.comprobar(true);
  },

  latir() {
    this.pintar();                 // la caducidad se ve aunque no ocurra nada
    if (document.hidden) return;   // pestaña oculta: no se gasta red ni batería
    if (Date.now() - this.ultimoIntento >= this.INTERVALO) this.comprobar(false);
  },

  /** copia y reposición del estado, para que las pruebas no dejen el aviso tocado */
  instantanea() {
    return { estado: this.estado, ultimoExito: this.ultimoExito, ultimoFallo: this.ultimoFallo,
             ultimoIntento: this.ultimoIntento, latencia: this.latencia, motivo: this.motivo };
  },
  restaurar(s) { Object.assign(this, s); this.pintar(); },

  /* ---------------- presentación ---------------- */

  hace(ts) {
    if (!ts) return 'nunca';
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 2) return 'hace un instante';
    if (s < 60) return 'hace ' + s + ' segundos';
    const m = Math.round(s / 60);
    if (m < 60) return 'hace ' + m + (m === 1 ? ' minuto' : ' minutos');
    const h = Math.round(m / 60);
    return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  },

  insignia() {
    const m = this.META[this.calcular()];
    return '<button class="conx ' + m.clase + '" id="conx" data-gact="conexion" ' +
      'title="' + attr(m.ayuda) + ' · clic para ver el detalle">' +
      '<span class="conx-p"></span><span class="conx-t">' + esc(m.texto) + '</span></button>';
  },

  pintar() {
    const el = document.getElementById('conx');
    if (!el) return;
    const m = this.META[this.calcular()];
    el.className = 'conx ' + m.clase;
    el.title = m.ayuda + ' · clic para ver el detalle';
    const t = el.querySelector('.conx-t');
    if (t) t.textContent = m.texto;
  },

  /** detalle: los números que sostienen lo que dice la insignia */
  async verDetalle() {
    const pintarCuerpo = () => {
      const m = this.META[this.calcular()];
      const s = Nube.sesion() || {};
      const fila = (k, v) => '<tr><td class="fs12 txt-3" style="padding:5px 12px 5px 0;white-space:nowrap">' +
        esc(k) + '</td><td class="fs12" style="padding:5px 0"><b>' + v + '</b></td></tr>';
      const caduca = s.expira
        ? (s.expira > Date.now()
            ? 'en ' + Math.max(1, Math.round((s.expira - Date.now()) / 60000)) + ' minuto(s), se renueva sola'
            : 'ya caducó')
        : 'sin sesión';
      return '<div class="flex aic g8 mb12"><span class="conx-p conx-p-' + m.clase +
        '" style="width:9px;height:9px;border-radius:50%;display:inline-block"></span>' +
        '<b style="font-size:14px">' + esc(m.texto) + '</b></div>' +
        '<table style="width:100%;border-collapse:collapse">' +
        fila('Servidor', esc((Nube.config().url || '').replace('https://', ''))) +
        fila('Última respuesta', esc(this.hace(this.ultimoExito))) +
        fila('Tiempo de ida y vuelta', this.latencia === null ? '—' : this.latencia + ' ms') +
        (this.ultimoFallo ? fila('Último fallo', esc(this.hace(this.ultimoFallo))) : '') +
        fila('Cuenta', esc(s.correo || '—')) +
        fila('Credencial', esc(caduca)) +
        '</table>' +
        (this.motivo ? '<div class="alert a-warn mt12" style="padding:8px 10px">' + Icon('warn', '', 14) +
          '<div class="fs12">' + esc(this.motivo) + '</div></div>' : '') +
        '<p class="fs11 txt-3 mt12" style="line-height:1.55">«En vivo» quiere decir que hubo un intercambio ' +
        'correcto con el servidor hace menos de ' + (this.VIGENCIA / 1000) + ' segundos. Si pasa ese plazo sin ' +
        'respuesta, el aviso cambia solo.</p>';
    };

    const m = Modal.abrir({
      titulo: 'Estado de la conexión',
      ancho: 'narrow',
      cuerpo: '<div id="cxCuerpo">' + pintarCuerpo() + '</div>',
      pie: '<button class="btn" data-cerrar>Cerrar</button>' +
           '<button class="btn btn-primary" id="cxProbar">' + Icon('refresh', '', 14) + 'Comprobar ahora</button>'
    });
    const refrescar = () => { const c = m.querySelector('#cxCuerpo'); if (c) c.innerHTML = pintarCuerpo(); };
    const t = setInterval(() => { if (!document.body.contains(m)) clearInterval(t); else refrescar(); }, 1000);
    const btn = m.querySelector('#cxProbar');
    btn.onclick = async () => {
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Comprobando…';
      await this.comprobar(true);
      refrescar();
      btn.disabled = false; btn.innerHTML = Icon('refresh', '', 14) + 'Comprobar ahora';
    };
  }
};


/* ==========================================================================
   §5  REPOSITORIOS
   --------------------------------------------------------------------------
   Capa delgada y tipada sobre el puerto. Los catálogos pequeños (config,
   personas, municipios, categorías) se mantienen en memoria porque son
   decenas/centenares de registros y la UI los consulta constantemente.
   Cajas, detalles y documentos NUNCA se cargan completos: se consultan por
   índice con paginación por cursor.
   ========================================================================== */
let db = null;   // instancia del StorageAdapter activo (se inyecta en el arranque)

const Cache = {
  config: null,
  contratos: new Map(),
  personas: new Map(),
  municipios: new Map(),
  categorias: new Map(),
  listo: false,
  invalidar() { this.listo = false; },
  async cargar() {
    this.config = (await db.get('configuracion', 'cfg_default')) || Modelo.configuracion();
    const [ctrs, pers, muns, cats] = await Promise.all([
      db.getAll('contratos'), db.getAll('personas'), db.getAll('municipios'), db.getAll('categorias')
    ]);
    this.contratos = new Map(ctrs.map(c => [c.id, c]));
    this.personas = new Map(pers.map(p => [p.id, p]));
    this.municipios = new Map(muns.map(m => [m.id, m]));
    this.categorias = new Map(cats.map(c => [c.id, c]));
    this.listo = true;
  }
};

/* --------------------------------------------------------------------------
   ContratoRepo — cada contrato es una unidad económica cerrada.
   Todo lo que se consulta en la aplicación está acotado al contrato ACTIVO;
   sólo el respaldo y la verificación de integridad miran el conjunto completo.
   -------------------------------------------------------------------------- */
const ContratoRepo = {
  todos() { return [...Cache.contratos.values()].sort(U.by('nombre')); },
  vigentes() { return this.todos().filter(c => c.estado !== 'FINALIZADO'); },
  get(id) { return Cache.contratos.get(id) || null; },
  porNombre(n) { const x = Txt.norm(n); return this.todos().find(c => c.nombreNorm === x) || null; },

  /** contrato sobre el que se trabaja ahora; nunca devuelve null si hay alguno */
  activo() {
    const cfg = Cache.config || {};
    return this.get(cfg.contratoActivoId) || this.todos()[0] || null;
  },
  activoId() { const c = this.activo(); return c ? c.id : null; },
  nombre(id) { const c = this.get(id); return c ? c.nombre : ''; },

  async cambiarActivo(id) {
    if (!this.get(id)) throw new ErrorDominio('Contrato no encontrado.', 'NO_EXISTE');
    await ConfigRepo.guardar({ contratoActivoId: id });
    Analitica.invalidar();
    Bus.emit('contrato:cambio', this.activo());
    return this.activo();
  },

  async guardar(datos) {
    const previo = datos.id ? Cache.contratos.get(datos.id) : null;
    const c = Modelo.contrato(Object.assign({}, previo || {}, datos));
    const e = Validar.contrato(c);
    if (e.length) throw new ErrorValidacion(e);
    const dup = this.porNombre(c.nombre);
    if (dup && dup.id !== c.id) throw new ErrorDominio('Ya existe un contrato llamado "' + c.nombre + '".', 'DUPLICADO');
    await db.put('contratos', c);
    Cache.contratos.set(c.id, c);
    await Auditoria.registrar('contrato', c.id, previo ? 'ACTUALIZAR' : 'CREAR', { nombre: c.nombre });
    Bus.emit('contratos:cambio', c);
    return c;
  },

  /** cuántas operaciones cuelgan del contrato (para decidir si se puede borrar) */
  async usos(id) {
    return {
      cajas: await db.count('cajas', 'contratoId', id),
      consignaciones: await db.count('consignaciones', 'contratoId', id)
    };
  },

  /** sólo se elimina un contrato SIN movimientos: nunca se borra dinero */
  async eliminar(id) {
    const u = await this.usos(id);
    if (u.cajas || u.consignaciones)
      throw new ErrorDominio('No se puede eliminar: el contrato tiene ' + u.cajas + ' caja(s) y ' +
        u.consignaciones + ' consignación(es). Márquelo como finalizado en su lugar.', 'EN_USO');
    if (this.todos().length <= 1)
      throw new ErrorDominio('Debe existir al menos un contrato.', 'ULTIMO');
    await db.remove('contratos', id);
    Cache.contratos.delete(id);
    if ((Cache.config || {}).contratoActivoId === id) await ConfigRepo.guardar({ contratoActivoId: this.todos()[0].id });
    await Auditoria.registrar('contrato', id, 'ELIMINAR', null);
    Bus.emit('contratos:cambio', null);
  }
};

const ConfigRepo = {
  get() { return Cache.config; },
  async guardar(parcial) {
    const actual = Cache.config || Modelo.configuracion();
    const nuevo = Object.assign({}, actual, parcial, { id: 'cfg_default', actualizadoEn: Modelo.ahora() });
    await db.put('configuracion', nuevo);
    Cache.config = nuevo;
    Bus.emit('config:cambio', nuevo);
    return nuevo;
  }
};

const PersonaRepo = {
  todas() { return [...Cache.personas.values()]; },
  activas() { return this.todas().filter(p => p.estado === Estado.ACTIVO); },
  solicitantes() { return this.activas().filter(p => p.esSolicitante).sort(U.by('nombre')); },
  financiadores() { return this.activas().filter(p => p.esFinanciador).sort(U.by('nombre')); },
  /** persona propuesta por defecto en «Consignó» (configurable, §8) */
  financiadorPorDefecto() {
    const ctr = ContratoRepo.activo() || {};
    const cfg = ConfigRepo.get() || {};
    const id = ctr.financiadorPorDefectoId || cfg.financiadorPorDefectoId;
    const p = id ? this.get(id) : null;
    if (p && p.estado === Estado.ACTIVO) return p;
    return this.financiadores()[0] || null;
  },
  get(id) { return Cache.personas.get(id) || null; },
  porNombre(nombre) {
    const n = Txt.norm(nombre);
    return this.todas().find(p => p.nombreNorm === n) || null;
  },
  porCedula(c) {
    const v = String(c || '').replace(/\D/g, '');
    if (!v) return null;
    return this.todas().find(p => String(p.cedula || '').replace(/\D/g, '') === v) || null;
  },
  async guardar(datos) {
    const previa = datos.id ? Cache.personas.get(datos.id) : null;
    // se valida el modelo ya normalizado (con sus valores por defecto), no la entrada cruda
    const p = Modelo.persona(Object.assign({}, previa || {}, datos));
    const errores = Validar.persona(p);
    if (errores.length) throw new ErrorValidacion(errores);
    const dup = this.porNombre(p.nombre);
    if (dup && dup.id !== p.id) throw new ErrorDominio('Ya existe una persona con el nombre "' + p.nombre + '".', 'DUPLICADO');
    if (p.cedula) {
      const dupc = this.porCedula(p.cedula);
      if (dupc && dupc.id !== p.id) throw new ErrorDominio('La cédula ya está registrada para ' + dupc.nombre + '.', 'DUPLICADO');
    }
    await db.put('personas', p);
    Cache.personas.set(p.id, p);
    await Auditoria.registrar('persona', p.id, previa ? 'ACTUALIZAR' : 'CREAR', { nombre: p.nombre });
    Bus.emit('personas:cambio', p);
    return p;
  },
  async cambiarEstado(id, estado) {
    const p = this.get(id);
    if (!p) throw new ErrorDominio('Persona no encontrada.', 'NO_EXISTE');
    return this.guardar(Object.assign({}, p, { estado }));
  },
  /** nunca borra si tiene movimientos: eso destruiría trazabilidad financiera */
  async eliminar(id) {
    const usos = await db.count('cajas', 'solicitanteId', id) + await db.count('cajas', 'consignoId', id)
               + await db.count('consignaciones', 'beneficiarioId', id);
    if (usos > 0) throw new ErrorDominio(
      'No se puede eliminar: la persona tiene ' + usos + ' movimiento(s) asociado(s). Desactívela en su lugar.', 'EN_USO');
    await db.remove('personas', id);
    Cache.personas.delete(id);
    await Auditoria.registrar('persona', id, 'ELIMINAR', null);
    Bus.emit('personas:cambio', null);
  },
  async contarUsos(id) {
    return {
      cajasSolicitante: await db.count('cajas', 'solicitanteId', id),
      cajasConsigno: await db.count('cajas', 'consignoId', id),
      consignaciones: await db.count('consignaciones', 'beneficiarioId', id)
    };
  }
};

const MunicipioRepo = {
  todos() { return [...Cache.municipios.values()].sort(U.by('nombre')); },
  activos() { return this.todos().filter(m => m.estado === Estado.ACTIVO); },
  get(id) { return Cache.municipios.get(id) || null; },
  nombre(id) { const m = this.get(id); return m ? m.nombre : ''; },
  porNombre(n) { const x = Txt.norm(n); return this.todos().find(m => m.nombreNorm === x) || null; },
  async guardar(datos) {
    const previo = datos.id ? Cache.municipios.get(datos.id) : null;
    const m = Modelo.municipio(Object.assign({}, previo || {}, datos));
    const e = Validar.municipio(m);
    if (e.length) throw new ErrorValidacion(e);
    const dup = this.porNombre(m.nombre);
    if (dup && dup.id !== m.id) throw new ErrorDominio('Ya existe el municipio "' + m.nombre + '".', 'DUPLICADO');
    await db.put('municipios', m);
    Cache.municipios.set(m.id, m);
    await Auditoria.registrar('municipio', m.id, previo ? 'ACTUALIZAR' : 'CREAR', { nombre: m.nombre });
    Bus.emit('municipios:cambio', m);
    return m;
  },
  /** obtiene o crea (usado por el importador, con origen IMPORT) */
  async obtenerOCrear(nombre, origen) {
    if (Txt.vacio(nombre)) return null;
    const ex = this.porNombre(nombre);
    if (ex) return ex;
    return this.guardar(Modelo.municipio({ nombre: String(nombre).trim(), origen: origen || Origen.IMPORT,
      esNoAplica: Txt.norm(nombre) === 'no aplica' ? 1 : 0 }));
  },
  async eliminar(id) {
    const usos = await db.count('cajas', 'municipioId', id);
    if (usos > 0) throw new ErrorDominio('No se puede eliminar: ' + usos + ' caja(s) usan este municipio. Desactívelo.', 'EN_USO');
    const pers = PersonaRepo.todas().filter(p => p.municipioId === id).length;
    if (pers > 0) throw new ErrorDominio('No se puede eliminar: ' + pers + ' persona(s) tienen este municipio.', 'EN_USO');
    await db.remove('municipios', id);
    Cache.municipios.delete(id);
    Bus.emit('municipios:cambio', null);
  }
};

const CategoriaRepo = {
  todas() { return [...Cache.categorias.values()].sort((a, b) => (a.orden - b.orden) || a.nombre.localeCompare(b.nombre, 'es')); },
  activas() { return this.todas().filter(c => c.estado === Estado.ACTIVO); },
  estadisticas() { return this.todas().filter(c => c.estadistica); },
  get(id) { return Cache.categorias.get(id) || null; },
  nombre(id) { const c = this.get(id); return c ? c.nombre : ''; },
  porNombre(n) { const x = Txt.norm(n); return this.todas().find(c => c.nombreNorm === x) || null; },
  porRol(rol) { return this.todas().find(c => c.rol === rol) || null; },
  async guardar(datos) {
    const previa = datos.id ? Cache.categorias.get(datos.id) : null;
    const c = Modelo.categoria(Object.assign({}, previa || {}, datos));
    const e = Validar.categoria(c);
    if (e.length) throw new ErrorValidacion(e);
    const dup = this.porNombre(c.nombre);
    if (dup && dup.id !== c.id) throw new ErrorDominio('Ya existe la categoría "' + c.nombre + '".', 'DUPLICADO');
    await db.put('categorias', c);
    Cache.categorias.set(c.id, c);
    await Auditoria.registrar('categoria', c.id, previa ? 'ACTUALIZAR' : 'CREAR', { nombre: c.nombre });
    Bus.emit('categorias:cambio', c);
    return c;
  },
  async obtenerOCrear(nombre, origen) {
    if (Txt.vacio(nombre)) return null;
    const ex = this.porNombre(nombre);
    if (ex) return ex;
    return this.guardar(Modelo.categoria({ nombre: String(nombre).trim(), origen: origen || Origen.MANUAL }));
  },
  /**
   * Vincula a esta categoría los gastos que ya la usaban como texto suelto.
   *
   * Un detalle guarda dos cosas: la referencia a la categoría y el nombre
   * congelado con el que se registró (§62). Los gastos importados antes de que
   * la categoría existiera en el catálogo se quedaron con el nombre pero sin
   * referencia; por eso el catálogo mostraba «0 usos» mientras el mismo
   * concepto seguía apareciendo como texto libre, invitando a añadirlo otra vez.
   *
   * Sólo se rellena la referencia que faltaba. El nombre congelado no se toca:
   * lo que quedó escrito en su día sigue diciendo exactamente lo mismo.
   */
  async adoptarTextoLibre(cat) {
    if (!cat || !cat.id || !cat.nombreNorm) return 0;
    const todos = await db.getAll('detalles');
    const sueltos = todos.filter(d => !d.categoriaId && d.categoriaNombre &&
      Txt.norm(d.categoriaNombre) === cat.nombreNorm);
    if (!sueltos.length) return 0;
    await db.putMany('detalles', sueltos.map(d => Object.assign({}, d, { categoriaId: cat.id })));
    Analitica.invalidar();
    Bus.emit('categorias:cambio', cat);
    return sueltos.length;
  },
  async eliminar(id) {
    const c = this.get(id);
    if (c && c.sistema) throw new ErrorDominio('Las categorías del sistema no se pueden eliminar. Desactívela.', 'SISTEMA');
    const usos = await db.count('detalles', 'categoriaId', id);
    if (usos > 0) throw new ErrorDominio('No se puede eliminar: ' + usos + ' detalle(s) la usan. Desactívela.', 'EN_USO');
    await db.remove('categorias', id);
    Cache.categorias.delete(id);
    Bus.emit('categorias:cambio', null);
  }
};

const CajaRepo = {
  get: id => db.get('cajas', id),

  /**
   * Cambia SÓLO la nota corta de la caja.
   *
   * Pasar por la actualización completa recalcularía totales y reescribiría
   * todos los detalles para guardar una frase. Aquí no se toca ni un peso:
   * los importes, los detalles y la copia congelada del solicitante quedan
   * exactamente como estaban.
   */
  async comentar(id, texto) {
    const caja = await db.get('cajas', id);
    if (!caja) throw new ErrorDominio('Caja no encontrada.', 'NO_EXISTE');
    const limpio = String(texto == null ? '' : texto).trim().slice(0, 140);
    if (limpio === String(caja.comentario || '')) return caja;
    const nueva = Object.assign({}, caja, { comentario: limpio, actualizadoEn: Modelo.ahora() });
    await db.put('cajas', nueva);
    await Auditoria.registrar('caja', id, 'COMENTAR', { comentario: limpio });
    Bus.emit('cajas:cambio', nueva);
    return nueva;
  },
  porNumero: async num => (await db.query('cajas', { indice: 'numero', valor: num }))[0] || null,
  detalles: async cajaId => (await db.query('detalles', { indice: 'cajaId', valor: cajaId })).sort(U.by('orden')),
  aplicaciones: cajaId => db.query('aplicaciones', { indice: 'cajaId', valor: cajaId }),
  documentos: async cajaId => (await db.query('documentos', { indice: 'cajaId', valor: cajaId }))
                                .filter(d => d.estado === Estado.ACTIVO).sort(U.by('creadoEn', 'desc')),
  contar: () => db.count('cajas'),
  /** carga completa sólo cuando se necesita analítica; usa cursores por índice */
  todas: opts => db.query('cajas', Object.assign({ indice: 'fecha', direccion: 'desc' }, opts || {})),
  porRango: (desde, hasta) => db.query('cajas', { indice: 'fecha', desde, hasta })
};

const ConsignacionRepo = {
  get: id => db.get('consignaciones', id),
  todas: opts => db.query('consignaciones', Object.assign({ indice: 'fecha', direccion: 'desc' }, opts || {})),
  aplicaciones: id => db.query('aplicaciones', { indice: 'consignacionId', valor: id }),
  documentos: async id => (await db.query('documentos', { indice: 'consignacionId', valor: id }))
                             .filter(d => d.estado === Estado.ACTIVO).sort(U.by('creadoEn', 'desc')),
  contar: () => db.count('consignaciones')
};

const Auditoria = {
  activa: true,
  async registrar(entidad, entidadId, accion, datos) {
    if (!this.activa) return;
    try { await db.put('auditoria', Modelo.auditoria(entidad, entidadId, accion, datos)); }
    catch (e) { console.warn('[auditoria]', e); }
  },
  porEntidad: async (entidadId) => (await db.query('auditoria', { indice: 'entidadId', valor: entidadId })).sort(U.by('ts', 'desc')),
  recientes: (limite) => db.query('auditoria', { indice: 'ts', direccion: 'desc', limite: limite || 100 })
};

/* --- Consecutivos atómicos: un número jamás se reutiliza (§9) -------------- */
const Secuencia = {
  async siguiente(clave, opts) {
    const o = opts || {};
    let valor = 0;
    await db.transaccion(['secuencias'], async tx => {
      const actual = await tx.get('secuencias', clave);
      valor = ((actual && actual.valor) || 0) + 1;
      tx.put('secuencias', { id: clave, valor, actualizadoEn: Modelo.ahora() });
    });
    return valor;
  },
  async ver(clave) { const r = await db.get('secuencias', clave); return (r && r.valor) || 0; },
  /** tras una importación/restauración, adelanta el contador para no colisionar */
  async asegurarMinimo(clave, minimo) {
    await db.transaccion(['secuencias'], async tx => {
      const actual = await tx.get('secuencias', clave);
      const v = (actual && actual.valor) || 0;
      if (minimo > v) tx.put('secuencias', { id: clave, valor: minimo, actualizadoEn: Modelo.ahora() });
    });
  },
  formatoCaja(anio, n, prefijo) {
    const ctr = ContratoRepo.activo() || {};
    return (prefijo || ctr.prefijoCaja || 'CM') + '-' + anio + '-' + String(n).padStart(5, '0');
  },
  formatoConsignacion(anio, n, prefijo) {
    const ctr = ContratoRepo.activo() || {};
    return (prefijo || ctr.prefijoConsignacion || 'CON') + '-' + anio + '-' + String(n).padStart(4, '0');
  },
  /** la clave incluye el contrato: dos contratos jamás comparten numeración */
  claveCaja(contratoId, prefijo, anio) { return 'caja:' + contratoId + ':' + prefijo + ':' + anio; },
  claveConsignacion(contratoId, prefijo, anio) { return 'con:' + contratoId + ':' + prefijo + ':' + anio; }
};

/* ==========================================================================
   §6  DOMINIO
   ========================================================================== */

/* --------------------------------------------------------------------------
   Finanzas — ÚNICO lugar del sistema donde se calcula dinero.
   Ninguna vista suma. Ninguna vista deriva totales. (§14, §43)
   -------------------------------------------------------------------------- */
const Finanzas = {
  /**
   * Calcula los totales de una caja a partir de sus detalles.
   * REGLA CRÍTICA (§13): gasolina y aceite son SUBCOMPONENTES del total,
   * NO se suman por encima de él. Se extraen de los detalles marcados con rol.
   */
  calcular(detalles, retencion) {
    const ds = detalles || [];
    const subtotal = U.sumBy(ds, d => d.valor || 0);
    const ret = retencion || 0;
    const total = subtotal - ret;
    const porRol = {};
    for (const d of ds) {
      if (!d.rol) continue;
      porRol[d.rol] = (porRol[d.rol] || 0) + (d.valor || 0);
    }
    const gasolina = porRol[RolEstadistico.GASOLINA] || 0;
    const aceite = porRol[RolEstadistico.ACEITE] || 0;
    return {
      subtotal, retencion: ret, total,
      gasolina, aceite,
      otros: total - gasolina - aceite,
      porRol,
      totalDetalles: ds.length
    };
  },

  /**
   * Saldo pendiente por reponer de una caja (§21, §23).
   * Regla única, usada por el detalle, el listado, el dashboard y las estadísticas:
   *   · ANULADA o BORRADOR      → 0 (no hay dinero comprometido a reponer)
   *   · REPUESTA                → 0 (se declara saldada, con o sin consignación)
   *   · resto                   → total − suma de aplicaciones
   */
  pendienteDe(caja, repuesto) {
    if (!caja) return 0;
    if (caja.estado === EstadoCaja.ANULADA || caja.estado === EstadoCaja.BORRADOR) return 0;
    if (caja.estado === EstadoCaja.REEMBOLSADA) return 0;
    return Math.max(0, (caja.total || 0) - (repuesto || 0));
  },
  pendiente(caja, aplicaciones) {
    return this.pendienteDe(caja, U.sumBy(aplicaciones || [], a => a.monto || 0));
  },
  repuesto(aplicaciones) { return U.sumBy(aplicaciones || [], a => a.monto || 0); },

  /**
   * Estado de reposición derivado. No lo decide la UI.
   * BORRADOR y ANULADA no se tocan jamás por reposición.
   * Si la caja fue declarada REPUESTA manualmente (histórico conciliado fuera
   * del sistema) se respeta esa declaración mientras no haya aplicaciones.
   */
  estadoPorReposicion(caja, repuesto) {
    if (!caja) return null;
    if (caja.estado === EstadoCaja.ANULADA || caja.estado === EstadoCaja.BORRADOR) return caja.estado;
    const total = caja.total || 0;
    if (repuesto <= 0) {
      if (caja.estado !== EstadoCaja.REEMBOLSADA) return caja.estado;
      return caja.reposicionManual ? EstadoCaja.REEMBOLSADA : EstadoCaja.CONSIGNADA;
    }
    if (repuesto >= total) return EstadoCaja.REEMBOLSADA;
    return EstadoCaja.CONSIGNADA;
  },

  /**
   * Agregado de un conjunto de cajas.
   * DISTINCIÓN FUNDAMENTAL (§24): el gasto operativo sale de las CAJAS; el
   * dinero repuesto sale de las APLICACIONES de consignaciones. Son dos
   * fuentes distintas y JAMÁS se suman entre sí.
   */
  resumen(cajas, aplicacionesPorCaja) {
    let gasto = 0, gasolina = 0, aceite = 0, repuesto = 0, pendiente = 0, anuladas = 0, nCajas = 0;
    for (const c of cajas) {
      if (c.estado === EstadoCaja.ANULADA) { anuladas++; continue; }
      nCajas++;
      gasto += c.total || 0;
      gasolina += c.gasolina || 0;
      aceite += c.aceite || 0;
      const rep = (aplicacionesPorCaja && aplicacionesPorCaja.get(c.id)) || 0;
      repuesto += rep;
      pendiente += this.pendienteDe(c, rep);
    }
    return {
      gastoOperativo: gasto, gasolina, aceite,
      otros: gasto - gasolina - aceite,
      totalRepuesto: repuesto, pendienteReponer: pendiente,
      numeroCajas: nCajas, cajasAnuladas: anuladas,
      promedioCaja: nCajas ? Math.round(gasto / nCajas) : 0
    };
  },

  /** Verificación de consistencia de una consignación contra sus cajas (§22) */
  verificarConsignacion(valorConsignacion, asignaciones) {
    const asignado = U.sumBy(asignaciones || [], a => a.monto || 0);
    const diferencia = (valorConsignacion || 0) - asignado;
    return {
      totalCajas: asignado,
      valorConsignacion: valorConsignacion || 0,
      diferencia,
      cuadra: diferencia === 0,
      sobrante: diferencia > 0,
      faltante: diferencia < 0
    };
  }
};

/* --------------------------------------------------------------------------
   CajaService
   -------------------------------------------------------------------------- */
const CajaService = {
  /** arma el snapshot de solicitante/consignó a partir de las fichas actuales */
  construirSnapshots(solicitanteId, consignoId, municipioIdOperacion) {
    const sol = solicitanteId ? PersonaRepo.get(solicitanteId) : null;
    const con = consignoId ? PersonaRepo.get(consignoId) : null;
    const munSol = sol && sol.municipioId ? MunicipioRepo.get(sol.municipioId) : null;
    const munOp = municipioIdOperacion ? MunicipioRepo.get(municipioIdOperacion) : null;
    return {
