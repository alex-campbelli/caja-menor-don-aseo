      '<dt>Fecha</dt><dd>' + Fecha.larga(c.fecha) + '</dd>' +
      '<dt>Beneficiario</dt><dd>' + esc((c.beneficiario && c.beneficiario.nombre) || '—') + '</dd>' +
      '<dt>Cédula</dt><dd class="mono">' + esc(c.beneficiario && c.beneficiario.cedula ? Txt.cedulaFmt(c.beneficiario.cedula) : VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Banco</dt><dd>' + esc(c.banco || VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Cuenta</dt><dd class="mono">' + esc(c.beneficiario ? Txt.mascaraCuenta(c.beneficiario.numeroCuenta) || VALOR_NO_DISPONIBLE : VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Referencia</dt><dd class="mono">' + esc(c.referencia || '—') + '</dd>' +
      '<dt>ID interno</dt><dd class="mono fs11">' + esc(c.id) + '</dd>' +
      '<dt>Registrada</dt><dd>' + Fecha.stamp(c.creadoEn) + '</dd>' +
      '</dl>' +
      (c.observaciones ? '<div class="divider"></div><div class="fs12"><b>Observaciones:</b> ' + esc(c.observaciones) + '</div>' : '') +
      '</div></div></div>' +

      '<div class="card" id="expedienteCons"></div>';

    await Expediente.montar($('#expedienteCons'), {
      consignacionId: c.id, docs: d.documentos,
      tipoPorDefecto: TipoDocumento.COMPROBANTE_CONSIGNACION,
      titulo: 'Comprobantes y soportes de ' + c.numero
    });

    setAcciones(Object.assign({
      eliminar: async () => {
        if (!await Modal.confirmar({ titulo: 'Eliminar consignación', peligro: true, textoOk: 'Eliminar',
          html: 'Se eliminará <b>' + esc(c.numero) + '</b>, sus comprobantes y la relación con ' + d.filas.length +
                ' caja(s). Las cajas volverán a quedar <b>pendientes de reposición</b>.' })) return;
        await ConsignacionService.eliminar(c.id);
        Toast.ok('Consignación eliminada. Las cajas volvieron a pendientes.');
        Shell.refrescarConteos();
        Router.ir('consignaciones');
      }
    }, Expediente.acciones({ consignacionId: c.id, recargar: () => VistaConsignacion.render(cont, params) })));
  }
};


/* ==========================================================================
   VISTA · PERSONAS  (§6, §8)
   ========================================================================== */
const VistaPersonas = {
  filtros: { texto: '', estado: '', rol: '', municipioId: '' },

  async render(cont) {
    Shell.titulo('Personas', 'Solicitantes y personas que adelantan dinero');
    const f = this.filtros;
    const q = Txt.norm(f.texto);
    const candidatos = [];   // para las sugerencias: sin el filtro de texto
    let lista = PersonaRepo.todas().filter(p => {
      if (f.estado && p.estado !== f.estado) return false;
      if (f.rol === 'financiador' && !p.esFinanciador) return false;
      if (f.rol === 'solicitante' && !p.esSolicitante) return false;
      if (f.municipioId && p.municipioId !== f.municipioId) return false;
      candidatos.push(p);
      if (q) {
        const blob = [p.nombre, p.cedula, p.banco, p.cargo, p.correo, p.telefono,
          MunicipioRepo.nombre(p.municipioId)].join(' ');
        if (!Txt.norm(blob).includes(q)) return false;
      }
      return true;
    }).sort(U.by('nombre'));

    const v = await Analitica.vista();
    const gasto = new Map(), nCajas = new Map();
    for (const c of v.cajas) {
      if (c.estado === EstadoCaja.ANULADA || !c.solicitanteId) continue;
      gasto.set(c.solicitanteId, (gasto.get(c.solicitanteId) || 0) + c.total);
      nCajas.set(c.solicitanteId, (nCajas.get(c.solicitanteId) || 0) + 1);
    }

    cont.innerHTML =
      '<div class="page-head"><div><h1>Personas</h1>' +
      '<div class="ph-sub">' + lista.length + ' de ' + PersonaRepo.todas().length + ' · ' +
      PersonaRepo.financiadores().length + ' pueden adelantar dinero</div></div>' +
      '<div class="ph-actions">' +
      '<button class="btn" data-act="exportar">' + Icon('download', '', 14) + 'Exportar</button>' +
      '<button class="btn btn-primary" data-act="nueva">' + Icon('plus', '', 14) + 'Nueva persona</button></div></div>' +

      '<div class="card mb16"><div class="card-b" style="padding:12px 14px"><div class="filters" style="margin:0">' +
      '<div class="field" style="flex:1 1 240px"><label>Búsqueda</label>' +
      '<input class="inp" placeholder="Nombre, cédula, banco, cargo…" value="' + attr(f.texto) +
        '" id="buscaPer" data-act="pTexto"></div>' +
      '<div class="field"><label>Estado</label><select class="inp" data-act="pEstado">' +
      '<option value="">Todos</option><option value="ACTIVO"' + (f.estado === 'ACTIVO' ? ' selected' : '') + '>Activos</option>' +
      '<option value="INACTIVO"' + (f.estado === 'INACTIVO' ? ' selected' : '') + '>Inactivos</option></select></div>' +
      '<div class="field"><label>Rol</label><select class="inp" data-act="pRol">' +
      '<option value="">Todos</option>' +
      '<option value="solicitante"' + (f.rol === 'solicitante' ? ' selected' : '') + '>Solicitantes</option>' +
      '<option value="financiador"' + (f.rol === 'financiador' ? ' selected' : '') + '>Adelantan dinero</option></select></div>' +
      '<div class="field"><label>Municipio</label><select class="inp" data-act="pMun"><option value="">Todos</option>' +
      MunicipioRepo.todos().map(m => '<option value="' + m.id + '"' + (f.municipioId === m.id ? ' selected' : '') + '>' +
        esc(m.nombre) + '</option>').join('') + '</select></div>' +
      '<button class="btn" data-act="pLimpiar">' + Icon('refresh', '', 13) + 'Limpiar</button>' +
      '</div></div></div>' +

      '<div class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl">' +
      '<thead><tr><th>Nombre</th><th>Documento</th><th>Municipio</th><th>Banco</th><th>Cuenta</th>' +
      '<th>Cargo</th><th class="num">Cajas</th><th class="num">Gasto histórico</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>' +
      (lista.length ? lista.map(p =>
        '<tr class="row-click" data-ir="persona/' + attr(p.id) + '">' +
        '<td><b>' + esc(p.nombre) + '</b></td>' +
        '<td class="mono">' + esc(p.cedula ? Txt.cedulaFmt(p.cedula) : '—') + '</td>' +
        '<td>' + esc(MunicipioRepo.nombre(p.municipioId) || '—') + '</td>' +
        '<td class="trunc" style="max-width:120px">' + esc(p.banco || '—') + '</td>' +
        '<td class="mask">' + esc(Txt.mascaraCuenta(p.numeroCuenta) || '—') + '</td>' +
        '<td class="trunc" style="max-width:110px">' + esc(p.cargo || '—') + '</td>' +
        '<td class="num">' + (nCajas.get(p.id) || 0) + '</td>' +
        '<td class="num">' + (gasto.get(p.id) ? Money.format(gasto.get(p.id)) : '<span class="txt-3">—</span>') + '</td>' +
        '<td>' + (p.esFinanciador ? '<span class="pill np p-violet">Adelanta</span> ' : '') +
                 (p.esSolicitante ? '<span class="pill np p-blue">Solicita</span>' : '') + '</td>' +
        '<td>' + Comp.pillEstado(p.estado) + '</td>' +
        '<td class="nowrap"><button class="btn btn-sm btn-ghost btn-icon" data-act="editar" data-id="' + attr(p.id) +
          '" title="Editar">' + Icon('edit', '', 13) + '</button></td></tr>').join('')
        : '<tr><td colspan="11">' + Comp.vacio({ icono: 'personas', titulo: 'Sin personas',
            texto: 'Registre a los solicitantes y a quienes adelantan el dinero.',
            accion: 'nueva', textoAccion: 'Crear persona', iconoAccion: 'plus' }) + '</td></tr>') +
      '</tbody></table></div></div></div>';

    Combo.buscador('buscaPer', candidatos.flatMap(p => [
      { texto: p.nombre, tag: 'Nombre' },
      { texto: p.cedula, tag: 'Cédula' },
      { texto: MunicipioRepo.nombre(p.municipioId), tag: 'Municipio' },
      { texto: p.banco, tag: 'Banco' },
      { texto: p.cargo, tag: 'Cargo' }
    ]), texto => { if (texto === f.texto) return; f.texto = texto; VistaPersonas.render(cont); });

    setAcciones({
      pTexto: el => { if (el.value === f.texto) return; f.texto = el.value; VistaPersonas.render(cont); },
      pEstado: el => { f.estado = el.value; VistaPersonas.render(cont); },
      pRol: el => { f.rol = el.value; VistaPersonas.render(cont); },
      pMun: el => { f.municipioId = el.value; VistaPersonas.render(cont); },
      pLimpiar: () => { Object.assign(f, { texto: '', estado: '', rol: '', municipioId: '' }); VistaPersonas.render(cont); },
      nueva: () => VistaPersonas.modalPersona(null, () => VistaPersonas.render(cont)),
      editar: el => VistaPersonas.modalPersona(PersonaRepo.get(el.dataset.id), () => VistaPersonas.render(cont)),
      exportar: () => Exportar.personasExcel(lista, gasto, nCajas)
    });
  },

  modalPersona(persona, alGuardar) {
    const p = persona || Modelo.persona({ nombre: '' });
    const esNueva = !persona;
    Modal.abrir({
      titulo: esNueva ? 'Nueva persona' : 'Editar persona',
      subtitulo: esNueva ? 'Los datos bancarios se copiarán a las cajas menores que cree con esta persona'
                         : 'Los cambios NO alteran las cajas menores ya creadas',
      ancho: 'wide',
      cuerpo:
        (!esNueva ? '<div class="alert a-info mb16">' + Icon('info') +
          '<div>Las cajas existentes conservan los datos que tenían cuando se crearon. ' +
          'Los cambios aquí sólo aplican a las <b>nuevas</b> cajas.</div></div>' : '') +
        '<div class="row">' +
        '<div class="field" style="flex:2 1 260px"><label>Nombre completo <span class="req">*</span></label>' +
        '<input class="inp" id="pNombre" value="' + attr(p.nombre) + '" autofocus></div>' +
        '<div class="field" style="flex:0 0 150px"><label>Documento</label>' +
        '<select class="inp" id="pTipoDoc">' + TIPOS_DOCUMENTO.map(t =>
          '<option value="' + attr(t) + '"' +
          ((p.tipoDocumento || TIPOS_DOCUMENTO[0]) === t ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
        '</select></div>' +
        '<div class="field"><label>Número</label><input class="inp" id="pCedula" value="' + attr(p.cedula) +
        '" placeholder="Sin puntos"></div>' +
        '</div>' +
        '<div class="row">' +
        '<div class="field"><label>Banco</label><input class="inp" id="pBanco" value="' + attr(p.banco) + '" placeholder="Ej.: Bancolombia"></div>' +
        '<div class="field"><label>Tipo de cuenta</label><select class="inp" id="pTipoCta">' +
        '<option value="">— sin definir —</option>' +
        TIPOS_CUENTA.map(t => '<option value="' + attr(t) + '"' + (p.tipoCuenta === t ? ' selected' : '') + '>' + esc(t) + '</option>').join('') +
        '</select></div>' +
        '<div class="field"><label>Número de cuenta</label><input class="inp" id="pCuenta" value="' + attr(p.numeroCuenta) + '"></div>' +
        '</div>' +
        '<div class="row">' +
        '<div class="field"><label>Municipio habitual</label><select class="inp" id="pMunicipio">' +
        '<option value="">— sin definir —</option>' +
        MunicipioRepo.activos().map(m => '<option value="' + m.id + '"' + (p.municipioId === m.id ? ' selected' : '') + '>' +
          esc(m.nombre) + '</option>').join('') + '</select>' +
        '<div class="hint">Se propone al crear una caja, pero cada caja conserva el municipio de su operación.</div></div>' +
        '<div class="field"><label>Cargo</label><input class="inp" id="pCargo" value="' + attr(p.cargo) + '"></div>' +
        '</div>' +
        '<div class="row">' +
        '<div class="field"><label>Teléfono</label><input class="inp" id="pTel" value="' + attr(p.telefono) + '"></div>' +
        '<div class="field"><label>Correo</label><input class="inp" id="pCorreo" value="' + attr(p.correo) + '"></div>' +
        '<div class="field"><label>Estado</label><select class="inp" id="pEstadoSel">' +
        '<option value="ACTIVO"' + (p.estado === 'ACTIVO' ? ' selected' : '') + '>Activo</option>' +
        '<option value="INACTIVO"' + (p.estado === 'INACTIVO' ? ' selected' : '') + '>Inactivo</option></select></div>' +
        '</div>' +
        '<div class="field"><label>Observaciones</label><textarea class="inp" id="pObs">' + esc(p.observaciones) + '</textarea></div>' +
        '<div class="divider"></div>' +
        '<div class="fs11 txt-3 mb8" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Rol en la operación</div>' +
        '<div class="grid g2">' +
        '<div><label class="inline-lbl"><input type="checkbox" id="pSolicita"' + (p.esSolicitante ? ' checked' : '') + '>' +
        'Puede ser <b>solicitante</b></label>' +
        '<div class="hint">Aparece en el campo «Solicitante» al crear una caja menor. Desmárquelo para alguien ' +
        'que únicamente pone el dinero y nunca es el destinatario del gasto.</div></div>' +
        '<div><label class="inline-lbl"><input type="checkbox" id="pFinancia"' + (p.esFinanciador ? ' checked' : '') + '>' +
        'Puede <b>adelantar dinero</b></label>' +
        '<div class="hint">Aparece en el campo «Consignó» y como beneficiario de las consignaciones. ' +
        'Es quien pone el dinero por adelantado.</div></div>' +
        '</div>' +
        '<div id="pAvisoRol" class="mt12"></div>',
      pie: (!esNueva ? '<button class="btn btn-danger mf-left" id="pEliminar">' + Icon('trash', '', 14) + 'Eliminar</button>' : '') +
        '<button class="btn" data-cerrar>Cancelar</button>' +
        '<button class="btn btn-primary" id="pGuardar">' + Icon('save', '', 14) + 'Guardar</button>',
      async alMontar(m) {
        /* Al quitarle a alguien el rol de solicitante, avisar qué pasa con su histórico:
           el cambio NUNCA reescribe cajas ya creadas (§62). */
        const cbSol = m.querySelector('#pSolicita');
        const aviso = m.querySelector('#pAvisoRol');
        let nHist = 0;
        if (persona) {
          try { nHist = await db.count('cajas', 'solicitanteId', persona.id); } catch {}
        }
        const pintarAviso = () => {
          if (!aviso) return;
          if (persona && nHist > 0 && !cbSol.checked) {
            aviso.innerHTML = '<div class="alert a-warn" style="padding:9px 11px">' + Icon('warn', '', 14) +
              '<div>Esta persona figura como solicitante en <b>' + nHist + ' caja(s) ya registradas</b>. ' +
              'Al desmarcar la casilla dejará de proponerse en las cajas <b>nuevas</b>, pero esas ' +
              nHist + ' cajas <b>no se modifican</b> y seguirá apareciendo en los rankings históricos: ' +
              'ese gasto ocurrió y el sistema no reescribe el pasado. ' +
              'Si alguna de esas cajas quedó mal asignada, ábrala y cambie el solicitante desde «Editar».</div></div>';
          } else aviso.innerHTML = '';
        };
        if (cbSol) { cbSol.addEventListener('change', pintarAviso); pintarAviso(); }

        m.querySelector('#pGuardar').onclick = async () => {
          try {
            const datos = {
              id: persona ? persona.id : undefined,
              nombre: m.querySelector('#pNombre').value.trim(),
              tipoDocumento: m.querySelector('#pTipoDoc').value,
              cedula: m.querySelector('#pCedula').value.trim(),
              banco: m.querySelector('#pBanco').value.trim(),
              tipoCuenta: m.querySelector('#pTipoCta').value,
              numeroCuenta: m.querySelector('#pCuenta').value.trim(),
              municipioId: m.querySelector('#pMunicipio').value || null,
              cargo: m.querySelector('#pCargo').value.trim(),
              telefono: m.querySelector('#pTel').value.trim(),
              correo: m.querySelector('#pCorreo').value.trim(),
              observaciones: m.querySelector('#pObs').value.trim(),
              estado: m.querySelector('#pEstadoSel').value,
              esSolicitante: m.querySelector('#pSolicita').checked ? 1 : 0,
              esFinanciador: m.querySelector('#pFinancia').checked ? 1 : 0,
              origen: persona ? persona.origen : Origen.MANUAL,
              legacy: persona ? persona.legacy : null
            };
            const guardada = await PersonaRepo.guardar(datos);
            Modal.cerrar(m);
            Toast.ok('Persona "' + guardada.nombre + '" guardada.');
            Shell.refrescarConteos();
            if (alGuardar) alGuardar(guardada);
          } catch (e) { manejarError(e); }
        };
        const del = m.querySelector('#pEliminar');
        if (del) del.onclick = async () => {
          const usos = await PersonaRepo.contarUsos(persona.id);
          const total = usos.cajasSolicitante + usos.cajasConsigno + usos.consignaciones;
          if (total > 0) {
            Modal.alerta('No se puede eliminar',
              'La persona tiene <b>' + total + '</b> movimiento(s): ' + usos.cajasSolicitante + ' caja(s) como solicitante, ' +
              usos.cajasConsigno + ' como quien consignó y ' + usos.consignaciones + ' consignación(es).<br><br>' +
              'Para conservar la trazabilidad financiera, <b>desactívela</b> en lugar de eliminarla.', 'warn');
            return;
          }
          if (!await Modal.confirmar({ titulo: 'Eliminar persona', peligro: true, textoOk: 'Eliminar',
            html: 'Se eliminará <b>' + esc(persona.nombre) + '</b>. No tiene movimientos asociados.' })) return;
          await PersonaRepo.eliminar(persona.id);
          Modal.cerrar(m); Toast.ok('Persona eliminada.');
          Shell.refrescarConteos();
          if (alGuardar) alGuardar(null);
        };
      }
    });
  }
};

/* ==========================================================================

    Shell.titulo(p.nombre, 'Perfil e historial');
    const r = await Analitica.perfilPersona(id);
    const mun = p.municipioId ? MunicipioRepo.get(p.municipioId) : null;
    const serie = r.porMes.map(m => ({ etiqueta: m.etiqueta, corta: Fecha.mesCorto(m.clave), valor: m.total }));

    cont.innerHTML =
      '<div class="page-head"><div><div class="flex aic g8">' +

      '<h1>' + esc(p.nombre) + '</h1>' + Comp.pillEstado(p.estado) +
      (p.esFinanciador ? '<span class="pill np p-violet">Adelanta dinero</span>' : '') +
      (!p.esSolicitante ? '<span class="pill np p-gray">No solicita</span>' : '') + '</div>' +
      '<div class="ph-sub">' + esc([p.cargo, mun ? mun.nombre : '', p.cedula ? 'CC ' + Txt.cedulaFmt(p.cedula) : '']
        .filter(Boolean).join(' · ') || 'Sin datos adicionales') + '</div></div>' +
      '<div class="ph-actions">' +
      '<button class="btn" data-act="exportar">' + Icon('download', '', 14) + 'Exportar historial</button>' +
      '<button class="btn" data-act="editar">' + Icon('edit', '', 14) + 'Editar ficha</button>' +
      '<button class="btn btn-primary" data-act="nuevaCaja">' + Icon('plus', '', 14) + 'Nueva caja</button></div></div>' +

      (!p.esSolicitante && r.numeroCajas > 0

/* ==========================================================================
   VISTA · CATEGORÍAS  (§11, §12)
   ========================================================================== */
const VistaCategorias = {
  async render(cont) {
    Shell.titulo('Categorías', 'Catálogo administrable de conceptos');
    const cats = CategoriaRepo.todas();
    const v = await Analitica.vista();
    /* Un gasto cuenta para una categoría si la referencia apunta a ella o si el
       nombre congelado coincide. Mirando sólo la referencia, el catálogo decía
       «0 usos» junto a un concepto con cientos de movimientos a su nombre. */
    const porNombreNorm = new Map(cats.map(c => [c.nombreNorm, c.id]));
    const idDe = d => d.categoriaId ||
      (d.categoriaNombre ? porNombreNorm.get(Txt.norm(d.categoriaNombre)) || null : null);

    const uso = new Map(), monto = new Map();
    for (const d of v.detalles) {
      const id = idDe(d);
      if (!id) continue;
      uso.set(id, (uso.get(id) || 0) + 1);
      monto.set(id, (monto.get(id) || 0) + d.valor);
    }
    /* Sólo es «texto libre» lo que NO está en el catálogo. Antes seguía en la
       lista después de añadirlo, y el botón invitaba a crearlo de nuevo: de ahí
       el error de duplicado. */
    const libres = new Map();
    for (const d of v.detalles) {
      if (idDe(d) || !d.categoriaNombre) continue;
      const k = d.categoriaNombre;
      if (!libres.has(k)) libres.set(k, { nombre: k, n: 0, total: 0 });
      const o = libres.get(k); o.n++; o.total += d.valor;
    }
    const listaLibres = [...libres.values()].sort(U.by('total', 'desc'));

    cont.innerHTML =
      '<div class="page-head"><div><h1>Categorías</h1>' +
      '<div class="ph-sub">' + cats.length + ' categoría(s) · ' + CategoriaRepo.estadisticas().length +
      ' marcadas como medibles estadísticamente</div></div>' +
      '<div class="ph-actions"><button class="btn btn-primary" data-act="nueva">' + Icon('plus', '', 14) + 'Nueva categoría</button></div></div>' +

      '<div class="alert a-info mb16">' + Icon('info') +
      '<div>El catálogo es una <b>ayuda</b>, no una restricción: al crear una caja usted puede escribir cualquier concepto ' +
      'aunque no exista aquí. Marque una categoría como <b>medible estadísticamente</b> para que tenga su propia serie en ' +
      'los reportes (como gasolina y aceite).</div></div>' +

      '<div class="grid g32">' +
      '<div class="card"><div class="card-h"><h3>Catálogo</h3></div><div class="card-b flush">' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Categoría</th><th>Rol estadístico</th>' +
      '<th class="num">Usos</th><th class="num">Monto acumulado</th><th>Estado</th><th></th></tr></thead><tbody>' +
      cats.map(c => '<tr>' +
        '<td><b>' + esc(c.nombre) + '</b>' + (c.sistema ? ' <span class="pill np p-blue">sistema</span>' : '') +
          (c.descripcion ? '<div class="fs11 txt-3">' + esc(c.descripcion) + '</div>' : '') + '</td>' +
        '<td>' + (c.rol ? '<span class="pill np p-amber">' + esc(c.rol) + '</span>' :
          (c.estadistica ? '<span class="pill np p-green">medible</span>' : '<span class="txt-3">—</span>')) + '</td>' +
        '<td class="num">' + (uso.get(c.id) || 0) + '</td>' +
        '<td class="num">' + (monto.get(c.id) ? Money.format(monto.get(c.id)) : '<span class="txt-3">—</span>') + '</td>' +
        '<td>' + Comp.pillEstado(c.estado) + '</td>' +
        '<td class="nowrap">' +
          '<button class="btn btn-sm btn-ghost btn-icon" data-act="ver" data-id="' + attr(c.id) + '" title="Ver histórico">' + Icon('chart', '', 13) + '</button>' +
          '<button class="btn btn-sm btn-ghost btn-icon" data-act="editar" data-id="' + attr(c.id) + '" title="Editar">' + Icon('edit', '', 13) + '</button>' +
        '</td></tr>').join('') +
      '</tbody></table></div></div></div>' +

      '<div class="card"><div class="card-h"><h3>Conceptos escritos libremente</h3>' +
      '<span class="ch-sub">Usados en cajas sin estar en el catálogo</span></div><div class="card-b flush">' +
      (listaLibres.length ? '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr><th>Concepto</th>' +
        '<th class="num">Usos</th><th class="num">Monto</th><th></th></tr></thead><tbody>' +
        listaLibres.map(l => '<tr><td>' + esc(l.nombre) + '</td><td class="num">' + l.n + '</td>' +
          '<td class="num">' + Money.format(l.total) + '</td>' +
          '<td><button class="btn btn-sm" data-act="promover" data-nombre="' + attr(l.nombre) + '">Añadir al catálogo</button></td></tr>').join('') +
        '</tbody></table></div>'
        : '<div class="empty" style="padding:24px"><p>Todos los conceptos usados están en el catálogo.</p></div>') +
      '</div></div></div>';

    setAcciones({
      nueva: () => VistaCategorias.modal(null, () => VistaCategorias.render(cont)),
      editar: el => VistaCategorias.modal(CategoriaRepo.get(el.dataset.id), () => VistaCategorias.render(cont)),
      ver: el => Router.ir('categoria/' + el.dataset.id),
      promover: el => VistaCategorias.modal({ nombre: el.dataset.nombre }, () => VistaCategorias.render(cont))
    });
  },

  modal(cat, alGuardar) {
    const c = cat || {};
    const esNueva = !c.id;
    Modal.abrir({
      titulo: esNueva ? 'Nueva categoría' : 'Editar categoría',
      ancho: 'narrow',
      cuerpo:
        '<div class="field"><label>Nombre <span class="req">*</span></label>' +
        '<input class="inp" id="cNombre" value="' + attr(c.nombre || '') + '" autofocus></div>' +
        '<div class="field"><label>Descripción</label><input class="inp" id="cDesc" value="' + attr(c.descripcion || '') + '"></div>' +
        '<div class="field"><label class="inline-lbl"><input type="checkbox" id="cEstad"' + (c.estadistica ? ' checked' : '') + '>' +
        'Medible estadísticamente</label>' +
        '<div class="hint">Tendrá su propia serie en el dashboard y en el módulo de estadísticas, como gasolina y aceite. ' +
        'Los detalles marcados con este rol se descuentan del total, nunca se suman por encima.</div></div>' +
        (c.rol ? '<div class="field"><label>Rol estadístico</label><input class="inp" value="' + attr(c.rol) + '" readonly>' +
          '<div class="hint">El rol es estable: no cambia aunque renombre la categoría, para no romper el histórico.</div></div>' : '') +
        '<div class="field"><label>Estado</label><select class="inp" id="cEstado">' +
        '<option value="ACTIVO"' + (c.estado !== 'INACTIVO' ? ' selected' : '') + '>Activo</option>' +
        '<option value="INACTIVO"' + (c.estado === 'INACTIVO' ? ' selected' : '') + '>Inactivo</option></select></div>',
      pie: (!esNueva && !c.sistema ? '<button class="btn btn-danger mf-left" id="cEliminar">' + Icon('trash', '', 14) + 'Eliminar</button>' : '') +
        '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="cGuardar">Guardar</button>',
      alMontar(m) {
        m.querySelector('#cGuardar').onclick = async () => {
          try {
            const nombre = m.querySelector('#cNombre').value.trim();
            const estad = m.querySelector('#cEstad').checked;
            let rol = c.rol || null;
            if (estad && !rol) rol = Txt.slug(nombre).toUpperCase().slice(0, 24) || null;
            if (!estad && !c.sistema) rol = c.sistema ? rol : (c.rol && ['GASOLINA', 'ACEITE'].includes(c.rol) ? c.rol : null);
            const guardada = await CategoriaRepo.guardar({
              id: c.id, nombre, descripcion: m.querySelector('#cDesc').value.trim(),
              estadistica: estad ? 1 : 0, rol,
              estado: m.querySelector('#cEstado').value,
              sistema: c.sistema || 0, orden: c.orden, origen: c.origen || Origen.MANUAL
            });
            /* Sólo al crearla: renombrar una categoría no debe arrastrar textos
               sueltos ajenos que casualmente coincidan con el nombre nuevo. */
            const adoptados = esNueva ? await CategoriaRepo.adoptarTextoLibre(guardada) : 0;
            Modal.cerrar(m);
            Toast.ok('Categoría guardada.' + (adoptados
              ? ' Se vincularon ' + adoptados + ' movimiento(s) que ya la usaban.' : ''));
            if (alGuardar) alGuardar();
          } catch (e) { manejarError(e); }
        };
        const del = m.querySelector('#cEliminar');
        if (del) del.onclick = async () => {
          if (!await Modal.confirmar({ titulo: 'Eliminar categoría', peligro: true, textoOk: 'Eliminar',
            html: 'Se eliminará <b>' + esc(c.nombre) + '</b>. Sólo es posible si ningún detalle la usa.' })) return;
          try { await CategoriaRepo.eliminar(c.id); Modal.cerrar(m); Toast.ok('Categoría eliminada.'); if (alGuardar) alGuardar(); }
          catch (e) { manejarError(e); }
        };
      }
    });
  }
};

const VistaMunicipios = {

      titulo: m0.id ? 'Editar municipio' : 'Nuevo municipio', ancho: 'narrow',
      cuerpo: '<div class="field"><label>Nombre <span class="req">*</span></label>' +
        '<input class="inp" id="mNombre" value="' + attr(m0.nombre || '') + '" autofocus></div>' +
        '<div class="field"><label>Departamento</label><input class="inp" id="mDpto" value="' +
        attr(m0.departamento || 'Antioquia') + '"></div>' +

/* ==========================================================================
   VISTA · CONTRATOS
   --------------------------------------------------------------------------
   Cada contrato es una unidad económica cerrada: numeración, cajas,
   consignaciones, saldos y estadísticas propias. Los catálogos (personas,
   municipios, categorías) sí se comparten, porque un mismo líder o municipio
   suele intervenir en varios contratos.
   ========================================================================== */
const VistaContratos = {
  async render(cont) {
    Shell.titulo('Contratos', 'Cada contrato lleva su propia contabilidad');
    cont.innerHTML = Comp.cargando();

    const lista = ContratoRepo.todos();
    const activoId = ContratoRepo.activoId();
    const [cajas, cons, apls] = await Promise.all([
      db.getAll('cajas'), db.getAll('consignaciones'), db.getAll('aplicaciones')
    ]);
    const repuesto = new Map();
    apls.forEach(a => repuesto.set(a.cajaId, (repuesto.get(a.cajaId) || 0) + a.monto));

    const resumen = new Map();
    for (const c of lista) resumen.set(c.id, { n: 0, total: 0, pendiente: 0, cons: 0, valorCons: 0, desde: null, hasta: null });
    for (const c of cajas) {
      const r = resumen.get(c.contratoId); if (!r) continue;
      if (c.estado !== EstadoCaja.ANULADA) {
        r.n++; r.total += c.total;
        r.pendiente += Finanzas.pendienteDe(c, repuesto.get(c.id) || 0);
      }
      if (!r.desde || c.fecha < r.desde) r.desde = c.fecha;
      if (!r.hasta || c.fecha > r.hasta) r.hasta = c.fecha;
    }
    for (const k of cons) {
      const r = resumen.get(k.contratoId); if (!r) continue;
      r.cons++; r.valorCons += k.valor;
    }
    const sinContrato = cajas.filter(c => !c.contratoId).length;

    cont.innerHTML =
      '<div class="page-head"><div><h1>Contratos</h1>' +
      '<div class="ph-sub">' + lista.length + ' contrato(s) · el activo determina todo lo que ve en el resto del sistema</div></div>' +
      '<div class="ph-actions"><button class="btn btn-primary" data-act="nuevo">' +
      Icon('plus', '', 14) + 'Nuevo contrato</button></div></div>' +

      '<div class="alert a-info mb16">' + Icon('info') +
      '<div><b>Los contratos son independientes entre sí.</b> Cada uno tiene su propia numeración de cajas ' +
      '(CM-2026-00001 empieza de nuevo en cada contrato), sus propios saldos y sus propias estadísticas. ' +
      'El dinero nunca se mezcla: una consignación no puede cubrir cajas de otro contrato.<br>' +
      '<b>Lo que sí se comparte</b> son las personas, los municipios y las categorías, porque el mismo líder ' +
      'o el mismo municipio suele trabajar en varios contratos a la vez.</div></div>' +

      (sinContrato ? '<div class="alert a-warn mb16">' + Icon('warn') +
        '<div>' + sinContrato + ' caja(s) no tienen contrato asignado. Recargue la página para que se ejecute ' +
        'la migración automática.</div></div>' : '') +

      '<div class="grid g3">' +
      lista.map(c => {
        const r = resumen.get(c.id) || { n: 0, total: 0, pendiente: 0, cons: 0, valorCons: 0 };
        const esActivo = c.id === activoId;
        return '<div class="card" style="' + (esActivo ? 'border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)' : '') + '">' +
          '<div class="card-h"><div style="flex:1;min-width:0">' +
          '<h3 class="trunc">' + esc(c.nombre) + '</h3>' +
          '<div class="ch-sub">' + esc(c.numero ? 'N.° ' + c.numero : 'sin número') +
          (c.cliente ? ' · ' + esc(c.cliente) : '') + '</div></div>' +
          '<div class="ch-act">' +
          (esActivo ? '<span class="pill p-green">Activo</span>'
                    : '<button class="btn btn-sm" data-act="activar" data-id="' + attr(c.id) + '">Activar</button>') +
          '</div></div>' +
          '<div class="card-b">' +
          '<div class="flex g6 wrap mb12">' +
          '<span class="pill np ' + (c.estado === 'VIGENTE' ? 'p-green' : c.estado === 'SUSPENDIDO' ? 'p-amber' : 'p-gray') + '">' +
          esc(c.estado.charAt(0) + c.estado.slice(1).toLowerCase()) + '</span>' +
          '<span class="chip">' + esc(c.prefijoCaja) + '-…</span>' +
          (c.fechaInicio ? '<span class="chip">' + Icon('calendar', '', 11) + Fecha.corta(c.fechaInicio) +
            (c.fechaFin ? ' → ' + Fecha.corta(c.fechaFin) : '') + '</span>' : '') +
          '</div>' +
          '<dl class="dl">' +
          '<dt>Cajas</dt><dd>' + r.n.toLocaleString('es-CO') + '</dd>' +
          '<dt>Gasto</dt><dd><b>' + Money.format(r.total) + '</b></dd>' +
          '<dt>Pendiente</dt><dd>' + (r.pendiente ? '<b style="color:var(--dang-500)">' + Money.format(r.pendiente) + '</b>'
            : '<span class="txt-3">$ 0</span>') + '</dd>' +
          '<dt>Consignaciones</dt><dd>' + r.cons + ' · ' + Money.format(r.valorCons) + '</dd>' +
          (r.desde ? '<dt>Movimientos</dt><dd class="fs11">' + Fecha.corta(r.desde) + ' — ' + Fecha.corta(r.hasta) + '</dd>' : '') +
          '</dl>' +
          (c.observaciones ? '<div class="fs11 txt-3 mt8">' + esc(c.observaciones) + '</div>' : '') +
          '</div>' +
          '<div class="card-f flex g6">' +
          '<button class="btn btn-sm" data-act="editar" data-id="' + attr(c.id) + '">' + Icon('edit', '', 12) + 'Editar</button>' +
          (!esActivo ? '<button class="btn btn-sm" data-act="activar" data-id="' + attr(c.id) + '">' +
            Icon('fwd', '', 12) + 'Trabajar aquí</button>' : '') +
          '</div></div>';
      }).join('') +
      '</div>';

    setAcciones({
      nuevo: () => VistaContratos.modal(null, () => VistaContratos.render(cont)),
      editar: el => VistaContratos.modal(ContratoRepo.get(el.dataset.id), () => VistaContratos.render(cont)),
      activar: async el => {
        try {
          await ContratoRepo.cambiarActivo(el.dataset.id);
          Toast.ok('Ahora está trabajando en: ' + ContratoRepo.activo().nombre);
        } catch (e) { manejarError(e); }
      }
    });
  },

  modal(contrato, alGuardar) {
    const c = contrato || {};
    const esNuevo = !c.id;
    Modal.abrir({
      titulo: esNuevo ? 'Nuevo contrato' : 'Editar contrato',
      subtitulo: esNuevo ? 'Empezará con su propia numeración, desde cero' : c.nombre,
      ancho: 'wide',
      cuerpo:
        '<div class="row">' +
        '<div class="field" style="flex:2 1 240px"><label>Nombre del contrato <span class="req">*</span></label>' +
        '<input class="inp" id="kNombre" value="' + attr(c.nombre || '') + '" placeholder="Ej.: COMFENALCO" autofocus></div>' +
        '<div class="field"><label>Número</label>' +
        '<input class="inp" id="kNumero" value="' + attr(c.numero || '') + '" placeholder="CTO-2026-001"></div>' +
        '</div>' +
        '<div class="row">' +
        '<div class="field" style="flex:2 1 240px"><label>Cliente / entidad</label>' +
        '<input class="inp" id="kCliente" value="' + attr(c.cliente || '') + '" placeholder="Nombre del contratante"></div>' +
        '<div class="field"><label>Estado</label><select class="inp" id="kEstado">' +
        ['VIGENTE', 'SUSPENDIDO', 'FINALIZADO'].map(e => '<option value="' + e + '"' +
          ((c.estado || 'VIGENTE') === e ? ' selected' : '') + '>' + e.charAt(0) + e.slice(1).toLowerCase() + '</option>').join('') +
        '</select></div></div>' +
        '<div class="row">' +
        '<div class="field"><label>Fecha de inicio</label>' +
        '<input type="date" class="inp" id="kIni" value="' + attr(c.fechaInicio || '') + '"></div>' +
        '<div class="field"><label>Fecha final</label>' +
        '<input type="date" class="inp" id="kFin" value="' + attr(c.fechaFin || '') + '"></div>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="row">' +
        '<div class="field"><label>Prefijo de caja menor <span class="req">*</span></label>' +
        '<input class="inp" id="kPrefCaja" value="' + attr(c.prefijoCaja || 'CM') + '" maxlength="8"></div>' +
        '<div class="field"><label>Prefijo de consignación</label>' +
        '<input class="inp" id="kPrefCon" value="' + attr(c.prefijoConsignacion || 'CON') + '" maxlength="8"></div>' +
        '<div class="field"><label>Quien adelanta el dinero por defecto</label>' +
        '<select class="inp" id="kFinanciador"><option value="">— sin preseleccionar —</option>' +
        PersonaRepo.todas().filter(p => p.esFinanciador).map(p => '<option value="' + p.id + '"' +
          (c.financiadorPorDefectoId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') +
        '</select></div>' +
        '</div>' +
        (esNuevo ? '<div class="alert a-info" style="padding:9px 11px">' + Icon('info', '', 14) +
          '<div>La numeración de este contrato empieza en <b>' + esc((c.prefijoCaja || 'CM')) +
          '-' + Fecha.anio(Fecha.hoy()) + '-00001</b>, independiente de los demás contratos.</div></div>'
          : '<div class="alert a-warn" style="padding:9px 11px">' + Icon('warn', '', 14) +
          '<div>Cambiar el prefijo <b>no renumera</b> las cajas ya emitidas: los números existentes son inmutables.</div></div>') +
        '<div class="field mt12"><label>Observaciones</label>' +
        '<textarea class="inp" id="kObs">' + esc(c.observaciones || '') + '</textarea></div>',
      pie: (!esNuevo ? '<button class="btn btn-danger mf-left" id="kEliminar">' + Icon('trash', '', 14) + 'Eliminar</button>' : '') +
        '<button class="btn" data-cerrar>Cancelar</button>' +
        '<button class="btn btn-primary" id="kGuardar">' + Icon('save', '', 14) + 'Guardar</button>',
      alMontar(m) {
        m.querySelector('#kGuardar').onclick = async () => {
          try {
            const guardado = await ContratoRepo.guardar({
              id: c.id,
              nombre: m.querySelector('#kNombre').value.trim(),
              numero: m.querySelector('#kNumero').value.trim(),
              cliente: m.querySelector('#kCliente').value.trim(),
              estado: m.querySelector('#kEstado').value,
              fechaInicio: m.querySelector('#kIni').value,
              fechaFin: m.querySelector('#kFin').value,
              prefijoCaja: (m.querySelector('#kPrefCaja').value.trim() || 'CM').toUpperCase(),
              prefijoConsignacion: (m.querySelector('#kPrefCon').value.trim() || 'CON').toUpperCase(),
              financiadorPorDefectoId: m.querySelector('#kFinanciador').value || null,
              observaciones: m.querySelector('#kObs').value.trim()
            });
            const primero = ContratoRepo.todos().length === 1;
            if (primero || !ContratoRepo.activoId()) await ContratoRepo.cambiarActivo(guardado.id);
            Modal.cerrar(m);
            Toast.ok('Contrato «' + guardado.nombre + '» guardado.');
            Shell.pintarSelectorContrato();
            Shell.refrescarConteos();
            if (alGuardar) alGuardar(guardado);
          } catch (e) { manejarError(e); }
        };
        const del = m.querySelector('#kEliminar');
        if (del) del.onclick = async () => {
          const u = await ContratoRepo.usos(c.id);
          if (u.cajas || u.consignaciones) {
            Modal.alerta('No se puede eliminar',
              'El contrato tiene <b>' + u.cajas + '</b> caja(s) y <b>' + u.consignaciones + '</b> consignación(es). ' +
              'Eliminarlo destruiría información financiera.<br><br>Márquelo como <b>Finalizado</b> en su lugar: ' +
              'deja de aparecer como vigente pero conserva todo su histórico.', 'warn');
            return;
          }
          if (!await Modal.confirmar({ titulo: 'Eliminar contrato', peligro: true, textoOk: 'Eliminar',
            html: 'Se eliminará <b>' + esc(c.nombre) + '</b>. No tiene movimientos asociados.' })) return;
          try {
            await ContratoRepo.eliminar(c.id);
            Modal.cerrar(m); Toast.ok('Contrato eliminado.');
            Shell.pintarSelectorContrato();
            if (alGuardar) alGuardar(null);
          } catch (e) { manejarError(e); }
        };
      }
    });
  }
};


/* ==========================================================================
   VISTA · ESTADÍSTICAS  (§31, §57, §58)

const VistaEstadisticas = {
  filtros: { periodo: 'todo', anio: '', mes: '', desde: '', hasta: '', solicitanteId: '', municipioId: '', categoriaId: '', estado: '' },
  tab: 'general',

  async render(cont) {
    Shell.titulo('Estadísticas', 'Análisis histórico del contrato');
    cont.innerHTML = Comp.cargando('Calculando…');
    const f = this.filtros;
    const rango = Comp.rangoDe(f);
    const r = await Analitica.consultar(Object.assign({}, rango, {
      solicitanteId: f.solicitanteId, municipioId: f.municipioId,
      categoriaId: f.categoriaId, estado: f.estado
    }));
    const res = r.resumen;
    const serieMes = r.porMes.map(m => ({ etiqueta: m.etiqueta, corta: Fecha.mesCorto(m.clave), valor: m.total }));
    const serieGas = r.porMes.map(m => ({ etiqueta: m.etiqueta, corta: Fecha.mesCorto(m.clave), valor: m.gasolina }));
    const serieAce = r.porMes.map(m => ({ etiqueta: m.etiqueta, corta: Fecha.mesCorto(m.clave), valor: m.aceite }));
    const serieRep = r.porMes.map(m => ({ etiqueta: m.etiqueta, corta: Fecha.mesCorto(m.clave), valor: m.repuesto }));
    const nMeses = r.porMes.length || 1;

    cont.innerHTML =
      '<div class="page-head"><div><h1>Estadísticas</h1>' +
      '<div class="ph-sub">' + Comp.etiquetaPeriodo(f) + ' · ' + res.numeroCajas + ' cajas · ' +
      r.detalles.length + ' detalles</div></div>' +
      '<div class="ph-actions"><button class="btn" data-act="exportar">' + Icon('download', '', 14) + 'Exportar estadísticas</button></div></div>' +

      Comp.selectorPeriodo(f, 'est') +
      '<div class="filters">' +
      '<div class="field"><label>Solicitante</label><select class="inp" data-act="est:sol"><option value="">Todos</option>' +
      PersonaRepo.todas().sort(U.by('nombre')).map(p => '<option value="' + p.id + '"' +
        (f.solicitanteId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Municipio</label><select class="inp" data-act="est:mun"><option value="">Todos</option>' +
      MunicipioRepo.todos().map(m => '<option value="' + m.id + '"' + (f.municipioId === m.id ? ' selected' : '') + '>' +
        esc(m.nombre) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Categoría</label><select class="inp" data-act="est:cat"><option value="">Todas</option>' +
      CategoriaRepo.todas().map(c => '<option value="' + c.id + '"' + (f.categoriaId === c.id ? ' selected' : '') + '>' +
        esc(c.nombre) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Estado</label><select class="inp" data-act="est:estado"><option value="">Todos</option>' +
      Object.keys(ESTADO_CAJA_META).map(k => '<option value="' + k + '"' + (f.estado === k ? ' selected' : '') + '>' +
        ESTADO_CAJA_META[k].label + '</option>').join('') + '</select></div>' +
      '<button class="btn" data-act="est:limpiar">' + Icon('refresh', '', 13) + 'Limpiar</button>' +
      '</div>' +

      '<div class="grid g4 mb16">' +
      Comp.kpi({ label: 'Total gastado', valor: Money.format(res.gastoOperativo), color: 'var(--brand-500)', icono: 'money',
        meta: '<span>Promedio mensual ' + Money.compact(Math.round(res.gastoOperativo / nMeses)) + '</span>' }) +
      Comp.kpi({ label: 'Gasolina', valor: Money.format(res.gasolina), color: '#c8860d', icono: 'fuel',
        meta: '<span>Promedio mes ' + Money.compact(Math.round(res.gasolina / nMeses)) + '</span>' }) +
      Comp.kpi({ label: 'Aceite', valor: Money.format(res.aceite), color: '#6d4aca', icono: 'drop',
        meta: '<span>Promedio mes ' + Money.compact(Math.round(res.aceite / nMeses)) + '</span>' }) +
      Comp.kpi({ label: 'Repuesto / pendiente', color: 'var(--ok-500)', icono: 'check',
        valor: Money.format(res.totalRepuesto),
        meta: '<span>Pendiente <b style="color:var(--dang-500)">' + Money.format(res.pendienteReponer) + '</b></span>' }) +
      '</div>' +

      '<div class="tabs">' +
      [['general', 'General'], ['gasolina', 'Gasolina'], ['aceite', 'Aceite'], ['personas', 'Por persona'],
       ['municipios', 'Por municipio'], ['categorias', 'Por categoría'], ['meses', 'Por mes']]
        .map(([k, t]) => '<div class="tab' + (this.tab === k ? ' active' : '') + '" data-act="est:tab" data-t="' + k + '">' +
          esc(t) + '</div>').join('') +
      '</div>' +
      '<div id="estCuerpo"></div>';

    const cuerpo = $('#estCuerpo');
    const T = this.tab;

    if (T === 'general') {
      cuerpo.innerHTML =
        '<div class="grid g32 mb16">' +
        '<div class="card"><div class="card-h"><h3>Gasto vs. reposición por mes</h3>' +
        '<span class="ch-sub">Dos magnitudes distintas: nunca se suman</span></div><div class="card-b">' +
        Chart.linea([{ nombre: 'Gasto operativo', datos: serieMes, color: '#0f7f58' },
                     { nombre: 'Dinero repuesto', datos: serieRep, color: '#2563c9' }], { alto: 230 }) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>Composición</h3></div><div class="card-b">' +
        Chart.dona([{ etiqueta: 'Gasolina', valor: res.gasolina, color: '#c8860d' },
                    { etiqueta: 'Aceite', valor: res.aceite, color: '#6d4aca' },
                    { etiqueta: 'Otros', valor: Math.max(0, res.otros), color: '#0f7f58' }],
                   { alto: 190, centro: Money.compact(res.gastoOperativo), centroSub: 'total' }) + '</div></div>' +
        '</div>' +
        '<div class="grid g3">' +
        '<div class="card"><div class="card-h"><h3>Top personas</h3></div><div class="card-b">' +
        Comp.ranking(r.porPersona, { limite: 10, ruta: it => it.ref ? 'persona/' + it.clave : null }) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>Top municipios</h3></div><div class="card-b">' +
        Comp.ranking(r.porMunicipio, { limite: 10, color: 'var(--info-500)',
          ruta: it => it.ref ? 'municipio/' + it.clave : null }) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>Top categorías</h3></div><div class="card-b">' +
        Comp.ranking(r.porCategoria, { limite: 10, color: 'var(--warn-500)' }) + '</div></div>' +
        '</div>';
    } else if (T === 'gasolina' || T === 'aceite') {
      const esGas = T === 'gasolina';
      const rol = esGas ? RolEstadistico.GASOLINA : RolEstadistico.ACEITE;
      const color = esGas ? '#c8860d' : '#6d4aca';
      const serie = esGas ? serieGas : serieAce;
      const totalRol = esGas ? res.gasolina : res.aceite;
      const perfil = await Analitica.perfilCategoria({ rol });
      const porPersona = r.porPersona.map(p => ({ etiqueta: p.etiqueta, clave: p.clave, ref: p.ref, total: esGas ? p.gasolina : p.aceite, n: p.n }))
        .filter(p => p.total > 0).sort(U.by('total', 'desc'));
      const porMun = r.porMunicipio.map(p => ({ etiqueta: p.etiqueta, clave: p.clave, ref: p.ref, total: esGas ? p.gasolina : p.aceite }))
        .filter(p => p.total > 0).sort(U.by('total', 'desc'));
      const mesTop = serie.slice().sort((a, b) => b.valor - a.valor)[0];
      cuerpo.innerHTML =
        '<div class="grid g4 mb16">' +
        Comp.kpi({ label: 'Total histórico ' + T, valor: Money.format(totalRol), color, icono: esGas ? 'fuel' : 'drop' }) +
        Comp.kpi({ label: 'Promedio mensual', valor: Money.format(Math.round(totalRol / nMeses)), color, icono: 'calendar',
          meta: '<span>' + nMeses + ' meses con movimiento</span>' }) +
        Comp.kpi({ label: 'Promedio por registro', valor: Money.format(perfil.promedio), color, icono: 'list',
          meta: '<span>' + perfil.n + ' registros</span>' }) +
        Comp.kpi({ label: 'Mayor consumidor', valor: porPersona[0] ? Money.format(porPersona[0].total) : '—', color, icono: 'star',
          meta: '<span>' + (porPersona[0] ? esc(porPersona[0].etiqueta) : 'sin datos') + '</span>' }) +
        '</div>' +
        '<div class="card mb16"><div class="card-h"><h3>Evolución mensual de ' + T + '</h3>' +
        (mesTop ? '<span class="ch-sub">Mes más alto: ' + esc(mesTop.etiqueta) + ' · ' + Money.format(mesTop.valor) + '</span>' : '') +
        '</div><div class="card-b">' + Chart.barras(serie.map(s => Object.assign({}, s, { color })), { alto: 210 }) + '</div></div>' +
        '<div class="grid g2">' +
        '<div class="card"><div class="card-h"><h3>' + Txt.titulo(T) + ' por persona</h3></div><div class="card-b">' +
        Comp.ranking(porPersona, { limite: 15, color, ruta: it => it.ref ? 'persona/' + it.clave : null }) + '</div></div>' +
        '<div class="card"><div class="card-h"><h3>' + Txt.titulo(T) + ' por municipio</h3></div><div class="card-b">' +
        Comp.ranking(porMun, { limite: 15, color, ruta: it => it.ref ? 'municipio/' + it.clave : null }) + '</div></div>' +
        '</div>';
    } else if (T === 'personas') {
      cuerpo.innerHTML = this.tablaAgrupada(r.porPersona, 'Persona', it => it.ref ? 'persona/' + it.clave : null, res);
    } else if (T === 'municipios') {
      cuerpo.innerHTML = this.tablaAgrupada(r.porMunicipio, 'Municipio', it => it.ref ? 'municipio/' + it.clave : null, res);
    } else if (T === 'categorias') {
      cuerpo.innerHTML =
        '<div class="card"><div class="card-b flush"><div class="tbl-wrap"><table class="tbl">' +
        '<thead><tr><th>Categoría / concepto</th><th class="num">Movimientos</th><th class="num">Cajas</th>' +
        '<th class="num">Total</th><th class="num">% del gasto</th><th class="num">Promedio</th><th></th></tr></thead><tbody>' +
        r.porCategoria.map(c => '<tr>' +
          '<td><b>' + esc(c.etiqueta) + '</b>' + (!c.categoriaId ? ' <span class="co-tag">libre</span>' : '') + '</td>' +
          '<td class="num">' + c.n + '</td><td class="num">' + c.nCajas + '</td>' +
          '<td class="num"><b>' + Money.format(c.total) + '</b></td>' +

/* ==========================================================================

   ========================================================================== */
const VistaExpediente = {
  filtros: { texto: '', tipo: '', vinculo: '' },
  async render(cont) {
    Shell.titulo('Expediente documental', 'Todos los soportes del contrato');
    cont.innerHTML = Comp.cargando();
    const f = this.filtros;
    const todos = (await db.getAll('documentos')).filter(d => d.estado === Estado.ACTIVO);
    const v = await Analitica.vista();
    const consPorId = new Map(v.consignaciones.map(c => [c.id, c]));
    const q = Txt.norm(f.texto);
    const lista = todos.filter(d => {
      if (f.tipo && d.tipo !== f.tipo) return false;
      if (f.vinculo === 'caja' && !d.cajaId) return false;
      if (f.vinculo === 'consignacion' && !d.consignacionId) return false;
      if (f.vinculo === 'huerfano' && (d.cajaId || d.consignacionId)) return false;
      if (q) {
        const c = d.cajaId ? v.cajaPorId.get(d.cajaId) : null;
        const cn = d.consignacionId ? consPorId.get(d.consignacionId) : null;
        const blob = [d.nombre, d.descripcion, c && c.numero, cn && cn.numero, c && Comp.nombreSolicitante(c)].join(' ');
        if (!Txt.norm(blob).includes(q)) return false;
      }
      return true;
    }).sort(U.by('creadoEn', 'desc'));
    const porTipo = U.groupBy(todos, 'tipo');

    cont.innerHTML =
      '<div class="page-head"><div><h1>Expediente documental</h1>' +
      '<div class="ph-sub">' + todos.length + ' documento(s) · ' + Txt.bytes(U.sumBy(todos, d => d.tamano)) +
      ' en el expediente</div></div></div>' +
      '<div class="flex g6 wrap mb16">' +
      Object.keys(TIPO_DOC_META).map(t => {
        const n = (porTipo.get(t) || []).length;
        return '<span class="chip" style="cursor:pointer" data-act="filTipo" data-t="' + t + '">' +
          Icon(TIPO_DOC_META[t].icono, '', 12) + TIPO_DOC_META[t].label + ' <b>' + n + '</b></span>';
      }).join('') +
      (f.tipo ? '<button class="btn btn-sm" data-act="filTipo" data-t="">' + Icon('x', '', 12) + 'Quitar filtro</button>' : '') +
      '</div>' +
      '<div class="card mb16"><div class="card-b" style="padding:12px 14px"><div class="filters" style="margin:0">' +
      '<div class="field" style="flex:1 1 260px"><label>Búsqueda</label>' +
      '<input class="inp" placeholder="Nombre del archivo, caja, consignación…" value="' + attr(f.texto) +

      ];
    }), texto => { if (texto === f.texto) return; f.texto = texto; VistaExpediente.render(cont); });

    setAcciones(Object.assign({
      dTexto: el => { if (el.value === f.texto) return; f.texto = el.value; VistaExpediente.render(cont); },
      dVinculo: el => { f.vinculo = el.value; VistaExpediente.render(cont); },
      filTipo: el => { f.tipo = el.dataset.t; VistaExpediente.render(cont); }
    }, Expediente.acciones({ recargar: () => VistaExpediente.render(cont) })));
  }
};


/* ==========================================================================
   §10  INTERCAMBIO DE ARCHIVOS — ZIP, XLSX y CSV sin dependencias
   --------------------------------------------------------------------------
   Un .xlsx es un ZIP de XML. Se usan las APIs NATIVAS del navegador
   (DecompressionStream / CompressionStream, DOMParser) para leerlo y
   escribirlo sin cargar ninguna librería externa: el sistema sigue siendo
   un único archivo HTML autocontenido.
   ========================================================================== */
const Zip = (() => {
  /* --- CRC32 --- */
  const TABLA = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = TABLA[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  const te = new TextEncoder();
  const td = new TextDecoder('utf-8');

  async function inflar(u8) {
    if (typeof DecompressionStream === 'undefined')
      throw new ErrorDominio('Este navegador no soporta descompresión nativa. Use Chrome o Edge 80+.', 'SIN_DEFLATE');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function desinflar(u8) {
    if (typeof CompressionStream === 'undefined') return null;
    const cs = new CompressionStream('deflate-raw');
    const stream = new Blob([u8]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /* ---------------------- LECTURA ---------------------- */
  async function leer(arrayBuffer) {
    const u8 = new Uint8Array(arrayBuffer);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    // localizar End Of Central Directory
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new ErrorDominio('El archivo no es un ZIP/XLSX válido.', 'ZIP_INVALIDO');
    const nEntradas = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);

    const entradas = new Map();
    for (let i = 0; i < nEntradas; i++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const metodo = dv.getUint16(off + 10, true);
      const crc = dv.getUint32(off + 16, true);
      const compSize = dv.getUint32(off + 20, true);
      const rawSize = dv.getUint32(off + 24, true);
      const nLen = dv.getUint16(off + 28, true);
      const eLen = dv.getUint16(off + 30, true);
      const cLen = dv.getUint16(off + 32, true);
      const localOff = dv.getUint32(off + 42, true);
      const nombre = td.decode(u8.subarray(off + 46, off + 46 + nLen));
      entradas.set(nombre, { metodo, crc, compSize, rawSize, localOff });
      off += 46 + nLen + eLen + cLen;
    }

    async function extraer(nombre) {
      const e = entradas.get(nombre);
      if (!e) return null;
      const lo = e.localOff;
      if (dv.getUint32(lo, true) !== 0x04034b50) throw new ErrorDominio('Cabecera local corrupta en ' + nombre, 'ZIP_CORRUPTO');
      const nLen = dv.getUint16(lo + 26, true);
      const eLen = dv.getUint16(lo + 28, true);
      const inicio = lo + 30 + nLen + eLen;
      const datos = u8.subarray(inicio, inicio + e.compSize);
      if (e.metodo === 0) return datos.slice();
      if (e.metodo === 8) return await inflar(datos);
      throw new ErrorDominio('Método de compresión no soportado (' + e.metodo + ') en ' + nombre, 'ZIP_METODO');
    }
    return {
      nombres: () => [...entradas.keys()],
      tiene: n => entradas.has(n),
      texto: async n => { const b = await extraer(n); return b ? td.decode(b) : null; },
      bytes: extraer,
      blob: async (n, mime) => { const b = await extraer(n); return b ? new Blob([b], { type: mime || 'application/octet-stream' }) : null; }
    };
  }

  /* ---------------------- ESCRITURA ---------------------- */
  /** archivos: [{nombre, datos: string|Uint8Array|Blob, comprimir?:bool}] */
  async function escribir(archivos) {
    const locales = [];
    const central = [];
    let offset = 0;

    for (const a of archivos) {
      let bruto;
      if (typeof a.datos === 'string') bruto = te.encode(a.datos);
      else if (a.datos instanceof Blob) bruto = new Uint8Array(await a.datos.arrayBuffer());
      else bruto = a.datos;
      const nombreBytes = te.encode(a.nombre);
      const crc = crc32(bruto);
      let metodo = 0, cuerpo = bruto;
      if (a.comprimir !== false && bruto.length > 256) {
        const z = await desinflar(bruto);
        if (z && z.length < bruto.length) { metodo = 8; cuerpo = z; }
      }
      const lh = new Uint8Array(30 + nombreBytes.length);
      const ldv = new DataView(lh.buffer);
      ldv.setUint32(0, 0x04034b50, true);
      ldv.setUint16(4, 20, true);
      ldv.setUint16(6, 0x0800, true);          // UTF-8
      ldv.setUint16(8, metodo, true);
      ldv.setUint16(10, 0, true); ldv.setUint16(12, 0x2821, true); // hora/fecha fijas
      ldv.setUint32(14, crc, true);
      ldv.setUint32(18, cuerpo.length, true);
      ldv.setUint32(22, bruto.length, true);
      ldv.setUint16(26, nombreBytes.length, true);
      ldv.setUint16(28, 0, true);
      lh.set(nombreBytes, 30);
      locales.push(lh, cuerpo);

      const ch = new Uint8Array(46 + nombreBytes.length);
      const cdv = new DataView(ch.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0x0800, true);
      cdv.setUint16(10, metodo, true);
      cdv.setUint16(12, 0, true); cdv.setUint16(14, 0x2821, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, cuerpo.length, true);
      cdv.setUint32(24, bruto.length, true);
      cdv.setUint16(28, nombreBytes.length, true);
      cdv.setUint32(42, offset, true);
      ch.set(nombreBytes, 46);
      central.push(ch);
      offset += lh.length + cuerpo.length;
    }
    const centralSize = central.reduce((a, b) => a + b.length, 0);
    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(8, archivos.length, true);
    edv.setUint16(10, archivos.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, offset, true);
    return new Blob([...locales, ...central, eocd], { type: 'application/zip' });
  }

  return { leer, escribir, crc32 };
})();

/* --------------------------------------------------------------------------
   XLSX — lector y escritor OOXML mínimos pero correctos
   -------------------------------------------------------------------------- */
const Xlsx = (() => {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const FORMATOS_FECHA = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 27, 30, 36, 45, 46, 47, 50, 57]);

  function colDeRef(ref) {
    const m = String(ref).match(/^([A-Z]+)/);
    if (!m) return 0;
    let n = 0;
    for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }
  function refDeCol(n) {
    let s = '';
    n = n + 1;
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  /* ------------------------- LECTURA ------------------------- */
  async function leer(file) {
    const zip = await Zip.leer(await file.arrayBuffer());
    if (!zip.tiene('xl/workbook.xml'))
      throw new ErrorDominio('El archivo no parece un libro de Excel (.xlsx). Si es .xls antiguo, guárdelo como .xlsx.', 'NO_XLSX');
    const parser = new DOMParser();
    const wb = parser.parseFromString(await zip.texto('xl/workbook.xml'), 'application/xml');
    const relsTxt = await zip.texto('xl/_rels/workbook.xml.rels');
    const rels = new Map();
    if (relsTxt) {
      const rx = parser.parseFromString(relsTxt, 'application/xml');
      [...rx.getElementsByTagName('Relationship')].forEach(r => rels.set(r.getAttribute('Id'), r.getAttribute('Target')));
    }
    // cadenas compartidas
    const compartidas = [];
    if (zip.tiene('xl/sharedStrings.xml')) {
      const ss = parser.parseFromString(await zip.texto('xl/sharedStrings.xml'), 'application/xml');
      for (const si of ss.getElementsByTagNameNS(NS, 'si')) {
        let t = '';
        for (const nodo of si.getElementsByTagNameNS(NS, 't')) t += nodo.textContent;
        compartidas.push(t);
      }
    }
    // estilos → saber qué columnas son fechas
    const esFecha = [];
    if (zip.tiene('xl/styles.xml')) {
      const st = parser.parseFromString(await zip.texto('xl/styles.xml'), 'application/xml');
      const custom = new Map();
      for (const nf of st.getElementsByTagNameNS(NS, 'numFmt')) {
        custom.set(Number(nf.getAttribute('numFmtId')), nf.getAttribute('formatCode') || '');
      }
      const cellXfs = st.getElementsByTagNameNS(NS, 'cellXfs')[0];
      if (cellXfs) {
        [...cellXfs.getElementsByTagNameNS(NS, 'xf')].forEach(xf => {
          const id = Number(xf.getAttribute('numFmtId') || 0);
          const code = custom.get(id) || '';
          esFecha.push(FORMATOS_FECHA.has(id) || /[dmyhs]/i.test(code) && /(y{2,}|d{1,2}|m{3,})/i.test(code));
        });
      }
    }

    const hojas = [];
    for (const s of wb.getElementsByTagNameNS(NS, 'sheet')) {
      const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      let target = rels.get(rid) || '';
      if (target && !target.startsWith('xl/')) target = 'xl/' + target.replace(/^\/?/, '');
      hojas.push({ nombre: s.getAttribute('name'), ruta: target, estado: s.getAttribute('state') || 'visible' });
    }

    async function filas(nombreHoja) {
      const hoja = hojas.find(h => h.nombre === nombreHoja) || hojas[0];
      if (!hoja || !zip.tiene(hoja.ruta)) throw new ErrorDominio('No se pudo leer la hoja "' + nombreHoja + '".', 'HOJA');
      const doc = parser.parseFromString(await zip.texto(hoja.ruta), 'application/xml');
      const out = [];
      let maxCol = 0;
      for (const row of doc.getElementsByTagNameNS(NS, 'row')) {
        const idx = Number(row.getAttribute('r') || out.length + 1);
        const celdas = [];
        for (const c of row.getElementsByTagNameNS(NS, 'c')) {
          const col = colDeRef(c.getAttribute('r') || '');
          const t = c.getAttribute('t');
          const sIdx = Number(c.getAttribute('s') || -1);
          let valor = null, tipo = 'texto';
          const vNodo = c.getElementsByTagNameNS(NS, 'v')[0];
          const isNodo = c.getElementsByTagNameNS(NS, 'is')[0];
          if (t === 's' && vNodo) valor = compartidas[Number(vNodo.textContent)] ?? '';
          else if (t === 'inlineStr' && isNodo) {
            valor = ''; for (const n of isNodo.getElementsByTagNameNS(NS, 't')) valor += n.textContent;
          } else if (t === 'b' && vNodo) { valor = vNodo.textContent === '1'; tipo = 'bool'; }
          else if (t === 'e' && vNodo) { valor = vNodo.textContent; tipo = 'error'; }
          else if (vNodo) {
            const num = Number(vNodo.textContent);
            if (isFinite(num)) {
              tipo = (sIdx >= 0 && esFecha[sIdx]) ? 'fecha' : 'numero';
              valor = tipo === 'fecha' ? Fecha.deSerialExcel(num) : num;
            } else { valor = vNodo.textContent; }
          }
          celdas[col] = { valor, tipo };
          if (col > maxCol) maxCol = col;
        }
        out.push({ fila: idx, celdas });
      }
      return { filas: out, columnas: maxCol + 1 };
    }

    return { hojas, filas };
  }

  /* ------------------------- ESCRITURA ------------------------- */
  const escXml = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

  /**
   * hojas: [{ nombre, columnas:[{titulo, ancho, tipo}], filas:[[v,...]], notas?:[string] }]
   * tipos de celda: 'texto' | 'numero' | 'dinero' | 'fecha' | 'entero'
   */
  async function escribir(hojas, meta) {
    const ESTILOS = { texto: 0, cabecera: 1, dinero: 2, fecha: 3, entero: 4, numero: 0, titulo: 5, nota: 6 };
    const partes = [];

    const hojasXml = hojas.map((h, hi) => {
      const cols = h.columnas || [];
      let filasXml = '';
      let r = 1;
      if (h.titulo) {
        filasXml += '<row r="' + r + '"><c r="A' + r + '" t="inlineStr" s="' + ESTILOS.titulo +
          '"><is><t>' + escXml(h.titulo) + '</t></is></c></row>';
        r++;
        if (h.subtitulo) {
          filasXml += '<row r="' + r + '"><c r="A' + r + '" t="inlineStr" s="' + ESTILOS.nota +
            '"><is><t>' + escXml(h.subtitulo) + '</t></is></c></row>';
          r++;
        }
        filasXml += '<row r="' + r + '"></row>'; r++;
      }
      const filaCabecera = r;
      filasXml += '<row r="' + r + '">' + cols.map((c, i) =>
        '<c r="' + refDeCol(i) + r + '" t="inlineStr" s="' + ESTILOS.cabecera + '"><is><t>' +
        escXml(c.titulo) + '</t></is></c>').join('') + '</row>';
      r++;
      for (const fila of (h.filas || [])) {
        const celdas = fila.map((v, i) => {
          const ref = refDeCol(i) + r;
          const tipo = (cols[i] && cols[i].tipo) || 'texto';
          if (v === null || v === undefined || v === '') return '';
          if (tipo === 'dinero' || tipo === 'numero' || tipo === 'entero') {
            const n = typeof v === 'number' ? v : Number(String(v).replace(/[^\d.\-]/g, ''));
            if (!isFinite(n)) return '<c r="' + ref + '" t="inlineStr"><is><t>' + escXml(v) + '</t></is></c>';
            return '<c r="' + ref + '" s="' + ESTILOS[tipo] + '"><v>' + n + '</v></c>';
          }
          if (tipo === 'fecha') {
            const serial = Fecha.aSerialExcel(Fecha.parse(v));
            if (serial) return '<c r="' + ref + '" s="' + ESTILOS.fecha + '"><v>' + serial + '</v></c>';
          }
          return '<c r="' + ref + '" t="inlineStr" s="' + ESTILOS.texto + '"><is><t>' + escXml(v) + '</t></is></c>';
        }).join('');
        filasXml += '<row r="' + r + '">' + celdas + '</row>';
        r++;
      }
      const anchos = cols.length ? '<cols>' + cols.map((c, i) =>
        '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (c.ancho || 16) + '" customWidth="1"/>').join('') + '</cols>' : '';
      const dim = 'A1:' + refDeCol(Math.max(0, cols.length - 1)) + Math.max(1, r - 1);
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<worksheet xmlns="' + NS + '"><dimension ref="' + dim + '"/>' +
        '<sheetViews><sheetView' + (hi === 0 ? ' tabSelected="1"' : '') + ' workbookViewId="0">' +
        '<pane ySplit="' + filaCabecera + '" topLeftCell="A' + (filaCabecera + 1) + '" activePane="bottomLeft" state="frozen"/>' +
        '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>' + anchos +
        '<sheetData>' + filasXml + '</sheetData>' +
        '<autoFilter ref="A' + filaCabecera + ':' + refDeCol(Math.max(0, cols.length - 1)) + Math.max(filaCabecera, r - 1) + '"/>' +
        '</worksheet>';
    });

    const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="' + NS + '">' +
      '<numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;$&quot;\\ #,##0"/>' +
      '<numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts>' +
      '<fonts count="4"><font><sz val="11"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
      '<font><b/><sz val="14"/><color rgb="FF0F7F58"/><name val="Calibri"/></font>' +
      '<font><i/><sz val="10"/><color rgb="FF6B7C8C"/><name val="Calibri"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF0F7F58"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
      '<border><left style="thin"><color rgb="FFD9D9D9"/></left><right style="thin"><color rgb="FFD9D9D9"/></right>' +
      '<top style="thin"><color rgb="FFD9D9D9"/></top><bottom style="thin"><color rgb="FFD9D9D9"/></bottom><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="7">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>' +
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>' +
      '<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>' +
      '<xf numFmtId="3" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>' +
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +

/* --------------------------------------------------------------------------
   CSV
   -------------------------------------------------------------------------- */
const Csv = {
  generar(columnas, filas, sep) {
    const s = sep || ';';
    const q = v => {
      if (v === null || v === undefined) return '';
      const t = String(v);
      return /["\n\r;,]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    return '﻿' + [columnas.map(q).join(s), ...filas.map(f => f.map(q).join(s))].join('\r\n');
  },
  descargar(nombre, columnas, filas) {
    U.descargar(new Blob([this.generar(columnas, filas)], { type: 'text/csv;charset=utf-8' }), nombre);
  }
};

/* ==========================================================================

   --------------------------------------------------------------------------
   Se renderiza en HTML con CSS de impresión (@page letter) y se imprime con
