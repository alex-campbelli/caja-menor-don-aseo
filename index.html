      solicitante: Modelo.snapshotPersona(sol, munSol),
      consigno: Modelo.snapshotPersona(con, con && con.municipioId ? MunicipioRepo.get(con.municipioId) : null),
      municipio: munOp
    };
  },

  /** Normaliza un detalle de formulario: resuelve categoría (texto libre o catálogo) y rol */
  normalizarDetalle(d, contexto, orden) {
    /* Si se escribió a mano un nombre que ya está en el catálogo, se enlaza con
       él en vez de dejarlo como texto suelto: es la misma categoría, escrita
       sin elegirla de la lista. El catálogo sigue siendo una ayuda y no una
       restricción — un nombre que no exista se conserva tal cual. */
    const cat = d.categoriaId ? CategoriaRepo.get(d.categoriaId)
      : (d.categoriaNombre ? CategoriaRepo.porNombre(d.categoriaNombre) : null);
    const nombreCat = cat ? cat.nombre : String(d.categoriaNombre || '').trim();
    let rol = d.rol !== undefined ? d.rol : (cat ? cat.rol : null);
    if (rol === undefined) rol = null;
    return Modelo.detalle({
      id: d.id, cajaId: contexto.cajaId, contratoId: contexto.contratoId || null, orden: orden,
      categoriaId: cat ? cat.id : null,
      categoriaNombre: nombreCat,
      elemento: d.elemento,
      descripcion: d.descripcion,
      cantidad: d.cantidad,
      valorUnitario: d.valorUnitario || 0,
      valor: d.valor || 0,
      rol: rol,
      fecha: contexto.fecha, mes: Fecha.mesClave(contexto.fecha),
      personaId: contexto.solicitanteId || null,
      municipioId: contexto.municipioId || null,
      estadoCaja: contexto.estado,
      origen: d.origen || Origen.MANUAL,
      legacy: d.legacy || null,
      creadoEn: d.creadoEn
    });
  },

  async siguienteNumero(fecha, contratoId) {
    const anio = Fecha.anio(fecha || Fecha.hoy());
    const ctr = (contratoId ? ContratoRepo.get(contratoId) : ContratoRepo.activo()) || {};
    const pref = ctr.prefijoCaja || 'CM';
    const n = await Secuencia.siguiente(Secuencia.claveCaja(ctr.id || 'sin', pref, anio));
    return Secuencia.formatoCaja(anio, n, pref);
  },

  /**
   * Crea una caja con sus detalles en UNA transacción atómica.
   * entrada: { fecha, solicitanteId, consignoId, municipioId, direccion, estado,
   *            observaciones, retencion, detalles:[...], origen, legacy, numero? }
   */
  async crear(entrada) {
    const snaps = this.construirSnapshots(entrada.solicitanteId, entrada.consignoId, entrada.municipioId);
    const cajaId = ID.caja();
    const contratoId = entrada.contratoId || ContratoRepo.activoId();
    if (!contratoId) throw new ErrorDominio('No hay un contrato activo. Cree uno en Contratos.', 'SIN_CONTRATO');
    const ctx = {
      cajaId, contratoId, fecha: entrada.fecha, solicitanteId: entrada.solicitanteId || null,
      municipioId: entrada.municipioId || null, estado: entrada.estado || EstadoCaja.BORRADOR
    };
    const detalles = (entrada.detalles || []).map((d, i) => this.normalizarDetalle(d, ctx, i));
    const calc = Finanzas.calcular(detalles, entrada.retencion || 0);

    const borrador = Modelo.caja({
      id: cajaId,
      contratoId,
      numero: entrada.numero || null,
      fecha: entrada.fecha,
      solicitante: snaps.solicitante,
      solicitanteTexto: entrada.solicitanteTexto || '',
      consigno: snaps.consigno,
      consignoTexto: entrada.consignoTexto || '',
      municipioId: entrada.municipioId || null,
      municipioNombre: snaps.municipio ? snaps.municipio.nombre : (entrada.municipioNombre || ''),
      direccion: entrada.direccion || '',
      estado: ctx.estado,
      observaciones: entrada.observaciones || '',
      comentario: entrada.comentario || '',
      retencion: entrada.retencion || 0,
      origen: entrada.origen || Origen.MANUAL,
      legacy: entrada.legacy || null,
      requiereRevision: entrada.requiereRevision || 0,
      motivoRevision: entrada.motivoRevision || '',
      /* nace como REPUESTA sin consignación → es una declaración, no un registro */
      reposicionManual: ctx.estado === EstadoCaja.REEMBOLSADA ? 1 : 0
    });
    const errores = Validar.caja(Object.assign({}, borrador, { retencion: entrada.retencion || 0 }), detalles);
    if (errores.length && !entrada.omitirValidacion) throw new ErrorValidacion(errores);

    const caja = Object.assign(borrador, {
      subtotal: calc.subtotal, retencion: calc.retencion, total: calc.total,
      gasolina: calc.gasolina, aceite: calc.aceite, totalDetalles: detalles.length
    });
    if (!caja.numero) caja.numero = await this.siguienteNumero(caja.fecha, contratoId);

    await db.transaccion(['cajas', 'detalles'], async tx => {
      tx.put('cajas', caja);
      detalles.forEach(d => tx.put('detalles', d));
    });
    await Auditoria.registrar('caja', caja.id, 'CREAR', { numero: caja.numero, total: caja.total });
    Bus.emit('cajas:cambio', caja);
    return caja;
  },

  /** Actualiza cabecera + reemplaza el conjunto completo de detalles, atómicamente */
  async actualizar(cajaId, entrada) {
    const previa = await CajaRepo.get(cajaId);
    if (!previa) throw new ErrorDominio('Caja no encontrada.', 'NO_EXISTE');
    if (previa.estado === EstadoCaja.ANULADA) throw new ErrorDominio('Una caja anulada no se puede modificar.', 'ANULADA');

    // Si cambia el solicitante se toma un snapshot NUEVO; si no, se conserva el original (§62)
    const cambioSolicitante = entrada.solicitanteId !== undefined && entrada.solicitanteId !== previa.solicitanteId;
    const cambioConsigno = entrada.consignoId !== undefined && entrada.consignoId !== previa.consignoId;
    const snaps = this.construirSnapshots(
      entrada.solicitanteId !== undefined ? entrada.solicitanteId : previa.solicitanteId,
      entrada.consignoId !== undefined ? entrada.consignoId : previa.consignoId,
      entrada.municipioId !== undefined ? entrada.municipioId : previa.municipioId);

    const fecha = entrada.fecha || previa.fecha;
    const estado = entrada.estado || previa.estado;
    const municipioId = entrada.municipioId !== undefined ? entrada.municipioId : previa.municipioId;
    const solicitanteId = entrada.solicitanteId !== undefined ? entrada.solicitanteId : previa.solicitanteId;
    const ctx = { cajaId, contratoId: previa.contratoId, fecha, solicitanteId, municipioId, estado };
    const detalles = (entrada.detalles || []).map((d, i) => this.normalizarDetalle(d, ctx, i));
    const calc = Finanzas.calcular(detalles, entrada.retencion !== undefined ? entrada.retencion : previa.retencion);

    const caja = Modelo.caja(Object.assign({}, previa, {
      fecha, mes: Fecha.mesClave(fecha), anio: Fecha.anio(fecha),
      solicitante: cambioSolicitante ? snaps.solicitante : (previa.solicitante || snaps.solicitante),
      solicitanteId,
      solicitanteTexto: entrada.solicitanteTexto !== undefined ? entrada.solicitanteTexto : previa.solicitanteTexto,
      consigno: cambioConsigno ? snaps.consigno : (previa.consigno || snaps.consigno),
      consignoId: entrada.consignoId !== undefined ? entrada.consignoId : previa.consignoId,
      municipioId,
      municipioNombre: snaps.municipio ? snaps.municipio.nombre : previa.municipioNombre,
      direccion: entrada.direccion !== undefined ? entrada.direccion : previa.direccion,
      estado,
      observaciones: entrada.observaciones !== undefined ? entrada.observaciones : previa.observaciones,
      comentario: entrada.comentario !== undefined ? entrada.comentario : previa.comentario,
      subtotal: calc.subtotal, retencion: calc.retencion, total: calc.total,
      gasolina: calc.gasolina, aceite: calc.aceite, totalDetalles: detalles.length,
      requiereRevision: entrada.requiereRevision !== undefined ? (entrada.requiereRevision ? 1 : 0) : previa.requiereRevision,
      motivoRevision: entrada.motivoRevision !== undefined ? entrada.motivoRevision : previa.motivoRevision,
      creadoEn: previa.creadoEn
    }));
    const errores = Validar.caja(caja, detalles);
    if (errores.length && !entrada.omitirValidacion) throw new ErrorValidacion(errores);

    await db.transaccion(['cajas', 'detalles'], async tx => {
      const viejos = await tx.porIndice('detalles', 'cajaId', cajaId);
      viejos.forEach(d => tx.remove('detalles', d.id));
      detalles.forEach(d => tx.put('detalles', d));
      tx.put('cajas', caja);
    });
    // el saldo puede haber cambiado: reevaluar estado de reposición
    await this.recalcularReposicion(cajaId);
    await Auditoria.registrar('caja', cajaId, 'ACTUALIZAR', { numero: caja.numero, total: caja.total });
    Bus.emit('cajas:cambio', caja);
    return await CajaRepo.get(cajaId);
  },

  async cambiarEstado(cajaId, estado, motivo) {
    const caja = await CajaRepo.get(cajaId);
    if (!caja) throw new ErrorDominio('Caja no encontrada.', 'NO_EXISTE');
    if (!ESTADO_CAJA_META[estado]) throw new ErrorDominio('Estado no válido.', 'ESTADO');
    if (estado === EstadoCaja.ANULADA) return this.anular(cajaId, motivo);
    if (caja.estado === EstadoCaja.ANULADA) throw new ErrorDominio('Una caja anulada no cambia de estado.', 'ANULADA');
    const apls = await CajaRepo.aplicaciones(cajaId);
    const repuesto = Finanzas.repuesto(apls);
    // Marcar REPUESTA sin consignación registrada es una DECLARACIÓN explícita
    caja.reposicionManual = (estado === EstadoCaja.REEMBOLSADA && repuesto < caja.total) ? 1 : 0;
    caja.estado = estado;
    caja.actualizadoEn = Modelo.ahora();
    await db.put('cajas', caja);
    await this._sincronizarDetalles(cajaId, { estadoCaja: estado });
    await Auditoria.registrar('caja', cajaId, 'CAMBIO_ESTADO', { estado, motivo: motivo || '' });
    Bus.emit('cajas:cambio', caja);
    return caja;
  },

  /** Anular conserva el número y el histórico completo (§16, §45) */
  async anular(cajaId, motivo) {
    const caja = await CajaRepo.get(cajaId);
    if (!caja) throw new ErrorDominio('Caja no encontrada.', 'NO_EXISTE');
    const apls = await CajaRepo.aplicaciones(cajaId);
    if (apls.length) throw new ErrorDominio(
      'No se puede anular: la caja está incluida en ' + apls.length + ' consignación(es). Retírela de la consignación primero.',
      'CON_REPOSICION');
    caja.estado = EstadoCaja.ANULADA;
    caja.anuladaEn = Modelo.ahora();
    caja.motivoAnulacion = motivo || '';
    caja.actualizadoEn = Modelo.ahora();
    await db.put('cajas', caja);
    await this._sincronizarDetalles(cajaId, { estadoCaja: EstadoCaja.ANULADA });
    await Auditoria.registrar('caja', cajaId, 'ANULAR', { numero: caja.numero, motivo: motivo || '' });
    Bus.emit('cajas:cambio', caja);
    return caja;
  },

  async reactivar(cajaId, estado) {
    const caja = await CajaRepo.get(cajaId);
    if (!caja) throw new ErrorDominio('Caja no encontrada.', 'NO_EXISTE');
    if (caja.estado !== EstadoCaja.ANULADA) throw new ErrorDominio('La caja no está anulada.', 'ESTADO');
    caja.estado = estado || EstadoCaja.BORRADOR;
    caja.anuladaEn = null; caja.motivoAnulacion = '';
    caja.actualizadoEn = Modelo.ahora();
    await db.put('cajas', caja);
    await this._sincronizarDetalles(cajaId, { estadoCaja: caja.estado });
    await Auditoria.registrar('caja', cajaId, 'REACTIVAR', { numero: caja.numero });
    Bus.emit('cajas:cambio', caja);
    return caja;
  },

  /** sólo se permite borrar físicamente un BORRADOR sin dinero comprometido (§45) */
  async eliminar(cajaId) {
    const caja = await CajaRepo.get(cajaId);
    if (!caja) return;
    if (caja.estado !== EstadoCaja.BORRADOR)
      throw new ErrorDominio('Sólo se pueden eliminar cajas en estado Borrador. Use "Anular" para conservar el histórico.', 'NO_BORRADOR');
    const apls = await CajaRepo.aplicaciones(cajaId);
    if (apls.length) throw new ErrorDominio('La caja tiene reposiciones asociadas.', 'CON_REPOSICION');
    const docs = await CajaRepo.documentos(cajaId);
    await db.transaccion(['cajas', 'detalles', 'documentos', 'archivos'], async tx => {
      const ds = await tx.porIndice('detalles', 'cajaId', cajaId);
      ds.forEach(d => tx.remove('detalles', d.id));
      docs.forEach(d => { tx.remove('documentos', d.id); tx.remove('archivos', d.id); });
      tx.remove('cajas', cajaId);
    });
    await Auditoria.registrar('caja', cajaId, 'ELIMINAR', { numero: caja.numero });
    Bus.emit('cajas:cambio', null);
  },

  async _sincronizarDetalles(cajaId, parcial) {
    const ds = await CajaRepo.detalles(cajaId);
    if (!ds.length) return;
    ds.forEach(d => Object.assign(d, parcial, { actualizadoEn: Modelo.ahora() }));
    await db.putMany('detalles', ds);
  },

  /** Reevalúa el estado según lo efectivamente repuesto */
  async recalcularReposicion(cajaId) {
    const caja = await CajaRepo.get(cajaId);
    if (!caja) return null;
    const apls = await CajaRepo.aplicaciones(cajaId);
    const repuesto = Finanzas.repuesto(apls);
    const nuevo = Finanzas.estadoPorReposicion(caja, repuesto);
    if (nuevo && nuevo !== caja.estado) {
      caja.estado = nuevo; caja.actualizadoEn = Modelo.ahora();
      await db.put('cajas', caja);
      await this._sincronizarDetalles(cajaId, { estadoCaja: nuevo });
      Bus.emit('cajas:cambio', caja);
    }
    return caja;
  },

  /** Cajas con saldo pendiente por reponer, listas para asociar a una consignación */
  async pendientesDeReposicion(filtro) {
    const f = filtro || {};
    const cajas = await db.query('cajas', {
      indice: 'fecha', direccion: 'desc',
      filtro: c => c.estado !== EstadoCaja.ANULADA && c.estado !== EstadoCaja.BORRADOR
                   && (!f.contratoId || c.contratoId === f.contratoId)
                   && (!f.consignoId || c.consignoId === f.consignoId)
                   && (!f.desde || c.fecha >= f.desde) && (!f.hasta || c.fecha <= f.hasta)
    });
    const todasApls = await db.getAll('aplicaciones');
    const porCaja = new Map();
    for (const a of todasApls) porCaja.set(a.cajaId, (porCaja.get(a.cajaId) || 0) + a.monto);
    return cajas.map(c => {
      const rep = porCaja.get(c.id) || 0;
      return Object.assign({}, c, { _repuesto: rep, _pendiente: Finanzas.pendienteDe(c, rep) });
    }).filter(c => c._pendiente > 0 || (f.incluirId && f.incluirId.includes(c.id)));
  }
};

/* --------------------------------------------------------------------------
   ConsignacionService — reposición financiera (NO es gasto, §24)
   -------------------------------------------------------------------------- */
const ConsignacionService = {
  async siguienteNumero(fecha, contratoId) {
    const anio = Fecha.anio(fecha || Fecha.hoy());
    const ctr = (contratoId ? ContratoRepo.get(contratoId) : ContratoRepo.activo()) || {};
    const pref = ctr.prefijoConsignacion || 'CON';
    const n = await Secuencia.siguiente(Secuencia.claveConsignacion(ctr.id || 'sin', pref, anio));
    return Secuencia.formatoConsignacion(anio, n, pref);
  },

  /** entrada: { fecha, beneficiarioId, valor, banco, referencia, observaciones,
   *             asignaciones: [{cajaId, monto}] } */
  async crear(entrada) {
    const ben = entrada.beneficiarioId ? PersonaRepo.get(entrada.beneficiarioId) : null;
    const contratoId = entrada.contratoId || ContratoRepo.activoId();
    if (!contratoId) throw new ErrorDominio('No hay un contrato activo. Cree uno en Contratos.', 'SIN_CONTRATO');
    const con = Modelo.consignacion({
      contratoId,
      numero: entrada.numero || null,
      fecha: entrada.fecha,
      beneficiario: Modelo.snapshotPersona(ben, ben && ben.municipioId ? MunicipioRepo.get(ben.municipioId) : null),
      valor: entrada.valor || 0,
      banco: entrada.banco || (ben ? ben.banco : ''),
      referencia: entrada.referencia || '',
      observaciones: entrada.observaciones || '',
      origen: entrada.origen || Origen.MANUAL
    });
    const errores = Validar.consignacion(con);
    if (errores.length) throw new ErrorValidacion(errores);
    if (!con.numero) con.numero = await this.siguienteNumero(con.fecha, contratoId);

    const asigns = await this._validarAsignaciones(con.id, entrada.asignaciones || [], undefined, contratoId);
    await db.transaccion(['consignaciones', 'aplicaciones'], async tx => {
      tx.put('consignaciones', con);
      asigns.forEach(a => tx.put('aplicaciones', a));
    });
    for (const a of asigns) await CajaService.recalcularReposicion(a.cajaId);
    await Auditoria.registrar('consignacion', con.id, 'CREAR', { numero: con.numero, valor: con.valor, cajas: asigns.length });
    Bus.emit('consignaciones:cambio', con);
    return con;
  },

  async actualizar(id, entrada) {
    const previa = await ConsignacionRepo.get(id);
    if (!previa) throw new ErrorDominio('Consignación no encontrada.', 'NO_EXISTE');
    const benId = entrada.beneficiarioId !== undefined ? entrada.beneficiarioId : previa.beneficiarioId;
    const ben = benId ? PersonaRepo.get(benId) : null;
    const cambioBen = benId !== previa.beneficiarioId;
    const fecha = entrada.fecha || previa.fecha;
    const con = Modelo.consignacion(Object.assign({}, previa, {
      fecha, mes: Fecha.mesClave(fecha), anio: Fecha.anio(fecha),
      beneficiario: cambioBen ? Modelo.snapshotPersona(ben, ben && ben.municipioId ? MunicipioRepo.get(ben.municipioId) : null)
                              : previa.beneficiario,
      beneficiarioId: benId,
      valor: entrada.valor !== undefined ? entrada.valor : previa.valor,
      banco: entrada.banco !== undefined ? entrada.banco : previa.banco,
      referencia: entrada.referencia !== undefined ? entrada.referencia : previa.referencia,
      observaciones: entrada.observaciones !== undefined ? entrada.observaciones : previa.observaciones,
      creadoEn: previa.creadoEn
    }));
    const errores = Validar.consignacion(con);
    if (errores.length) throw new ErrorValidacion(errores);

    const previasApl = await ConsignacionRepo.aplicaciones(id);
    const cajasAfectadas = new Set(previasApl.map(a => a.cajaId));
    let asigns = previasApl;
    if (entrada.asignaciones) {
      asigns = await this._validarAsignaciones(id, entrada.asignaciones, id, con.contratoId);
      asigns.forEach(a => cajasAfectadas.add(a.cajaId));
    }
    await db.transaccion(['consignaciones', 'aplicaciones'], async tx => {
      tx.put('consignaciones', con);
      if (entrada.asignaciones) {
        previasApl.forEach(a => tx.remove('aplicaciones', a.id));
        asigns.forEach(a => tx.put('aplicaciones', a));
      }
    });
    for (const cid of cajasAfectadas) await CajaService.recalcularReposicion(cid);
    await Auditoria.registrar('consignacion', id, 'ACTUALIZAR', { numero: con.numero, valor: con.valor });
    Bus.emit('consignaciones:cambio', con);
    return con;
  },

  async eliminar(id) {
    const con = await ConsignacionRepo.get(id);
    if (!con) return;
    const apls = await ConsignacionRepo.aplicaciones(id);
    const docs = await ConsignacionRepo.documentos(id);
    const cajas = apls.map(a => a.cajaId);
    await db.transaccion(['consignaciones', 'aplicaciones', 'documentos', 'archivos'], async tx => {
      apls.forEach(a => tx.remove('aplicaciones', a.id));
      docs.forEach(d => { tx.remove('documentos', d.id); tx.remove('archivos', d.id); });
      tx.remove('consignaciones', id);
    });
    for (const cid of cajas) await CajaService.recalcularReposicion(cid);
    await Auditoria.registrar('consignacion', id, 'ELIMINAR', { numero: con.numero, valor: con.valor });
    Bus.emit('consignaciones:cambio', null);
  },

  /** valida que ninguna caja quede sobre-repuesta (integridad financiera) */
  async _validarAsignaciones(consignacionId, lista, excluirConsignacionId, contratoDeLaConsignacion) {
    const out = [];
    const errores = [];
    const todas = await db.getAll('aplicaciones');
    for (const a of lista) {
      if (!a.cajaId || !a.monto || a.monto <= 0) continue;
      const caja = await CajaRepo.get(a.cajaId);
      if (!caja) { errores.push('La caja ' + a.cajaId + ' no existe.'); continue; }
      if (caja.estado === EstadoCaja.ANULADA) { errores.push('La caja ' + caja.numero + ' está anulada y no puede reponerse.'); continue; }
      if (contratoDeLaConsignacion && caja.contratoId && caja.contratoId !== contratoDeLaConsignacion) {
        errores.push('La caja ' + caja.numero + ' pertenece a otro contrato: no puede repartirse dinero entre contratos.');
        continue;
      }
      const otras = todas.filter(x => x.cajaId === a.cajaId && x.consignacionId !== excluirConsignacionId);
      const yaRepuesto = U.sumBy(otras, x => x.monto);
      if (yaRepuesto + a.monto > caja.total)
        errores.push('La caja ' + caja.numero + ' quedaría sobre-repuesta: total ' + Money.format(caja.total) +
                     ', ya repuesto ' + Money.format(yaRepuesto) + ', se intenta aplicar ' + Money.format(a.monto) + '.');
      out.push(Modelo.aplicacion({ consignacionId, cajaId: a.cajaId, monto: a.monto }));
    }
    if (errores.length) throw new ErrorValidacion(errores);
    return out;
  },

  /** Detalle completo con las cajas cubiertas y la verificación de cuadre */
  async detalle(id) {
    const con = await ConsignacionRepo.get(id);
    if (!con) return null;
    const apls = await ConsignacionRepo.aplicaciones(id);
    const cajas = await db.getMany('cajas', apls.map(a => a.cajaId));
    const mapa = new Map(cajas.map(c => [c.id, c]));
    const filas = apls.map(a => ({ aplicacion: a, caja: mapa.get(a.cajaId) || null }));
    const verif = Finanzas.verificarConsignacion(con.valor, apls);
    const docs = await ConsignacionRepo.documentos(id);
    return { consignacion: con, filas, verificacion: verif, documentos: docs };
  }
};

/* --------------------------------------------------------------------------
   DocumentoService — expediente digital (§25, §26, §27)
   -------------------------------------------------------------------------- */
const DocumentoService = {
  MAX_BYTES: 40 * 1024 * 1024,

  async adjuntar(file, meta) {
    if (!file) throw new ErrorDominio('No se recibió archivo.', 'SIN_ARCHIVO');
    if (file.size > this.MAX_BYTES)
      throw new ErrorDominio('El archivo "' + file.name + '" supera 40 MB.', 'MUY_GRANDE');
    let hash = null;
    if (file.size <= 12 * 1024 * 1024) {
      try { hash = await U.hashHex(await file.arrayBuffer()); } catch {}
    }
    const doc = Modelo.documento({
      cajaId: meta.cajaId || null,
      consignacionId: meta.consignacionId || null,
      tipo: meta.tipo || TipoDocumento.OTRO,
      nombre: meta.nombre || file.name,
      nombreArchivo: file.name,
      mime: file.type || 'application/octet-stream',
      extension: U.extension(file.name),
      tamano: file.size,
      descripcion: meta.descripcion || '',
      hash,
      origen: meta.origen || Origen.MANUAL
    });
    doc.storageKey = doc.id;
    await db.transaccion(['documentos', 'archivos'], async tx => {
      tx.put('documentos', doc);
      tx.put('archivos', { docId: doc.id, blob: file, mime: doc.mime, nombre: file.name, tamano: file.size });
    });
    await Auditoria.registrar('documento', doc.id, 'CARGAR',
      { nombre: doc.nombre, tipo: doc.tipo, cajaId: doc.cajaId, consignacionId: doc.consignacionId });
    Bus.emit('documentos:cambio', doc);
    return doc;
  },

  /** guarda un documento generado por el sistema (formato de caja en HTML congelado) */
  async guardarGenerado(html, meta) {
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const nombre = U.nombreSeguro(meta.nombre || 'formato') + '.html';
    const file = new File([blob], nombre, { type: 'text/html' });
    const doc = await this.adjuntar(file, Object.assign({}, meta, { origen: Origen.SISTEMA }));
    doc.snapshotHtml = true;
    await db.put('documentos', doc);
    return doc;
  },

  async blob(docId) {
    const a = await db.get('archivos', docId);
    return a ? a.blob : null;
  },
  async url(docId) {
    const b = await this.blob(docId);
    return b ? URL.createObjectURL(b) : null;
  },
  async descargar(doc) {
    const b = await this.blob(doc.id);
    if (!b) throw new ErrorDominio('El archivo no está disponible.', 'SIN_ARCHIVO');
    U.descargar(b, doc.nombreArchivo || doc.nombre);
  },
  async actualizar(docId, parcial) {
    const d = await db.get('documentos', docId);
    if (!d) throw new ErrorDominio('Documento no encontrado.', 'NO_EXISTE');
    Object.assign(d, parcial, { actualizadoEn: Modelo.ahora() });
    await db.put('documentos', d);
    Bus.emit('documentos:cambio', d);
    return d;
  },
  async eliminar(docId) {
    const d = await db.get('documentos', docId);
    if (!d) return;
    await db.transaccion(['documentos', 'archivos'], async tx => {
      tx.remove('documentos', docId); tx.remove('archivos', docId);
    });
    await Auditoria.registrar('documento', docId, 'ELIMINAR', { nombre: d.nombre, tipo: d.tipo });
    Bus.emit('documentos:cambio', null);
  },
  /** detecta un archivo idéntico ya adjunto a la misma caja */
  async duplicado(hash, cajaId, consignacionId) {
    if (!hash) return null;
    const lista = cajaId ? await db.query('documentos', { indice: 'cajaId', valor: cajaId })
                         : await db.query('documentos', { indice: 'consignacionId', valor: consignacionId });
    return lista.find(d => d.hash === hash) || null;
  },
  async contarPorCaja(cajaId) { return db.count('documentos', 'cajaId', cajaId); }
};


/* --------------------------------------------------------------------------
   Analitica — motor de estadísticas (§29 a §32, §54 a §58)
   --------------------------------------------------------------------------
   Estrategia de rendimiento: se construye UNA vista analítica en memoria
   (cajas + detalles + aplicaciones) y se cachea. Se invalida por eventos del
   bus, nunca por tiempo. Con 5.000 cajas / 20.000 detalles la construcción
   toma decenas de milisegundos y evita miles de lecturas repetidas a IndexedDB.
   Las TABLAS de la interfaz no usan esta vista: paginan por cursor.
   -------------------------------------------------------------------------- */
const Analitica = (() => {
  let vista = null;
  let construyendo = null;

  async function construir() {
    const [todasCajas, todosDetalles, aplicaciones, todasCons] = await Promise.all([
      db.getAll('cajas'), db.getAll('detalles'), db.getAll('aplicaciones'), db.getAll('consignaciones')
    ]);
    /* ACOTADO AL CONTRATO ACTIVO. Es el único punto donde se aplica el filtro:
       todas las vistas, perfiles, rankings y la búsqueda global lo heredan.
       El respaldo y la verificación de integridad NO usan esta vista: leen la
       base completa, porque deben abarcar todos los contratos. */
    const ctrId = ContratoRepo.activoId();
    const delContrato = x => !ctrId || !x.contratoId || x.contratoId === ctrId;
    const cajas = todasCajas.filter(delContrato);
    const idsCajas = new Set(cajas.map(c => c.id));
    const detalles = todosDetalles.filter(d => idsCajas.has(d.cajaId));
    const consignaciones = todasCons.filter(delContrato);
    const repuestoPorCaja = new Map();
    for (const a of aplicaciones) { if (!idsCajas.has(a.cajaId)) continue;
      repuestoPorCaja.set(a.cajaId, (repuestoPorCaja.get(a.cajaId) || 0) + (a.monto || 0)); }
    const cajaPorId = new Map(cajas.map(c => [c.id, c]));
    return { cajas, detalles, aplicaciones, consignaciones, repuestoPorCaja, cajaPorId, generadaEn: Date.now() };
  }

  async function obtener() {
    if (vista) return vista;
    if (!construyendo) construyendo = construir().then(v => { vista = v; construyendo = null; return v; });
    return construyendo;
  }
  function invalidar() { vista = null; }
  ['cajas:cambio', 'consignaciones:cambio', 'datos:reemplazados', 'import:finalizado',
   'contrato:cambio', 'contratos:cambio']
    .forEach(e => Bus.on(e, invalidar));

  function pasaFiltroCaja(c, f) {
    if (!f) return true;
    if (!f.incluirAnuladas && c.estado === EstadoCaja.ANULADA) return false;
    if (!f.incluirBorradores && c.estado === EstadoCaja.BORRADOR) return false;
    if (f.desde && c.fecha < f.desde) return false;
    if (f.hasta && c.fecha > f.hasta) return false;
    if (f.anio && c.anio !== String(f.anio)) return false;
    if (f.mes && c.mes !== f.mes) return false;
    if (f.solicitanteId && c.solicitanteId !== f.solicitanteId) return false;
    if (f.municipioId && c.municipioId !== f.municipioId) return false;
    if (f.consignoId && c.consignoId !== f.consignoId) return false;
    if (f.estado && c.estado !== f.estado) return false;
    if (f.origen && c.origen !== f.origen) return false;
    return true;
  }

  function etiquetaPersona(id, cajasRef) {
    const p = PersonaRepo.get(id);
    if (p) return p.nombre;
    const c = (cajasRef || []).find(x => x.solicitanteId === id);
    return (c && c.solicitante && c.solicitante.nombre) || 'Sin solicitante';
  }

  return {
    invalidar,
    async vista() { return obtener(); },

    /** Consulta principal: devuelve KPIs + todas las agrupaciones para un filtro */
    async consultar(filtros) {
      const f = filtros || {};
      const v = await obtener();
      const cajas = v.cajas.filter(c => pasaFiltroCaja(c, f));
      const ids = new Set(cajas.map(c => c.id));
      let detalles = v.detalles.filter(d => ids.has(d.cajaId));
      if (f.categoriaId) detalles = detalles.filter(d => d.categoriaId === f.categoriaId);
      if (f.categoriaNombre) {
        const n = Txt.norm(f.categoriaNombre);
        detalles = detalles.filter(d => Txt.norm(d.categoriaNombre) === n);
      }
      if (f.rol) detalles = detalles.filter(d => d.rol === f.rol);

      const resumen = Finanzas.resumen(cajas, v.repuestoPorCaja);

      // consignaciones del período (reposición ≠ gasto)
      const cons = v.consignaciones.filter(c =>
        (!f.desde || c.fecha >= f.desde) && (!f.hasta || c.fecha <= f.hasta) &&
        (!f.anio || c.anio === String(f.anio)) && (!f.mes || c.mes === f.mes) &&
        (!f.consignoId || c.beneficiarioId === f.consignoId));
      resumen.numeroConsignaciones = cons.length;
      resumen.valorConsignaciones = U.sumBy(cons, c => c.valor || 0);

      /* Agrupador genérico. Cuando una caja no tiene entidad relacionada (típico
         del histórico importado) NO se apilan todas en un solo cajón: cada texto
         distinto conserva su propia fila. `ref` indica si la clave es un
         identificador real y por tanto navegable. */
      const agr = (lista, refFn, textoFn) => {
        const m = new Map();
        for (const x of lista) {
          const id = refFn(x);
          const texto = textoFn(x);
          const k = id || ('txt:' + Txt.norm(texto));
          if (!m.has(k)) m.set(k, { clave: id || k, ref: Boolean(id), etiqueta: texto,
            total: 0, gasolina: 0, aceite: 0, n: 0, repuesto: 0, pendiente: 0 });
          const o = m.get(k);
          o.total += x.total || 0; o.gasolina += x.gasolina || 0; o.aceite += x.aceite || 0; o.n++;
          const rep = v.repuestoPorCaja.get(x.id) || 0;
          o.repuesto += rep; o.pendiente += Finanzas.pendienteDe(x, rep);
        }
        return [...m.values()].sort(U.by('total', 'desc'));
      };

      const porPersona = agr(cajas, c => c.solicitanteId || null,
        c => c.solicitanteId ? etiquetaPersona(c.solicitanteId, v.cajas)
                             : (c.solicitanteTexto || 'Sin solicitante identificado'));
      const porMunicipio = agr(cajas, c => c.municipioId || null,
        c => c.municipioId ? (MunicipioRepo.nombre(c.municipioId) || c.municipioNombre || 'Sin municipio')
                           : (c.municipioNombre || 'Sin municipio'));
      const porConsigno = agr(cajas, c => c.consignoId || null,
        c => c.consignoId ? etiquetaPersona(c.consignoId, v.cajas) : (c.consignoTexto || 'No registrado'));

      // categorías: se agrupan por DETALLE (no por caja) — un detalle = un gasto
      const mCat = new Map();
      for (const d of detalles) {
        const k = d.categoriaId || ('txt:' + Txt.norm(d.categoriaNombre || '(sin categoría)'));
        if (!mCat.has(k)) mCat.set(k, {
          clave: k, categoriaId: d.categoriaId || null,
          etiqueta: d.categoriaId ? (CategoriaRepo.nombre(d.categoriaId) || d.categoriaNombre) : (d.categoriaNombre || 'Sin categoría'),
          total: 0, n: 0, cajas: new Set()
        });
        const o = mCat.get(k);
        o.total += d.valor || 0; o.n++; o.cajas.add(d.cajaId);
      }
      const porCategoria = [...mCat.values()].map(o => ({
        clave: o.clave, categoriaId: o.categoriaId, etiqueta: o.etiqueta,
        total: o.total, n: o.n, nCajas: o.cajas.size
      })).sort(U.by('total', 'desc'));

      // meses
      const mMes = new Map();
      for (const c of cajas) {
        if (!mMes.has(c.mes)) mMes.set(c.mes, { clave: c.mes, etiqueta: Fecha.mesNombre(c.mes), total: 0, gasolina: 0, aceite: 0, n: 0, repuesto: 0 });
        const o = mMes.get(c.mes);
        o.total += c.total || 0; o.gasolina += c.gasolina || 0; o.aceite += c.aceite || 0; o.n++;
        o.repuesto += v.repuestoPorCaja.get(c.id) || 0;
      }
      const porMes = [...mMes.values()].sort(U.by('clave'));

      // roles estadísticos (gasolina, aceite y los que defina el usuario)
      const mRol = new Map();
      for (const d of detalles) {
        if (!d.rol) continue;
        if (!mRol.has(d.rol)) mRol.set(d.rol, { rol: d.rol, total: 0, n: 0 });
        const o = mRol.get(d.rol); o.total += d.valor || 0; o.n++;
      }
      const porRol = [...mRol.values()].sort(U.by('total', 'desc'));

      const mesTop = porMes.slice().sort(U.by('total', 'desc'))[0] || null;

      return {
        filtros: f, cajas, detalles, consignaciones: cons, resumen,
        porPersona, porMunicipio, porCategoria, porMes, porRol, porConsigno,
        mesMayorGasto: mesTop,
        repuestoPorCaja: v.repuestoPorCaja
      };
    },

    /** Perfil completo de una persona (§30, §54) */
    async perfilPersona(personaId) {
      const v = await obtener();
      const cajas = v.cajas.filter(c => c.solicitanteId === personaId && c.estado !== EstadoCaja.ANULADA);
      const anuladas = v.cajas.filter(c => c.solicitanteId === personaId && c.estado === EstadoCaja.ANULADA);
      const ids = new Set(cajas.map(c => c.id));
      const detalles = v.detalles.filter(d => ids.has(d.cajaId));
      const hoy = Fecha.hoy();
      const mesActual = Fecha.mesClave(hoy), anioActual = Fecha.anio(hoy);

      const mMes = new Map();
      for (const c of cajas) {
        if (!mMes.has(c.mes)) mMes.set(c.mes, { clave: c.mes, etiqueta: Fecha.mesNombre(c.mes), total: 0, gasolina: 0, aceite: 0, n: 0 });
        const o = mMes.get(c.mes);
        o.total += c.total; o.gasolina += c.gasolina; o.aceite += c.aceite; o.n++;
      }
      const porMes = [...mMes.values()].sort(U.by('clave'));
      const mesTop = porMes.slice().sort(U.by('total', 'desc'))[0] || null;

      const mCat = new Map();
      for (const d of detalles) {
        const k = d.categoriaNombre || 'Sin categoría';
        mCat.set(k, (mCat.get(k) || 0) + (d.valor || 0));
      }
      const porCategoria = [...mCat.entries()].map(([etiqueta, total]) => ({ etiqueta, total })).sort(U.by('total', 'desc'));

      const mMun = new Map();
      for (const c of cajas) {
        const k = c.municipioNombre || MunicipioRepo.nombre(c.municipioId) || 'Sin municipio';
        if (!mMun.has(k)) mMun.set(k, { etiqueta: k, total: 0, n: 0 });
        const o = mMun.get(k); o.total += c.total; o.n++;
      }
      const porMunicipio = [...mMun.values()].sort(U.by('total', 'desc'));

      const repuesto = U.sumBy(cajas, c => v.repuestoPorCaja.get(c.id) || 0);
      const totalHist = U.sumBy(cajas, c => c.total);

      return {
        persona: PersonaRepo.get(personaId),
        cajas: cajas.sort(U.by('fecha', 'desc')),
        cajasAnuladas: anuladas,
        detalles,
        totalHistorico: totalHist,
        totalAnio: U.sumBy(cajas.filter(c => c.anio === anioActual), c => c.total),
        totalMes: U.sumBy(cajas.filter(c => c.mes === mesActual), c => c.total),
        gasolina: U.sumBy(cajas, c => c.gasolina),
        aceite: U.sumBy(cajas, c => c.aceite),
        numeroCajas: cajas.length,
        repuesto,
        pendiente: U.sumBy(cajas, c => Finanzas.pendienteDe(c, v.repuestoPorCaja.get(c.id) || 0)),
        mesMayorGasto: mesTop,
        promedioCaja: cajas.length ? Math.round(totalHist / cajas.length) : 0,
        porMes, porCategoria, porMunicipio,
        primeraCaja: porMes[0] ? porMes[0].clave : null,
        repuestoPorCaja: v.repuestoPorCaja
      };
    },

    /** Perfil de municipio (§55) */
    async perfilMunicipio(municipioId) {
      const v = await obtener();
      const cajas = v.cajas.filter(c => c.municipioId === municipioId && c.estado !== EstadoCaja.ANULADA);
      const ids = new Set(cajas.map(c => c.id));
      const detalles = v.detalles.filter(d => ids.has(d.cajaId));
      const mPer = new Map();
      for (const c of cajas) {
        const texto = c.solicitanteId ? etiquetaPersona(c.solicitanteId, v.cajas) : (c.solicitanteTexto || 'Sin solicitante');
        const k = c.solicitanteId || ('txt:' + Txt.norm(texto));
        if (!mPer.has(k)) mPer.set(k, { etiqueta: texto, total: 0, n: 0, clave: c.solicitanteId || k, ref: Boolean(c.solicitanteId) });
        const o = mPer.get(k); o.total += c.total; o.n++;
      }
      const mMes = new Map();
      for (const c of cajas) {
        if (!mMes.has(c.mes)) mMes.set(c.mes, { clave: c.mes, etiqueta: Fecha.mesNombre(c.mes), total: 0, n: 0 });
        const o = mMes.get(c.mes); o.total += c.total; o.n++;
      }
      const mCat = new Map();
      for (const d of detalles) {
        const k = d.categoriaNombre || 'Sin categoría';
        mCat.set(k, (mCat.get(k) || 0) + (d.valor || 0));
      }
      return {
        municipio: MunicipioRepo.get(municipioId),
        cajas: cajas.sort(U.by('fecha', 'desc')),
        total: U.sumBy(cajas, c => c.total),
        gasolina: U.sumBy(cajas, c => c.gasolina),
        aceite: U.sumBy(cajas, c => c.aceite),
        numeroCajas: cajas.length,
        porPersona: [...mPer.values()].sort(U.by('total', 'desc')),
        porMes: [...mMes.values()].sort(U.by('clave')),
        porCategoria: [...mCat.entries()].map(([etiqueta, total]) => ({ etiqueta, total })).sort(U.by('total', 'desc')),
        repuestoPorCaja: v.repuestoPorCaja
      };
    },

    /** Perfil de categoría/concepto (§56) — acepta id de catálogo o texto libre */
    async perfilCategoria(opts) {
      const v = await obtener();
      const cajasVivas = new Map(v.cajas.filter(c => c.estado !== EstadoCaja.ANULADA).map(c => [c.id, c]));
      let detalles = v.detalles.filter(d => cajasVivas.has(d.cajaId));
      if (opts.categoriaId) detalles = detalles.filter(d => d.categoriaId === opts.categoriaId);
      else if (opts.texto) { const n = Txt.norm(opts.texto); detalles = detalles.filter(d => Txt.norm(d.categoriaNombre) === n); }
      else if (opts.rol) detalles = detalles.filter(d => d.rol === opts.rol);

      const mPer = new Map(), mMun = new Map(), mMes = new Map();
      for (const d of detalles) {
        const c = cajasVivas.get(d.cajaId);
        const tp = d.personaId ? etiquetaPersona(d.personaId, v.cajas) : ((c && c.solicitanteTexto) || 'Sin solicitante');
        const kp = d.personaId || ('txt:' + Txt.norm(tp));
        if (!mPer.has(kp)) mPer.set(kp, { clave: d.personaId || kp, ref: Boolean(d.personaId), etiqueta: tp, total: 0, n: 0 });
        mPer.get(kp).total += d.valor || 0; mPer.get(kp).n++;
        const tm = d.municipioId ? MunicipioRepo.nombre(d.municipioId) : ((c && c.municipioNombre) || 'Sin municipio');
        const km = d.municipioId || ('txt:' + Txt.norm(tm));
        if (!mMun.has(km)) mMun.set(km, { clave: d.municipioId || km, ref: Boolean(d.municipioId), etiqueta: tm, total: 0, n: 0 });
        mMun.get(km).total += d.valor || 0; mMun.get(km).n++;
        const kk = d.mes || (c && c.mes);
        if (kk) {
          if (!mMes.has(kk)) mMes.set(kk, { clave: kk, etiqueta: Fecha.mesNombre(kk), total: 0, n: 0 });
          mMes.get(kk).total += d.valor || 0; mMes.get(kk).n++;
        }
      }
      const total = U.sumBy(detalles, d => d.valor || 0);
      const porMes = [...mMes.values()].sort(U.by('clave'));
      return {
        detalles, total, n: detalles.length,
        promedio: detalles.length ? Math.round(total / detalles.length) : 0,
        porPersona: [...mPer.values()].sort(U.by('total', 'desc')),
        porMunicipio: [...mMun.values()].sort(U.by('total', 'desc')),
        porMes,
        mesMayor: porMes.slice().sort(U.by('total', 'desc'))[0] || null,
        cajas: U.uniq(detalles.map(d => d.cajaId)).length
      };
    },

    /** Saldo pendiente agrupado por quien adelantó el dinero (KPI "Pendiente Fabián") */
    async pendientePorFinanciador() {
      const v = await obtener();
      const m = new Map();
      for (const c of v.cajas) {
        if (c.estado === EstadoCaja.ANULADA || c.estado === EstadoCaja.BORRADOR) continue;
        const rep = v.repuestoPorCaja.get(c.id) || 0;
        const pend = Finanzas.pendienteDe(c, rep);
        if (pend <= 0) continue;
        const texto = c.consignoId ? etiquetaPersona(c.consignoId, v.cajas) : (c.consignoTexto || 'No registrado');
        const k = c.consignoId || ('txt:' + Txt.norm(texto));
        if (!m.has(k)) m.set(k, { clave: c.consignoId || k, ref: Boolean(c.consignoId), etiqueta: texto, pendiente: 0, n: 0 });
        const o = m.get(k); o.pendiente += pend; o.n++;
      }
      return [...m.values()].sort(U.by('pendiente', 'desc'));
    },

    /** Rankings del módulo Análisis (§32) */
    async rankings(filtros) {
      const r = await this.consultar(filtros || {});
      const topN = (lista, campo, n) => lista.slice().sort(U.by(campo, 'desc')).filter(x => x[campo] > 0).slice(0, n || 10);
      return {
        base: r,
        personas: {
          gasto: topN(r.porPersona, 'total'),
          gasolina: topN(r.porPersona, 'gasolina'),
          aceite: topN(r.porPersona, 'aceite'),
          cajas: topN(r.porPersona, 'n'),
          pendiente: topN(r.porPersona, 'pendiente')
        },
        municipios: {
          gasto: topN(r.porMunicipio, 'total'),
          gasolina: topN(r.porMunicipio, 'gasolina'),
          aceite: topN(r.porMunicipio, 'aceite'),
          cajas: topN(r.porMunicipio, 'n')
        },
        categorias: {
          gasto: topN(r.porCategoria, 'total', 15),
          frecuencia: topN(r.porCategoria, 'n', 15)
        }
      };
    },

    /** Cajas con inconsistencias declaradas (importadas o marcadas) */
    async revisiones() {
      const v = await obtener();
      return v.cajas.filter(c => c.requiereRevision).sort(U.by('fecha', 'desc'));
    }
  };
})();

/* ==========================================================================
   §7  APLICACIÓN — estado, router, búsqueda global
   ========================================================================== */
const Prefs = {
  datos: { tema: 'light', paginaTam: 25, sidebar: true },
  cargar() {
    try { Object.assign(this.datos, JSON.parse(localStorage.getItem(APP.prefsKey) || '{}')); } catch {}
    return this.datos;
  },
  set(k, v) { this.datos[k] = v; try { localStorage.setItem(APP.prefsKey, JSON.stringify(this.datos)); } catch {} },
  get(k) { return this.datos[k]; }
};

const Estado_App = {
  ruta: { vista: 'dashboard', params: {} },
  filtrosDashboard: { periodo: 'todo', anio: '', mes: '', desde: '', hasta: '' },
  filtrosCajas: { texto: '', estado: '', solicitanteId: '', municipioId: '', consignoId: '', categoriaId: '',
                  desde: '', hasta: '', pagina: 1, orden: 'fecha', dir: 'desc' },
  filtrosConsignaciones: { texto: '', beneficiarioId: '', desde: '', hasta: '', pagina: 1 },
  borradorCaja: null,
  cargando: false
};

/* --- Router hash: #/vista/param ------------------------------------------- */
const Router = (() => {
  const rutas = {};
  let actual = null;
  let secuencia = 0;              // identifica la última navegación pedida
  let enCurso = Promise.resolve(); // las navegaciones se atienden en fila
  function parse() {
    const h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    const partes = h.split('/').filter(Boolean).map(decodeURIComponent);
    return { vista: partes[0] || 'dashboard', params: partes.slice(1) };
  }
  return {
    registrar(nombre, fn) { rutas[nombre] = fn; },
    ir(ruta) { location.hash = '#/' + String(ruta).replace(/^#?\/?/, ''); },
    reemplazar(ruta) { history.replaceState(null, '', '#/' + String(ruta).replace(/^#?\/?/, '')); this.resolver(); },
    actual: () => actual,
    /**
     * Las navegaciones se atienden EN FILA, nunca a la vez. Sin esto, dos clics
     * seguidos lanzaban dos cargas en paralelo y pintaba la que terminara
     * última: se podía acabar viendo la pantalla de A con la dirección de B.
     * Además, una navegación que ya quedó atrás cuando llega su turno se
     * descarta sin consultar nada: no tiene sentido traer datos de una pantalla
     * que el usuario ya abandonó.
     */
    async resolver() {
      const mio = ++secuencia;
      enCurso = enCurso.then(() => this._pintar(mio));
      return enCurso;
    },
    async _pintar(mio) {
      if (mio !== secuencia) return;   // hubo otro clic después: éste sobra
      const r = parse();
      actual = r;
      Estado_App.ruta = r;
      const fn = rutas[r.vista] || rutas['404'];
      const cont = $('#vista');
      if (!cont) return;
      Cargando.iniciar();
      try {
        Bus.emit('ruta:cambio', r);    // el menú marca el destino al instante
        await fn(cont, r.params);
        cont.scrollIntoView({ block: 'start' });
        window.scrollTo(0, 0);
      } catch (e) {
        console.error('[router]', e);
        cont.innerHTML = Comp.errorPagina(e);
      } finally {
        Cargando.terminar();
      }
    },
    iniciar() {
      window.addEventListener('hashchange', () => this.resolver());
      this.resolver();
    }
  };
})();

/* --- Búsqueda global (§33, §59) ------------------------------------------- */
const Buscador = {
  async buscar(texto) {
    const q = Txt.norm(texto);
    if (q.length < 2) return { grupos: [], total: 0 };
    const digitos = q.replace(/\D/g, '');
    const v = await Analitica.vista();
    const grupos = [];
    const marcar = s => {
      const str = String(s || '');
      const i = Txt.norm(str).indexOf(q);
      if (i < 0) return esc(str);
      return esc(str.slice(0, i)) + '<mark>' + esc(str.slice(i, i + q.length)) + '</mark>' + esc(str.slice(i + q.length));
    };

    // personas
    const personas = PersonaRepo.todas().filter(p =>
      p.nombreNorm.includes(q) || (digitos && String(p.cedula || '').replace(/\D/g, '').includes(digitos))
    ).slice(0, 8);
    if (personas.length) grupos.push({
      titulo: 'Personas', icono: 'personas',
      items: personas.map(p => ({
        titulo: marcar(p.nombre),
        meta: p.cedula ? 'CC ' + Txt.cedulaFmt(p.cedula) : '',
        ruta: 'persona/' + p.id
      }))
    });

    // cajas
    const cajas = v.cajas.filter(c => {
      if (Txt.norm(c.numero).includes(q)) return true;
      if (c.solicitante && Txt.norm(c.solicitante.nombre).includes(q)) return true;
      if (c.solicitanteTexto && Txt.norm(c.solicitanteTexto).includes(q)) return true;
      if (Txt.norm(c.municipioNombre).includes(q)) return true;
      if (digitos && c.solicitante && String(c.solicitante.cedula || '').replace(/\D/g, '').includes(digitos)) return true;
      if (Txt.norm(c.observaciones).includes(q)) return true;
      return false;
    }).sort(U.by('fecha', 'desc')).slice(0, 8);
    if (cajas.length) grupos.push({
      titulo: 'Cajas menores', icono: 'caja',
      items: cajas.map(c => ({
        titulo: marcar(c.numero) + ' · ' + esc(Comp.nombreSolicitante(c)),
        meta: Money.format(c.total) + ' · ' + Fecha.corta(c.fecha),
        ruta: 'caja/' + c.id
      }))
    });

    // detalles (descripción / categoría)
    const dets = v.detalles.filter(d =>
      Txt.norm(d.descripcion).includes(q) || Txt.norm(d.categoriaNombre).includes(q)
    ).slice(0, 8);
    if (dets.length) grupos.push({
      titulo: 'Detalles de gasto', icono: 'list',
      items: dets.map(d => {
        const c = v.cajaPorId.get(d.cajaId);
        return {
          titulo: marcar(d.descripcion || d.categoriaNombre),
          meta: (c ? c.numero + ' · ' : '') + Money.format(d.valor),
          ruta: c ? 'caja/' + c.id : 'cajas'
        };
      })
    });

    // consignaciones
    const cons = v.consignaciones.filter(c =>
      Txt.norm(c.numero).includes(q) || Txt.norm(c.referencia).includes(q) ||
      (c.beneficiario && Txt.norm(c.beneficiario.nombre).includes(q)) || Txt.norm(c.banco).includes(q)
    ).slice(0, 6);
    if (cons.length) grupos.push({
      titulo: 'Consignaciones', icono: 'banco',
      items: cons.map(c => ({
        titulo: marcar(c.numero) + ' · ' + esc((c.beneficiario && c.beneficiario.nombre) || ''),
        meta: Money.format(c.valor) + ' · ' + Fecha.corta(c.fecha),
        ruta: 'consignacion/' + c.id
      }))
    });

    // municipios y categorías
    const muns = MunicipioRepo.todos().filter(m => m.nombreNorm.includes(q)).slice(0, 4);
    if (muns.length) grupos.push({
      titulo: 'Municipios', icono: 'pin',
      items: muns.map(m => ({ titulo: marcar(m.nombre), meta: '', ruta: 'municipio/' + m.id }))
    });
    const cats = CategoriaRepo.todas().filter(c => c.nombreNorm.includes(q)).slice(0, 4);
    if (cats.length) grupos.push({
      titulo: 'Categorías', icono: 'tag',
      items: cats.map(c => ({ titulo: marcar(c.nombre), meta: '', ruta: 'categoria/' + c.id }))
    });

    return { grupos, total: grupos.reduce((a, g) => a + g.items.length, 0) };
  }
};


/* ==========================================================================
   §8  UI KIT — componentes reutilizables
   ========================================================================== */
const Comp = {
  nombreSolicitante(caja) {
    if (!caja) return '';
    if (caja.solicitante && caja.solicitante.nombre) return caja.solicitante.nombre;
    return caja.solicitanteTexto || 'Sin solicitante';
  },
  nombreConsigno(caja) {
    if (!caja) return '';
    if (caja.consigno && caja.consigno.nombre) return caja.consigno.nombre;
    return caja.consignoTexto || '—';
  },

  kpi(o) {
    const cls = 'kpi' + (o.ruta || o.accion ? ' clickable' : '');
    const at = o.ruta ? ' data-ir="' + attr(o.ruta) + '"' : (o.accion ? ' data-act="' + attr(o.accion) + '"' : '');
    return '<div class="' + cls + '" style="--k:' + (o.color || 'var(--brand-500)') + '"' + at +
      (o.titulo ? ' title="' + attr(o.titulo) + '"' : '') + '>' +
      '<div class="kpi-l">' + (o.icono ? Icon(o.icono, '', 12) : '') + esc(o.label) + '</div>' +
      '<div class="kpi-v" style="' + (o.colorTexto ? 'color:' + o.colorTexto : '') + '">' + (o.html || esc(o.valor)) + '</div>' +
      (o.meta ? '<div class="kpi-m">' + o.meta + '</div>' : '') +
      '</div>';
  },

  pillEstadoCaja(estado) {
    const m = ESTADO_CAJA_META[estado] || { label: estado, pill: 'p-gray' };
    return '<span class="pill ' + m.pill + '">' + esc(m.label) + '</span>';
  },
  /**
   * Selector de estado embebido en una tabla (§16): permite cambiarlo sin
   * abrir la caja. Las anuladas no son editables aquí porque anular exige un
   * motivo y reactivar es una decisión deliberada: eso vive en el detalle.
   */
  selectorEstadoCaja(caja, accion) {
    if (caja.estado === EstadoCaja.ANULADA) {
      return '<span class="pill p-red" title="Las cajas anuladas se gestionan desde su detalle">Anulada</span>';
    }
    const meta = ESTADO_CAJA_META[caja.estado] || { pill: 'p-gray' };
    return '<select class="sel-estado ' + meta.pill + '" data-act="' + attr(accion) + '" data-id="' + attr(caja.id) + '"' +
      ' title="Cambiar el estado de ' + attr(caja.numero) + ' sin salir del listado">' +
      Object.keys(ESTADO_CAJA_META).filter(k => k !== EstadoCaja.ANULADA)
        .map(k => '<option value="' + k + '"' + (caja.estado === k ? ' selected' : '') + '>' +
          esc(ESTADO_CAJA_META[k].label) + '</option>').join('') +
      '</select>';
  },
  pillEstado(estado) {
    return '<span class="pill ' + (estado === Estado.ACTIVO ? 'p-green' : 'p-gray') + '">' +
      (estado === Estado.ACTIVO ? 'Activo' : 'Inactivo') + '</span>';
  },
  pillOrigen(origen) {
    const m = ORIGEN_META[origen] || ORIGEN_META.MANUAL;
    return '<span class="pill np ' + m.pill + '">' + esc(m.label) + '</span>';
  },

  vacio(o) {
    return '<div class="empty">' + Icon(o.icono || 'folder') +
      '<h4>' + esc(o.titulo || 'Sin información') + '</h4>' +
      '<p>' + esc(o.texto || '') + '</p>' +
      (o.accion ? '<button class="btn btn-primary" data-act="' + attr(o.accion) + '">' +
        (o.iconoAccion ? Icon(o.iconoAccion, '', 14) : '') + esc(o.textoAccion || 'Crear') + '</button>' : '') +
      '</div>';
  },

  errorPagina(e) {
    return '<div class="card"><div class="card-b">' +
      '<div class="alert a-err">' + Icon('warn') + '<div><b>Ocurrió un error al mostrar esta pantalla.</b><br>' +
      esc(e && e.message ? e.message : String(e)) + '</div></div>' +
      '<pre style="font-size:11px;color:var(--text-3);overflow:auto;margin-top:12px;max-height:220px">' +
      esc(e && e.stack ? e.stack : '') + '</pre></div></div>';
  },

  cargando(texto) {
    return '<div class="empty"><span class="spin"></span><h4 style="margin-top:12px">' +
      esc(texto || 'Cargando…') + '</h4></div>';
  },

  /** barra de progreso con etiqueta */
  progreso(pct, texto) {
    return '<div><div class="progress"><i style="width:' + U.clamp(pct, 0, 100).toFixed(1) + '%"></i></div>' +
      (texto ? '<div class="fs11 txt-3 mt4">' + esc(texto) + '</div>' : '') + '</div>';
  },

  /** lista de ranking con barras proporcionales */
  ranking(items, opts) {
    const o = opts || {};
    if (!items || !items.length) return '<div class="empty" style="padding:24px"><p>Sin datos en el período.</p></div>';
    const max = Math.max(...items.map(i => Math.abs(i[o.campo || 'total'] || 0)), 1);
    return items.slice(0, o.limite || 10).map((it, i) => {
      const v = it[o.campo || 'total'] || 0;
      const rutaAttr = o.ruta ? ' data-ir="' + attr(o.ruta(it)) + '" style="cursor:pointer"' : '';
      return '<div class="rank"' + rutaAttr + '>' +
        '<div class="rk-n">' + (i + 1) + '</div>' +
        '<div class="rk-b"><div class="rk-t"><span title="' + attr(it.etiqueta) + '">' + esc(it.etiqueta) + '</span>' +
        '<b>' + (o.formato ? o.formato(v) : Money.format(v)) + '</b></div>' +
        '<div class="bar"><i style="width:' + (Math.abs(v) / max * 100).toFixed(1) + '%' +
        (o.color ? ';background:' + o.color : '') + '"></i></div>' +
        (o.sub ? '<div class="fs11 txt-3 mt4">' + esc(o.sub(it)) + '</div>' : '') +
        '</div></div>';
    }).join('');
  },

  /** paginador estándar */
  pager(o) {
    const totalPags = Math.max(1, Math.ceil(o.total / o.tam));
    const desde = o.total === 0 ? 0 : (o.pagina - 1) * o.tam + 1;
    const hasta = Math.min(o.total, o.pagina * o.tam);
    return '<div class="pager">' +
      '<span>' + desde + '–' + hasta + ' de <b>' + o.total.toLocaleString('es-CO') + '</b></span>' +
      '<span class="pg-sp"></span>' +
      '<select class="inp" style="height:27px;width:auto;font-size:11.5px" data-act="' + attr(o.actTam) + '">' +
      [25, 50, 100, 250].map(n => '<option value="' + n + '"' + (n === o.tam ? ' selected' : '') + '>' + n + ' por página</option>').join('') +
      '</select>' +
      '<button class="btn btn-sm btn-icon" data-act="' + attr(o.actPag) + '" data-pagina="1" ' +
        (o.pagina <= 1 ? 'disabled' : '') + ' title="Primera">«</button>' +
      '<button class="btn btn-sm btn-icon" data-act="' + attr(o.actPag) + '" data-pagina="' + (o.pagina - 1) + '" ' +
        (o.pagina <= 1 ? 'disabled' : '') + '>' + Icon('back', '', 12) + '</button>' +
      '<span class="nowrap">Pág. <b>' + o.pagina + '</b> / ' + totalPags + '</span>' +
      '<button class="btn btn-sm btn-icon" data-act="' + attr(o.actPag) + '" data-pagina="' + (o.pagina + 1) + '" ' +
        (o.pagina >= totalPags ? 'disabled' : '') + '>' + Icon('fwd', '', 12) + '</button>' +
      '<button class="btn btn-sm btn-icon" data-act="' + attr(o.actPag) + '" data-pagina="' + totalPags + '" ' +
        (o.pagina >= totalPags ? 'disabled' : '') + ' title="Última">»</button>' +
      '</div>';
  },

  /** selector de período reutilizable (dashboard, estadísticas, análisis) */
  selectorPeriodo(f, prefijo) {
    const anios = Comp._aniosDisponibles();
    return '<div class="filters" data-periodo="' + attr(prefijo) + '">' +
      '<div class="seg">' +
      ['todo', 'anio', 'mes', 'rango'].map(p => '<button data-act="' + attr(prefijo) + ':periodo" data-p="' + p + '"' +
        (f.periodo === p ? ' class="on"' : '') + '>' +
        ({ todo: 'Todo', anio: 'Año', mes: 'Mes', rango: 'Rango' })[p] + '</button>').join('') +
      '</div>' +
      (f.periodo === 'anio' ? '<div class="field"><label>Año</label><select class="inp" data-act="' + attr(prefijo) + ':anio">' +
        anios.map(a => '<option value="' + a + '"' + (String(f.anio) === String(a) ? ' selected' : '') + '>' + a + '</option>').join('') +
        '</select></div>' : '') +
      (f.periodo === 'mes' ? '<div class="field"><label>Mes</label><input type="month" class="inp" value="' +
        attr(f.mes || Fecha.mesClave(Fecha.hoy())) + '" data-act="' + attr(prefijo) + ':mes"></div>' : '') +
      (f.periodo === 'rango' ? '<div class="field"><label>Desde</label><input type="date" class="inp" value="' +
        attr(f.desde || '') + '" data-act="' + attr(prefijo) + ':desde"></div>' +
        '<div class="field"><label>Hasta</label><input type="date" class="inp" value="' +
        attr(f.hasta || '') + '" data-act="' + attr(prefijo) + ':hasta"></div>' : '') +
      '</div>';
  },
  /**
   * Manejador para un filtro de fecha.
   *
   * Un <input type="date"> dispara «change» en cuanto la fecha queda completa,
   * y al teclear el año eso pasa CUATRO veces: 0002, 0020, 0202 y por fin 2026.
   * Cada una recargaba el listado —contra el servidor— y las intermedias
   * dejaban la pantalla vacía a mitad de escribir. De ahí la sensación de que
   * «se calcula con un solo número y recarga de la nada».
   *
   * Se espera a que la escritura pare y se descartan las fechas imposibles:
   * mientras el año está a medias no es una fecha, es un tecleo.
   */
  filtroFecha(aplicar) {
    return U.debounce(el => {
      const v = el.value;
      if (v && !Fecha.valida(v)) return;   // año incompleto: aún está escribiendo
      aplicar(v);
    }, 420);
  },

  _aniosDisponibles() {
    const ctr = ContratoRepo.activo() || {};
    const ini = Number(Fecha.anio(ctr.fechaInicio || '2025-10-29')) || 2025;
    const fin = Math.max(Number(Fecha.anio(Fecha.hoy())), ini);
    const out = [];
    for (let a = fin; a >= ini; a--) out.push(a);
    return out;
  },
  /** convierte el selector de período a {desde,hasta} */
  rangoDe(f) {
    if (!f || f.periodo === 'todo') return {};
    if (f.periodo === 'anio' && f.anio) return Fecha.rangoAnio(f.anio);
    if (f.periodo === 'mes' && f.mes) return Fecha.rangoMes(f.mes);
    if (f.periodo === 'rango') return { desde: f.desde || undefined, hasta: f.hasta || undefined };
    return {};
  },
  etiquetaPeriodo(f) {
    if (!f || f.periodo === 'todo') return 'Todo el histórico';
    if (f.periodo === 'anio') return 'Año ' + f.anio;
    if (f.periodo === 'mes') return Fecha.mesNombre(f.mes);
    if (f.periodo === 'rango') {
      if (f.desde && f.hasta) return Fecha.corta(f.desde) + ' — ' + Fecha.corta(f.hasta);
      if (f.desde) return 'Desde ' + Fecha.corta(f.desde);
      if (f.hasta) return 'Hasta ' + Fecha.corta(f.hasta);
    }
    return 'Todo el histórico';
  },

  /** ficha compacta de datos bancarios con enmascaramiento (§46) */
  fichaBancaria(snap, revelar) {
    if (!snap) return '<span class="txt-3">Sin información bancaria</span>';
    const cuenta = revelar ? (snap.numeroCuenta || VALOR_NO_DISPONIBLE) : Txt.mascaraCuenta(snap.numeroCuenta);
    return '<dl class="dl">' +
      '<dt>Banco</dt><dd>' + esc(snap.banco || VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Tipo</dt><dd>' + esc(snap.tipoCuenta || VALOR_NO_DISPONIBLE) + '</dd>' +
      '<dt>Cuenta</dt><dd class="mono">' + esc(cuenta || VALOR_NO_DISPONIBLE) + '</dd>' +
      '</dl>';
  },

  chipDoc(n, tipo) {
    const m = TIPO_DOC_META[tipo];
    return '<span class="chip">' + Icon(m.icono, '', 12) + esc(m.label) + ' <b>' + n + '</b></span>';
  }
};

/* --- Modales -------------------------------------------------------------- */
const Modal = (() => {
  const pila = [];
  function cerrarTop() {
    const m = pila.pop();
    if (m) { m.el.remove(); if (m.resolver) m.resolver(null); }
    if (!pila.length) document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); cerrarTop(); } }

  function abrir(o) {
    const id = 'md_' + Ulid.generate().slice(-8);
    const html =
      '<div class="modal-bd" id="' + id + '">' +
      '<div class="modal ' + (o.ancho || '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><div style="flex:1;min-width:0"><h3>' + esc(o.titulo) + '</h3>' +
      (o.subtitulo ? '<div class="mh-sub">' + esc(o.subtitulo) + '</div>' : '') + '</div>' +
      '<button class="btn btn-ghost btn-icon btn-sm" data-cerrar>' + Icon('x', '', 15) + '</button></div>' +
      '<div class="modal-b">' + o.cuerpo + '</div>' +
      (o.pie === null ? '' : '<div class="modal-f">' + (o.pie || (
        '<button class="btn" data-cerrar>Cerrar</button>')) + '</div>') +
      '</div></div>';
    const el = elFrom(html);
    $('#modals').appendChild(el);
    const reg = { el, resolver: null };
    pila.push(reg);
    if (pila.length === 1) document.addEventListener('keydown', onKey);
    el.addEventListener('click', ev => {
      if (ev.target === el && o.cerrarFuera !== false) cerrar(el);
      if (ev.target.closest('[data-cerrar]')) cerrar(el);
    });
    if (o.alMontar) setTimeout(() => o.alMontar(el), 0);
    const foco = el.querySelector('[autofocus],input:not([type=hidden]),select,textarea');
    if (foco) setTimeout(() => foco.focus(), 60);
    return el;
  }
  function cerrar(el) {
    const i = pila.findIndex(m => m.el === el);
    if (i >= 0) { const m = pila.splice(i, 1)[0]; m.el.remove(); if (m.resolver) m.resolver(null); }
    else if (el) el.remove();
    if (!pila.length) document.removeEventListener('keydown', onKey);
  }
  function confirmar(o) {
    return new Promise(res => {
      const el = abrir({
        titulo: o.titulo || 'Confirmar',
        ancho: o.ancho || 'narrow',
        cuerpo: '<div style="font-size:13px;line-height:1.55">' + (o.html || esc(o.texto || '')) + '</div>' +
          (o.escribirPara ? '<div class="field mt16"><label>Escriba <b>' + esc(o.escribirPara) +
            '</b> para confirmar</label><input class="inp" id="cfConf" autocomplete="off"></div>' : ''),
        pie: '<button class="btn" data-no>' + esc(o.textoCancelar || 'Cancelar') + '</button>' +
             '<button class="btn ' + (o.peligro ? 'btn-danger' : 'btn-primary') + '" data-si>' +
             esc(o.textoOk || 'Confirmar') + '</button>',
        alMontar(m) {
          const btnSi = m.querySelector('[data-si]');
          if (o.escribirPara) {
            btnSi.disabled = true;
            const inp = m.querySelector('#cfConf');
            inp.oninput = () => { btnSi.disabled = Txt.norm(inp.value) !== Txt.norm(o.escribirPara); };
          }
          btnSi.onclick = () => { cerrar(m); res(true); };
          m.querySelector('[data-no]').onclick = () => { cerrar(m); res(false); };
          m.addEventListener('click', ev => { if (ev.target === m) res(false); });
        }
      });
      el.addEventListener('DOMNodeRemoved', () => {}, { once: true });
    });
  }
  function alerta(titulo, html, tipo) {
    return abrir({
      titulo, ancho: 'narrow',
      cuerpo: '<div class="alert a-' + (tipo || 'info') + '">' + Icon(tipo === 'err' ? 'warn' : tipo === 'warn' ? 'warn' : 'info') +
        '<div>' + html + '</div></div>',
      pie: '<button class="btn btn-primary" data-cerrar>Entendido</button>'
    });
  }
  return { abrir, cerrar, cerrarTop, confirmar, alerta };
})();

/* --- Aviso emergente ------------------------------------------------------
   El `title` del navegador no es de fiar: tarda cerca de un segundo, no se ve
   en pantallas táctiles, desaparece solo a los pocos segundos y —lo que llevó
   a escribir esto— unas veces sale y otras no sobre elementos pequeños.

   Se dibuja en una capa fija ÚNICA anclada al <body>, por el mismo motivo que
   el desplegable del combo: dentro de una tabla con `overflow-x:auto` el
   navegador recorta también el eje vertical y el aviso quedaría cortado por el
   borde de la tarjeta.
   -------------------------------------------------------------------------- */
const Tip = {
  _el: null,
  _capa() {
    if (this._el && document.body.contains(this._el)) return this._el;
    /* Si ya hay una capa en el documento se reutiliza en vez de añadir otra:
       dos capas superpuestas dejarían una vacía y visible por encima. */
    const previa = document.querySelector('body > .tip');
    if (previa) return (this._el = previa);
    const d = document.createElement('div');
    d.className = 'tip';
    document.body.appendChild(d);
    return (this._el = d);
  },
  mostrar(sobre, texto) {
    if (!texto) return;
    const d = this._capa();
    d.textContent = texto;
    d.classList.add('on');
    const r = sobre.getBoundingClientRect();
    const t = d.getBoundingClientRect();
    /* Encima del elemento; si no cabe arriba, debajo. Y siempre dentro de la
       ventana, para que no se salga por los bordes. */
    let x = r.left + r.width / 2 - t.width / 2;
    x = Math.max(6, Math.min(x, innerWidth - t.width - 6));
    const arriba = r.top - t.height - 8;
    d.style.left = Math.round(x) + 'px';
    d.style.top = Math.round(arriba > 6 ? arriba : r.bottom + 8) + 'px';
  },
  ocultar() { if (this._el) this._el.classList.remove('on'); },
  iniciar() {
    if (this._iniciado) return;
    this._iniciado = true;
    const de = e => e.target.closest && e.target.closest('[data-tip]');
    document.addEventListener('mouseover', e => {
      const el = de(e); if (!el) return;
      Tip.mostrar(el, el.getAttribute('data-tip'));
    });
    document.addEventListener('mouseout', e => { if (de(e)) Tip.ocultar(); });
    document.addEventListener('focusin', e => {
      const el = de(e); if (el) Tip.mostrar(el, el.getAttribute('data-tip'));
    });
    document.addEventListener('focusout', () => Tip.ocultar());
    /* Al desplazarse o repintar, el elemento se mueve y el aviso quedaría
       flotando en el aire: se retira. */
    addEventListener('scroll', () => Tip.ocultar(), true);
    addEventListener('resize', () => Tip.ocultar());
  }
};

/* --- ComboBox: SELECT + AUTOCOMPLETE + TEXTO LIBRE (§11) ------------------
   El desplegable se dibuja en una capa fija ÚNICA anclada al <body> y se
   posiciona con getBoundingClientRect().
   Motivo: dentro de una tabla con `overflow-x:auto` el navegador recorta
   también el eje vertical (regla CSS: si un eje deja de ser `visible`, el otro
   se comporta como `auto`), y el menú quedaba cortado por el borde del card.
   Usar una capa compartida evita además acumular menús y listeners cada vez
   que se repinta la tabla de detalles.
   -------------------------------------------------------------------------- */
const Combo = {
  _portal: null,
  _act: null,        // instancia activa (sólo una abierta a la vez)
  _bound: false,

  _menu() {
    if (this._portal) return this._portal;
    const m = document.createElement('div');
    m.className = 'combo-portal';
    document.body.appendChild(m);
    m.addEventListener('mousedown', e => {
      const op = e.target.closest('.combo-opt');
      if (!op || !this._act) return;
      e.preventDefault();
      if (op.dataset.libre !== undefined) this._act.elegir(null, this._act.input.value.trim());
      else if (op.dataset.i !== undefined) this._act.elegir(this._act.filtradas[Number(op.dataset.i)]);
    });
    this._portal = m;
    return m;
  },

  /** listeners globales: se registran UNA sola vez en toda la aplicación */
  _globales() {
    if (this._bound) return;
    this._bound = true;
    document.addEventListener('mousedown', e => {
      if (!this._act) return;
      if (e.target === this._act.input) return;
      if (this._portal && this._portal.contains(e.target)) return;
      this.cerrar();
    });
    // el menú acompaña al campo si se desplaza la página o la tabla
    window.addEventListener('scroll', () => { if (this._act) this._posicionar(); }, true);
    window.addEventListener('resize', () => { if (this._act) this._posicionar(); });
    Bus.on('ruta:cambio', () => this.cerrar());
  },

  cerrar() {
    if (this._portal) this._portal.classList.remove('open');
    this._act = null;
  },

  /** coloca la capa junto al campo; si no cabe abajo, la abre hacia arriba */
  _posicionar() {
    const a = this._act;
    if (!a) return;
    if (!document.contains(a.input)) { this.cerrar(); return; }   // la vista se repintó
    if (!innerHeight || !innerWidth) return;                      // ventana sin medidas (pestaña oculta)
    const m = this._portal;
    const r = a.input.getBoundingClientRect();
    if (!r.width && !r.height) { this.cerrar(); return; }
    m.style.width = r.width + 'px';
    m.style.left = Math.round(Math.max(6, Math.min(r.left, innerWidth - r.width - 6))) + 'px';
    m.style.maxHeight = '250px';
    const alto = Math.min(m.scrollHeight + 2, 250);
    const abajo = innerHeight - r.bottom - 10;
    const arriba = r.top - 10;
    if (abajo < alto && arriba > abajo) {
      m.style.maxHeight = Math.max(80, Math.min(250, arriba)) + 'px';
      m.style.top = Math.round(Math.max(6, r.top - Math.min(alto, arriba) - 3)) + 'px';
    } else {
      m.style.maxHeight = Math.max(80, Math.min(250, abajo)) + 'px';
      m.style.top = Math.round(r.bottom + 3) + 'px';
    }
  },

  /**
   * montar(inputEl, {
   *   opciones: [{id, texto, sub, tag}] | () => [...],
   *   permitirLibre: bool, etiquetaLibre: string,
   *   alElegir(opcion|null, textoLibre), alEscribir(texto)
   * })
   */
  montar(input, cfg) {
    this._globales();
    // si se está repintando la vista, el combo que quedó abierto apunta a un
    // campo ya desconectado del DOM: se cierra antes de montar los nuevos
    if (this._act && !document.contains(this._act.input)) this.cerrar();
    const api = { input, cfg, filtradas: [], hl: -1 };

    api.pintar = () => {
      const menu = Combo._menu();
      const q = Txt.norm(input.value);
      const todas = typeof cfg.opciones === 'function' ? cfg.opciones() : (cfg.opciones || []);
      /* Al abrir un combo que YA tiene una opción elegida se muestra la lista
         completa: si no, filtraría por el propio valor y ocultaría las demás,
         obligando a borrar el texto para poder cambiar de selección. */
      api.filtradas = ((q && !api.mostrarTodo)
        ? todas.filter(o => Txt.norm(o.texto).includes(q) || (o.sub && Txt.norm(o.sub).includes(q)))
        : todas.slice()).slice(0, 60);
      const exacta = todas.some(o => Txt.norm(o.texto) === q);
      let html = api.filtradas.map((o, i) =>
        '<div class="combo-opt' + (i === api.hl || (api.hl < 0 && Txt.norm(o.texto) === q) ? ' hl' : '') +
        '" data-i="' + i + '">' +
        '<div style="min-width:0;flex:1"><div class="trunc">' + Txt.resaltar(o.texto, input.value) + '</div>' +
        (o.sub ? '<div class="fs11 txt-3 trunc">' + Txt.resaltar(o.sub, input.value) + '</div>' : '') + '</div>' +
        (o.tag ? '<span class="co-tag">' + esc(o.tag) + '</span>' : '') + '</div>').join('');
      if (!api.filtradas.length && !input.value) html = '<div class="combo-opt txt-3">Sin opciones</div>';
      if (cfg.permitirLibre && input.value.trim() && !exacta) {
        html += '<div class="combo-opt combo-new" data-libre="1">' + Icon('plus', '', 12) +
          'Usar “' + esc(input.value.trim()) + '”' +
          (cfg.etiquetaLibre ? ' <span class="co-tag">' + esc(cfg.etiquetaLibre) + '</span>' : '') + '</div>';
      }
      if (!html) html = '<div class="combo-opt txt-3">Sin coincidencias</div>';
      menu.innerHTML = html;
    };

    api.abrir = () => {
      if (!document.contains(input)) return;
      Combo._act = api;
      // valor ya elegido → se ofrece la lista completa y se preselecciona el texto,
      // de modo que escribir lo reemplace directamente
      api.mostrarTodo = Boolean(input.dataset.id) || !input.value.trim();
      api.pintar();
      Combo._menu().classList.add('open');
      Combo._posicionar();
      const sel = Combo._portal.querySelector('.hl');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    };
    api.cerrar = () => { if (Combo._act === api) Combo.cerrar(); api.hl = -1; };

    api.elegir = (op, libre) => {
      if (op) { input.value = op.texto; input.dataset.id = op.id; }
      else { input.dataset.id = ''; }
      api.cerrar();
      if (cfg.alElegir) cfg.alElegir(op || null, libre === undefined ? input.value.trim() : libre);
    };

    const scrollHl = () => {
      const el = Combo._portal && Combo._portal.querySelector('.hl');
      if (el) el.scrollIntoView({ block: 'nearest' });
    };
    const refrescar = () => { if (Combo._act === api) { api.pintar(); Combo._posicionar(); } };

    input.setAttribute('autocomplete', 'off');
    input.addEventListener('focus', () => {
      const teniaSeleccion = Boolean(input.dataset.id);
      api.abrir();
      if (teniaSeleccion) setTimeout(() => { try { input.select(); } catch {} }, 0);
    });
    input.addEventListener('input', () => {
      input.dataset.id = ''; api.hl = -1; api.mostrarTodo = false;
      if (Combo._act !== api) api.abrir(); else refrescar();
      if (cfg.alEscribir) cfg.alEscribir(input.value);
    });
    input.addEventListener('keydown', e => {
      const abierto = Combo._act === api;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!abierto) { api.abrir(); return; }
        api.hl = Math.min(api.hl + 1, api.filtradas.length - 1); refrescar(); scrollHl();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        api.hl = Math.max(api.hl - 1, -1); refrescar(); scrollHl();
      } else if (e.key === 'Enter') {
        if (abierto) {
          e.preventDefault();
          if (api.hl >= 0 && api.filtradas[api.hl]) api.elegir(api.filtradas[api.hl]);
          else if (cfg.permitirLibre && input.value.trim()) api.elegir(null, input.value.trim());
          else if (api.filtradas.length === 1) api.elegir(api.filtradas[0]);
        }
      } else if (e.key === 'Escape') { api.cerrar(); }
      else if (e.key === 'Tab') {
        if (abierto && api.hl >= 0 && api.filtradas[api.hl]) api.elegir(api.filtradas[api.hl]);
        else api.cerrar();
      }
    });
    input.addEventListener('blur', () => {
      setTimeout(() => { if (Combo._act === api && document.activeElement !== input) api.cerrar(); }, 120);
    });
    return api;
  },

  /**
   * Buscador con lista de sugerencias. Se comporta igual en todas las
   * pantallas: mientras se escribe sólo se mueve la lista, y el listado de
   * abajo se rehace únicamente al elegir una sugerencia o al confirmar.
   *
   * Filtrar tecla a tecla obligaba a recorrer y repintar la tabla entera con
   * cada letra; con 447 cajas se notaba. Las sugerencias, en cambio, se
   * construyen una vez por pintado y filtrar unas decenas de textos es
   * instantáneo.
   *
   * `valores` es una lista de {texto, tag}. El orden de los grupos lo decide
   * el orden en que aparece cada `tag` por primera vez, así cada pantalla
   * manda lo suyo primero.
   */
  buscador(id, valores, alBuscar) {
    const input = document.getElementById(id);
    if (!input) return null;
    const vistos = new Set(), opciones = [], ordenTag = new Map();
    for (const v of (valores || [])) {
      const t = String((v && v.texto) || '').trim();
      const tag = String((v && v.tag) || '');
      if (!t || t === '—' || t === VALOR_NO_DISPONIBLE) continue;
      if (!ordenTag.has(tag)) ordenTag.set(tag, ordenTag.size);
      const k = tag + '|' + Txt.norm(t);
      if (vistos.has(k)) continue;
      vistos.add(k);
      opciones.push({ id: k, texto: t, tag: tag });
    }
    opciones.sort((a, b) => (ordenTag.get(a.tag) - ordenTag.get(b.tag)) ||
      a.texto.localeCompare(b.texto, 'es'));
    return Combo.montar(input, {
      opciones: opciones,
      permitirLibre: true,
      etiquetaLibre: 'buscar este texto',
      alElegir: (op, libre) => alBuscar(op ? op.texto : String(libre || ''))
    });
  },

  /** helpers de opciones */
  opcionesPersonas(lista) {
    return (lista || PersonaRepo.solicitantes()).map(p => ({
      id: p.id, texto: p.nombre,
      sub: [p.cedula ? 'CC ' + Txt.cedulaFmt(p.cedula) : '', p.municipioId ? MunicipioRepo.nombre(p.municipioId) : '',
            p.banco ? p.banco : ''].filter(Boolean).join(' · '),
      tag: p.estado === Estado.INACTIVO ? 'INACTIVO' : ''
    }));
  },
  /**
   * Opciones filtradas por ROL (§7, §8): una persona marcada sólo como
   * «adelanta dinero» no debe poder elegirse como solicitante, y viceversa.
   * `incluirId` fuerza la inclusión de la persona ya seleccionada aunque hoy
   * no cumpla el rol: así se puede editar una caja histórica sin perder su dato.
   */
  opcionesPersonasPorRol(rol, incluirId) {
    const cumple = p => rol === 'financiador' ? p.esFinanciador : p.esSolicitante;
    const lista = PersonaRepo.todas()
      .filter(p => (p.estado === Estado.ACTIVO && cumple(p)) || (incluirId && p.id === incluirId))
      .sort(U.by('nombre'));
    return Combo.opcionesPersonas(lista).map(o => {
      const p = PersonaRepo.get(o.id);
      if (p && !cumple(p)) o.tag = 'OTRO ROL';
      return o;
    });
  },
  /**
   * Categorías que se pueden elegir al registrar un gasto.
   *
   * Gasolina y aceite quedan fuera a propósito: son un PAPEL ESTADÍSTICO, no
   * una categoría. Un tanque de gasolina pertenece a «Caja menor» igual que
